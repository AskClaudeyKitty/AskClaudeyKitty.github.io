<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Annoying Platformer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #101018; color: #eee; }
  body { display: flex; justify-content: center; align-items: center; font-family: system-ui, monospace; }
  canvas { border: 3px solid #444; background: #0b0b17; display: block; }
  #ui { text-align: center; margin-top: 12px; font-size: 13px; line-height: 1.6; }
  #ui span { color: #7cf; }
</style>
</head>
<body>
<canvas id="canvas" width="860" height="460"></canvas>
<div id="ui"><span>ARROW KEYS</span> to move, <span>SPACE</span> or <span>UP</span> to jump. Death resets. Watch disappearing and fake blocks.</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
let keys = { left: false, right: false };
let state = 'ready';
let score = 0, best = Number(localStorage.getItem('annoyingPlatformerBest') || 0), level = 1, timer = 0;
const player = { x: 80, y: 360, w: 22, h: 30, vx: 0, vy: 0, canJump: 2, flash: 0 };
const platforms = [];
const traps = [];
const spikes = [];
const particles = [];
const gravity = 0.8;
const friction = 0.88;

function jump() {
  if (player.canJump > 0) {
    if (player.canJump === 2 || player.vy > 0) {
      player.vy = -12 - Math.abs(player.vx) * 0.2;
      player.canJump--;
      player.flash = 6;
    }
  }
}

function rand(min, max) { return Math.random() * (max - min) + min; }

function reset() {
  state = 'playing';
  score = 0;
  level = 1;
  timer = 0;
  player.x = 80;
  player.y = 360;
  player.vx = 0;
  player.vy = 0;
  player.canJump = 2;
  player.flash = 0;
  platforms.length = 0;
  traps.length = 0;
  spikes.length = 0;
  particles.length = 0;
  platforms.push({ x: 0, y: 400, w: W, type: 'ground' });
  platforms.push({ x: 160, y: 320, w: 86, type: 'solid' });
  platforms.push({ x: 320, y: 260, w: 70, type: 'fragile', timer: 0 });
  platforms.push({ x: 430, y: 340, w: 80, type: 'solid' });
  platforms.push({ x: 620, y: 300, w: 70, type: 'spinner', dir: Math.random() < 0.5 ? -1 : 1, angle: 0 });
  createNextSection(W + 20);
}

function createNextSection(startX) {
  const count = 4 + Math.floor(level / 2);
  let x = startX;
  for (let i = 0; i < count; i++) {
    const y = 260 + Math.random() * 140;
    const typeRoll = Math.random();
    if (typeRoll < 0.25) {
      platforms.push({ x, y, w: 70, type: 'solid' });
    } else if (typeRoll < 0.55) {
      platforms.push({ x, y, w: 60, type: 'fragile', timer: 0 });
    } else if (typeRoll < 0.75) {
      platforms.push({ x, y, w: 40, type: 'spinner', dir: Math.random() < 0.5 ? -1 : 1, angle: 0 });
      spikes.push({ x: x + 12, y: y - 10, w: 14, h: 12 });
    } else {
      platforms.push({ x, y, w: 100, type: 'fake', active: false, decay: 0 });
    }
    if (Math.random() < 0.3) {
      traps.push({ x: x + rand(10, 50), y: y - 20, w: 16, h: 20, phase: rand(0, Math.PI * 2), type: Math.random() < 0.5 ? 'slow' : 'push' });
    }
    x += 140 + Math.random() * 90;
  }
}

function die() {
  if (state !== 'playing') return;
  state = 'dead';
  if (score > best) {
    best = Math.floor(score);
    localStorage.setItem('annoyingPlatformerBest', best);
  }
  for (let i = 0; i < 25; i++) {
    particles.push({ x: player.x + player.w * 0.5, y: player.y + player.h * 0.5, vx: rand(-3, 3), vy: rand(-5, -1), life: 20 });
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'Space') {
    if (state !== 'playing') {
      reset();
    }
    jump();
  }
});

document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
});

function update() {
  if (state !== 'playing') return;
  timer++;
  if (timer % 360 === 0) {
    level++;
    createNextSection(W + 20);
  }
  player.vx += (keys.right ? 0.8 : 0) - (keys.left ? 0.8 : 0);
  player.vx *= friction;
  player.vx += rand(-0.02, 0.02) * ((keys.left || keys.right) ? 0 : 1);
  if (Math.abs(player.vx) < 0.05) player.vx = 0;
  player.x += player.vx;
  player.vy += gravity;
  player.y += player.vy;
  player.x = Math.max(0, Math.min(W - player.w, player.x));
  let onGround = false;
  for (const p of platforms) {
    if (p.type === 'spinner') {
      p.angle += 0.06 * p.dir;
      if (Math.abs(p.angle) > Math.PI / 2) p.dir *= -1;
    }
    if (player.x + player.w > p.x && player.x < p.x + p.w && player.y + player.h > p.y && player.y + player.h < p.y + 16 && player.vy >= 0) {
      if (player.y + player.h <= p.y + player.vy + 1) {
        player.y = p.y - player.h;
        player.vy = 0;
        onGround = true;
        player.canJump = 2;
        if (p.type === 'fragile') {
          p.timer++;
          if (p.timer > 40) { p.y += 100; p.w = 0; }
        }
        if (p.type === 'fake' && !p.active) {
          p.decay++;
          if (p.decay > 20) p.active = true;
        }
        if (p.type === 'spinner') {
          player.x += Math.sin(p.angle) * 2;
        }
      }
    }
  }
  for (const trap of traps) {
    const tx = trap.x + Math.sin(timer * 0.08 + trap.phase) * 8;
    const ty = trap.y;
    if (player.x + player.w > tx && player.x < tx + trap.w && player.y + player.h > ty && player.y < ty + trap.h) {
      if (trap.type === 'push') player.vx += trap.w * 0.05 * ((trap.x % 2) ? 1 : -1);
      else if (trap.type === 'slow') { player.vx *= 0.5; player.vy = -2; }
    }
  }
  for (const s of spikes) {
    if (player.x + player.w > s.x && player.x < s.x + s.w && player.y + player.h > s.y && player.y < s.y + s.h) {
      die();
    }
  }
  if (player.y > H) die();
  if (player.flash > 0) player.flash--;
  if (player.y + player.h > H - 60) {
    player.y = H - 60 - player.h;
    player.vy = 0;
    onGround = true;
    player.canJump = 2;
  }
  if (onGround) score += 0.05;
  score += 0.02;
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
  }
  while (particles.length && particles[0].life <= 0) particles.shift();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#10101a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1b1b33';
  ctx.fillRect(0, H - 60, W, 60);
  ctx.fillStyle = '#2f2fa8';
  for (let x = 0; x < W; x += 80) ctx.fillRect(x, H - 60, 40, 20);
  platforms.forEach(p => {
    if (p.w <= 0) return;
    if (p.type === 'solid') ctx.fillStyle = '#8cc';
    else if (p.type === 'fragile') ctx.fillStyle = `rgba(220,180,80,${1 - Math.min(p.timer / 40, 1)})`;
    else if (p.type === 'fake') ctx.fillStyle = p.active ? '#d84' : '#642';
    else if (p.type === 'spinner') ctx.fillStyle = '#c5f';
    else ctx.fillStyle = '#888';
    ctx.fillRect(p.x, p.y, p.w, 14);
    if (p.type === 'spinner') {
      ctx.save();
      ctx.translate(p.x + p.w * 0.5, p.y + 7);
      ctx.rotate(p.angle);
      ctx.fillStyle = '#7c1';
      ctx.fillRect(-p.w * 0.4, -3, p.w * 0.8, 6);
      ctx.restore();
    }
  });
  traps.forEach(trap => {
    const tx = trap.x + Math.sin(timer * 0.08 + trap.phase) * 8;
    ctx.fillStyle = trap.type === 'push' ? '#f55' : '#5af';
    ctx.fillRect(tx, trap.y, trap.w, trap.h);
  });
  spikes.forEach(s => {
    ctx.fillStyle = '#e55';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + s.h);
    ctx.lineTo(s.x + s.w * 0.5, s.y);
    ctx.lineTo(s.x + s.w, s.y + s.h);
    ctx.fill();
  });
  particles.forEach(pt => {
    ctx.fillStyle = `rgba(255,255,255,${pt.life / 20})`;
    ctx.fillRect(pt.x, pt.y, 2, 2);
  });
  ctx.fillStyle = player.flash ? '#fff' : '#7ef';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText(`Score ${Math.floor(score)}   Best ${Math.floor(best)}   Level ${level}`, 14, 24);
  if (state !== 'playing') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(state === 'ready' ? 'ANNOYING PLATFORMER' : 'YOU DIED', W / 2, H / 2 - 20);
    ctx.font = '18px monospace';
    ctx.fillText('PRESS SPACE OR UP TO TRY AGAIN', W / 2, H / 2 + 20);
    ctx.textAlign = 'left';
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
