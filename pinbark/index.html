<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinbark</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a0b2e;
      display: flex;
      justify-content: center;
      align-items: stretch;
      height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #main-layout {
      display: flex;
      gap: 20px;
      align-items: stretch;
      height: 100vh;
      padding: 0;
    }
    #game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-shadow: 0 0 50px rgba(0, 245, 212, 0.3);
    }
    #app {
      height: 100%;
      display: flex;
      align-items: center;
    }
    canvas {
      display: block;
      height: 100vh !important;
      width: auto !important;
      object-fit: contain;
    }
    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      background: #8338ec;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
    }
    #sidebar {
      width: 280px;
      min-width: 280px;
      background: #0d0518;
      border-left: 2px solid #8338ec;
      padding: 20px;
      color: #00f5d4;
      overflow-y: auto;
      height: 100vh;
    }
    #sidebar h1 {
      font-size: 24px;
      color: #ff006e;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 #8338ec;
      letter-spacing: 4px;
    }
    .tuner-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(131, 56, 236, 0.4);
    }
    .tuner-section:last-child {
      border-bottom: none;
    }
    .tuner-section h3 {
      font-size: 11px;
      color: #ffbe0b;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slider-group {
      margin-bottom: 12px;
    }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #00f5d4;
      margin-bottom: 4px;
    }
    .slider-group label span {
      color: #ff006e;
      font-weight: bold;
    }
    .slider-group input[type="range"] {
      width: 100%;
      height: 6px;
      background: #1a0b2e;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }
    .slider-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #ff006e;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #00f5d4;
    }
    .slider-group input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #ff006e;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #00f5d4;
    }
    #tools-section {
      margin-top: 8px;
    }
    .tool-btn {
      width: 100%;
      padding: 8px;
      background: #8338ec;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .tool-btn:hover {
      background: #ff006e;
    }
    #debug-section {
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    #debug-section.active {
      opacity: 1;
    }

    /* Keyboard shortcuts in sidebar */
    .keys-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .key-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: #ccc;
    }
    .key-row .key-combo {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .key-row .key-label {
      white-space: nowrap;
    }
    .key-separator {
      color: #666;
      font-size: 9px;
    }

    /* Debug keys */
    .debug-keys {
      font-size: 10px;
      color: #ccc;
      line-height: 1.8;
    }
    .debug-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 2-column sidebar on wide displays */
    @media (min-width: 1200px) {
      #sidebar {
        width: 440px;
        min-width: 440px;
      }
      .sidebar-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 20px;
      }
      .sidebar-content > .sidebar-header {
        grid-column: 1 / -1;
      }
      .sidebar-col-left {
        grid-column: 1;
      }
      .sidebar-col-right {
        grid-column: 2;
      }
      .keys-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Custom scrollbar for sidebar */
    #sidebar::-webkit-scrollbar {
      width: 4px;
    }
    #sidebar::-webkit-scrollbar-track {
      background: #0d0518;
    }
    #sidebar::-webkit-scrollbar-thumb {
      background: #8338ec;
      border-radius: 2px;
    }
  </style>
  <script type="module" crossorigin src="assets/index-C_bV9zEy.js"></script>
</head>
<body>
  <div id="main-layout">
    <div id="game-container">
      <div id="app"></div>
    </div>
    <div id="sidebar">
      <div class="sidebar-content">
        <div class="sidebar-header">
          <h1>PINBARK</h1>

          <div id="autoflip-indicator" style="display: none; text-align: center; margin-bottom: 12px; padding: 8px; background: #ff006e; color: #fff; font-weight: bold; font-size: 12px; border-radius: 4px; animation: pulse 1s infinite;">
            AUTOFLIP
          </div>
        </div>

        <div class="sidebar-col-left">
          <div class="tuner-section" id="keys-section">
            <h3>Controls</h3>
            <div class="keys-grid">
              <div class="key-row">
                <span class="key-combo"><span class="key">Z</span><span class="key-separator">/</span><span class="key">X</span></span>
                <span class="key-label">Flippers</span>
              </div>
              <div class="key-row">
                <span class="key-combo"><span class="key">&larr;</span><span class="key-separator">/</span><span class="key">&rarr;</span></span>
                <span class="key-label">Nudge</span>
              </div>
              <div class="key-row">
                <span class="key-combo"><span class="key">R</span></span>
                <span class="key-label">Restart</span>
              </div>
              <div class="key-row">
                <span class="key-combo"><span class="key">D</span></span>
                <span class="key-label">Debug</span>
              </div>
              <div class="key-row">
                <span class="key-combo"><span class="key">A</span></span>
                <span class="key-label">Autoflip</span>
              </div>
            </div>
          </div>

          <div class="tuner-section">
            <h3>Physics Tuning</h3>

            <div class="slider-group">
              <label>Bumper Kick <span id="bumper-kick-val">18</span></label>
              <input type="range" id="bumper-kick" min="5" max="30" value="18" step="1">
            </div>

            <div class="slider-group">
              <label>Upward Bias <span id="upward-bias-val">70%</span></label>
              <input type="range" id="upward-bias" min="0" max="100" value="70" step="5">
            </div>

            <div class="slider-group">
              <label>Gravity <span id="gravity-val">0.5</span></label>
              <input type="range" id="gravity" min="0.1" max="2.0" value="0.5" step="0.1">
            </div>

            <div class="slider-group">
              <label>Ball Restitution <span id="restitution-val">0.7</span></label>
              <input type="range" id="restitution" min="0.3" max="1.0" value="0.7" step="0.05">
            </div>

            <div class="slider-group">
              <label>Autoflip Zone</label>
              <select id="autoflip-zone" style="width: 100%; padding: 4px; font-family: 'Courier New', monospace; font-size: 10px; background: #1a0b2e; color: #00f5d4; border: 1px solid #8338ec; border-radius: 3px;">
                <option value="circular">Circular</option>
                <option value="trapezoid">Trapezoid</option>
              </select>
            </div>
          </div>
        </div>

        <div class="sidebar-col-right">
          <div class="tuner-section" id="tools-section">
            <h3>Tools</h3>
            <button class="tool-btn" id="reset-physics">Reset Physics</button>
          </div>

          <div class="tuner-section" id="debug-section">
            <h3>Debug (Press D)</h3>
            <div class="debug-keys">
              <div class="debug-key-row"><span class="key">1</span> Spawn Multi (M)</div>
              <div class="debug-key-row"><span class="key">2</span> Spawn Sticky (S)</div>
              <div class="debug-key-row"><span class="key">3</span> Spawn Gravity (G)</div>
              <div class="debug-key-row"><span class="key">4</span> Spawn Arkanoid (A)</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
