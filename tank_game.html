// ========== AUDIO ==========
let audioCtx = null;
let audioStarted = false;
function initAudio() {
  if (audioStarted) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioStarted = true;
}
// Start audio on first user interaction
document.addEventListener('mousedown', initAudio, { once: false });
document.addEventListener('keydown', initAudio, { once: false });

function playTone(freq, duration, type, vol, detune) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  if (detune) osc.detune.value = detune;
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol, filterFreq) {
  if (!audioCtx) return;
  const bufSize = audioCtx.sampleRate * duration;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq || 800;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
}

// Ambient hazard sounds
let hazardSoundTimer = 0;
function updateHazardSounds() {
  if (!audioCtx) return;
  hazardSoundTimer++;
  if (hazardSoundTimer % 20 !== 0) return; // every ~0.33 sec
  let hasFire = false, hasRad = false, hasIce = false;
  for (const h of hazards) {
    if (h.type === 'fire' || h.type === 'hellfire' || h.type === 'acidFire' || h.type === 'lava') hasFire = true;
    if (h.type === 'radiation') hasRad = true;
    if (h.type === 'ice') hasIce = true;
  }
  if (hasFire) playNoise(0.15, 0.015, 3000); // crackle
  if (hasRad) playTone(55, 0.2, 'sawtooth', 0.01); // hum
}

// ========== MUSIC ==========
let musicPlaying = false;
let musicEnabled = true;
let musicNodes = [];

function startMusic() {
  if (!audioCtx || musicPlaying || !musicEnabled) return;
  musicPlaying = true;

  // Bass line pattern (notes in Hz)
  const bassNotes = [65, 65, 82, 82, 73, 73, 87, 82];
  // Melody pattern
  const melodyNotes = [262, 330, 392, 330, 349, 294, 262, 247];
  // Drum pattern (1 = kick, 2 = snare, 0 = rest)
  const drumPattern = [1, 0, 2, 0, 1, 1, 2, 0];

  const bpm = 120;
  const beatTime = 60 / bpm;
  let beat = 0;

  function scheduleNote() {
    if (!musicPlaying || !audioCtx || !musicEnabled) return;
    const now = audioCtx.currentTime;

    // Bass
    const bassOsc = audioCtx.createOscillator();
    const bassGain = audioCtx.createGain();
    bassOsc.type = 'triangle';
    bassOsc.frequency.value = bassNotes[beat % bassNotes.length];
    bassGain.gain.setValueAtTime(0.08, now);
    bassGain.gain.exponentialRampToValueAtTime(0.001, now + beatTime * 0.9);
    bassOsc.connect(bassGain);
    bassGain.connect(audioCtx.destination);
    bassOsc.start(now);
    bassOsc.stop(now + beatTime);

    // Melody (every other beat)
    if (beat % 2 === 0) {
      const melOsc = audioCtx.createOscillator();
      const melGain = audioCtx.createGain();
      melOsc.type = 'square';
      melOsc.frequency.value = melodyNotes[Math.floor(beat / 2) % melodyNotes.length];
      melGain.gain.setValueAtTime(0.03, now);
      melGain.gain.exponentialRampToValueAtTime(0.001, now + beatTime * 1.8);
      melOsc.connect(melGain);
      melGain.connect(audioCtx.destination);
      melOsc.start(now);
      melOsc.stop(now + beatTime * 2);
    }

    // Drums
    const d = drumPattern[beat % drumPattern.length];
    if (d === 1) {
      // Kick
      const kickOsc = audioCtx.createOscillator();
      const kickGain = audioCtx.createGain();
      kickOsc.type = 'sine';
      kickOsc.frequency.setValueAtTime(150, now);
      kickOsc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
      kickGain.gain.setValueAtTime(0.12, now);
      kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      kickOsc.connect(kickGain);
      kickGain.connect(audioCtx.destination);
      kickOsc.start(now);
      kickOsc.stop(now + 0.15);
    } else if (d === 2) {
      // Snare (noise burst)
      const bufSize = audioCtx.sampleRate * 0.08;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const snareGain = audioCtx.createGain();
      snareGain.gain.setValueAtTime(0.06, now);
      snareGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1000;
      src.connect(filter);
      filter.connect(snareGain);
      snareGain.connect(audioCtx.destination);
      src.start(now);
    }

    beat++;
    musicNodes.push(setTimeout(scheduleNote, beatTime * 1000));
  }

  scheduleNote();
}

function stopMusic() {
  musicPlaying = false;
  for (const t of musicNodes) clearTimeout(t);
  musicNodes = [];
}

// ========== TERRAIN ==========
function generateTerrain() {
  terrain.length = 0;
  const m = maps[currentMap];
  let y = H * m.baseY;
  for (let x = 0; x <= W; x++) {
    y += (Math.random() - 0.5) * m.roughness;
    y = Math.max(H * 0.25, Math.min(H * 0.8, y));
    terrain[x] = y;
  }
  for (let pass = 0; pass < 5; pass++) {
    for (let x = 2; x < W - 2; x++) {
      terrain[x] = (terrain[x-2] + terrain[x-1] + terrain[x] + terrain[x+1] + terrain[x+2]) / 5;
    }
  }
  // Set terrain type from map
  terrainType.length = 0;
  const tt = maps[currentMap].terrainType || 'normal';
  for (let x = 0; x <= W; x++) terrainType[x] = tt;
}

function terrainAt(x) {
  x = Math.round(Math.max(0, Math.min(W - 1, x)));
  return terrain[x];
}

// ========== FLOATING DAMAGE TEXT ==========
function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 60 });
}

// ========== CRATES ==========
function spawnCrate() {
  const cx = 80 + Math.random() * (W - 160);
  const cy = terrainAt(cx) - 12;
  crates.push({ x: cx, y: cy, size: 16 });
}

function checkCratePickup(tank, tankIndex) {
  for (let i = crates.length - 1; i >= 0; i--) {
    const c = crates[i];
    if (Math.abs(tank.x - c.x) < 25) {
      if (Math.random() < 0.25 && !tank.shield) {
        // Shield pickup
        tank.shield = true;
        spawnFloatingText(c.x, c.y - 20, '+SHIELD!', '#4af');
      } else {
        // Give a random weapon from ANY tank
        const allWeapons = [];
        for (const tt of tankTypes) { if (!tt.locked) for (const ww of tt.weapons) allWeapons.push(ww); }
        for (const ww of crateWeapons) allWeapons.push(ww);
        const w = allWeapons[Math.floor(Math.random() * allWeapons.length)];
        tank.bonusWeapon = w;
        tank.bonusAmmo = 1;
        spawnFloatingText(c.x, c.y - 20, '+' + w.name + '!', '#fa0');
      }
      SFX.cratePickup();
      crates.splice(i, 1);
    }
  }
}

function checkAmmoRefill(tank) {
  // If all weapons are empty, refill all to 1
  let allEmpty = true;
  for (let w = 0; w < tank.ammo.length; w++) {
    if (tank.ammo[w] > 0) { allEmpty = false; break; }
  }
  if (allEmpty) {
    for (let w = 0; w < tank.ammo.length; w++) {
      if (tank.type.weapons[w].ammo > 0) tank.ammo[w] = 1;
    }
    spawnFloatingText(tank.x, terrainAt(tank.x) - 60, 'AMMO REFILL!', '#ff0');
    SFX.ammoRefill();
  }
}

// ========== TANK INIT ==========
function initTanks() {
  const p = tankTypes[menuSelection];
  const botPool = tankTypes.filter(t => !t.locked);
  const b = botPool[Math.floor(Math.random() * botPool.length)];
  const playerHp = testBotMode ? 999999 : p.hp;
  const playerFuel = testBotMode ? 999999 : p.fuel;
  Object.assign(tanks[0], {
    x: 80 + Math.random() * 80, angle: 45, hp: playerHp, maxHp: playerHp, color: p.color,
    name: p.name, weapon: 0, fuel: playerFuel, maxFuel: playerFuel, isBot: false, type: p,
    ammo: p.weapons.map(w => w.ammo === -1 ? -1 : 1),
    bonusWeapon: null, bonusAmmo: 0, shockTimer: 0, shield: false
  });
  const botHp = testBotMode ? 100000 : b.hp;
  Object.assign(tanks[1], {
    x: testBotMode ? W / 2 : W - 160 + Math.random() * 80, angle: 135, hp: botHp, maxHp: botHp, color: '#e55',
    name: testBotMode ? 'TEST BOT' : 'BOT(' + b.name + ')', weapon: 0, fuel: b.fuel, maxFuel: b.fuel, isBot: true, type: b,
    ammo: b.weapons.map(w => w.ammo === -1 ? -1 : 1),
    bonusWeapon: null, bonusAmmo: 0, shockTimer: 0, shield: false, testBot: testBotMode
  });
}

function applyMapEffects() {
  const m = maps[currentMap];
  if (m.name === 'Snow') {
    // Cover entire terrain in ice patches
    for (let x = 40; x < W - 40; x += 60) {
      hazards.push({ x, y: terrainAt(x), radius: 40 + Math.random() * 20, type: 'ice', life: 999999, dmg: 0 });
    }
  }
}

function applyMapBoosts() {
  const m = maps[currentMap];
  if (!m.boosts) return;
  for (const t of tanks) {
    t.boosted = m.boosts.includes(t.type.name);
    if (t.boosted) {
      t.hp = Math.round(t.hp + 50);
      t.maxHp = Math.round(t.maxHp + 50);
    }
  }
}

function getBoostedDmg(tank) {
  return tank.boosted ? 1.2 : 1;
}

// ========== INPUT ==========
let dragging = false;
let dragStartX = 0, dragStartY = 0;
let dragX = 0, dragY = 0;
let dragPower = 0, dragAngle = 0;
const MAX_DRAG = 120;
const MAX_POWER = 22;

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousemove', e => {
  const m = getMousePos(e);
  if (state === 'select') {
    menuHover = -1;
    for (let i = 0; i < tankTypes.length; i++) {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const bx = W / 2 - 210 + col * 145;
      const by = 120 + row * 170 - selectScroll;
      if (m.x >= bx && m.x <= bx + 130 && m.y >= by && m.y <= by + 150 && by > 50 && by + 150 < H) menuHover = i;
    }
    return;
  }
  if (state === 'mapSelect') {
    mapHover = -1;
    for (let i = 0; i < maps.length; i++) {
      const bx = W / 2 - (maps.length * 85) / 2 + i * 85;
      if (m.x >= bx && m.x <= bx + 75 && m.y >= 140 && m.y <= 320) mapHover = i;
    }
    return;
  }
  if (dragging) {
    dragX = m.x; dragY = m.y;
    // Direct aim: drag from tank toward where you want to shoot
    const tank = tanks[0];
    const tankY = terrainAt(tank.x) - 20;
    const dx = dragX - tank.x;
    const dy = tankY - dragY; // flip Y so up = positive
    const dist = Math.hypot(dx, dy);
    dragPower = Math.min(dist / MAX_DRAG, 1) * MAX_POWER;
    dragAngle = Math.atan2(dy, dx) * 180 / Math.PI;
    dragAngle = Math.max(0, Math.min(180, dragAngle));
    tanks[0].angle = dragAngle;
  }
});

let moveLeft = false, moveRight = false;

canvas.addEventListener('mousedown', e => {
  const m = getMousePos(e);
  if (state === 'menu') {
    // BATTLE button
    if (m.x >= W / 2 - 100 && m.x <= W / 2 + 100 && m.y >= 280 && m.y <= 340) { state = 'select'; selectScroll = 0; }
    // Toggle buttons (match drawing layout)
    const btnW2 = 95, btnGap2 = 6, totalBtnW2 = btnW2 * 3 + btnGap2 * 2;
    const btnX2 = W / 2 - totalBtnW2 / 2;
    if (m.y >= 380 && m.y <= 410) {

      if (m.x >= btnX2 + btnW2 + btnGap2 && m.x <= btnX2 + btnW2 * 2 + btnGap2) chaosMode = !chaosMode;
      if (m.x >= btnX2 + (btnW2 + btnGap2) * 2 && m.x <= btnX2 + (btnW2 + btnGap2) * 2 + btnW2) tripleMode = !tripleMode;
    }
    // Row 2: Music, Test Bot, Wind
    if (m.y >= 420 && m.y <= 445) {
      const r2W2 = 95, r2Gap2 = 6, r2Total2 = r2W2 * 3 + r2Gap2 * 2;
      const r2X2 = W / 2 - r2Total2 / 2;
      if (m.x >= r2X2 && m.x <= r2X2 + r2W2) { musicEnabled = !musicEnabled; if (!musicEnabled) stopMusic(); }
      if (m.x >= r2X2 + r2W2 + r2Gap2 && m.x <= r2X2 + r2W2 * 2 + r2Gap2) { testBotMode = !testBotMode; }
      if (m.x >= r2X2 + (r2W2 + r2Gap2) * 2 && m.x <= r2X2 + (r2W2 + r2Gap2) * 2 + r2W2) { windEnabled = !windEnabled; if (windEnabled) windStrength = (Math.random() - 0.5) * 0.4; }
    }
    return;
  }
  if (state === 'select') {
    // Tank card clicks
    for (let i = 0; i < tankTypes.length; i++) {
      const t = tankTypes[i];
      const isLocked = t.locked && (t.unlockCode ? !unlockedCodes.includes(t.unlockCode) : totalWins < (t.unlockWins || 0));
      const col = i % 3;
      const row = Math.floor(i / 3);
      const bx = W / 2 - 210 + col * 145;
      const by = 120 + row * 170 - selectScroll;
      if (m.x >= bx && m.x <= bx + 130 && m.y >= by && m.y <= by + 150) {
        if (isLocked) {
          if (t.unlockCode) {
            const code = prompt('Enter secret code:');
            if (code === t.unlockCode) {
              if (!unlockedCodes.includes(t.unlockCode)) {
                unlockedCodes.push(t.unlockCode);
                localStorage.setItem('tankUnlockedCodes', JSON.stringify(unlockedCodes));
              }
            }
          }
          return;
        }
        menuSelection = i;
        startMapSelect();
        return;
      }
    }
    // Back button
    if (m.x >= 20 && m.x <= 100 && m.y >= 15 && m.y <= 45) { state = 'menu'; return; }
    return;
  }
  if (state === 'mapSelect') {
    // Random button
    if (m.x >= W / 2 - 60 && m.x <= W / 2 + 60 && m.y >= 80 && m.y <= 110) { startGame(); return; }
    // Map cards
    for (let i = 0; i < maps.length; i++) {
      const bx = W / 2 - (maps.length * 85) / 2 + i * 85;
      const by = 140;
      if (m.x >= bx && m.x <= bx + 75 && m.y >= by && m.y <= by + 180) { startGame(i); return; }
    }
    // Back button
    if (m.x >= 20 && m.x <= 100 && m.y >= 15 && m.y <= 45) { state = 'select'; selectScroll = 0; return; }
    return;
  }
  if (state !== 'game' || gameOver) return;
  if (!testBotMode && (turn !== 0 || projectiles.length)) return;

  const selY = H - 63;
  const slotW = 55;
  const totalSlots = tanks[0].bonusWeapon ? 5 : 4;

  // Weapon slot clicks
  for (let i = 0; i < totalSlots; i++) {
    const wx = 16 + i * (slotW + 4);
    if (m.x >= wx && m.x <= wx + slotW && m.y >= selY && m.y <= selY + 30) {
      if (i < 4) tanks[0].weapon = i;
      else if (tanks[0].bonusWeapon) tanks[0].weapon = 4;
      SFX.weaponSwitch();
      return;
    }
  }

  // Fire button click
  const fbx = W - 110, fby = selY - 8;
  if (m.x >= fbx && m.x <= fbx + 95 && m.y >= fby && m.y <= fby + 38) {
    const hasAmmo = (tanks[0].bonusWeapon && tanks[0].weapon >= tanks[0].type.weapons.length) ? (tanks[0].bonusAmmo > 0) : tanks[0].ammo[tanks[0].weapon] > 0;
    if (hasAmmo) {
      // Fire at current angle with medium power
      fireWeapon(tanks[0], null, 12);
    }
    return;
  }

  // Move button clicks
  const my = selY - 8;
  if (m.x >= W - 220 && m.x <= W - 185 && m.y >= my && m.y <= my + 38) { moveLeft = true; return; }
  if (m.x >= W - 180 && m.x <= W - 145 && m.y >= my && m.y <= my + 38) { moveRight = true; return; }

  // Check ammo for drag
  if (tanks[0].bonusWeapon && tanks[0].weapon >= tanks[0].type.weapons.length) { if (!tanks[0].bonusAmmo) return; }
  else if (tanks[0].ammo[tanks[0].weapon] === 0) return;

  // Start drag aiming
  dragging = true;
  dragStartX = m.x; dragStartY = m.y;
  dragX = m.x; dragY = m.y;
  dragPower = 0;
});

canvas.addEventListener('mouseup', e => {
  moveLeft = false; moveRight = false;
  if (state !== 'game') return;
  if (dragging && (turn === 0 || testBotMode) && (!projectiles.length || testBotMode) && !gameOver) {
    dragging = false;
    if (dragPower > 1) {
      fireWeapon(tanks[0], null, dragPower);
    }
  }
});

canvas.addEventListener('mouseleave', () => { dragging = false; moveLeft = false; moveRight = false; });

canvas.addEventListener('wheel', e => {
  if (state === 'select') {
    const maxScroll = Math.max(0, Math.ceil(tankTypes.length / 3) * 170 + 120 - H + 40);
    selectScroll = Math.max(0, Math.min(maxScroll, selectScroll + e.deltaY * 0.5));
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state === 'menu') {
    if (e.key === 'Enter') { state = 'select'; selectScroll = 0; }
    return;
  }
  if (state === 'select') {
    if (e.key === 'Escape') { state = 'menu'; return; }
    if (e.key === 'ArrowLeft') menuSelection = Math.max(0, menuSelection - 1);
    if (e.key === 'ArrowRight') menuSelection = Math.min(tankTypes.length - 1, menuSelection + 1);
    if (e.key === 'Enter') startMapSelect();
    return;
  }
  if (state === 'mapSelect') {
    if (e.key === 'Escape') { state = 'select'; selectScroll = 0; return; }
    if (e.key >= '1' && e.key <= String(maps.length)) { startGame(parseInt(e.key) - 1); return; }
    if (e.key === 'Enter') { startGame(); return; } // random
    return;
  }
  if (gameOver && e.key === 'r') return resetGame();
  if (e.key === 'm') { state = 'select'; selectScroll = 0; document.getElementById('info').style.display = 'none'; stopMusic(); gameOver = false; projectiles = []; return; }
  if (!testBotMode && (turn !== 0 || projectiles.length || gameOver)) return;
  if (gameOver) return;
  if (e.key >= '1' && e.key <= '5') {
    const idx = parseInt(e.key) - 1;
    const maxWeaponIdx = tanks[0].type.weapons.length;
    if (idx < maxWeaponIdx) { tanks[0].weapon = idx; SFX.weaponSwitch(); }
    else if (idx === maxWeaponIdx && tanks[0].bonusWeapon) { tanks[0].weapon = maxWeaponIdx; SFX.weaponSwitch(); }
  }
});

document.addEventListener('keyup', e => { keys[e.key] = false; });

  });

  Object.assign(tanks[1], {
    x: testBotMode ? W / 2 : W - 160 + Math.random() * 80, angle: 135, hp: botHp2, maxHp: botHp2, color: '#e55',
    name: testBotMode ? 'TEST BOT' : 'BOT(' + b.name + ')', weapon: 0, fuel: b.fuel, maxFuel: b.fuel, type: b,
    ammo: b.weapons.map(w => w.ammo === -1 ? -1 : 1),
    bonusWeapon: null, bonusAmmo: 0, shockTimer: 0, inWater: false, shield: false, testBot: testBotMode
  });
  turn = 0;
  projectiles = [];
  explosions = [];
  floatingTexts = [];
  crates = [];
  hazards = [];
  gameOver = false;

// ========== FIRE ==========
function fireWeapon(tank, holdTime, directPower) {
  const dmgBonus = getBoostedDmg(tank);
  const power = tank.isBot ? tank._botPower : (directPower || (5 + (holdTime || 0) * 12));
  // Sound
  const wCheck = tank.weapon === 4 ? tank.bonusWeapon : tank.type.weapons[tank.weapon];
  if (wCheck && (wCheck.behavior === 'drill' || wCheck.behavior === 'drillRain' || wCheck.behavior === 'rain')) SFX.shootBig();
  else SFX.shoot();
  let w;
  if (tank.weapon === 4 && tank.bonusWeapon) {
    w = tank.bonusWeapon;
    tank.bonusAmmo--;
    if (tank.bonusAmmo <= 0) { tank.bonusWeapon = null; tank.bonusAmmo = 0; }
  } else {
    w = tank.type.weapons[tank.weapon];
    if (!testBotMode && tank.ammo[tank.weapon] > 0) tank.ammo[tank.weapon]--;
    checkAmmoRefill(tank);
  }
  // Random: use bonus weapon if available, otherwise pick random
  if (w.behavior === 'random') {
    if (tank.bonusWeapon && tank.bonusAmmo > 0) {
      w = tank.bonusWeapon;
      tank.bonusAmmo--;
      if (tank.bonusAmmo <= 0) { tank.bonusWeapon = null; tank.bonusAmmo = 0; }
    } else {
      const allW = [];
      for (const tt of tankTypes) { if (!tt.locked || (tt.unlockCode && unlockedCodes.includes(tt.unlockCode))) { for (const ww of tt.weapons) { if (ww.behavior !== 'random') allW.push(ww); } } }
      w = allW[Math.floor(Math.random() * allW.length)];
    }
    spawnFloatingText(tank.x, terrainAt(tank.x) - 65, w.name + '!', w.color);
  }
  const tripleOffsets = tripleMode ? [-4, 0, 4] : [0];
  for (const tOff of tripleOffsets) {
    for (let i = 0; i < w.count; i++) {
      const angleOff = (i - (w.count - 1) / 2) * w.spread + tOff;
      const rad = (tank.angle + angleOff) * Math.PI / 180;
      const speedMult = w.behavior === 'boomerang' ? 2.5 : 1;
      projectiles.push({
        x: tank.x, y: terrainAt(tank.x) - 20,
        vx: Math.cos(rad) * power * speedMult,
        vy: -Math.sin(rad) * power * speedMult,
        owner: turn,
        weaponData: w,
        dmgBonus
      });
    }
  }
  // Auto-switch to next available weapon
  if (!testBotMode) switchToNextWeapon(tank);
}

function switchToNextWeapon(tank) {
  // Try next slots in order after current
  for (let n = 1; n <= 5; n++) {
    const idx = (tank.weapon + n) % 5;
    if (idx === 4) {
      if (tank.bonusWeapon && tank.bonusAmmo > 0) { tank.weapon = 4; return; }
    } else if (idx < tank.type.weapons.length) {
      if (tank.ammo[idx] > 0) { tank.weapon = idx; return; }
    }
  }
  // All empty — refill will handle it, default to 0
  tank.weapon = 0;
}

// ========== EXPLOSION ==========
function createExplosion(x, y, w, noTerrain) {
  const radius = w.radius;
  explosions.push({ x, y, radius, alpha: 1, color: w.color });
  if (radius > 30) SFX.explode(radius);
  else SFX.explodeSmall();
  shakeTime = 10;
  shakeAmount = radius / 10;
  if (!noTerrain) {
    for (let tx = Math.floor(x - radius); tx <= Math.ceil(x + radius); tx++) {
      if (tx >= 0 && tx < W) {
        const dist = Math.abs(tx - x);
        const depth = Math.sqrt(Math.max(0, radius * radius - dist * dist));
        const tt = terrainType[tx] || 'normal';
        const mult = tt === 'sand' ? 0.9 : tt === 'rock' ? 0.15 : 0.5;
        terrain[tx] += depth * mult;
        terrain[tx] = Math.min(terrain[tx], H - 5);
      }
    }
  }
}

// ========== BOT AI ==========
let botMoveFrames = 0;
let botMoveDir = 0;
let botMoveDone = false;
let botAimFrame = 0;

function botShoot() {
  botDelay++;

  // Move phase
  if (!botMoveDone) {
    const bot = tanks[1];

    // Check if standing in hazard
    let inHazard = false;
    let hazardX = 0;
    let botInWater = false;
    for (const h of hazards) {
      if (h.type === 'water' && Math.abs(bot.x - h.x) < h.radius) { botInWater = true; }
      if (h.type !== 'ice' && h.type !== 'water' && Math.abs(bot.x - h.x) < h.radius) { inHazard = true; hazardX = h.x; break; }
    }

    if (botDelay === 1) {
      botMoveDir = 0;
      botMoveFrames = 0;
      if (inHazard) {
        // Check which direction has less hazard coverage
        let leftClear = true, rightClear = true;
        for (const h of hazards) {
          if (h.type === 'ice') continue;
          // Check 60px to the left and right
          if (Math.abs((bot.x - 60) - h.x) < h.radius) leftClear = false;
          if (Math.abs((bot.x + 60) - h.x) < h.radius) rightClear = false;
        }
        if (leftClear && !rightClear) botMoveDir = -1;
        else if (rightClear && !leftClear) botMoveDir = 1;
        else if (bot.x > W / 2) botMoveDir = -1; // fallback: toward center
        else botMoveDir = 1;
        // Don't go off edge
        if (bot.x < 50) botMoveDir = 1;
        if (bot.x > W - 50) botMoveDir = -1;
        botMoveFrames = 999; // keep going until clear
      } else {
        // Check for nearby crates
        let nearestCrate = null, nearestDist = Infinity;
        for (const c of crates) {
          const d = Math.abs(c.x - bot.x);
          if (d < nearestDist && d < 150) { nearestDist = d; nearestCrate = c; }
        }
        if (nearestCrate) {
          botMoveDir = nearestCrate.x > bot.x ? 1 : -1;
          botMoveFrames = Math.min(20, Math.round(nearestDist / bot.type.speed));
        } else if (Math.random() < 0.3) {
          botMoveDir = (Math.random() < 0.5) ? -1 : 1;
          botMoveFrames = Math.floor(Math.random() * 15);
        }
      }
    }

    // If fleeing hazard, stop once clear
    if (botMoveFrames === 999 && !inHazard) {
      botMoveFrames = 0;
    }

    if (botMoveFrames > 0 && bot.fuel > 0 && !botInWater) {
      let spd = bot.type.speed * 0.4;
      let botOnIce = false;
      for (const h of hazards) {
        if (h.type === 'ice' && Math.abs(bot.x - h.x) < h.radius) { botOnIce = true; }
        if (h.type === 'mud' && Math.abs(bot.x - h.x) < h.radius) { spd *= 0.35; }
      }
      if (botOnIce) {
        spd *= 2.5;
        bot.slideVx = botMoveDir * spd;
        bot.x += bot.slideVx;
        if (Math.random() < 0.15) SFX.move();
      } else {
        bot.x = Math.max(15, Math.min(W - 15, bot.x + botMoveDir * spd));
      }
      bot.fuel -= 0.3;
      if (botMoveFrames !== 999) botMoveFrames--;
      checkCratePickup(bot, 1);
      return;
    }
    // Bot in water: sway gently, no movement
    if (botInWater) {
      bot.inWater = true;
      bot.waterSway = Math.sin(Date.now() / 200) * 3;
      bot.x += bot.waterSway * 0.1;
    }
    botMoveDone = true;
    botAimFrame = 0;
  }

  // Aim phase
  botAimFrame++;

  // Frame 1: calculate best shot
  if (botAimFrame === 1) {
    const bot = tanks[1];
    const target = tanks[0];
    const grav = maps[currentMap].gravity;
    const available = [];
    for (let i = 0; i < bot.type.weapons.length; i++) {
      if (bot.ammo[i] !== 0) available.push(i);
    }
    if (bot.bonusWeapon && bot.bonusAmmo > 0) available.push(4);
    bot.weapon = available[Math.floor(Math.random() * available.length)];
    let bestAngle = 135, bestPower = 10, bestDist = Infinity;
    for (let power = 8; power <= 25; power += 1) {
      for (let angle = 5; angle <= 175; angle += 2) {
        const rad = angle * Math.PI / 180;
        let sx = bot.x, sy = terrainAt(bot.x) - 20;
        let vx = Math.cos(rad) * power, vy = -Math.sin(rad) * power;
        for (let step = 0; step < 300; step++) {
          if (windEnabled) vx += windStrength;
          sx += vx; vy += grav; sy += vy;
          if (sx <= 0 && vx < 0) { sx = 1; vx = -vx * 0.8; }
          if (sx >= W && vx > 0) { sx = W - 1; vx = -vx * 0.8; }
          if (sx >= 0 && sx < W && sy >= terrainAt(sx)) {
            const dist = Math.hypot(sx - target.x, sy - terrainAt(target.x));
            if (dist < bestDist) { bestDist = dist; bestAngle = angle; bestPower = power; }
            break;
          }
          if (sy > H + 50) break;
        }
      }
    }
    bestAngle += (Math.random() - 0.5) * 4;
    bestPower += (Math.random() - 0.5) * 1.5;
    bot._targetAngle = bestAngle;
    bot._botPower = bestPower;
    
    // Calculate trajectory points for visualization
    botTrajectory = [];
    const rad = bestAngle * Math.PI / 180;
    let tx = bot.x, ty = terrainAt(bot.x) - 20;
    let tvx = Math.cos(rad) * bestPower, tvy = -Math.sin(rad) * bestPower;
    for (let step = 0; step < 300; step++) {
      tx += tvx; tvy += grav; ty += tvy;
      if (tx <= 0 && tvx < 0) { tx = 1; tvx = -tvx * 0.8; }
      if (tx >= W && tvx > 0) { tx = W - 1; tvx = -tvx * 0.8; }
      if (ty > H + 50) break;
      if (step % 3 === 0) botTrajectory.push({ x: tx, y: ty });
      if (ty >= terrainAt(tx)) break;
    }
  }

  // Frames 2-50: slowly rotate barrel
  if (botAimFrame < 50) {
    const bot = tanks[1];
    const diff = bot._targetAngle - bot.angle;
    bot.angle += diff * 0.08;
    return;
  }

  // Frame 50: fire
  botDelay = 0;
  botMoveDone = false;
  botAimFrame = 0;
  const bot = tanks[1];
  bot.angle = bot._targetAngle;
  fireWeapon(bot);
  botTrajectory = []; // clear trajectory after firing
}

function impactDamage(px, py, w, p) {
  for (const t of tanks) {
    const dist = Math.hypot(t.x - px, terrainAt(t.x) - py);
    if (dist < w.radius + 20) {
      if (t.shield) {
        // Rebound shield: shot bounces back at shooter with 80% velocity
        t.shield = false;
        spawnFloatingText(t.x, terrainAt(t.x) - 55, 'REBOUND!', '#4af');
        // Create rebound projectile heading back at shooter
        const shooter = tanks[p.owner];
        if (shooter) {
          const dx = shooter.x - px;
          const dy = (terrainAt(shooter.x) - 20) - py;
          const angle = Math.atan2(dy, dx);
          const speed = Math.hypot(p.vx, p.vy) * 0.8;
          projectiles.push({
            x: px, y: py,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            owner: t === tanks[0] ? 0 : 1, // rebound belongs to shield owner
            weaponData: { ...w, radius: w.radius * 0.7, dmgMult: w.dmgMult * 0.6 },
            dmgBonus: p.dmgBonus,
            isRebound: true
          });
        }
        continue;
      }
      const dmg = Math.round(Math.max(0, (w.radius + 20 - dist)) * w.dmgMult * (p.dmgBonus || 1));
      t.hp -= dmg;
      if (dmg > 0) { spawnFloatingText(t.x + (Math.random()-0.5)*20, terrainAt(t.x) - 55, '-' + dmg, '#f44'); SFX.hit(); }
      if (w.effect === 'shock' && dmg > 0) t.shockTimer = 300;
      if (t.hp <= 0 && !gameOver) { t.hp = 0; checkWin(); }
    }
  }
}

// ========== UPDATE ==========
function update() {
  if (state !== 'game') return;
  const grav = maps[currentMap].gravity;
  const tank = tanks[turn];

  if ((!projectiles.length || testBotMode) && !gameOver) {
    if (turn === 0 || testBotMode) {
      let spd = tank.type.speed;
      let onIce = false, inWater = false;
      for (const h of hazards) {
        if (h.type === 'ice' && Math.abs(tank.x - h.x) < h.radius) { onIce = true; }
        if (h.type === 'mud' && Math.abs(tank.x - h.x) < h.radius) { spd *= 0.35; }
        if (h.type === 'water' && Math.abs(tank.x - h.x) < h.radius) { inWater = true; }
      }
      if (onIce) spd *= 2.5; // faster but slidey
      const moving = (keys['q'] || moveLeft || keys['e'] || moveRight);
      // Water: no movement, just swaying
      if (inWater) {
        tank.inWater = true;
        tank.waterSway = Math.sin(Date.now() / 200) * 3;
        tank.x += tank.waterSway;
        if (Math.random() < 0.02) SFX.water();
      } else {
        if ((keys['q'] || moveLeft) && tank.fuel > 0) { tank.slideVx = -spd; tank.fuel -= 0.3; }
        if ((keys['e'] || moveRight) && tank.fuel > 0) { tank.slideVx = spd; tank.fuel -= 0.3; }
        if (moving && tank.fuel > 0 && Math.random() < 0.15) SFX.move();
        if (!tank.slideVx) tank.slideVx = 0;
        if (onIce) {
          // Ice: slide with momentum
          tank.x += tank.slideVx;
          if (!moving) tank.slideVx *= 0.95; // friction on ice when not pressing
          else tank.slideVx *= 0.98;
        } else {
          if (moving) tank.x += tank.slideVx;
          tank.slideVx = 0; // no slide on normal ground
        }
      }
      tank.x = Math.max(15, Math.min(W - 15, tank.x));
      checkCratePickup(tank, 0);
    }
    if (turn === 1 && tanks[1].isBot) {
      if (tanks[1].testBot) { turn = 0; tanks[0].fuel = Math.min(tanks[0].fuel + 20, tanks[0].maxFuel); }
      else botShoot();
    }
  }

  // Projectile physics
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    const w = p.weaponData;

    // Homing: curve toward enemy
    if (w.behavior === 'homing' && !p.isFragment) {
      const enemy = tanks[1 - p.owner];
      const tx = enemy.x;
      const ty = terrainAt(enemy.x) - 15;
      const dx = tx - p.x;
      const dy = ty - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 10) {
        const strength = 0.5;
        p.vx += (dx / dist) * strength;
        p.vy += (dy / dist) * strength;
        // Cap speed so it doesn't go crazy
        const spd = Math.hypot(p.vx, p.vy);
        if (spd > 12) { p.vx *= 12/spd; p.vy *= 12/spd; }
      }
    }

    // Boomerang: fly out in arc, then return to thrower in circular path
    if (w.behavior === 'boomerang') {
      if (!p._boomFrame) {
        p._boomFrame = 0;
        p._outward = true;
        // Slow down boomerang speed
        const slowFactor = 0.6;
        p.vx *= slowFactor;
        p.vy *= slowFactor;
        // Store initial throw direction and speed
        p._throwSpeed = Math.hypot(p.vx, p.vy);
        p._throwAngle = Math.atan2(-p.vy, p.vx); // angle of throw
      }
      p._boomFrame++;
      const owner = tanks[p.owner];
      const ox = owner.x, oy = terrainAt(owner.x) - 20;
      const dx = ox - p.x, dy = oy - p.y;
      const distToOwner = Math.hypot(dx, dy);
      
      // Outward phase: first 30 frames fly away
      if (p._outward && p._boomFrame < 30) {
        // Slight upward curve during outward flight
        p.vy -= 0.15;
      }
      // Turnaround: start curving back
      else if (p._outward && p._boomFrame >= 30) {
        p._outward = false;
      }
      
      // Return phase: curve back to owner in boomerang arc
      if (!p._outward) {
        if (distToOwner > 10) {
          // Calculate desired direction toward owner
          const desiredAngle = Math.atan2(dy, dx);
          const currentAngle = Math.atan2(p.vy, p.vx);
          // Smoothly turn toward owner (boomerang curve)
          let angleDiff = desiredAngle - currentAngle;
          while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
          while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
          const turnStrength = w.buzzsaw ? 0.15 : 0.08;
          const newAngle = currentAngle + angleDiff * turnStrength;
          // Maintain speed
          const speed = Math.hypot(p.vx, p.vy) * 0.99; // slight drag
          p.vx = Math.cos(newAngle) * speed;
          p.vy = Math.sin(newAngle) * speed;
          // Add lift when moving (boomerang aerodynamics)
          p.vy -= 0.1;
        } else {
          // Caught by owner - despawn
          projectiles.splice(i, 1);
          continue;
        }
      }
      
      // Despawn if been flying too long (10 seconds)
      if (p._boomFrame > 600) {
        projectiles.splice(i, 1);
        continue;
      }
    }

    const isHoming = w.behavior === 'homing' && !p.isFragment;
    const isBoomerang = w.behavior === 'boomerang';
    if (windEnabled) p.vx += windStrength;
    p.x += p.vx;
    if (!isHoming && !isBoomerang) p.vy += grav;
    p.y += p.vy;

    // Ricochet off left/right walls
    if (p.x <= 0) { p.x = 1; p.vx = Math.abs(p.vx); }
    if (p.x >= W) { p.x = W - 1; p.vx = -Math.abs(p.vx); }

    // Check direct hit on enemy tank (not the one who fired, unless rebound)
    let hitTank = false;
    for (let ti = 0; ti < tanks.length; ti++) {
      if (ti === p.owner && !p.isFragment && !p.isRebound) continue; // don't hit yourself (unless rebound)
      const t = tanks[ti];
      const ty = terrainAt(t.x);
      const dx = p.x - t.x;
      const dy = p.y - (ty - 10);
      if (Math.abs(dx) < 18 && dy > -25 && dy < 5) {
        hitTank = true;
        break;
      }
    }

    // Boomerang: damage ENEMY only on pass-through, phase through owner
    if (hitTank && w.behavior === 'boomerang') {
      // Check if enemy is the one we're hitting
      const enemy = tanks[1 - p.owner];
      const ey = terrainAt(enemy.x);
      const edx = p.x - enemy.x;
      const edy = p.y - (ey - 10);
      if (Math.abs(edx) < 18 && edy > -25 && edy < 5) {
        impactDamage(p.x, p.y, w, p);
      }
      hitTank = false;
    }

    // Bouncy weapons: damage enemy but bounce off
    if (hitTank && (w.bouncy || w.behavior === 'pinball')) {
      impactDamage(p.x, p.y, w, p);
      p.vx = -p.vx + (Math.random() - 0.5) * 2;
      p.vy = -Math.abs(p.vy) * 0.9;
      hitTank = false; // don't count as ground hit
    }

    // Fragments (secondaries) disappear on hitting enemy
    if (hitTank && p.isFragment) {
      createExplosion(p.x, p.y, w);
      impactDamage(p.x, p.y, w, p);
      projectiles.splice(i, 1);
      continue;
    }

    const hitGround = w.behavior === 'boomerang' ? false : ((p.x >= 0 && p.x < W && p.y >= terrainAt(p.x)) || hitTank);
    const outOfBounds = p.y > H + 50;

    if (hitGround) {
      // Ground Zero: initial shot spawns one nuke orb from sky
      if (w.behavior === 'groundzero') {
        // Initial hit does 3 damage
        createExplosion(p.x, p.y, w);
        impactDamage(p.x, p.y, { ...w, dmgMult: 3 }, p);
        // Spawn single orb at impact point, dropping from sky
        projectiles.push({
          x: p.x, y: -20,
          vx: 0, vy: 4,
          owner: p.owner,
          weaponData: { ...w, radius: 20, dmgMult: 999999999999, behavior: 'nukeOrb', color: '#f44' },
          dmgBonus: p.dmgBonus, bounceCount: 0
        });
        projectiles.splice(i, 1);
        continue;
      }

      // Nuke Orb: strips entire map layer each bounce, 20 bounces
      if (w.behavior === 'nukeOrb') {
        if (!p.bounceCount) p.bounceCount = 0;
        if (p.bounceCount < 20) {
          p.bounceCount++;
          // Strip a layer off the ENTIRE map
          for (let tx = 0; tx < W; tx++) {
            terrain[tx] += 15;
            terrain[tx] = Math.min(terrain[tx], H - 5);
          }
          // Massive explosion + damage
          createExplosion(p.x, p.y, { ...w, radius: 60 });
          impactDamage(p.x, p.y, w, p);
          shakeTime = 20; shakeAmount = 15;
          SFX.explode(80);
          p.vy = -Math.abs(p.vy) * 0.9;
          p.y = terrainAt(p.x) - 2;
          continue;
        }
        // Final impact
        createExplosion(p.x, p.y, { ...w, radius: 100 });
        impactDamage(p.x, p.y, w, p);
        for (let tx = 0; tx < W; tx++) { terrain[tx] += 30; terrain[tx] = Math.min(terrain[tx], H - 5); }
        shakeTime = 30; shakeAmount = 20;
        projectiles.splice(i, 1);
        continue;
      }

      // Pinball: 50 bounces, no terrain damage, just bounce and hit
      if (w.behavior === 'pinball') {
        if (!p.bounceCount) p.bounceCount = 0;
        if (p.bounceCount < 50) {
          p.bounceCount++;
          impactDamage(p.x, p.y, w, p);
          p.vy = -Math.abs(p.vy);
          p.y = terrainAt(p.x) - 2;
          continue;
        }
        createExplosion(p.x, p.y, w);
        impactDamage(p.x, p.y, w, p);
        projectiles.splice(i, 1);
        continue;
      }

      // Swarm: 100 bounces, no ground damage, spawn 2 copies
      if (w.behavior === 'swarm') {
        // If hit enemy, damage + remove all swarm
        if (hitTank) {
          createExplosion(p.x, p.y, w);
          impactDamage(p.x, p.y, w, p);
          for (const pp of projectiles) { if (pp.weaponData && pp.weaponData.behavior === 'swarm') pp._remove = true; }
          projectiles = projectiles.filter(pp => !pp._remove);
          i = -1;
          continue;
        }
        if (!p.bounceCount) p.bounceCount = 0;
        if (p.bounceCount < 100) {
          p.bounceCount++;
          // Spawn 2 copies (each clone can only multiply once)
          if (!p.hasCloned) {
            p.hasCloned = true;
            for (let s = 0; s < 2; s++) {
              projectiles.push({
                x: p.x, y: terrainAt(p.x) - 2,
                vx: (Math.random() - 0.5) * 6 + p.vx * 0.4,
                vy: -(2 + Math.random() * 5),
                owner: p.owner, weaponData: w, dmgBonus: p.dmgBonus,
                bounceCount: p.bounceCount, hasCloned: false
              });
            }
          }
          p.vy = -Math.abs(p.vy) * 0.85;
          p.vx *= 0.85;
          p.y = terrainAt(p.x) - 2;
          continue;
        }
        projectiles.splice(i, 1);
        continue;
      }

      // Bounce off terrain (all weapons, up to 10 times, pass through enemies)
      if (!p.bounceCount) p.bounceCount = 0;
      const maxBounce = w.bouncy || (chaosMode ? (p.isFragment ? 4 : 10) : 0);
      if (p.bounceCount < maxBounce) {
        p.bounceCount++;
        createExplosion(p.x, p.y, w, !!w.bouncy);
        impactDamage(p.x, p.y, w, p);
        // Trigger behaviors on every bounce (no isFragment check — always trigger)
        if (w.behavior === 'split') {
          const frags = w.fragments || 4;
          for (let f = 0; f < frags; f++) {
            const angle = Math.PI * 0.3 + (f / (frags-1)) * Math.PI * 0.4;
            projectiles.push({ x: p.x, y: terrainAt(p.x) - 5, vx: Math.cos(angle) * (1.5 + Math.random() * 2) * (Math.random() < 0.5 ? 1 : -1), vy: -Math.sin(angle) * (3 + Math.random() * 2), owner: p.owner, weaponData: { ...w, radius: w.fragRadius || 12, behavior: null, dmgMult: w.dmgMult * 0.7 }, dmgBonus: p.dmgBonus, isFragment: true });
          }
        }
        if (w.behavior === 'rain') {
          const frags = w.fragments || 5;
          for (let f = 0; f < frags; f++) {
            const rx = p.x + (f - (frags-1)/2) * (50 / frags) + (Math.random()-0.5) * 8;
            projectiles.push({ x: rx, y: -10 - Math.random() * 30, vx: (Math.random()-0.5) * 0.3, vy: 3 + Math.random() * 3, owner: p.owner, weaponData: { ...w, radius: w.radius || 15, behavior: null, dmgMult: w.dmgMult * 0.7 }, dmgBonus: p.dmgBonus, isFragment: true });
          }
        }
        if (w.behavior === 'cluster') {
          const frags = w.fragments || 5;
          for (let f = 0; f < frags; f++) {
            const angle = Math.PI * 0.3 + (f / (frags-1)) * Math.PI * 0.4;
            projectiles.push({ x: p.x, y: terrainAt(p.x) - 5, vx: Math.cos(angle) * (1.5 + Math.random() * 2) * (p.vx > 0 ? 1 : -1), vy: -Math.sin(angle) * (2 + Math.random() * 2), owner: p.owner, weaponData: { ...w, radius: w.fragRadius || 12, behavior: null, dmgMult: w.dmgMult * 0.6 }, dmgBonus: p.dmgBonus, isFragment: true });
          }
        }
        if (w.behavior === 'drill' || w.behavior === 'drillRain') {
          const dr = w.radius * 1.3;
          for (let tx = Math.floor(p.x - dr); tx <= Math.ceil(p.x + dr); tx++) {
            if (tx >= 0 && tx < W) { const d = Math.abs(tx - p.x); terrain[tx] += Math.sqrt(Math.max(0, dr*dr - d*d)) * 0.4; terrain[tx] = Math.min(terrain[tx], H - 5); }
          }
          shakeTime = 20; shakeAmount = dr / 6;
        }
        if (w.behavior === 'drillRain') {

              const d = Math.abs(tx - p.x);

          }
          shakeTime = 15; shakeAmount = er / 8;
        }
        // chaosWeapon: ALL behaviors at once
        if (w.behavior === 'chaosWeapon') {
          // Split fragments
          const frags1 = w.fragments || 6;
          for (let f = 0; f < frags1; f++) {
            const angle = Math.PI * 0.3 + (f / (frags1-1)) * Math.PI * 0.4;

          }
          // Cluster fragments
          for (let f = 0; f < frags1; f++) {

            projectiles.push({ x: p.x, y: terrainAt(p.x) - 5, vx: Math.cos(angle) * (1.5 + Math.random() * 2) * (p.vx > 0 ? 1 : -1), vy: -Math.sin(angle) * (2 + Math.random() * 2), owner: p.owner, weaponData: { ...w, radius: w.fragRadius || 20, behavior: null, dmgMult: w.dmgMult * 0.4 }, dmgBonus: p.dmgBonus, isFragment: true });

          }
          // Drill crater
          const dr = w.radius * 1.3;
          for (let tx = Math.floor(p.x - dr); tx <= Math.ceil(p.x + dr); tx++) {
            if (tx >= 0 && tx < W) { const d = Math.abs(tx - p.x); terrain[tx] += Math.sqrt(Math.max(0, dr*dr - d*d)) * 0.4; terrain[tx] = Math.min(terrain[tx], H - 5); }
          }
          // DrillRain bombs
          for (let f = 0; f < 8; f++) {

        if (w.effect === 'radiation') hazards.push({ x: p.x, y: p.y, radius: w.radius * 1.8, type: 'radiation', life: 3600, dmg: 0.5 });

        if (w.effect === 'chaosAll') {
          hazards.push({ x: p.x, y: p.y, radius: w.radius * 0.8, type: 'fire', life: 180, dmg: 0.4 });

      // Split: fragments scatter on impact

        createExplosion(p.x, p.y, w);
        impactDamage(p.x, p.y, w, p);
        const frags = w.fragments || 4;

          projectiles.push({
            x: p.x, y: terrainAt(p.x) - 5,

            owner: p.owner,

            dmgBonus: p.dmgBonus,
            isFragment: true
          });
        }
        projectiles.splice(i, 1);
        continue;
      }

      // Rain: on impact, spawn bomblets that drop from the sky above impact point
      if (w.behavior === 'rain' && !p.isFragment) {
        createExplosion(p.x, p.y, w);
        impactDamage(p.x, p.y, w, p);
        const frags = w.fragments || 5;
        const spread = 50;
        for (let f = 0; f < frags; f++) {
          const rx = p.x + (f - (frags-1)/2) * (spread / frags) + (Math.random()-0.5) * 8;
          projectiles.push({
            x: rx, y: -10 - Math.random() * 30,
            vx: (Math.random()-0.5) * 0.3,
            vy: 3 + Math.random() * 3,
            owner: p.owner,
            weaponData: { ...w, radius: w.radius || 15, behavior: null, dmgMult: w.dmgMult * 0.7 },
            dmgBonus: p.dmgBonus,
            isFragment: true
          });
        }
        projectiles.splice(i, 1);
        continue;
      }

      // Cluster: spawn fragments on impact
      if (w.behavior === 'cluster' && !p.isFragment) {
        createExplosion(p.x, p.y, w);
        impactDamage(p.x, p.y, w, p);
        const frags = w.fragments || 5;
        for (let f = 0; f < frags; f++) {
          const angle = Math.PI * 0.3 + (f / (frags-1)) * Math.PI * 0.4;
          projectiles.push({
            x: p.x, y: terrainAt(p.x) - 5,
            vx: Math.cos(angle) * (1.5 + Math.random() * 2) * (p.vx > 0 ? 1 : -1),
            vy: -Math.sin(angle) * (2 + Math.random() * 2),

            isFragment: true
          });
        }
        projectiles.splice(i, 1);
        continue;
      }

      // DrillRain: drill on impact, then rain drilling bombs
      if (w.behavior === 'drillRain' && !p.isFragment) {
        const drillRadius = w.radius * 1.3;
        createExplosion(p.x, p.y, { ...w, radius: drillRadius });
        impactDamage(p.x, p.y, { ...w, radius: drillRadius }, p);
        for (let tx = Math.floor(p.x - drillRadius); tx <= Math.ceil(p.x + drillRadius); tx++) {
          if (tx >= 0 && tx < W) {

            terrain[tx] += depth * 0.4;
            terrain[tx] = Math.min(terrain[tx], H - 5);
          }
        }
        shakeTime = 25;
        shakeAmount = drillRadius / 5;
        // Rain 8 drilling mini-bombs
        const spread = 100;
        for (let f = 0; f < 8; f++) {
          const rx = p.x + (f - 3.5) * (spread / 8) + (Math.random()-0.5) * 15;
          projectiles.push({
            x: rx, y: -10 - Math.random() * 40,
            vx: (Math.random()-0.5) * 0.3,
            vy: 3 + Math.random() * 3,
            owner: p.owner,
            weaponData: { ...w, radius: 25, behavior: 'drill', dmgMult: w.dmgMult * 0.5, effect: w.effect },
            dmgBonus: p.dmgBonus,
            isFragment: true
          });
        }
        projectiles.splice(i, 1);
        continue;

      // Tomb: drill crater + raise walls on either side
      if (w.behavior === 'tomb' && !p.isFragment) {
        const drillRadius = w.radius * 1.2;
        createExplosion(p.x, p.y, { ...w, radius: drillRadius });
        impactDamage(p.x, p.y, { ...w, radius: drillRadius }, p);
        // Dig the crater
        for (let tx = Math.floor(p.x - drillRadius); tx <= Math.ceil(p.x + drillRadius); tx++) {
          if (tx >= 0 && tx < W) {
            const dd = Math.abs(tx - p.x);
            const depth = Math.sqrt(Math.max(0, drillRadius * drillRadius - dd * dd));

            terrain[tx] = Math.min(terrain[tx], H - 5);
          }
        }
        // Raise walls on either side
        const wallW = 15;
        const wallH = 25;
        for (let tx = Math.floor(p.x - drillRadius - wallW); tx <= Math.ceil(p.x - drillRadius); tx++) {
          if (tx >= 0 && tx < W) {
            const d = Math.abs(tx - (p.x - drillRadius));
            terrain[tx] -= wallH * (1 - d / wallW);
            terrain[tx] = Math.max(terrain[tx], H * 0.15);
          }
        }
        for (let tx = Math.floor(p.x + drillRadius); tx <= Math.ceil(p.x + drillRadius + wallW); tx++) {
          if (tx >= 0 && tx < W) {
            const d = Math.abs(tx - (p.x + drillRadius));
            terrain[tx] -= wallH * (1 - d / wallW);
            terrain[tx] = Math.max(terrain[tx], H * 0.15);
          }
        }
        shakeTime = 20;
        shakeAmount = drillRadius / 6;
        projectiles.splice(i, 1);

      // Erase: remove terrain entirely
      if (w.behavior === 'erase') {
        const er = w.radius;
        createExplosion(p.x, p.y, w);
        for (let tx = Math.floor(p.x - er); tx <= Math.ceil(p.x + er); tx++) {
          if (tx >= 0 && tx < W) {
            const d = Math.abs(tx - p.x);
            if (d < er) terrain[tx] = H - 5;
          }
        }
        shakeTime = 15; shakeAmount = er / 8;
      } else
      // Drill: bigger crater
      if (w.behavior === 'drill') {
        const drillRadius = w.radius * 1.3;
        createExplosion(p.x, p.y, { ...w, radius: drillRadius });
        // Extra terrain destruction
        let maxDepth = 0;
        for (let tx = Math.floor(p.x - drillRadius); tx <= Math.ceil(p.x + drillRadius); tx++) {
          if (tx >= 0 && tx < W) {
            const dist = Math.abs(tx - p.x);
            const depth = Math.sqrt(Math.max(0, drillRadius * drillRadius - dist * dist));

      } else if (w.effect === 'thermoAll') {
        // Radiation + acid + acid fire (1.5x damage)

        hazards.push({ x: p.x, y: p.y, radius: w.radius * 1.0, type: 'mud', life: 1200, dmg: 0 });
        hazards.push({ x: p.x, y: p.y, radius: w.radius * 0.8, type: 'acid', life: 1800, dmg: 1.35 });

      }
      projectiles.splice(i, 1);
    } else if (outOfBounds) {
      projectiles.splice(i, 1);
    }
  }

  // Floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y -= 0.8;
    floatingTexts[i].life--;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }

  // Explosions
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].alpha -= 0.025;
    if (explosions[i].alpha <= 0) explosions.splice(i, 1);
  }

  if (shakeTime > 0) shakeTime--;

  // Shock damage-over-time (on tanks, not ground)
  for (const t of tanks) {
    if (t.shockTimer > 0) {
      t.shockTimer--;
      t.hp -= 0.4;
      if (Math.random() < 0.04) {
        spawnFloatingText(t.x + (Math.random()-0.5)*20, terrainAt(t.x) - 55, 'SHOCK!', '#8af');
        SFX.shock();
      }
      if (t.hp <= 0 && !gameOver) { t.hp = 0; checkWin(); }
    }
  }

  updateHazardSounds();

  // Check for ice + fire touching -> create water hazard
  for (let i = 0; i < hazards.length; i++) {
    for (let j = i + 1; j < hazards.length; j++) {
      const h1 = hazards[i], h2 = hazards[j];
      if ((h1.type === 'ice' && (h2.type === 'fire' || h2.type === 'hellfire' || h2.type === 'lava')) ||
          (h2.type === 'ice' && (h1.type === 'fire' || h1.type === 'hellfire' || h1.type === 'lava'))) {
        const dist = Math.abs(h1.x - h2.x);
        if (dist < h1.radius + h2.radius) {
          // Create water hazard between them
          const waterX = (h1.x + h2.x) / 2;
          const waterRadius = (h1.radius + h2.radius) * 0.8;
          // Check if water already exists nearby
          let hasWater = false;
          for (const h of hazards) {
            if (h.type === 'water' && Math.abs(h.x - waterX) < 20) { hasWater = true; break; }
          }
          if (!hasWater) {
            hazards.push({ x: waterX, y: terrainAt(waterX), radius: waterRadius, type: 'water', life: 4200, dmg: 0 });
            // Remove the ice and fire that created it
            h1.life = 1; h2.life = 1;
          }
        }
      }
    }
  }

  // Snow map: convert water to ice, re-ice exposed ground
  if (maps[currentMap].name === 'Snow') {
    for (const h of hazards) {
      if (h.type === 'water') { h.type = 'ice'; h.life = 999999; h.dmg = 0; }
    }
    // Check for un-iced terrain and add ice patches
    for (let x = 40; x < W - 40; x += 60) {
      let hasIce = false;
      for (const h of hazards) {
        if (h.type === 'ice' && Math.abs(h.x - x) < 40) { hasIce = true; break; }
      }
      if (!hasIce) {
        hazards.push({ x, y: terrainAt(x), radius: 40 + Math.random() * 20, type: 'ice', life: 999999, dmg: 0 });
      }
    }
  }

  // Clear inWater flags before hazard check
  for (const t of tanks) t.inWater = false;

  // Hazard zones (fire/poison)
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    h.life--;
    // Lava: when it dies, raise terrain (cools into rock)
    if (h.life <= 0) {
      if (h.type === 'lava') {
        for (let tx = Math.floor(h.x - h.radius); tx <= Math.ceil(h.x + h.radius); tx++) {
          if (tx >= 0 && tx < W) {
            const dist = Math.abs(tx - h.x);
            const raise = Math.sqrt(Math.max(0, h.radius * h.radius - dist * dist)) * 0.15;
            terrain[tx] = Math.max(terrain[tx] - raise, H * 0.2);
          }
        }
      }
      hazards.splice(i, 1); continue;
    }
    // Lava: randomly spawn small fire splashes nearby
    if (h.type === 'lava' && Math.random() < 0.005) {
      const fx = h.x + (Math.random() - 0.5) * h.radius * 3;
      if (fx > 10 && fx < W - 10) {
        hazards.push({ x: fx, y: terrainAt(fx), radius: 12 + Math.random() * 10, type: 'fire', life: 120, dmg: 0.4 });
      }
    }
    // Damage tanks standing in the zone
    for (const t of tanks) {
      const dist = Math.abs(t.x - h.x);
      if (dist < h.radius) {
        // Water hazard: no movement, just swaying
        if (h.type === 'water') {
          t.inWater = true;
          t.waterSway = Math.sin(Date.now() / 200) * 3;
        } else {
          t.hp -= h.dmg;
          if (Math.random() < 0.03) {
            const labels = { fire: 'BURN', radiation: 'RADIATION', lava: 'LAVA!', poison: 'POISON', ice: 'FREEZE', acid: 'ACID!', acidFire: 'ACID BURN!', hellfire: 'HELLFIRE!', mud: 'MUD', water: 'WATER' };
            const cols = { fire: '#f80', radiation: '#cf0', lava: '#f40', poison: '#4f4', ice: '#8df', acid: '#0ff', acidFire: '#4fa', hellfire: '#c4f', mud: '#a85', water: '#4af' };
            const label = labels[h.type] || h.type;
            const col = cols[h.type] || '#fff';
            spawnFloatingText(t.x + (Math.random()-0.5)*20, terrainAt(t.x) - 55, label, col);
          }
        }
        // Check for game over from hazard damage
        if (t.hp <= 0 && !gameOver) {
          t.hp = 0;
          checkWin();
        }
      }
    }
  }

  // Turn switch
  if (lastProjCount > 0 && projectiles.length === 0 && !gameOver) {
    checkWin();
    if (!gameOver) {
      turn = 1 - turn;
      if (windEnabled) windStrength = (Math.random() - 0.5) * 0.4;
      tanks[turn].fuel = Math.min(tanks[turn].fuel + 20, tanks[turn].maxFuel);
      botDelay = 0;
      botMoveDone = false;
      botMoveFrames = 0;
      botAimFrame = 0;
      turnCount++;
      // Spawn crate every 4 turns
      if (turnCount % 4 === 0) spawnCrate();
    }
  }
  lastProjCount = projectiles.length;

  // Lava damage (volcano)
  if (maps[currentMap].lava) {
    for (const t of tanks) {
      if (terrainAt(t.x) > H * 0.78) {
        t.hp -= 0.2;
        if (Math.random() < 0.05) spawnFloatingText(t.x, terrainAt(t.x) - 50, '-LAVA', '#f40');
        if (t.hp <= 0 && !gameOver) { t.hp = 0; checkWin(); }
      }
    }
  }
}

function checkWin() {
  const dead0 = tanks[0].hp <= 0;
  const dead1 = tanks[1].hp <= 0;
  if (!dead0 && !dead1) return;
  if (dead0) tanks[0].hp = 0;
  if (dead1) tanks[1].hp = 0;
  gameOver = true;
  stopMusic();
  if (dead0 && dead1) {
    // Both dead — attacker wins, or draw if hazard kill
    winner = tanks[turn].name;
    if (turn === 0) { SFX.win(); }
    else { SFX.lose(); }
  } else if (dead1) {
    winner = tanks[0].name;
    totalWins++;
    localStorage.setItem('tankBattleWins', totalWins);
    SFX.win();
  } else {
    winner = tanks[1].name;
    SFX.lose();
  }
}

// ========== DRAWING ==========
function drawTank(t, tx, ty, scale) {
  const s = scale || 1;
  const type = t.type;
  const bw = type.bodyW * s / 2;
  const bh = type.bodyH * s;
  const bl = type.barrelLen * s;
  const brl = type.barrelW * s;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(tx, ty + 2 * s, bw + 2 * s, 4 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Treads — dark base with wheels
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(tx - bw - 2 * s, ty - 8 * s, (bw + 2 * s) * 2, 10 * s);
  // Wheels
  ctx.fillStyle = '#444';
  const wheelCount = Math.round(bw / (5 * s));
  for (let wi = 0; wi < wheelCount; wi++) {
    const wx = tx - bw + 4 * s + wi * ((bw * 2 - 8 * s) / (wheelCount - 1));
    ctx.beginPath();
    ctx.arc(wx, ty - 3 * s, 3.5 * s, 0, Math.PI * 2);
    ctx.fill();
  }
  // Wheel highlights
  ctx.fillStyle = '#555';
  for (let wi = 0; wi < wheelCount; wi++) {
    const wx = tx - bw + 4 * s + wi * ((bw * 2 - 8 * s) / (wheelCount - 1));
    ctx.beginPath();
    ctx.arc(wx, ty - 3.5 * s, 1.5 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // Body — rounded rectangle
  const bodyY = ty - bh - 8 * s;
  const bodyH = bh + 2 * s;
  ctx.fillStyle = t.color;
  ctx.fillRect(tx - bw + 2 * s, bodyY, (bw - 2 * s) * 2, bodyH);
  // Body highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(tx - bw + 4 * s, bodyY + 1 * s, (bw - 4 * s) * 2, bodyH * 0.4);
  // Body shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(tx - bw + 3 * s, bodyY + bodyH - 3 * s, (bw - 3 * s) * 2, 3 * s);

  // Turret dome — full circle bubble
  const turretR = 9 * s;
  const turretY = bodyY - 2 * s;
  ctx.fillStyle = t.color;
  ctx.beginPath();
  ctx.arc(tx, turretY, turretR, 0, Math.PI * 2);
  ctx.fill();
  // Turret highlight
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.arc(tx - 2 * s, turretY - 3 * s, turretR * 0.5, 0, Math.PI * 2);
  ctx.fill();
  // Turret outline
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1 * s;
  ctx.beginPath();
  ctx.arc(tx, turretY, turretR, 0, Math.PI * 2);
  ctx.stroke();

  // Barrel
  const rad = (t.angle || 45) * Math.PI / 180;
  const barrelStartX = tx + Math.cos(rad) * turretR * 0.5;
  const barrelStartY = turretY - Math.sin(rad) * turretR * 0.5;
  const barrelEndX = tx + Math.cos(rad) * (turretR * 0.5 + bl);
  const barrelEndY = turretY - Math.sin(rad) * (turretR * 0.5 + bl);
  // Barrel shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = brl + 2 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(barrelStartX, barrelStartY + 1 * s);
  ctx.lineTo(barrelEndX, barrelEndY + 1 * s);
  ctx.stroke();
  // Main barrel
  ctx.strokeStyle = t.color;
  ctx.lineWidth = brl;
  ctx.beginPath();
  ctx.moveTo(barrelStartX, barrelStartY);
  ctx.lineTo(barrelEndX, barrelEndY);
  ctx.stroke();
  // Barrel tip
  ctx.fillStyle = t.color;
  ctx.beginPath();
  ctx.arc(barrelEndX, barrelEndY, brl * 0.7, 0, Math.PI * 2);
  ctx.fill();
  // Barrel highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = brl * 0.3;
  ctx.beginPath();
  ctx.moveTo(barrelStartX, barrelStartY);
  ctx.lineTo(barrelEndX, barrelEndY);
  ctx.stroke();
  ctx.lineCap = 'butt';
}

function drawAimUI() {
  if (turn !== 0 || projectiles.length || gameOver || !dragging) return;
  const tank = tanks[0];
  const grav = maps[currentMap].gravity;
  const rad = tank.angle * Math.PI / 180;
  const power = dragPower;
  const tankY = terrainAt(tank.x);

  const pct = dragPower / MAX_POWER;

  // Draw aim line from tank barrel toward mouse
  const aimLen = 30 + pct * 40;
  const aimEndX = tank.x + Math.cos(rad) * aimLen;
  const aimEndY = tankY - Math.sin(rad) * aimLen;
  ctx.strokeStyle = pct < 0.4 ? 'rgba(80,200,120,0.5)' : pct < 0.75 ? 'rgba(240,200,50,0.5)' : 'rgba(240,60,60,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(tank.x, tankY);
  ctx.lineTo(aimEndX, aimEndY);
  ctx.stroke();

  // Arrow at end of aim line
  ctx.fillStyle = ctx.strokeStyle;
  ctx.beginPath();
  ctx.arc(aimEndX, aimEndY, 4, 0, Math.PI * 2);
  ctx.fill();

  if (power < 1) return;

  // Trajectory dotted lines (one per projectile in multi-shot weapons)
  const wCheck = tanks[0].weapon === 4 ? tanks[0].bonusWeapon : tanks[0].type.weapons[tanks[0].weapon];
  const canBounce = true; // all weapons bounce
  const shotCount = wCheck ? (wCheck.count || 1) : 1;
  const shotSpread = wCheck ? (wCheck.spread || 0) : 0;
  const tripleOffsets = tripleMode ? [-4, 0, 4] : [0];
  let lastSx = 0, lastSy = 0;

  for (const tOff of tripleOffsets) {
  for (let shot = 0; shot < shotCount; shot++) {
    const angleOff = (shot - (shotCount - 1) / 2) * shotSpread + tOff;
    const shotRad = (tank.angle + angleOff) * Math.PI / 180;
    let sx = tank.x, sy = tankY - 20;
    let vx = Math.cos(shotRad) * power, vy = -Math.sin(shotRad) * power;
    const alpha = shotCount === 1 ? 0.4 : 0.3;
    ctx.setLineDash([5, 8]);
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    let trajBounced = false;
    const isBoomerangTraj = wCheck && wCheck.behavior === 'boomerang';
    // Boomerang trajectory simulation - must match actual physics EXACTLY
    let boomFrame = 0, outward = true;
    if (isBoomerangTraj) {
      // Apply same slowFactor as actual physics
      const slowFactor = 0.6;
      vx *= slowFactor;
      vy *= slowFactor;
    }
    for (let step = 0; step < (isBoomerangTraj ? 400 : 300); step++) {
      if (isBoomerangTraj) {
        boomFrame++;
        const dx = tank.x - sx, dy = (tankY - 20) - sy;
        const distToOwner = Math.hypot(dx, dy);
        // Outward phase: first 30 frames
        if (outward && boomFrame < 30) {
          vy -= 0.15; // upward curve
        } else if (outward && boomFrame >= 30) {
          outward = false;
        }
        // Return phase: curve back to owner
        if (!outward) {
          if (distToOwner > 10) {
            const desiredAngle = Math.atan2(dy, dx);
            const currentAngle = Math.atan2(vy, vx);
            let angleDiff = desiredAngle - currentAngle;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            const turnStrength = wCheck.buzzsaw ? 0.15 : 0.08;
            const newAngle = currentAngle + angleDiff * turnStrength;
            const speed = Math.hypot(vx, vy) * 0.99;
            vx = Math.cos(newAngle) * speed;
            vy = Math.sin(newAngle) * speed;
            vy -= 0.1; // aerodynamic lift
          } else {
            break; // returned to owner
          }
        }
        if (boomFrame > 400) break;
      }
      if (windEnabled) vx += windStrength;
      sx += vx;
      if (!isBoomerangTraj) vy += grav;
      sy += vy;
      if (sx <= 0 && vx < 0) { sx = 1; vx = -vx * 0.8; }
      if (sx >= W && vx > 0) { sx = W - 1; vx = -vx * 0.8; }
      if (sy >= terrainAt(sx)) {
        if (!simpleAiming && chaosMode) {
          if (!trajBounced) trajBounced = 0;
          if (trajBounced < 10) {
            trajBounced++;
            vy = -Math.abs(vy);
            sy = terrainAt(sx) - 2;
            continue;
          }
        }
        break;
      }
      ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    lastSx = sx; lastSy = sy;

    // Impact crosshair per shot
    ctx.strokeStyle = 'rgba(255,80,80,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx, sy, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx - 12, sy); ctx.lineTo(sx + 12, sy);
    ctx.moveTo(sx, sy - 12); ctx.lineTo(sx, sy + 12);
    ctx.stroke();
  }
  }

  // Power bar at top
  ctx.fillStyle = '#222'; ctx.fillRect(W / 2 - 100, 10, 200, 16);
  ctx.strokeStyle = '#555'; ctx.strokeRect(W / 2 - 100, 10, 200, 16);
  ctx.fillStyle = pct < 0.4 ? '#4a9' : pct < 0.75 ? '#ea4' : '#e44';
  ctx.fillRect(W / 2 - 99, 11, 198 * pct, 14);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  ctx.fillText('POWER', W / 2, 22);
}

function drawSelect() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0a2a');
  grad.addColorStop(1, '#1a1a3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Back button
  ctx.fillStyle = '#333';
  ctx.fillRect(20, 15, 80, 30);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, 15, 80, 30);
  ctx.fillStyle = '#aaa';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('< BACK', 60, 35);

  // Title
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SELECT TANK', W / 2, 45);

  ctx.fillStyle = '#666';
  ctx.font = '11px monospace';
  ctx.fillText('Click a tank to start battle', W / 2, 70);

  // Tank cards in grid (3 columns, scrollable)
  for (let i = 0; i < tankTypes.length; i++) {
    const t = tankTypes[i];
    const col = i % 3;
    const row = Math.floor(i / 3);
    const bx = W / 2 - 210 + col * 145;
    const by = 120 + row * 170 - selectScroll;
    if (by + 150 < 50 || by > H) continue; // skip off-screen cards
    const hovered = menuHover === i;
    const selected = menuSelection === i;

    const isLocked = t.locked && (t.unlockCode ? !unlockedCodes.includes(t.unlockCode) : totalWins < (t.unlockWins || 0));

    // Card background
    ctx.fillStyle = isLocked ? '#0e0e1a' : hovered ? '#2a2a4a' : '#151530';
    ctx.fillRect(bx, by, 130, 150);
    ctx.strokeStyle = isLocked ? '#222' : hovered ? t.color : selected ? '#555' : '#333';
    ctx.lineWidth = hovered && !isLocked ? 2 : 1;
    ctx.strokeRect(bx, by, 130, 150);

    if (isLocked) {
      // Locked overlay
      ctx.fillStyle = '#555';
      ctx.font = 'bold 20px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LOCKED', bx + 65, by + 65);
      ctx.fillStyle = '#888';
      ctx.font = '10px monospace';
      ctx.fillText(t.name, bx + 65, by + 85);
      ctx.fillStyle = '#666';
      ctx.font = '9px monospace';
      if (t.unlockCode) {
        ctx.fillText('Enter code to unlock', bx + 65, by + 105);
        ctx.fillText('Code: ???', bx + 65, by + 120);
      } else {
        ctx.fillText('Win ' + t.unlockWins + 'x to unlock', bx + 65, by + 105);
        ctx.fillText('(' + totalWins + '/' + t.unlockWins + ')', bx + 65, by + 120);
        drawStatBar(bx + 20, by + 128, 90, totalWins / t.unlockWins, '#a6f');
      }
    } else {
      // Tank color bar at top
      ctx.fillStyle = t.color;
      ctx.fillRect(bx + 1, by + 1, 128, 4);

      // Tank name
      ctx.fillStyle = hovered ? '#fff' : '#ccc';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(t.name, bx + 65, by + 25);

      // Tank preview
      const fakeTank = { color: t.color, type: t, angle: 45 };
      drawTank(fakeTank, bx + 65, by + 70, 1);

      // Stats
      ctx.font = '9px monospace';
      ctx.fillStyle = '#999';
      ctx.textAlign = 'left';
      ctx.fillText('HP', bx + 10, by + 102);
      ctx.fillText('SPD', bx + 10, by + 115);
      ctx.fillText('FUEL', bx + 10, by + 128);

      // Stat bars
      const maxHp = 1600, maxSpd = 2, maxFuel = 130;
      drawStatBar(bx + 45, by + 95, 75, t.hp / maxHp, '#4c4');
      drawStatBar(bx + 45, by + 108, 75, t.speed / maxSpd, '#48f');
      drawStatBar(bx + 45, by + 121, 75, t.fuel / maxFuel, '#fa4');

      // Description
      ctx.fillStyle = t.color;
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(t.desc, bx + 65, by + 145);
    }
  }

  // Bottom bar background
  ctx.fillStyle = 'rgba(10,10,30,0.9)';
  ctx.fillRect(0, H - 55, W, 55);

  // Weapon preview of hovered tank
  const previewIdx = menuHover >= 0 ? menuHover : menuSelection;
  const previewWeapons = tankTypes[previewIdx].weapons;
  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(tankTypes[previewIdx].name + ' weapons:', W / 2, H - 38);
  ctx.fillStyle = '#aaa';
  ctx.font = '9px monospace';
  ctx.fillText(previewWeapons.map(w => w.name).join('  |  '), W / 2, H - 22);

  // Scroll hint
  const maxScroll = Math.max(0, Math.ceil(tankTypes.length / 3) * 170 + 120 - H + 40);
  if (maxScroll > 0) {
    ctx.fillStyle = '#555';
    ctx.font = '9px monospace';
    ctx.fillText('Scroll to see more', W / 2, H - 6);
  }
}
