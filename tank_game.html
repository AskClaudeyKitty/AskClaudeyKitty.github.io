  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
  ctx.fillText('SELECT MAP', W / 2, 45);
  ctx.fillStyle = '#666'; ctx.font = '11px monospace';
  ctx.fillText('Playing as ' + tankTypes[menuSelection].name, W / 2, 68);

  // Random button
  ctx.fillStyle = '#555'; ctx.fillRect(W / 2 - 60, 80, 120, 30);
  ctx.strokeStyle = '#777'; ctx.lineWidth = 1; ctx.strokeRect(W / 2 - 60, 80, 120, 30);
  ctx.fillStyle = '#ddd'; ctx.font = 'bold 12px monospace';
  ctx.fillText('RANDOM', W / 2, 100);

  // Map cards
  const totalW = maps.length * 85;
  for (let i = 0; i < maps.length; i++) {
    const mp = maps[i];
    const bx = W / 2 - totalW / 2 + i * 85;
    const by = 140;
    const hovered = mapHover === i;

    // Card bg with map sky colors
    const cg = ctx.createLinearGradient(bx, by, bx, by + 180);
    cg.addColorStop(0, mp.sky1);
    cg.addColorStop(0.5, mp.sky2);
    cg.addColorStop(1, mp.ground);
    ctx.fillStyle = cg;
    ctx.fillRect(bx, by, 75, 180);
    ctx.strokeStyle = hovered ? '#fff' : '#444';
    ctx.lineWidth = hovered ? 2 : 1;
    ctx.strokeRect(bx, by, 75, 180);

    // Map name
    ctx.fillStyle = hovered ? '#fff' : '#ccc';
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(mp.name, bx + 37, by + 20);

    // Terrain type
    const ttLabel = mp.terrainType === 'sand' ? 'Sand' : mp.terrainType === 'rock' ? 'Rock' : 'Dirt';
    ctx.fillStyle = mp.terrainType === 'sand' ? '#da0' : mp.terrainType === 'rock' ? '#888' : '#6a6';
    ctx.font = '9px monospace';
    ctx.fillText(ttLabel, bx + 37, by + 35);

    // Gravity
    ctx.fillStyle = '#999'; ctx.font = '8px monospace';
    ctx.fillText('Grav: ' + mp.gravity, bx + 37, by + 50);

    // Boosts
    if (mp.boosts) {
      ctx.fillStyle = '#aa8'; ctx.font = '7px monospace';
      const boostStr = mp.boosts.join(', ');
      ctx.fillText(boostStr.length > 12 ? boostStr.substring(0, 12) + '..' : boostStr, bx + 37, by + 170);
    }

    // Mini terrain preview
    ctx.strokeStyle = mp.groundLine; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let px = 0; px < 65; px++) {
      const py = by + 80 + Math.sin(px * 0.15 + i * 2) * 10 * (mp.roughness / 3);
      if (px === 0) ctx.moveTo(bx + 5 + px, py);
      else ctx.lineTo(bx + 5 + px, py);
    }
    ctx.stroke();
  }
}

function drawStatBar(x, y, w, pct, color) {
  pct = Math.min(1, Math.max(0, pct));
  ctx.fillStyle = '#222';
  ctx.fillRect(x, y, w, 8);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * pct, 8);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, 8);
}

// ========== GAME DRAW ==========
function drawGame() {
  const m = maps[currentMap];
  ctx.save();
  if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);

  // Sky
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, m.sky1);
  grad.addColorStop(1, m.sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(-5, -5, W + 10, H + 10);

  // Moon stars
  if (m.name === 'Moon') {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 50; i++) {
      const sx = (i * 137.5) % W;
      const sy = (i * 97.3) % (H * 0.4);
      ctx.fillRect(sx, sy, 1, 1);
    }
  }

  // Lava layer
  if (m.lava) {
    ctx.fillStyle = '#f40';
    ctx.fillRect(0, H * 0.85, W, H * 0.15);
    ctx.fillStyle = '#f80';
    const t = Date.now() / 500;
    for (let x = 0; x < W; x += 20) {
      const ly = H * 0.85 + Math.sin(t + x * 0.05) * 3;
      ctx.fillRect(x, ly, 20, 3);
    }
  }

  // Terrain
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x++) ctx.lineTo(x, terrain[x]);
  ctx.lineTo(W, H); ctx.closePath();
  ctx.fillStyle = m.ground; ctx.fill();
  ctx.strokeStyle = m.groundLine; ctx.lineWidth = 2; ctx.stroke();

  // Ricochet walls
  const wallAlpha = 0.3 + Math.sin(Date.now() / 500) * 0.1;
  ctx.fillStyle = `rgba(150,150,255,${wallAlpha})`;
  ctx.fillRect(0, 0, 3, H);
  ctx.fillRect(W - 3, 0, 3, H);
  ctx.strokeStyle = `rgba(200,200,255,${wallAlpha + 0.1})`;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath(); ctx.moveTo(1.5, 0); ctx.lineTo(1.5, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W - 1.5, 0); ctx.lineTo(W - 1.5, H); ctx.stroke();
  ctx.setLineDash([]);

  // Snow overlay
  if (m.name === 'Snow') {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x++) ctx.lineTo(x, terrain[x]);
    ctx.stroke();
  }

  // Hazard zones
  for (const h of hazards) {
    const alpha = Math.min(0.5, h.life / 100);
    const t = Date.now() / 300;
    if (h.type === 'fire') {
      // Flickering fire on the ground
      for (let fx = h.x - h.radius; fx < h.x + h.radius; fx += 6) {
        if (fx < 0 || fx >= W) continue;
        const fy = terrainAt(fx);
        const flicker = Math.sin(t + fx * 0.3) * 4 + Math.random() * 3;
        const fh = 8 + flicker;
        const g = ctx.createLinearGradient(fx, fy - fh, fx, fy);
        g.addColorStop(0, `rgba(255,200,0,0)`);
        g.addColorStop(0.3, `rgba(255,120,0,${alpha * 0.8})`);
        g.addColorStop(1, `rgba(255,50,0,${alpha})`);
        ctx.fillStyle = g;
        ctx.fillRect(fx - 3, fy - fh, 6, fh);
      }
    } else if (h.type === 'poison') {
      // Green poison cloud
      const pulse = Math.sin(t * 2) * 0.15;
      ctx.fillStyle = `rgba(80,255,40,${alpha * 0.3 + pulse * 0.1})`;
      ctx.beginPath();
      ctx.ellipse(h.x, terrainAt(h.x) - 10, h.radius, 20 + Math.sin(t) * 5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Bubbles
      for (let b = 0; b < 4; b++) {
        const bx = h.x + Math.sin(t * 1.5 + b * 2) * h.radius * 0.6;
        const by = terrainAt(h.x) - 5 - Math.abs(Math.sin(t * 2 + b)) * 20;
        ctx.fillStyle = `rgba(100,255,50,${alpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(bx, by, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (h.type === 'radiation') {
      // Yellow-green radiation glow with pulsing rings
      const pulse = Math.sin(t * 3) * 0.15;
      const gy = terrainAt(h.x);
      // Ground glow
      const rg = ctx.createRadialGradient(h.x, gy, 0, h.x, gy, h.radius);
      rg.addColorStop(0, `rgba(200,255,0,${alpha * 0.4 + pulse * 0.1})`);
      rg.addColorStop(0.5, `rgba(150,200,0,${alpha * 0.2})`);
      rg.addColorStop(1, 'rgba(100,150,0,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(h.x, gy, h.radius, 0, Math.PI * 2);
      ctx.fill();
      // Radiation rings
      for (let r = 0; r < 3; r++) {
        const ringR = (h.radius * 0.3) + ((t * 20 + r * h.radius * 0.4) % (h.radius * 0.8));
        const ringA = alpha * 0.3 * (1 - ringR / h.radius);
        if (ringA > 0) {
          ctx.strokeStyle = `rgba(220,255,0,${ringA})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(h.x, gy - 5, ringR, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      // Particles
      for (let p = 0; p < 5; p++) {
        const px = h.x + Math.sin(t * 1.2 + p * 1.8) * h.radius * 0.5;
        const py = gy - 3 - Math.abs(Math.sin(t * 1.5 + p * 1.3)) * 25;
        ctx.fillStyle = `rgba(230,255,0,${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(px, py, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (h.type === 'ice') {
      // Shiny ice patch on terrain
      const gy = terrainAt(h.x);
      ctx.fillStyle = `rgba(150,220,255,${alpha * 0.25})`;
      ctx.beginPath();
      ctx.ellipse(h.x, gy + 1, h.radius, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Shiny highlights
      ctx.strokeStyle = `rgba(200,240,255,${alpha * 0.4 + Math.sin(t * 2) * 0.1})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let ix = h.x - h.radius * 0.8; ix < h.x + h.radius * 0.8; ix += 12) {
        ctx.moveTo(ix, gy - 1);
        ctx.lineTo(ix + 6, gy + 1);
      }
      ctx.stroke();
      // Sparkles
      for (let s = 0; s < 3; s++) {
        const sx = h.x + Math.sin(t * 0.8 + s * 2.5) * h.radius * 0.6;
        const sparkle = Math.sin(t * 3 + s * 4);
        if (sparkle > 0.5) {
          ctx.fillStyle = `rgba(255,255,255,${alpha * sparkle * 0.5})`;
          ctx.fillRect(sx - 1, gy - 2, 2, 2);
        }
      }
    } else if (h.type === 'water') {
      // Water hazard: blue shimmering surface with gentle waves
      const gy = terrainAt(h.x);
      const wave = Math.sin(t * 2) * 3;
      // Water surface gradient
      const wg = ctx.createLinearGradient(h.x, gy - 8, h.x, gy + 5);
      wg.addColorStop(0, `rgba(100,180,255,${alpha * 0.6})`);
      wg.addColorStop(0.5, `rgba(60,140,220,${alpha * 0.4})`);
      wg.addColorStop(1, `rgba(40,100,180,${alpha * 0.3})`);
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.ellipse(h.x, gy, h.radius, 10 + wave, 0, 0, Math.PI * 2);
      ctx.fill();
      // Wave lines
      ctx.strokeStyle = `rgba(150,200,255,${alpha * 0.5})`;
      ctx.lineWidth = 1;
      for (let wy = -5; wy <= 5; wy += 4) {
        ctx.beginPath();
        for (let wx = -h.radius; wx <= h.radius; wx += 3) {
          const waveY = Math.sin(wx * 0.3 + t * 3) * 2;
          ctx.lineTo(h.x + wx, gy + wy + waveY);
        }
        ctx.stroke();
      }
      // Sparkles on water surface
      for (let s = 0; s < 4; s++) {
        const sx = h.x + Math.sin(t * 1.5 + s * 2) * h.radius * 0.7;
        const sparkle = Math.sin(t * 4 + s * 3);
        if (sparkle > 0.7) {
          ctx.fillStyle = `rgba(200,230,255,${sparkle * alpha * 0.8})`;
          ctx.beginPath();
          ctx.arc(sx, gy - 2, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (h.type === 'mud') {
      // Brown mud patch
      const gy = terrainAt(h.x);
      ctx.fillStyle = `rgba(120,80,30,${alpha * 0.4})`;
      ctx.beginPath();
      ctx.ellipse(h.x, gy + 2, h.radius, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(90,60,20,${alpha * 0.3})`;
      ctx.beginPath();
      ctx.ellipse(h.x, gy + 2, h.radius * 0.6, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (h.type === 'acid') {
      // Glowing cyan-green acid pool with bubbles
      const gy = terrainAt(h.x);
      const ag = ctx.createRadialGradient(h.x, gy, 0, h.x, gy, h.radius);
      ag.addColorStop(0, `rgba(0,255,200,${alpha * 0.6})`);
      ag.addColorStop(0.4, `rgba(0,200,180,${alpha * 0.4})`);
      ag.addColorStop(0.8, `rgba(0,150,120,${alpha * 0.2})`);
      ag.addColorStop(1, 'rgba(0,80,60,0)');
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.ellipse(h.x, gy + 2, h.radius, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // Bright core
      ctx.fillStyle = `rgba(100,255,220,${alpha * 0.3 + Math.sin(t * 4) * 0.1})`;
      ctx.beginPath();
      ctx.ellipse(h.x, gy + 2, h.radius * 0.3, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      // Acid bubbles
      for (let b = 0; b < 5; b++) {
        const bx = h.x + Math.sin(t * 1.5 + b * 1.4) * h.radius * 0.6;
        const bubblePhase = (t * 2.5 + b * 1.3) % 2.5;
        if (bubblePhase < 1.2) {
          const by = gy - bubblePhase * 10;
          ctx.fillStyle = `rgba(0,255,200,${alpha * (1 - bubblePhase / 1.2) * 0.5})`;
          ctx.beginPath();
          ctx.arc(bx, by, 2 + bubblePhase, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (h.type === 'acidFire') {
      // Green-teal burning flames
      const gy = terrainAt(h.x);
      for (let fx = h.x - h.radius; fx < h.x + h.radius; fx += 6) {
        if (fx < 0 || fx >= W) continue;
        const fy = terrainAt(fx);
        const flicker = Math.sin(t + fx * 0.3) * 4 + Math.random() * 3;
        const fh = 10 + flicker;
        const g = ctx.createLinearGradient(fx, fy - fh, fx, fy);
        g.addColorStop(0, 'rgba(0,255,180,0)');
        g.addColorStop(0.3, `rgba(0,220,150,${alpha * 0.7})`);
        g.addColorStop(1, `rgba(0,180,120,${alpha * 0.9})`);
        ctx.fillStyle = g;
        ctx.fillRect(fx - 3, fy - fh, 6, fh);
      }
    } else if (h.type === 'hellfire') {
      // Purple demonic fire
      for (let fx = h.x - h.radius; fx < h.x + h.radius; fx += 5) {
        if (fx < 0 || fx >= W) continue;
        const fy = terrainAt(fx);
        const flicker = Math.sin(t * 1.5 + fx * 0.4) * 5 + Math.random() * 4;
        const fh = 12 + flicker;
        const g = ctx.createLinearGradient(fx, fy - fh, fx, fy);
        g.addColorStop(0, 'rgba(200,100,255,0)');
        g.addColorStop(0.2, `rgba(180,60,255,${alpha * 0.6})`);
        g.addColorStop(0.6, `rgba(140,30,200,${alpha * 0.8})`);
        g.addColorStop(1, `rgba(80,0,150,${alpha * 0.9})`);
        ctx.fillStyle = g;
        ctx.fillRect(fx - 3, fy - fh, 6, fh);
      }
      // Purple embers
      for (let e = 0; e < 4; e++) {
        const ex = h.x + Math.sin(t * 1.2 + e * 2) * h.radius * 0.7;
        const ey = terrainAt(h.x) - 5 - Math.abs(Math.sin(t * 2 + e * 1.5)) * 18;
        ctx.fillStyle = `rgba(200,100,255,${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(ex, ey, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (h.type === 'lava') {
      // Lava pool — solid like the bottom-of-map lava layer
      const gy = terrainAt(h.x);
      // Solid lava fill
      ctx.fillStyle = `rgba(255,68,0,${alpha})`;
      ctx.beginPath();
      ctx.ellipse(h.x, gy + 2, h.radius, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // Bright wavy surface line (like map lava)
      ctx.fillStyle = `rgba(255,136,0,${alpha * 0.9})`;
      for (let lx = h.x - h.radius; lx < h.x + h.radius; lx += 20) {
        if (lx < 0 || lx >= W) continue;
        const ly = gy - 1 + Math.sin(t * 2 + lx * 0.05) * 3;
        ctx.fillRect(lx, ly, 20, 3);
      }
      // Hot yellow core
      ctx.fillStyle = `rgba(255,200,0,${alpha * 0.5 + Math.sin(t * 3) * 0.1})`;
      ctx.beginPath();
      ctx.ellipse(h.x, gy + 2, h.radius * 0.5, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Crates
  for (const c of crates) {
    ctx.fillStyle = '#8a3000';
    ctx.fillRect(c.x - c.size / 2, c.y - c.size / 2, c.size, c.size);
    ctx.strokeStyle = '#fa0';
    ctx.lineWidth = 2;
    ctx.strokeRect(c.x - c.size / 2, c.y - c.size / 2, c.size, c.size);
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('W', c.x, c.y + 4);
  }

  // Explosions
  for (const e of explosions) {
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
    g.addColorStop(0, `rgba(255, 200, 50, ${e.alpha})`);
    g.addColorStop(0.5, `rgba(255, 100, 20, ${e.alpha * 0.6})`);
    g.addColorStop(1, 'rgba(100, 20, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
  }

  // Tanks
  for (let i = 0; i < 2; i++) {
    const t = tanks[i];
    const ty = terrainAt(t.x);
    drawTank(t, t.x, ty, 1);
    // Shield bubble
    if (t.shield) {
      const sa = 0.25 + Math.sin(Date.now() / 300) * 0.1;
      ctx.strokeStyle = `rgba(80,180,255,${sa + 0.2})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(t.x, ty - 15, 25, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = `rgba(80,180,255,${sa * 0.3})`;
      ctx.fill();
    }
    // Shock visual — electric arcs
    if (t.shockTimer > 0) {
      ctx.strokeStyle = `rgba(130,180,255,${0.4 + Math.random() * 0.4})`;
      ctx.lineWidth = 1.5;
      for (let arc = 0; arc < 3; arc++) {
        ctx.beginPath();
        const sx = t.x + (Math.random() - 0.5) * 25;
        const sy = ty - 10 + (Math.random() - 0.5) * 20;
        ctx.moveTo(sx, sy);
        for (let seg = 0; seg < 3; seg++) {
          ctx.lineTo(sx + (Math.random() - 0.5) * 20, sy + (Math.random() - 0.5) * 20);
        }
        ctx.stroke();
      }
    }
    // HP bar
    ctx.fillStyle = '#333';
    ctx.fillRect(t.x - 22, ty - 36, 44, 6);
    ctx.fillStyle = t.hp / t.maxHp > 0.5 ? '#4c4' : t.hp / t.maxHp > 0.25 ? '#ea4' : '#e44';
    ctx.fillRect(t.x - 22, ty - 36, 44 * Math.max(0, t.hp / t.maxHp), 6);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
    ctx.strokeRect(t.x - 22, ty - 36, 44, 6);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    const boostLabel = t.boosted ? ' +' : '';
    ctx.fillText(t.name + boostLabel + ' ' + Math.max(0, Math.round(t.hp)) + '/' + t.maxHp, t.x, ty - 40);
    if (i === 0) {
      ctx.fillStyle = '#333';
      ctx.fillRect(t.x - 22, ty - 50, 44, 4);
      ctx.fillStyle = '#48f';
      ctx.fillRect(t.x - 22, ty - 50, 44 * (t.fuel / t.maxFuel), 4);
    }
  }

  drawAimUI();

  // Bot trajectory preview (when bot is aiming)
  if (turn === 1 && botTrajectory.length > 0 && !projectiles.length && !gameOver) {
    ctx.strokeStyle = 'rgba(255, 100, 100, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(tanks[1].x, terrainAt(tanks[1].x) - 20);
    for (const point of botTrajectory) {
      ctx.lineTo(point.x, point.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Target marker at end of trajectory
    if (botTrajectory.length > 0) {
      const lastPoint = botTrajectory[botTrajectory.length - 1];
      ctx.fillStyle = 'rgba(255, 50, 50, 0.5)';
      ctx.beginPath();
      ctx.arc(lastPoint.x, lastPoint.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 100, 100, 0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(lastPoint.x, lastPoint.y, 8, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Projectiles — glowing orbs with trails
  for (const p of projectiles) {
    const w = p.weaponData;
    const big = w.radius > 40;
    const med = w.radius > 25;
    const r = big ? 6 : med ? 5 : p.isFragment ? 3 : 4;

    // Parse color to RGB for alpha blending
    const hex = w.color;
    let cr, cg, cb;
    if (hex.length === 4) { cr = parseInt(hex[1]+hex[1],16); cg = parseInt(hex[2]+hex[2],16); cb = parseInt(hex[3]+hex[3],16); }
    else { cr = parseInt(hex.slice(1,3),16); cg = parseInt(hex.slice(3,5),16); cb = parseInt(hex.slice(5,7),16); }

    // Trail
    const spd = Math.hypot(p.vx, p.vy);
    const trailLen = Math.min(spd * 4, 30);
    if (trailLen > 2) {
      const nx = p.vx / spd, ny = p.vy / spd;
      const tg = ctx.createLinearGradient(p.x, p.y, p.x - nx * trailLen, p.y - ny * trailLen);
      tg.addColorStop(0, `rgba(${cr},${cg},${cb},0.5)`);
      tg.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.strokeStyle = tg;
      ctx.lineWidth = r * 1.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - nx * trailLen, p.y - ny * trailLen);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }

    // Outer glow
    const gg = ctx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, r * 3);
    gg.addColorStop(0, `rgba(${cr},${cg},${cb},0.25)`);
    gg.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2);
    ctx.fill();

    // Main orb
    ctx.fillStyle = w.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Bright center
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(p.x - r * 0.2, p.y - r * 0.2, r * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Minimap when projectile goes high off screen
  let projHigh = false;
  let minProjY = Infinity;
  for (const p of projectiles) {
    if (p.y < 0) { projHigh = true; if (p.y < minProjY) minProjY = p.y; }
  }
  if (projHigh) {
    const mmW = 200, mmH = 120;
    const mmX = W / 2 - mmW / 2, mmY = 10;
    // Calculate view bounds to include projectiles
    const viewTop = Math.min(minProjY - 20, -100);
    const viewBot = H;
    const viewH = viewBot - viewTop;
    const sx = mmW / W, sy = mmH / viewH;

    // Background
    const mg = ctx.createLinearGradient(mmX, mmY, mmX, mmY + mmH);
    mg.addColorStop(0, maps[currentMap].sky1);
    mg.addColorStop(1, maps[currentMap].sky2);
    ctx.fillStyle = mg;
    ctx.fillRect(mmX, mmY, mmW, mmH);

    // Terrain
    ctx.fillStyle = maps[currentMap].ground;
    ctx.beginPath();
    ctx.moveTo(mmX, mmY + mmH);
    for (let x = 0; x <= W; x += 4) {
      ctx.lineTo(mmX + x * sx, mmY + (terrain[x] - viewTop) * sy);
    }
    ctx.lineTo(mmX + mmW, mmY + mmH);
    ctx.closePath();
    ctx.fill();

    // Tanks
    for (let i = 0; i < 2; i++) {
      const t = tanks[i];
      const tx = mmX + t.x * sx;
      const ty = mmY + (terrainAt(t.x) - viewTop) * sy;
      ctx.fillStyle = i === 0 ? t.color : '#e55';
      ctx.fillRect(tx - 3, ty - 3, 6, 4);
    }

    // Projectiles
    for (const p of projectiles) {
      ctx.fillStyle = p.weaponData.color;
      ctx.beginPath();
      ctx.arc(mmX + p.x * sx, mmY + (p.y - viewTop) * sy, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Border
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.strokeRect(mmX, mmY, mmW, mmH);

    // Label
    ctx.fillStyle = '#aaa';
    ctx.font = '8px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('TRACKING', mmX + mmW - 4, mmY + 10);
  }

  // Floating damage/heal texts
  for (const ft of floatingTexts) {
    const alpha = ft.life / 60;
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
  }

  // Weapon selector with ammo
  if (!gameOver) {
    const selY = H - 55;
    const myWeapons = tanks[0].type.weapons;
    const totalSlots = (tanks[0].bonusWeapon ? 1 : 0) + myWeapons.length;
    const slotW = 55;
    const barW = totalSlots * slotW + (totalSlots + 1) * 4;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(10, selY - 5, barW, 50);
    for (let i = 0; i < totalSlots; i++) {
      const wx = 16 + i * (slotW + 4);
      const selected = tanks[0].weapon === i;
      let wName, wColor, wIcon, hasAmmo, ammoStr;
      if (i < myWeapons.length) {
        wName = myWeapons[i].name;
        wColor = myWeapons[i].color;
        wIcon = myWeapons[i].icon;
        hasAmmo = tanks[0].ammo[i] !== 0;
        ammoStr = ' [' + tanks[0].ammo[i] + ']';
      } else {
        const bw = tanks[0].bonusWeapon;
        wName = bw.name;
        wColor = bw.color;
        wIcon = bw.icon;
        hasAmmo = tanks[0].bonusAmmo > 0;
        ammoStr = ' [' + tanks[0].bonusAmmo + ']';
      }
      ctx.strokeStyle = selected ? wColor : '#444';
      ctx.lineWidth = selected ? 2 : 1;
      ctx.strokeRect(wx, selY, slotW, 30);
      if (selected) { ctx.fillStyle = wColor + '33'; ctx.fillRect(wx + 1, selY + 1, slotW - 2, 28); }
      ctx.fillStyle = hasAmmo ? (selected ? '#fff' : '#888') : '#444';
      ctx.font = '8px monospace'; ctx.textAlign = 'center';
      ctx.fillText((i + 1) + ':' + wName, wx + slotW / 2, selY + 12);
      ctx.font = hasAmmo ? '11px monospace' : '9px monospace';
      if (hasAmmo) {
        ctx.fillText(wIcon + ammoStr, wx + slotW / 2, selY + 26);
      } else {
        ctx.fillStyle = '#f44';
        ctx.fillText('EMPTY', wx + slotW / 2, selY + 26);
      }
    }

    // FIRE button
    if (turn === 0 && !dragging) {
      const fbx = W - 110, fby = selY - 8;
      const hasAmmoForFire = (tanks[0].bonusWeapon && tanks[0].weapon >= tanks[0].type.weapons.length) ? (tanks[0].bonusAmmo > 0) : tanks[0].ammo[tanks[0].weapon] > 0;
      ctx.fillStyle = hasAmmoForFire ? '#d33' : '#555';
      ctx.fillRect(fbx, fby, 95, 38);
      ctx.strokeStyle = hasAmmoForFire ? '#f55' : '#666';
      ctx.lineWidth = 2;
      ctx.strokeRect(fbx, fby, 95, 38);
      ctx.fillStyle = hasAmmoForFire ? '#fff' : '#888';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('FIRE', fbx + 47, fby + 24);
    }

    // Move buttons
    if (turn === 0) {
      const my = selY - 8;
      // Left
      ctx.fillStyle = tanks[0].fuel > 0 ? '#335' : '#222';
      ctx.fillRect(W - 220, my, 35, 38);
      ctx.strokeStyle = '#558'; ctx.lineWidth = 1;
      ctx.strokeRect(W - 220, my, 35, 38);
      ctx.fillStyle = tanks[0].fuel > 0 ? '#aaf' : '#555';
      ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
      ctx.fillText('<', W - 202, my + 25);
      // Right
      ctx.fillStyle = tanks[0].fuel > 0 ? '#335' : '#222';
      ctx.fillRect(W - 180, my, 35, 38);
      ctx.strokeStyle = '#558'; ctx.lineWidth = 1;
      ctx.strokeRect(W - 180, my, 35, 38);
      ctx.fillStyle = tanks[0].fuel > 0 ? '#aaf' : '#555';
      ctx.fillText('>', W - 162, my + 25);
    }
  }

  // Map name
  ctx.fillStyle = '#555'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
  const ttName = m.terrainType === 'sand' ? ' [Sand]' : m.terrainType === 'rock' ? ' [Rock]' : '';
  ctx.fillText(m.name + ttName + (m.boosts ? ' (boost: ' + m.boosts.join(', ') + ')' : ''), W - 15, 15);

  // Wind indicator
  if (windEnabled) {
    const wx = W / 2, wy = 45;
    const arrowLen = windStrength * 80;
    ctx.fillStyle = '#aaa'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
    ctx.fillText('WIND', wx, wy - 8);
    ctx.strokeStyle = '#aaa'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + arrowLen, wy); ctx.stroke();
    // Arrowhead
    if (Math.abs(arrowLen) > 2) {
      const dir = arrowLen > 0 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(wx + arrowLen, wy);
      ctx.lineTo(wx + arrowLen - dir * 6, wy - 4);
      ctx.lineTo(wx + arrowLen - dir * 6, wy + 4);
      ctx.closePath(); ctx.fillStyle = '#aaa'; ctx.fill();
    }
  }

  // Turn + angle
  if (!gameOver) {
    ctx.fillStyle = tanks[turn].color; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    ctx.fillText(tanks[turn].name + "'s turn", W / 2, H - 10);
  }
  if (!gameOver && turn === 0) {
    ctx.fillStyle = '#aaa'; ctx.font = '12px monospace'; ctx.textAlign = 'right';
    ctx.fillText('Fuel: ' + Math.round(tanks[0].fuel), W - 15, H - 25);
  }

  // Game over
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H / 2 - 50, W, 100);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
    ctx.fillText(winner + ' wins!', W / 2, H / 2);
    ctx.font = '14px monospace'; ctx.fillStyle = '#aaa';
    ctx.fillText('R = rematch  |  M = menu', W / 2, H / 2 + 30);
  }

  ctx.restore();
}

function draw() {
  if (state === 'menu') drawMenu();
  else if (state === 'select') drawSelect();
  else if (state === 'mapSelect') drawMapSelect();
  else drawGame();
}

function loop() {
  try {
    update();
    draw();
  } catch(e) {
    console.error('GAME ERROR:', e);
    ctx.fillStyle = '#f00';
    ctx.font = '14px monospace';
    ctx.fillText('ERROR: ' + e.message, 10, 30);
    return; // stop loop so error is visible
  }
  requestAnimationFrame(loop);
}

loop();
</script>
