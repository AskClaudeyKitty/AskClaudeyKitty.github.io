<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Python Script</title>
    <script src="mini-coi.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            background: #1a202c;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            padding: 1rem 2rem;
            background: #2d3748;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header a {
            color: #90cdf4;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header a:hover { text-decoration: underline; }
        .header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #e2e8f0;
        }
        #loading {
            text-align: center;
            padding: 3rem;
            color: #a0aec0;
            font-size: 1.1rem;
        }
        .py-terminal {
            flex: 1;
        }
    </style>
    <script>
        // Set the title before page renders
        const params = new URLSearchParams(window.location.search);
        const scriptFile = params.get('script');
        if (scriptFile) {
            const displayName = scriptFile.replace(/\.py$/, '');
            document.title = displayName + ' — Python Script';
        }
    </script>
</head>
<body>
    <div class="header">
        <a href="index.html">&larr; Back to Python Scripts</a>
        <h2 id="script-name"></h2>
    </div>
    <div id="loading">Loading Python environment... this may take a moment on first load.</div>

    <script type="py" terminal worker>
        from pyodide.http import pyfetch
        from pyscript import window, document

        # Get script filename from URL parameters
        params = window.URLSearchParams.new(window.location.search)
        script_file = params.get("script")

        # Update header with script name
        display_name = script_file.replace(".py", "") if script_file else "Unknown"
        document.getElementById("script-name").textContent = display_name
        document.getElementById("loading").style.display = "none"

        if script_file:
            # Fetch and run the script
            response = await pyfetch(script_file)
            code = await response.string()
            exec(code)
        else:
            print("Error: No script specified in URL.")
    </script>
</body>
</html>
