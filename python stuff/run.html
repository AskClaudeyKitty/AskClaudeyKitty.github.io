<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Python Script</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            background: #1a202c;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            padding: 1rem 2rem;
            background: #2d3748;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header a {
            color: #90cdf4;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header a:hover { text-decoration: underline; }
        .header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #e2e8f0;
        }
        #loading {
            text-align: center;
            padding: 3rem;
            color: #a0aec0;
            font-size: 1.1rem;
        }
        .py-terminal {
            flex: 1;
        }
    </style>
    <script>
        const params = new URLSearchParams(window.location.search);
        const scriptFile = params.get('script');
        if (scriptFile) {
            const displayName = scriptFile.replace(/\.py$/, '');
            document.title = displayName + ' — Python Script';
        }
    </script>
</head>
<body>
    <div class="header">
        <a href="index.html">&larr; Back to Python Scripts</a>
        <h2 id="script-name"></h2>
    </div>
    <div id="loading">Loading Python environment... this may take a moment on first load.</div>

    <script type="py" terminal>
        import builtins
        import time as _time_module
        from pyscript import window, document
        from pyodide.http import pyfetch

        # Override input() to use browser prompt dialogs
        # (PyScript terminal input needs SharedArrayBuffer which GitHub Pages doesn't support)
        _original_input = builtins.input
        def _web_input(prompt=''):
            if prompt:
                print(prompt, end='', flush=True)
            result = window.prompt(prompt if prompt else 'Enter input:')
            if result is None:
                result = ''
            print(result)
            return result
        builtins.input = _web_input

        # Cap time.sleep so it doesn't freeze the browser
        _original_sleep = _time_module.sleep
        def _safe_sleep(seconds):
            _original_sleep(min(seconds, 3))
        _time_module.sleep = _safe_sleep

        # Get script from URL and run it
        params = window.URLSearchParams.new(window.location.search)
        script_file = params.get('script')

        name_el = document.getElementById('script-name')
        loading_el = document.getElementById('loading')

        if script_file:
            display_name = script_file.replace('.py', '')
            name_el.textContent = display_name
            loading_el.style.display = 'none'

            response = await pyfetch(script_file)
            code = await response.string()
            exec(code)
        else:
            name_el.textContent = 'No script specified'
            loading_el.textContent = 'Error: No script file specified in URL.'
    </script>
</body>
</html>
