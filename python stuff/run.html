<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Python Script</title>
    <script src="mini-coi.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css" />
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            background: #1a202c;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            padding: 1rem 2rem;
            background: #2d3748;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header a {
            color: #90cdf4;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header a:hover { text-decoration: underline; }
        .header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #e2e8f0;
        }
        #loading {
            text-align: center;
            padding: 3rem;
            color: #a0aec0;
            font-size: 1.1rem;
        }
        .py-terminal {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html">&larr; Back to Python Scripts</a>
        <h2 id="script-name"></h2>
    </div>
    <div id="loading">Loading Python environment... this may take a moment on first load.</div>

    <!-- This script type="py" is just a DOM element to the browser (unknown type).
         The inline script below sets its src BEFORE PyScript's module script runs,
         since module scripts are deferred until after DOM parsing. -->
    <script type="py" terminal worker id="runner"></script>

    <script>
        // Runs immediately during parsing — before PyScript's deferred module
        const params = new URLSearchParams(window.location.search);
        const scriptFile = params.get('script');

        if (scriptFile) {
            const displayName = scriptFile.replace(/\.py$/, '');
            document.getElementById('script-name').textContent = displayName;
            document.title = displayName + ' — Python Script';

            // Set src on the py script element before PyScript initializes
            document.getElementById('runner').setAttribute('src', encodeURI(scriptFile));
        } else {
            document.getElementById('script-name').textContent = 'No script specified';
            document.getElementById('loading').textContent = 'Error: No script file specified in URL.';
        }
    </script>

    <!-- PyScript module loads here (deferred), finds the script element with src already set -->
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>

    <script>
        // Hide loading message once terminal appears
        const observer = new MutationObserver(() => {
            const terminal = document.querySelector('.py-terminal');
            if (terminal) {
                document.getElementById('loading').style.display = 'none';
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
</body>
</html>
