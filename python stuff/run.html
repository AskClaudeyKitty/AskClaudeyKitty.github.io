<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Python Script</title>
    <script src="mini-coi.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            background: #1a202c;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            padding: 1rem 2rem;
            background: #2d3748;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header a {
            color: #90cdf4;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header a:hover { text-decoration: underline; }
        .header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #e2e8f0;
        }
        #loading {
            text-align: center;
            padding: 3rem;
            color: #a0aec0;
            font-size: 1.1rem;
        }
        /* make the PyScript terminal fill the page */
        .py-terminal {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html">&larr; Back to Python Scripts</a>
        <h2 id="script-name"></h2>
    </div>
    <div id="loading">Loading Python environment... this may take a moment on first load.</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const scriptFile = params.get('script');
        const nameEl = document.getElementById('script-name');

        if (scriptFile) {
            const displayName = scriptFile.replace(/\.py$/, '');
            nameEl.textContent = displayName;
            document.title = displayName + ' — Python Script';

            // Fetch the Python code, then inject PyScript with inline code
            fetch(scriptFile)
                .then(r => {
                    if (!r.ok) throw new Error('Could not load ' + scriptFile);
                    return r.text();
                })
                .then(code => {
                    // Add PyScript CSS and JS
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = 'https://pyscript.net/releases/2024.11.1/core.css';
                    document.head.appendChild(link);

                    const coreScript = document.createElement('script');
                    coreScript.type = 'module';
                    coreScript.src = 'https://pyscript.net/releases/2024.11.1/core.js';
                    document.head.appendChild(coreScript);

                    // Create the py-script element with inline code
                    const pyScript = document.createElement('script');
                    pyScript.type = 'py';
                    pyScript.setAttribute('terminal', '');
                    pyScript.setAttribute('worker', '');
                    pyScript.textContent = code;
                    document.body.appendChild(pyScript);

                    // Hide loading message once terminal appears
                    const observer = new MutationObserver(() => {
                        const terminal = document.querySelector('.py-terminal');
                        if (terminal) {
                            document.getElementById('loading').style.display = 'none';
                            observer.disconnect();
                        }
                    });
                    observer.observe(document.body, { childList: true, subtree: true });
                })
                .catch(err => {
                    document.getElementById('loading').textContent = 'Error: ' + err.message;
                });
        } else {
            nameEl.textContent = 'No script specified';
            document.getElementById('loading').textContent = 'Error: No script file specified in URL.';
        }
    </script>
</body>
</html>
