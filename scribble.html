<style>

  #hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:10px;align-items:center;z-index:10;pointer-events:none}
  #hp{width:160px;height:14px;background:#2a2f3a;border:1px solid #3a4150;border-radius:3px;overflow:hidden}
  #hpfill{height:100%;background:linear-gradient(90deg,#3a8a3a,#aae83a);transition:width 0.1s}
  .pill{background:rgba(20,23,30,0.85);border:1px solid #2c3142;border-radius:4px;padding:4px 10px;color:#cdd5e3;font-variant-numeric:tabular-nums}
  .pill b{color:#e8c83a}
  #wordwrap{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:10;width:min(520px,90vw)}
  #word{width:100%;box-sizing:border-box;background:rgba(20,23,30,0.92);border:1px solid #3a4150;border-radius:6px;padding:10px 14px;color:#e8ecf2;font:14px -apple-system,system-ui,monospace;outline:none}
  #word:focus{border-color:#5a8aff}
  #suggest{position:absolute;left:0;right:0;bottom:calc(100% + 4px);background:rgba(20,23,30,0.95);border:1px solid #3a4150;border-radius:6px;max-height:200px;overflow-y:auto;display:none}
  #suggest div{padding:6px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  #suggest div:hover,#suggest div.sel{background:#2a3142}
  #suggest .cat{color:#7a8290;font-size:11px;margin-left:8px}
  #hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#5a6271;font-size:11px;z-index:10;pointer-events:none;text-align:center;width:90vw}
  #spawnbtn{position:fixed;bottom:8px;right:12px;z-index:20;padding:10px 16px;background:#5a8aff;color:#fff;border:none;border-radius:6px;font:14px -apple-system,system-ui,monospace;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
  #spawnbtn:hover{background:#6a9aff}
  #spawnbtn:active{background:#4a7aff}
  #spawnmenu{position:fixed;inset:0;z-index:30;background:rgba(11,13,18,0.95);display:none;flex-direction:column;padding:20px;box-sizing:border-box}
  #spawnmenu.open{display:flex}
  #spawnmenu #menuhead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  #spawnmenu #menusearch{flex:1;background:#1b1f2a;color:#e8ecf2;border:1px solid #2c3142;border-radius:4px;padding:12px 14px;font:18px monospace;outline:none}
  #spawnmenu #menusearch:focus{border-color:#5a8aff}
  #spawnmenu #menuclose,#spawnmenu #menuspawn{background:#5a8aff;color:#fff;border:none;border-radius:4px;padding:10px 18px;cursor:pointer;font:14px monospace}
  #spawnmenu #menuspawn{background:#3a8a3a}
  #spawnmenu #menuspawn:hover{background:#4a9a4a}
  #spawnmenu #menuclose:hover{background:#6a6a6a}
  #spawnmenu #adjs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;max-height:60px;overflow-y:auto}
  #spawnmenu #adjs .adjbtn{background:#1b1f2a;color:#cdd5e3;border:1px solid #2c3142;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:11px}
  #spawnmenu #adjs .adjbtn:hover{background:#2a3142}
  #spawnmenu #adjs .adjbtn.sel{background:#e8c83a;color:#1a1a1a;border-color:#e8c83a;font-weight:bold}
  #spawnmenu #cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
  #spawnmenu #cats .catbtn{background:#1b1f2a;color:#cdd5e3;border:1px solid #2c3142;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12px}
  #spawnmenu #cats .catbtn:hover{background:#2a3142}
  #spawnmenu #cats .catbtn.sel{background:#5a8aff;color:#fff;border-color:#5a8aff}
  #spawnmenu #items{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;align-content:start;padding-bottom:60px}
  #spawnmenu #items .it{background:#1b1f2a;color:#cdd5e3;border:1px solid #2c3142;border-radius:3px;padding:8px 4px;cursor:pointer;font-size:11px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}

  #spawnmenu #preview{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;background:#1b1f2a;border:1px solid #3a4150;border-radius:6px;padding:8px 12px;color:#cdd5e3;font:13px monospace;max-width:90vw}

  // ---- adjective system ----

  const ADJ = {
    // size
    big:    { sz: 1.5 }, large: { sz: 1.4 }, huge: { sz: 2.0 }, giant: { sz: 2.5 },
    small:  { sz: 0.7 }, tiny:  { sz: 0.5 }, mini: { sz: 0.6 },

  const ADJ_NAMES = Object.keys(ADJ);

  // parse input like "big red fire dragon" → base=dragon, adj=[big,red,fire]
  function parseInput(str) {
    const words = str.toLowerCase().trim().split(/\s+/).filter(Boolean);
    const adjs = [];
    let base = null;
    for (const w of words) {
      if (ADJ[w] && !base) { adjs.push(w); continue; }
      // exact match first
      if (O[w]) { base = w; continue; }
      // try partial match for last word (the noun)
      if (base === null) {
        const match = OBJECT_NAMES.find(n => n.startsWith(w));
        if (match) { base = match; continue; }
      }
      // not adj, not noun — ignore or add to adjs as flavor
      if (base) adjs.push(w);
    }
    return { base, adjs };
  }
  function applyAdjs(baseName, adjs) {
    const d = O[baseName];
    if (!d) return null;
    const out = { ...d };
    let sizeMul = 1, hpMul = 1, sdMul = 1, dmMul = 1, hlAdd = 0, clAdd = 0;
    let setAg = d.ag, setFr = d.fr, setFl = d.fl, setFz = d.fz, setSp = d.sp, setFly = d.fly, setBo = d.bo, setRd = d.rd, setSo = d.so, setHv = d.hv, setEx = d.ex;
    let motionSet = false;
    for (const a of adjs) {
      const adj = ADJ[a];
      if (!adj) continue;
      if (adj.sz) sizeMul *= adj.sz;
      if (adj.hp) hpMul *= adj.hp;
      if (adj.sd !== undefined && !motionSet) { out.sd = adj.sd; motionSet = true; }
      else if (adj.sd) sdMul *= adj.sd;
      if (adj.dm) dmMul *= adj.dm;
      if (adj.hl) hlAdd += adj.hl;
      if (adj.cl) clAdd += adj.cl;
      if (adj.col) out.col = adj.col;
      if (adj.ag) setAg = 1;
      if (adj.fr) setFr = 1;
      if (adj.fl) setFl = 1;
      if (adj.fz) setFz = 1;
      if (adj.sp) setSp = 1;
      if (adj.bo) setBo = 1;
      if (adj.rd) setRd = 1;
      if (adj.so) setSo = 1;
      if (adj.hv !== undefined) setHv = adj.hv;
      if (adj.ex) setEx = 1;
      if (adj.fly !== undefined) setFly = adj.fly;
    }
    if (sizeMul !== 1) {
      if (out.sz) out.sz = Math.max(2, Math.round(out.sz * sizeMul));
      if (out.w) out.w = Math.max(2, Math.round(out.w * sizeMul));
      if (out.h) out.h = Math.max(2, Math.round(out.h * sizeMul));
    }
    if (hpMul !== 1) out.hp = Math.round((out.hp || 10) * hpMul);
    if (!motionSet && sdMul !== 1) out.sd = Math.round((out.sd || 60) * sdMul);
    if (dmMul !== 1) out.dm = Math.round((out.dm || 0) * dmMul);
    if (hlAdd) out.hl = (out.hl || 0) + hlAdd;
    if (clAdd) out.cl = (out.cl || 0) + clAdd;
    if (setAg) out.ag = setAg;
    if (setFr) out.fr = setFr;
    if (setFl) out.fl = setFl;
    if (setFz) out.fz = setFz;
    if (setSp) out.sp = setSp;
    if (setBo) out.bo = setBo;
    if (setRd) out.rd = setRd;
    if (setSo) out.so = setSo;
    if (setHv) out.hv = setHv;
    if (setEx) out.ex = setEx;
    if (out.fly === undefined && setFly !== undefined) out.fly = setFly;
    return out;
  }

  // ---- spawn menu (scribblenauts-style) ----
  spawnMenu = $('spawnmenu');
  const spawnBtn = $('spawnbtn');
  menuSearch = $('menusearch');
  const menuClose = $('menuclose');
  const menuSpawn = $('menuspawn');
  const menuCats = $('cats');
  const menuItems = $('items');
  const menuAdjs = $('adjs');
  let selCat = 'all';
  // build category list from O
  const CATS = ['all', ...new Set(Object.values(O).map(o => o.cat))];
  function buildCats() {
    menuCats.innerHTML = CATS.map(c => `<div class="catbtn" data-c="${c}">${c}</div>`).join('');
    [...menuCats.children].forEach(b => b.addEventListener('click', () => {
      selCat = b.dataset.c;
      [...menuCats.children].forEach(x => x.classList.toggle('sel', x === b));
      renderItems();
    }));
    menuCats.children[0].classList.add('sel');
  }
  function buildAdjs() {
    // common adjectives for quick-pick
    const common = ['big','small','red','blue','green','fire','ice','strong','fast','angry','healing','magic','dark','shiny','royal','moving','spinning','bouncing','floating','chasing','rideable','explosive'];
    menuAdjs.innerHTML = common.map(a => `<div class="adjbtn" data-a="${a}">${a}</div>`).join('');
    [...menuAdjs.children].forEach(b => b.addEventListener('click', () => {
      b.classList.toggle('sel');
      const adjs = [...menuAdjs.querySelectorAll('.adjbtn.sel')].map(x => x.dataset.a).join(' ');
      const cur = menuSearch.value.trim();
      // replace leading adjs in search with the selected ones
      const words = cur.split(/\s+/).filter(Boolean);
      const baseStart = words.findIndex(w => O[w] || OBJECT_NAMES.find(n => n.startsWith(w)));
      const tail = baseStart >= 0 ? words.slice(baseStart).join(' ') : '';
      menuSearch.value = (adjs + ' ' + tail).trim();
    }));
  }
  function renderItems() {
    const q = menuSearch.value.trim().toLowerCase();
    let list = OBJECT_NAMES.filter(n => selCat === 'all' || O[n].cat === selCat);
    if (q) {
      // also show items matching search across all cats
      const searchMatches = OBJECT_NAMES.filter(n => n.includes(q));
      const merged = [...new Set([...searchMatches, ...list])];
      list = merged;
    }
    menuItems.innerHTML = list.slice(0, 200).map(n => {
      const d = O[n];
      return `<div class="it" data-n="${n}"><div class="sw" style="background:${d.col}"></div>${n}</div>`;
    }).join('');
    [...menuItems.children].forEach(it => it.addEventListener('click', () => {
      const cur = menuSearch.value.trim();
      const words = cur.split(/\s+/).filter(Boolean);
      // replace the noun part (last word or partial match)
      const baseStart = words.findIndex(w => O[w] || OBJECT_NAMES.find(n => n.startsWith(w)));
      const adjs = baseStart >= 0 ? words.slice(0, baseStart).join(' ') : cur;
      menuSearch.value = (adjs + ' ' + it.dataset.n).trim();
    }));
  }
  function doSpawn() {
    const text = menuSearch.value.trim();
    if (!text) return;
    const { base, adjs } = parseInput(text);
    if (!base) { menuSearch.style.borderColor = '#aa3030'; return; }
    const d = adjs.length ? applyAdjs(base, adjs) : O[base];
    if (!d) return;
    // pick motion mode from adjs
    const motionAdjs = adjs.filter(a => ['moving','spinning','bouncing','floating','sinking','chasing','fleeing','static_obj','patrolling'].includes(a));
    const motion = motionAdjs[motionAdjs.length-1] || (d.sd ? 'patrolling' : null);
    const ang = (motion === 'spinning') ? 6 : 0;
    const o = {
      n: base + (adjs.length ? ' ('+adjs.join(' ')+')' : ''),
      def: d,
      x: player.x + (player.facing||1)*30,
      y: player.y - 30,
      vx: 0, vy: 0, ang, age: 0,
      hp: d.hp || (d.al ? 10 : 1e9),
      reload: 0, onGround: false, facing: 1,
      _motion: motion,
    };
    objs.push(o);
    spawnMenu.classList.remove('open');
    menuSearch.value = '';
  }
  spawnBtn.addEventListener('click', () => {
    spawnMenu.classList.toggle('open');
    if (spawnMenu.classList.contains('open')) {
      renderItems();
      setTimeout(() => menuSearch.focus(), 50);
    }
  });
  menuClose.addEventListener('click', () => spawnMenu.classList.remove('open'));
  menuSpawn.addEventListener('click', doSpawn);
  const menuModify = $('menumodify');
  function doModify() {
    if (!sel) { menuSearch.style.borderColor = '#aa6a3a'; return; }
    const text = menuSearch.value.trim();
    if (!text) return;
    // parse adjs only (ignore noun part if any)
    const words = text.toLowerCase().split(/\s+/).filter(Boolean);
    const adjs = words.filter(w => ADJ[w]);
    if (!adjs.length) { menuSearch.style.borderColor = '#aa6a3a'; return; }
    // apply to sel.def (mutate)
    for (const a of adjs) {
      const adj = ADJ[a];
      if (!adj) continue;
      if (adj.sz) {
        if (sel.def.sz) sel.def.sz = Math.max(2, Math.round(sel.def.sz * adj.sz));
        if (sel.def.w) sel.def.w = Math.max(2, Math.round(sel.def.w * adj.sz));
        if (sel.def.h) sel.def.h = Math.max(2, Math.round(sel.def.h * adj.sz));
      }
      if (adj.hp) sel.def.hp = Math.round((sel.def.hp || sel.hp) * adj.hp);
      if (adj.sd !== undefined) sel.def.sd = adj.sd;
      if (adj.dm) sel.def.dm = Math.round((sel.def.dm || 0) * adj.dm);
      if (adj.hl) sel.def.hl = (sel.def.hl || 0) + adj.hl;
      if (adj.cl) sel.def.cl = (sel.def.cl || 0) + adj.cl;
      if (adj.col) sel.def.col = adj.col;
      if (adj.ag) sel.def.ag = 1;
      if (adj.fr) sel.def.fr = 1;
      if (adj.fl) sel.def.fl = 1;
      if (adj.fz) sel.def.fz = 1;
      if (adj.sp) sel.def.sp = 1;
      if (adj.bo) sel.def.bo = 1;
      if (adj.rd) sel.def.rd = 1;
      if (adj.so) sel.def.so = 1;
      if (adj.hv !== undefined) sel.def.hv = adj.hv;
      if (adj.ex) { sel.def.ex = 1; sel.def.xr = sel.def.xr || 50; sel.def.xd = sel.def.xd || 20; sel.def.lt = 5; sel._armed = false; }
      if (adj.fly !== undefined) sel.def.fly = adj.fly;
    }
    // refresh label
    sel.n = sel.n.split(' (')[0] + ' (' + adjs.join(' ') + ')';
    sel._motion = (['moving','spinning','bouncing','floating','sinking','chasing','fleeing','static_obj','patrolling'].filter(m => adjs.includes(m)).slice(-1)[0]) || sel._motion;
    spawnMenu.classList.remove('open');
  }
  menuModify.addEventListener('click', doModify);
  function updateModifyBtn() {
    if (!menuModify) return;
    if (sel) {
      menuModify.disabled = false;
      menuModify.textContent = `apply to: ${sel.n}`;
      menuModify.style.opacity = '1';
    } else {
      menuModify.disabled = true;
      menuModify.textContent = 'apply to sel (click an obj first)';
      menuModify.style.opacity = '0.5';
    }
  }
  // refresh on open
  spawnBtn.addEventListener('click', () => setTimeout(updateModifyBtn, 60));
  menuSearch.addEventListener('input', renderItems);
  menuSearch.addEventListener('keydown', e => {
    if (e.key === 'Enter') doSpawn();
  });
  buildCats();
  buildAdjs();
  renderItems();

  function hitObj(wx, wy) {
    for (let i = objs.length-1; i >= 0; i--) {
      const o = objs[i];
      const w = objW(o), h = objH(o);
      if (o.def.sh === 'o' || o.def.sh === 't') {
        const r = Math.max(w, h)/2;
        if ((o.x-wx)**2 + (o.y-wy)**2 <= r*r) return o;
      } else {
        if (Math.abs(o.x-wx) <= w/2 && Math.abs(o.y-wy) <= h/2) return o;
      }
    }
    return null;
  }
  function objW(o) { if (!o.def) return 12; return o.def.sh === 'o' || o.def.sh === 't' ? (o.def.sz||12) : (o.def.w||12); }
  function objH(o) { if (!o.def) return 12; return o.def.sh === 'o' || o.def.sh === 't' ? (o.def.sz||12) : (o.def.h||12); }
  function removeObj(o) {
    const i = objs.indexOf(o); if (i >= 0) objs.splice(i, 1);
    if (sel === o) sel = null;
    if (mouse.drag === o) mouse.drag = null;
    if (player.riding === o) player.riding = null;
  }

  function toggleRide() {
    if (player.riding) { player.riding = null; return; }
    let best = null, bd = 1e9;
    for (const o of objs) {
      if (!o.def.rd) continue;
      const dx = o.x - player.x, dy = o.y - player.y;
      const d = Math.hypot(dx, dy);
      if (d < 50 && d < bd) { best = o; bd = d; }
    }
    player.riding = best;
  }

  // ---------- update ----------
  function update(dt) {
    elapsed += dt;
    let mx = 0;
    if (keys['arrowleft'] || keys['a']) mx -= 1;
    if (keys['arrowright'] || keys['d']) mx += 1;
    const wantJump = keys['arrowup'] || keys['w'] || keys[' '];
    if (mx) player.facing = mx;
    let moveSp = 220;
    if (player.riding) moveSp = (player.riding.def.sd || 220);
    player.vx = mx * moveSp;
    if (wantJump && (player.onGround || player.riding)) {
      player.vy = -500;
      player.onGround = false;
      if (player.riding) player.riding = null;
    }
    if (player.riding) {
      // ride: player follows mount, mount moves with input
      const m = player.riding;
      m.vx = player.vx;
      if (mouse.drag !== m) {
        moveWith(m, m.vx*dt, m.vy*dt);
      }
      m.vx *= 0.9;
      player.x = m.x;
      player.y = m.y - objH(player)/2 - objH(m)/2;
      // flying mount: no gravity for mount
      if (!m.def.fly) {
        m.vy += GRAVITY * dt;
        if (m.vy > 900) m.vy = 900;
      }
      // clamp mount to ground
      if (!m.def.fly && m.y > GROUND_Y - objH(m)/2) {
        m.y = GROUND_Y - objH(m)/2;
        m.vy = 0;
        m.onGround = true;
      }
    } else {
      player.vy += GRAVITY * dt;
      if (player.vy > 900) player.vy = 900;
      if (mouse.drag !== player) {
        moveWith(player, player.vx*dt, player.vy*dt);
      }
    }
    // out of world (below)
    if (player.y > WORLD_H) { player.hp -= 30; player.y = GROUND_Y - 30; player.vy = 0; }
    // hard ground clamp — player bottom can't go past GROUND_Y
    if (player.y > GROUND_Y - 11) {
      player.y = GROUND_Y - 11;
      player.vy = 0;
      player.onGround = true;
    }
    // sanity clamp: don't let player float into the sky
    if (player.y < -500 || player.y > WORLD_H + 200) {
      player.y = GROUND_Y - 30;
      player.vy = 0;
    }
    // hp regen when grounded
    player.regen += dt;
    if (player.regen > 1 && player.hp < player.hpMax && player.onGround) {
      player.hp = Math.min(player.hpMax, player.hp + 1); player.regen = 0;
    }
    // camera
    const targetX = player.x - c.width/2;
    const targetY = player.y - c.height/2;
    cam.x += (targetX - cam.x) * Math.min(1, dt*5);
    cam.y += (targetY - cam.y) * Math.min(1, dt*5);
    cam.y = Math.max(-200, Math.min(WORLD_H - c.height + 200, cam.y));
    cam.x = Math.max(-200, Math.min(WORLD_W - c.width + 200, cam.x));

    // update objs
    for (let i = objs.length-1; i >= 0; i--) {
      const o = objs[i];
      o.age += dt;
      if (o.def.lt && o.age >= o.def.lt) {
        if (o.def.ex) explode(o.x, o.y, o.def.xr||50, o.def.xd||20);
        removeObj(o); continue;
      }
      if (player.riding === o) continue;
      // gravity (not for flyers)
      if (!o.def.fly) {
        o.vy += GRAVITY * dt;
        if (o.vy > 900) o.vy = 900;
      }
      // motion adjective behavior
      if (o._motion) {
        const sp = o.def.sd || 60;
        if (o._motion === 'moving' || o._motion === 'bouncing' || o._motion === 'patrolling') {
          if (!o._mvT || o._mvT < 0) { o._mvA = Math.random() < 0.5 ? 1 : -1; o._mvT = 2 + Math.random()*3; }
          o._mvT -= dt;
          o.vx = o._mvA * sp * (o._motion === 'patrolling' ? 0.5 : 1);
        } else if (o._motion === 'spinning') {
          o.ang += sp * dt;
        } else if (o._motion === 'floating') {
          o.vx = (o._mvA || (o._mvA = Math.random() < 0.5 ? 1 : -1, 1)) * sp;
          o.vy = -sp * 0.3;
        } else if (o._motion === 'sinking') {
          o.vx = 0;
          o.vy = sp * 0.5; // sink down
        } else if (o._motion === 'chasing') {
          const dx = player.x - o.x, dy = player.y - o.y;
          const d = Math.hypot(dx, dy) || 1;
          o.vx = (dx/d) * sp;
          o.vy = (dy/d) * sp * 0.5;
        } else if (o._motion === 'fleeing') {
          const dx = o.x - player.x, dy = o.y - player.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 300) { o.vx = (dx/d) * sp; o.vy = (dy/d) * sp * 0.3; }
        } else if (o._motion === 'static_obj') {
          o.vx = 0; o.vy = 0;
        }
      }
      // AI: chase/follow/wander
      if (o.def.al && !o._motion) {
        const dx = player.x - o.x, dist = Math.abs(dx);
        if (o.def.ag && dist < 320) {
          o.vx = Math.sign(dx) * (o.def.sd||60);
          o.facing = Math.sign(dx);
        } else if (o.def.fr && dist < 250) {
          o.vx = Math.sign(dx) * (o.def.sd||60) * 0.6;
        } else if (o.def.ag || o.def.fr) {
          if (!o.wanderT || o.wanderT < 0) {
            o.wanderA = Math.random() < 0.5 ? 1 : -1;
            o.wanderT = 1 + Math.random()*2;
          }
          o.wanderT -= dt;
          o.vx = o.wanderA * (o.def.sd||60) * 0.4;
        }
        // jump if chase
        if ((o.def.ag || o.def.fr) && o.onGround) {
          if (Math.abs(dx) < 200 && Math.random() < 0.02) { o.vy = -400; o.onGround = false; }
        }
      }
      // missile
      if (o.n === 'missile' && o.age > 0.1) {
        const dx = player.x - o.x, dy = player.y - o.y;
        const d = Math.hypot(dx, dy) || 1;
        o.vx = (dx/d) * (o.def.sd||200);
        o.vy = (dy/d) * (o.def.sd||200);
        o.ang = Math.atan2(dy, dx);
      }
      // wind pushes player
      if (o.n === 'wind') {
        const dx = o.x - player.x, dy = o.y - player.y;
        const d = Math.hypot(dx, dy);
        if (d < 60) {
          player.vx += (dx/d||0) * 250 * dt;
          player.vy += (dy/d||0) * 250 * dt;
        }
      }
      // apply
      if (mouse.drag !== o) {
        moveWith(o, o.vx*dt, o.vy*dt);
        o.vx *= 0.85;
      }
      // shooter
      if (o.def.rl) {
        o.reload -= dt;
        if (o.reload <= 0) {
          o.reload = o.def.rl;
          const d = Math.hypot(player.x-o.x, player.y-o.y);
          if (d < 400) {
            const ang = Math.atan2(player.y-o.y, player.x-o.x);
            const proj = spawn('arrow', o.x, o.y);
            if (proj) {
              proj.vx = Math.cos(ang)*280;
              proj.vy = Math.sin(ang)*280;
              proj.ang = ang;
              proj.age = -0.4;
              proj.def = {...proj.def, lt: 2, dm: o.def.dm||5, ex:0, sh:'r', w:3, h:14};
              proj.bo = 0;
            }
          }
        }
      }
      // bomb arm
      if (o.def.ex && !o._armed && o.age > 0.1) o._armed = true;
      if (o.def.ex && o._armed) {
        for (const f of objs) {
          if ((f.n === 'fire' || f.n === 'torch') && Math.hypot(f.x-o.x, f.y-o.y) < 14) {
            explode(o.x, o.y, o.def.xr||50, o.def.xd||20);
            removeObj(o); break;
          }
        }
      }
      // elements spread
      if (o.def.sp && (!o.spreads || o.spreads < 3) && Math.random() < dt * 0.5) {
        o.spreads = (o.spreads||0) + 1;
        const ang = Math.random()*Math.PI*2;
        spawn(o.n, o.x + Math.cos(ang)*12, o.y + Math.sin(ang)*12);
      }
      // water vs fire / ice
      if (o.n === 'water') {
        for (const f of objs) {
          if ((f.n === 'fire' || f.n === 'torch') && Math.hypot(f.x-o.x, f.y-o.y) < 14) {
            removeObj(f);
            o.age = o.def.lt;
            break;
          }
        }
        for (const ic of objs) {
          if (ic.n === 'ice' && Math.hypot(ic.x-o.x, ic.y-o.y) < 14) {
            removeObj(ic); removeObj(o);
            spawn('sand', (o.x+ic.x)/2, (o.y+ic.y)/2);
            break;
          }
        }
      }
      // fire spreads
      if (o.n === 'fire' || o.n === 'torch') {
        for (const f of objs) {
          if (f.def.fl && f !== o && Math.hypot(f.x-o.x, f.y-o.y) < 16 && Math.random() < dt*0.5) {
            spawn('fire', f.x, f.y);
            removeObj(f);
            break;
          }
        }
      }
      // bomb proximity
      if (o.def.ex && o._armed && Math.hypot(o.x-player.x, o.y-player.y) < 24 && o.age > 0.2) {
        explode(o.x, o.y, o.def.xr||50, o.def.xd||20);
        removeObj(o);
      }
    }

    // player vs objs
    for (let i = objs.length-1; i >= 0; i--) {
      const o = objs[i];
      if (player.riding === o) continue;
      const dx = o.x - player.x, dy = o.y - player.y;
      const d = Math.hypot(dx, dy);
      const reach = (objW(o)+objH(o))/4 + 6;
      if (d < reach) {
        if (o.def.dm && o.age > 0.05) { player.hp -= o.def.dm; o.age = -0.5; }
        if (o.def.hl) { player.hp = Math.min(player.hpMax, player.hp + o.def.hl); removeObj(o); continue; }
        if (o.def.cl) { score += o.def.cl; removeObj(o); continue; }
      }
      if (o.def.ag && o.def.al && d < 18 && o.onGround) {
        player.hp -= o.def.dm || 4;
        o.age = 0;
      }
    }
    if (player.hp <= 0) { player.hp = 100; score = Math.max(0, score - 50); player.y = GROUND_Y-30; player.vy = 0; }
  }

  function moveWith(o, dx, dy) {
    o.x += dx;
    for (const b of objs) {
      if (b === o) continue;
      if (!b.def || !b.def.so) continue;
      if (b._ground) continue; // ground handled by clamp
      if (b === o._standOn) continue; // standing on this — don't block X
      if (aabb(o, b)) {
        o.x -= dx; o.vx = 0; break;
      }
    }
    o.y += dy;
    o._standOn = null;
    o.onGround = false;
    for (const b of objs) {
      if (b === o) continue;
      if (!b.def || !b.def.so) continue;
      if (b._ground) continue; // ground handled by clamp
      if (aabb(o, b)) {
        if (dy > 0) {
          o.onGround = true;
          o._standOn = b;
          o.y = b.y - objH(b)/2 - objH(o)/2;
        } else {
          o.y -= dy;
        }
        o.vy = 0;
        break;
      }
    }
    // world ground clamp — only if not snapped onto a higher solid this frame
    if (!o._isPlayer) {
      if (!o.def.fly && o.y > GROUND_Y - objH(o)/2) {
        o.y = GROUND_Y - objH(o)/2;
        o.vy = 0;
        o.onGround = true;
      }
    } else {
      if (o.y > GROUND_Y - 11) {
        // if we just snapped onto a solid in the y-loop, allow it (don't override)
        if (!o.onGround) {
          o.y = GROUND_Y - 11;
          o.vy = 0;
          o.onGround = true;
        }
      }
    }
  }
  function aabb(a, b) {
    if (!a.def || !b.def) return false;
    const aw = objW(a)/2, ah = objH(a)/2, bw = objW(b)/2, bh = objH(b)/2;
    return Math.abs(a.x-b.x) <= aw+bw && Math.abs(a.y-b.y) <= ah+bh;
  }

  function explode(x, y, r, dmg) {
    flashes.push({ x, y, r, age: 0, life: 0.5 });
    for (let i = objs.length-1; i >= 0; i--) {
      const o = objs[i];
      if (Math.hypot(o.x-x, o.y-y) < r) {
        if (o.def.al) o.hp -= dmg;
        const dx = o.x - x, dy = o.y - y;
        const d = Math.hypot(dx, dy) || 1;
        o.vx += (dx/d) * 400;
        o.vy += (dy/d) * 400 - 100;
        if (o.def.fl) { spawn('fire', o.x, o.y); removeObj(o); continue; }
        if (o.hp <= 0 && o.def.al) removeObj(o);
        else if (Math.hypot(o.x-x, o.y-y) < r*0.7) removeObj(o);
        if (o === player) player.hp -= dmg;
      }
    }
    if (Math.hypot(player.x-x, player.y-y) < r) player.hp -= dmg*0.6;
  }

  // ---------- render ----------
  function draw() {
    const grd = ctx.createLinearGradient(0, 0, 0, c.height);
    grd.addColorStop(0, '#2a3548');
    grd.addColorStop(1, '#1a1d24');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,c.width,c.height);
    // stars
    ctx.fillStyle = '#dadada';
    for (let i = 0; i < 80; i++) {
      const sx = ((i*173 + cam.x*0.2) % c.width + c.width) % c.width;
      const sy = ((i*89 + cam.y*0.1) % (c.height*0.6));
      ctx.fillRect(sx, sy, 1, 1);
    }
    // ground
    const gp = w2s(0, GROUND_Y);
    if (gp.y < c.height) {
      ctx.fillStyle = '#3a4a3a';
      ctx.fillRect(0, gp.y, c.width, c.height - gp.y);
      ctx.fillStyle = '#5a8a4a';
      ctx.fillRect(0, gp.y, c.width, 3);
    }
    // grid (only below ground line)
    if (gp.y < c.height) {
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      const step = 200;
      const left = ((-cam.x) % step + step) % step;
      for (let x = left; x < c.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, gp.y); ctx.lineTo(x, c.height); ctx.stroke();
      }
    }
    // world border
    const tl = w2s(0,0), br = w2s(WORLD_W, WORLD_H);
    ctx.strokeStyle = '#3a4150'; ctx.lineWidth = 2;
    ctx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);

    objs.sort((a,b) => a.y - b.y);

    for (const o of objs) {
      if (o._ground) continue; // ground block is invisible (drawn as grass+grid instead)
      const p = w2s(o.x, o.y);
      const w = objW(o), h = objH(o);
      if (p.x < -50 || p.x > c.width+50 || p.y < -50 || p.y > c.height+50) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      if (o.ang) ctx.rotate(o.ang);
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(0, h/2 + 1, w/2, 3, 0, 0, Math.PI*2); ctx.fill();
      // shape
      ctx.fillStyle = o.def.col;
      if (o.def.sh === 'o') {
        ctx.beginPath(); ctx.arc(0, 0, w/2, 0, Math.PI*2); ctx.fill();
      } else if (o.def.sh === 'r') {
        ctx.fillRect(-w/2, -h/2, w, h);
      } else {
        ctx.beginPath();
        ctx.moveTo(0, -h/2);
        ctx.lineTo(w/2, h/2);
        ctx.lineTo(-w/2, h/2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = sel === o ? '#5a8aff' : 'rgba(0,0,0,0.4)';
      ctx.lineWidth = sel === o ? 2 : 1;
      if (o.def.sh === 'o') ctx.beginPath(), ctx.arc(0, 0, w/2, 0, Math.PI*2), ctx.stroke();
      else if (o.def.sh === 'r') ctx.strokeRect(-w/2, -h/2, w, h);
      else ctx.stroke();
      if (o.def.al && o.hp < (o.def.hp || 10)) {
        const maxHp = o.def.hp || 10;
        ctx.fillStyle = '#3a1a1a'; ctx.fillRect(-w/2, -h/2-6, w, 3);
        ctx.fillStyle = '#e83a3a'; ctx.fillRect(-w/2, -h/2-6, w * (o.hp/maxHp), 3);
      }
      if (o.def.rl) {
        ctx.fillStyle = '#3a4150'; ctx.fillRect(-w/2, h/2+2, w, 2);
        ctx.fillStyle = '#e8c83a'; ctx.fillRect(-w/2, h/2+2, w * (1 - o.reload/o.def.rl), 2);
      }
      ctx.rotate(-o.ang);
      ctx.fillStyle = '#e8ecf2';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(o.n, 0, -h/2 - 8);
      if (o.n === 'fire' || o.n === 'torch') {
        ctx.fillStyle = `rgba(255,200,40,${0.4 + Math.random()*0.3})`;
        ctx.beginPath(); ctx.arc(0, -h/2 - 4 + Math.random()*2, 3 + Math.random()*2, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    // player
    const pp = w2s(player.x, player.y);
    ctx.save();
    ctx.translate(pp.x, pp.y);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, objH(player)/2 + 1, 6, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a8aff';
    ctx.fillRect(-objW(player)/2, -objH(player)/2, objW(player), objH(player));
    ctx.strokeStyle = '#aac8ff'; ctx.lineWidth = 2; ctx.strokeRect(-objW(player)/2, -objH(player)/2, objW(player), objH(player));
    // eyes face direction
    ctx.fillStyle = '#fff';
    const eyeY = -objH(player)/4;
    if (player.facing > 0) {
      ctx.fillRect(0, eyeY, 2, 2);
      ctx.fillRect(4, eyeY, 2, 2);
    } else {
      ctx.fillRect(-6, eyeY, 2, 2);
      ctx.fillRect(-2, eyeY, 2, 2);
    }
    ctx.restore();

    // explosions
    for (let i = flashes.length-1; i >= 0; i--) {
      const f = flashes[i];
      f.age += 1/60;
      const a = 1 - f.age/f.life;
      const p = w2s(f.x, f.y);
      const grd2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, f.r);
      grd2.addColorStop(0, `rgba(255,200,40,${a})`);
      grd2.addColorStop(0.5, `rgba(255,80,20,${a*0.7})`);
      grd2.addColorStop(1, `rgba(0,0,0,0)`);
      ctx.fillStyle = grd2;
      ctx.beginPath(); ctx.arc(p.x, p.y, f.r, 0, Math.PI*2); ctx.fill();
      if (f.age >= f.life) flashes.splice(i, 1);
    }

    if (player.riding) {
      ctx.fillStyle = '#e8c83a';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`riding ${player.riding.n} (E to dismount, Space to jump off)`, c.width/2, 30);
    }
    // minimap
    const mmW = 200, mmH = 50, mmX = c.width - mmW - 12, mmY = 12;
    ctx.fillStyle = 'rgba(20,23,30,0.7)'; ctx.fillRect(mmX, mmY, mmW, mmH);
    ctx.strokeStyle = '#3a4150'; ctx.strokeRect(mmX, mmY, mmW, mmH);
    const mx = mmX + (player.x / WORLD_W) * mmW;
    const my = mmY + (player.y / WORLD_H) * mmH;
    ctx.fillStyle = '#5a8aff'; ctx.fillRect(mx-1, my-1, 2, 2);
    for (const o of objs) {
      ctx.fillStyle = o.def.ag ? '#ff5a5a' : '#dadada';
      const ox = mmX + (o.x / WORLD_W) * mmW;
      const oy = mmY + (o.y / WORLD_H) * mmH;
      ctx.fillRect(ox, oy, 1, 1);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    $('hpfill').style.width = (player.hp/player.hpMax*100) + '%';
    $('hpv').textContent = Math.max(0, Math.round(player.hp));
    $('sv').textContent = score;
    $('ov').textContent = objs.length;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(() => {
    // don't auto-focus — let user click to type, otherwise keys go to game
  }, 100);
})();
</script>
</body>
</html>
