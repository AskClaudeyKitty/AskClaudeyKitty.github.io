<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terraria Lite</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Press Start 2P', monospace; overflow: hidden; }
  #game-container { position: relative; image-rendering: pixelated; }
  canvas { border: 4px solid #333; cursor: crosshair; image-rendering: pixelated; }
  #ui { position: absolute; top: 8px; left: 8px; color: #fff; font-size: 10px; text-shadow: 2px 2px 0 #000; pointer-events: none; font-family: 'Press Start 2P', monospace; }
  #hp-bar { width: 160px; height: 16px; background: #222; border: 2px solid #555; margin-bottom: 6px; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #ff4444, #aa0000); transition: width 0.2s; }
  #stats { font-size: 8px; color: #ccc; }
  #hotbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 40px); gap: 3px; pointer-events: auto; }
  .slot { width: 40px; height: 40px; background: rgba(0,0,0,0.7); border: 2px solid #777; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; position: relative; font-family: 'Press Start 2P', monospace; cursor: pointer; }
  .slot.active { border-color: #ffff44; background: rgba(255,255,0,0.2); }
  .slot .count { position: absolute; bottom: 2px; right: 4px; font-size: 8px; color: #fff; text-shadow: 1px 1px 0 #000; }
  #inventory { position: absolute; top: 8px; right: 8px; background: rgba(15,15,25,0.95); border: 3px solid #555; width: 320px; display: none; flex-direction: column; font-family: 'Press Start 2P', monospace; max-height: 520px; }
  #inv-header { background: #2a2a3a; padding: 8px 10px; font-size: 10px; color: #ffff44; border-bottom: 2px solid #444; display: flex; justify-content: space-between; align-items: center; }
  #inv-close { cursor: pointer; color: #ff4444; font-size: 12px; }
  #inv-close:hover { color: #ff8888; }
  #inv-content { display: flex; flex-direction: column; padding: 8px; gap: 4px; overflow-y: auto; }
  #inv-crafting { flex: 1; }
  #inv-crafting h4 { color: #ffff44; font-size: 9px; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 3px; }
  .recipe { padding: 5px 6px; cursor: pointer; font-size: 8px; border-radius: 2px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
  .recipe.can { background: rgba(40,80,40,0.6); border: 1px solid #4a8a2a; color: #8aff8a; }
  .recipe.can:hover { background: rgba(60,120,60,0.7); color: #aaffaa; }
  .recipe.cant { background: rgba(30,30,30,0.5); border: 1px solid #444; color: #666; }
  .recipe.cant:hover { background: rgba(40,40,40,0.6); color: #888; }
  .recipe-name { font-weight: bold; }
  .recipe-ing { font-size: 7px; color: #999; margin-top: 2px; }
  .recipe .out-icon { font-size: 12px; margin-right: 6px; }
  #msg { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); color: #ffff44; font-size: 10px; text-shadow: 2px 2px 0 #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; font-family: 'Press Start 2P', monospace; }
  #minimap { position: absolute; top: 8px; right: 8px; width: 160px; height: 100px; border: 2px solid #555; background: rgba(0,0,0,0.7); image-rendering: pixelated; display: none; }
  #armor-panel { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 4px; pointer-events: auto; }
  .armor-slot { width: 36px; height: 36px; background: rgba(0,0,0,0.7); border: 2px solid #777; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; font-family: 'Press Start 2P', monospace; cursor: pointer; }
  .armor-slot.active { border-color: #ffff44; }
  #chest-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(15,15,25,0.98); border: 3px solid #555; padding: 12px; display: none; flex-direction: column; gap: 8px; font-family: 'Press Start 2P', monospace; z-index: 10; }
  #chest-header { color: #ffff44; font-size: 10px; display: flex; justify-content: space-between; }
  #chest-grid { display: grid; grid-template-columns: repeat(5, 36px); gap: 3px; }
  .chest-slot { width: 36px; height: 36px; background: rgba(0,0,0,0.6); border: 2px solid #555; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; cursor: pointer; }
  #music-toggle { position: absolute; bottom: 8px; right: 8px; color: #888; font-size: 8px; cursor: pointer; pointer-events: auto; font-family: 'Press Start 2P', monospace; }
  #music-toggle:hover { color: #ffff44; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="ui">
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="stats"><span id="time">Day</span> | Depth: <span id="depth">0</span>m</div>
  </div>
  <div id="hotbar"></div>
  <div id="crafting"></div>
  <div id="inventory">
    <div id="inv-header">Crafting Guide <span id="inv-close">X</span></div>
    <div id="inv-content">
      <div id="inv-crafting">
        <div id="inv-recipes"></div>
      </div>
    </div>
  </div>
  <canvas id="minimap" width="160" height="100"></canvas>
  <div id="armor-panel">
    <div class="armor-slot" id="helm-slot" title="Helmet">H</div>
    <div class="armor-slot" id="chest-slot" title="Chestplate">C</div>
    <div class="armor-slot" id="leg-slot" title="Leggings">L</div>
  </div>
  <div id="chest-ui">
    <div id="chest-header">Chest <span id="chest-close" style="cursor:pointer;color:#f44">X</span></div>
    <div id="chest-grid"></div>
  </div>
  <div id="music-toggle">♪ OFF</div>
  <div id="msg"></div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const TILE = 24;
const WORLD_W = 800, WORLD_H = 400;
const DAY_LEN = 24000;

const world = new Uint8Array(WORLD_W * WORLD_H);
const light = new Uint8Array(WORLD_W * WORLD_H);

const BLOCKS = {
  0: { name: 'Air', solid: false },
  1: { name: 'Dirt', color: '#8a5a2a', solid: true, hp: 2 },
  2: { name: 'Stone', color: '#777777', solid: true, hp: 4 },
  3: { name: 'Grass', color: '#4a8a2a', solid: true, hp: 2, top: true },
  4: { name: 'Wood', color: '#aa7744', solid: true, hp: 3, drop: 4 },
  5: { name: 'Leaves', color: '#2a6a1a', solid: false, hp: 1 },
  6: { name: 'Sand', color: '#d4c85a', solid: true, hp: 2 },
  7: { name: 'Coal', color: '#222222', solid: true, hp: 5, drop: 20 },
  8: { name: 'Iron', color: '#aa6666', solid: true, hp: 6, drop: 21 },
  9: { name: 'Gold', color: '#ddaa44', solid: true, hp: 8, drop: 22 },
  10: { name: 'Torch', color: '#ffdd44', solid: false, light: 12, hp: 1 },
  11: { name: 'Plank', color: '#bb8844', solid: true, hp: 3 },
  12: { name: 'Crafting Table', color: '#aa7744', solid: true, hp: 4, special: 'craft' },
  13: { name: 'Furnace', color: '#666666', solid: true, hp: 6, special: 'smelt' },
  14: { name: 'Glass', color: '#aaddff88', solid: false, hp: 2 },
  15: { name: 'Brick', color: '#aa5555', solid: true, hp: 5 },
  16: { name: 'Mossy Stone', color: '#558866', solid: true, hp: 5 },
  17: { name: 'Snow', color: '#eeeeee', solid: true, hp: 2 },
  18: { name: 'Ice', color: '#aaddff', solid: true, hp: 3 },
  19: { name: 'Snow Grass', color: '#ddeedd', solid: true, hp: 2, top: true },
  20: { name: 'Cactus', color: '#44aa44', solid: true, hp: 2, drop: 36 },
  21: { name: 'Corruption Grass', color: '#8844aa', solid: true, hp: 2, top: true },
  22: { name: 'Ebonstone', color: '#442255', solid: true, hp: 5 },
  23: { name: 'Chest', color: '#aa7744', solid: true, hp: 4, special: 'chest' },
};

const ITEMS = {
  20: { name: 'Coal', icon: 'C', color: '#444444' },
  21: { name: 'Iron Ore', icon: 'I', color: '#aa6666' },
  22: { name: 'Gold Ore', icon: 'G', color: '#ddaa44' },
  23: { name: 'Stick', icon: '/', color: '#aa7744' },
  24: { name: 'Iron Bar', icon: '=', color: '#bbbbbb' },
  25: { name: 'Gold Bar', icon: '=', color: '#ffdd44' },
  26: { name: 'Wood Pick', icon: 'p', color: '#aa7744', tool: 'pick', power: 2 },
  27: { name: 'Stone Pick', icon: 'p', color: '#888888', tool: 'pick', power: 3 },
  28: { name: 'Iron Pick', icon: 'p', color: '#bbbbbb', tool: 'pick', power: 5 },
  29: { name: 'Gold Pick', icon: 'p', color: '#ffdd44', tool: 'pick', power: 7 },
  30: { name: 'Wood Sword', icon: 's', color: '#aa7744', tool: 'sword', dmg: 12 },
  31: { name: 'Stone Sword', icon: 's', color: '#888888', tool: 'sword', dmg: 18 },
  32: { name: 'Iron Sword', icon: 's', color: '#bbbbbb', tool: 'sword', dmg: 25 },
  33: { name: 'Gold Sword', icon: 's', color: '#ffdd44', tool: 'sword', dmg: 35 },
  34: { name: 'Apple', icon: 'A', color: '#dd4444', food: 15 },
  35: { name: 'Meat', icon: 'M', color: '#aa6644', food: 30 },
  36: { name: 'Cactus', icon: 'c', color: '#44aa44' },
  37: { name: 'Bow', icon: 'B', color: '#aa7744', tool: 'bow' },
  38: { name: 'Arrow', icon: '→', color: '#dddddd', ammo: 'arrow' },
  39: { name: 'Wood Helmet', icon: 'h', color: '#aa7744', armor: 'helm', def: 1 },
  40: { name: 'Wood Chestplate', icon: 'c', color: '#aa7744', armor: 'chest', def: 2 },
  41: { name: 'Wood Leggings', icon: 'l', color: '#aa7744', armor: 'leg', def: 1 },
  42: { name: 'Iron Helmet', icon: 'h', color: '#bbbbbb', armor: 'helm', def: 3 },
  43: { name: 'Iron Chestplate', icon: 'c', color: '#bbbbbb', armor: 'chest', def: 5 },
  44: { name: 'Iron Leggings', icon: 'l', color: '#bbbbbb', armor: 'leg', def: 2 },
};

const RECIPES = [
  { out: 11, count: 4, need: [[4, 1]], name: 'Plank', anywhere: true },
  { out: 23, count: 4, need: [[4, 1]], name: 'Stick', anywhere: true },
  { out: 12, count: 1, need: [[11, 4]], name: 'Crafting Table', anywhere: true },
  { out: 26, count: 1, need: [[11, 3], [23, 2]], name: 'Wood Pick' },
  { out: 30, count: 1, need: [[11, 2], [23, 1]], name: 'Wood Sword' },
  { out: 27, count: 1, need: [[2, 3], [23, 2]], name: 'Stone Pick' },
  { out: 31, count: 1, need: [[2, 2], [23, 1]], name: 'Stone Sword' },
  { out: 24, count: 1, need: [[21, 2], [20, 1]], name: 'Iron Bar', station: 'smelt' },
  { out: 25, count: 1, need: [[22, 2], [20, 1]], name: 'Gold Bar', station: 'smelt' },
  { out: 28, count: 1, need: [[24, 3], [23, 2]], name: 'Iron Pick' },
  { out: 32, count: 1, need: [[24, 2], [23, 1]], name: 'Iron Sword' },
  { out: 29, count: 1, need: [[25, 3], [23, 2]], name: 'Gold Pick' },
  { out: 33, count: 1, need: [[25, 2], [23, 1]], name: 'Gold Sword' },
  { out: 14, count: 2, need: [[2, 1], [20, 1]], name: 'Glass', station: 'smelt' },
  { out: 15, count: 4, need: [[2, 1]], name: 'Brick', station: 'smelt' },
  { out: 13, count: 1, need: [[2, 8]], name: 'Furnace' },
  { out: 37, count: 1, need: [[11, 5], [23, 2]], name: 'Bow' },
  { out: 38, count: 10, need: [[11, 1], [23, 1]], name: 'Arrow', anywhere: true },
  { out: 39, count: 1, need: [[11, 10]], name: 'Wood Helmet' },
  { out: 40, count: 1, need: [[11, 15]], name: 'Wood Chestplate' },
  { out: 41, count: 1, need: [[11, 12]], name: 'Wood Leggings' },
  { out: 42, count: 1, need: [[24, 5]], name: 'Iron Helmet' },
  { out: 43, count: 1, need: [[24, 8]], name: 'Iron Chestplate' },
  { out: 44, count: 1, need: [[24, 6]], name: 'Iron Leggings' },
];

const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  w: 18, h: 34,
  hp: 100, maxHp: 100,
  hunger: 100,
  facing: 1,
  onGround: false,
  inv: [],
  hotbar: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null],
  selected: 0,
  mining: null,
  swing: 0,
  armor: { helm: null, chest: null, leg: null },
};

let camX = 0, camY = 0;
let time = 0;
const entities = [];
const particles = [];
const keys = {};
let mouseX = 0, mouseY = 0, mouseDown = false;
let craftingOpen = false;

const TARGET_FPS = 60;
const FIXED_DT = 1 / TARGET_FPS;
let lastTime = 0;
let accumulator = 0;

const chests = new Map();
let regenTimer = 0;
let openChest = null;

function getBiome(x) {
  if (x < WORLD_W * 0.25) return 'snow';
  if (x > WORLD_W * 0.35 && x < WORLD_W * 0.45) return 'desert';
  if (x > WORLD_W * 0.7) return 'corruption';
  return 'forest';
}

function generate() {
  function noise(x) {
    return Math.sin(x * 0.05) * 8 + Math.sin(x * 0.13) * 4 + Math.sin(x * 0.03) * 12;
  }
  const surface = [];
  for (let x = 0; x < WORLD_W; x++) surface[x] = Math.floor(60 + noise(x));

  for (let x = 0; x < WORLD_W; x++) {
    const biome = getBiome(x);
    for (let y = 0; y < WORLD_H; y++) {
      const i = y * WORLD_W + x;
      const s = surface[x];
      if (y < s) { world[i] = 0; continue; }

      if (biome === 'snow') {
        if (y === s) world[i] = 19;
        else if (y < s + 3) world[i] = 17;
        else if (y < s + 10) world[i] = 18;
        else {
          world[i] = 2;
          if (Math.random() < 0.03) world[i] = 7;
          if (Math.random() < 0.015) world[i] = 8;
        }
      } else if (biome === 'desert') {
        if (y === s) world[i] = 6;
        else if (y < s + 15) world[i] = 6;
        else {
          world[i] = 2;
          if (Math.random() < 0.02) world[i] = 7;
          if (Math.random() < 0.01) world[i] = 8;
        }
      } else if (biome === 'corruption') {
        if (y === s) world[i] = 21;
        else if (y < s + 3) world[i] = 1;
        else if (y < s + 12) world[i] = 22;
        else {
          world[i] = 22;
          if (Math.random() < 0.04) world[i] = 7;
          if (Math.random() < 0.02) world[i] = 8;
        }
      } else {
        if (y === s) world[i] = 3;
        else if (y < s + 3) world[i] = 1;
        else if (y < s + 8) world[i] = Math.random() < 0.3 ? 6 : 1;
        else if (y < s + 20) {
          world[i] = 2;
          if (Math.random() < 0.03) world[i] = 7;
          if (Math.random() < 0.015) world[i] = 8;
          if (y > s + 15 && Math.random() < 0.008) world[i] = 9;
        } else {
          world[i] = 2;
          if (Math.random() < 0.05) world[i] = 7;
          if (Math.random() < 0.02) world[i] = 8;
          if (y > s + 30 && Math.random() < 0.01) world[i] = 9;
          if (Math.random() < 0.1) world[i] = 16;
        }
      }
      if (y > s + 5) {
        const cave = Math.sin(x * 0.08) * Math.sin(y * 0.12) + Math.sin(x * 0.15 + y * 0.07);
        if (cave > 0.6) world[i] = 0;
      }
    }

    // Trees / Cacti
    const base = surface[x];
    const topBlock = getBlock(x, base);
    if (x % 7 === 3 && Math.random() < 0.6) {
      if (biome === 'desert' && topBlock === 6) {
        for (let ty = base - 1; ty >= base - 3 && ty >= 0; ty--) {
          if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 20;
        }
      } else if ((topBlock === 3 || topBlock === 19) && getBlock(x, base) !== 0) {
        for (let ty = base - 1; ty >= base - 5 && ty >= 0; ty--) {
          if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 4;
        }
        for (let dy = -3; dy >= -5; dy--) {
          for (let dx = -2; dx <= 2; dx++) {
            const ly = base + dy, lx = x + dx;
            if (ly >= 0 && lx >= 0 && lx < WORLD_W && getBlock(lx, ly) === 0) {
              world[ly * WORLD_W + lx] = 5;
            }
          }
        }
      }
    }
  }

  const px = Math.floor(WORLD_W / 2);
  player.x = px * TILE;
  const surfaceY = surface[px];
  let spawnY = surfaceY - 3;
  while (spawnY > 0 && getBlock(px, spawnY) !== 0) spawnY--;
  player.y = spawnY * TILE;
}

function getBlock(x, y) {
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return 0;
  return world[y * WORLD_W + x];
}

function setBlock(x, y, id) {
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return;
  world[y * WORLD_W + x] = id;
}

function isSolid(x, y) {
  const b = BLOCKS[getBlock(x, y)];
  return b && b.solid;
}

function addItem(id, count) {
  const item = ITEMS[id] || BLOCKS[id];
  if (!item) return;
  for (let i = 0; i < 20; i++) {
    if (player.hotbar[i] && player.hotbar[i].id === id) {
      player.hotbar[i].count += count;
      updateHotbar();
      if (craftingOpen) updateCrafting();
      return;
    }
  }
  for (let i = 0; i < 20; i++) {
    if (!player.hotbar[i]) {
      player.hotbar[i] = { id, count };
      updateHotbar();
      if (craftingOpen) updateCrafting();
      return;
    }
  }
  for (const s of player.inv) {
    if (s.id === id) { s.count += count; updateHotbar(); if (craftingOpen) updateCrafting(); return; }
  }
  player.inv.push({ id, count });
  updateHotbar();
  if (craftingOpen) updateCrafting();
}

function hasItems(need) {
  const all = [...player.hotbar.filter(s => s), ...player.inv];
  for (const [id, count] of need) {
    let have = 0;
    for (const s of all) if (s.id === id) have += s.count;
    if (have < count) return false;
  }
  return true;
}

function consumeItems(need) {
  for (const [id, count] of need) {
    let rem = count;
    for (const s of player.hotbar) {
      if (s && s.id === id) {
        const take = Math.min(rem, s.count);
        s.count -= take;
        rem -= take;
        if (s.count <= 0) {
          const idx = player.hotbar.indexOf(s);
          player.hotbar[idx] = null;
        }
        if (rem <= 0) break;
      }
    }
    for (const s of player.inv) {
      if (s.id === id) {
        const take = Math.min(rem, s.count);
        s.count -= take;
        rem -= take;
        if (s.count <= 0) {
          const idx = player.inv.indexOf(s);
          player.inv.splice(idx, 1);
        }
        if (rem <= 0) break;
      }
    }
  }
  updateHotbar();
}

function updateHotbar() {
  const el = document.getElementById('hotbar');
  el.innerHTML = '';
  // 5x4 grid = 20 slots, first 9 are hotbar
  for (let i = 0; i < 20; i++) {
    const s = player.hotbar[i];
    const div = document.createElement('div');
    div.className = 'slot' + (i === player.selected ? ' active' : '');
    div.dataset.index = i;
    if (s) {
      const item = ITEMS[s.id] || BLOCKS[s.id];
      div.textContent = item.icon || item.name[0];
      div.style.color = item.color || '#fff';
      if (s.count > 1) {
        const c = document.createElement('span');
        c.className = 'count';
        c.textContent = s.count;
        div.appendChild(c);
      }
    }
    div.onclick = () => {
      player.selected = i;
      updateHotbar();
    };
    el.appendChild(div);
  }
}

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 2000);
}

function toggleCrafting() {
  const panel = document.getElementById('inventory');
  const closeBtn = document.getElementById('inv-close');
  if (closeBtn) closeBtn.onclick = toggleCrafting;
  craftingOpen = !craftingOpen;
  panel.style.display = craftingOpen ? 'flex' : 'none';
  if (craftingOpen) updateCrafting();
}

function updateCrafting() {
  const recipesEl = document.getElementById('inv-recipes');
  recipesEl.innerHTML = '';

  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  let nearCraft = false, nearSmelt = false;
  for (let dy = -3; dy <= 3; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      const b = getBlock(px + dx, py + dy);
      if (b === 12) nearCraft = true;
      if (b === 13) nearSmelt = true;
    }
  }

  for (const r of RECIPES) {
    const outItem = ITEMS[r.out] || BLOCKS[r.out];
    const canCraft = hasItems(r.need);
    const stationOk = (!r.station || (r.station === 'smelt' && nearSmelt) || (r.station !== 'smelt' && (r.anywhere || nearCraft)));

    const div = document.createElement('div');
    div.className = 'recipe ' + (canCraft && stationOk ? 'can' : 'cant');

    const left = document.createElement('div');
    const icon = document.createElement('span');
    icon.className = 'out-icon';
    icon.textContent = outItem?.icon || outItem?.name?.[0] || '?';
    icon.style.color = outItem?.color || '#fff';

    const name = document.createElement('span');
    name.className = 'recipe-name';
    name.textContent = `${outItem?.name || '?'} x${r.count}`;

    left.appendChild(icon);
    left.appendChild(name);

    const ing = document.createElement('div');
    ing.className = 'recipe-ing';
    const needText = r.need.map(n => {
      const it = ITEMS[n[0]] || BLOCKS[n[0]];
      return `${it?.name || '?'} x${n[1]}`;
    }).join(', ');
    const stationText = r.station === 'smelt' ? ' [Furnace]' : (!r.anywhere ? ' [Table]' : '');
    ing.textContent = needText + stationText;

    div.appendChild(left);
    div.appendChild(ing);

    if (canCraft && stationOk) {
      div.onclick = () => {
        consumeItems(r.need);
        addItem(r.out, r.count);
        showMsg(`Crafted ${outItem?.name}`);
        updateCrafting();
      };
    }

    recipesEl.appendChild(div);
  }
}

function spawnEnemy(x, y, type) {
  entities.push({ x, y, vx: 0, vy: 0, w: 20, h: 20, type,
    hp: type === 'slime' ? 15 : 30, maxHp: type === 'slime' ? 15 : 30,
    timer: 0, dir: Math.random() < 0.5 ? -1 : 1 });
}

function spawnDrop(x, y, id, count) {
  entities.push({ x, y, vx: (Math.random() - 0.5) * 3, vy: -2,
    w: 10, h: 10, type: 'drop', id, count, life: 600 });
}

function spawnParticle(x, y, color) {
  for (let i = 0; i < 4; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
      life: 20 + Math.random() * 15, color, size: 2 + Math.random() * 3 });
  }
}

function updatePlayer() {
  const speed = 0.4, jump = -7.5, friction = 0.85, gravity = 0.35;
  
  if (keys['a'] || keys['ArrowLeft']) { player.vx -= speed; player.facing = -1; }
  if (keys['d'] || keys['ArrowRight']) { player.vx += speed; player.facing = 1; }
  if ((keys['w'] || keys[' '] || keys['ArrowUp']) && player.onGround) {
    player.vy = jump; player.onGround = false;
  }
  
  player.vx *= friction;
  player.vy += gravity;
  
  // X collision
  player.x += player.vx;
  const topY = Math.floor(player.y / TILE);
  const botY = Math.floor((player.y + player.h - 1) / TILE);
  if (player.vx > 0) {
    const rightEdge = Math.floor((player.x + player.w) / TILE);
    if (isSolid(rightEdge, topY) || isSolid(rightEdge, botY)) {
      player.x = rightEdge * TILE - player.w - 0.1;
      player.vx = 0;
    }
  } else if (player.vx < 0) {
    const leftEdge = Math.floor(player.x / TILE);
    if (isSolid(leftEdge, topY) || isSolid(leftEdge, botY)) {
      player.x = (leftEdge + 1) * TILE + 0.1;
      player.vx = 0;
    }
  }
  
  // Y collision
  player.y += player.vy;
  const leftX = Math.floor(player.x / TILE);
  const rightX = Math.floor((player.x + player.w - 1) / TILE);
  if (player.vy > 0) {
    const botEdge = Math.floor((player.y + player.h) / TILE);
    if (isSolid(leftX, botEdge) || isSolid(rightX, botEdge)) {
      player.y = botEdge * TILE - player.h - 0.1;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }
  } else if (player.vy < 0) {
    const topEdge = Math.floor(player.y / TILE);
    if (isSolid(leftX, topEdge) || isSolid(rightX, topEdge)) {
      player.y = (topEdge + 1) * TILE + 0.1;
      player.vy = 0;
    }
  } else {
    const botEdge = Math.floor((player.y + player.h) / TILE);
    player.onGround = isSolid(leftX, botEdge) || isSolid(rightX, botEdge);
  }
  
  player.x = Math.max(0, Math.min(WORLD_W * TILE - player.w, player.x));
  player.y = Math.max(0, Math.min(WORLD_H * TILE - player.h, player.y));
  
  player.hunger -= 0.005;
  if (player.hunger <= 0) { player.hunger = 0; player.hp -= 0.05; }
  
  camX += (player.x - W/2 - camX) * 0.1;
  camY += (player.y - H/2 - camY) * 0.1;
  camX = Math.max(0, Math.min(WORLD_W * TILE - W, camX));
  camY = Math.max(0, Math.min(WORLD_H * TILE - H, camY));
}

function updateEntities() {
  const px = player.x + player.w/2, py = player.y + player.h/2;
  for (let i = entities.length - 1; i >= 0; i--) {
    const e = entities[i];
    const dist = Math.hypot(e.x - px, e.y - py);
    if (dist > 1200 && e.type !== 'drop') continue;
    if (e.type === 'drop') {
      e.vy += 0.3; e.x += e.vx; e.y += e.vy; e.vx *= 0.9;
      const ty = Math.floor((e.y + e.h) / TILE);
      const tx = Math.floor((e.x + e.w/2) / TILE);
      if (isSolid(tx, ty)) { e.y = ty * TILE - e.h; e.vy = 0; e.vx *= 0.5; }
      const dx = px - (e.x + e.w/2);
      const dy = py - (e.y + e.h/2);
      if (Math.hypot(dx, dy) < 30) {
        addItem(e.id, e.count);
        showMsg(`+${e.count} ${ITEMS[e.id]?.name || BLOCKS[e.id]?.name}`);
        entities.splice(i, 1); continue;
      }
      e.life--;
      if (e.life <= 0) entities.splice(i, 1);
    } else if (e.type === 'slime' || e.type === 'zombie') {
      const dx = px - (e.x + e.w/2);
      const dy = py - (e.y + e.h/2);
      const edist = Math.hypot(dx, dy);
      
      if (edist < 300) {
        e.dir = dx > 0 ? 1 : -1;
        e.vx += e.dir * (e.type === 'slime' ? 0.08 : 0.12);
        if (e.onGround && Math.random() < 0.03) e.vy = -5;
      } else {
        e.vx += e.dir * 0.03;
        if (Math.random() < 0.01) e.dir *= -1;
      }
      
      e.vx *= 0.9; e.vy += 0.35;
      e.x += e.vx;
      let etx = Math.floor((e.x + e.w/2) / TILE);
      if (isSolid(etx, Math.floor(e.y / TILE)) || isSolid(etx, Math.floor((e.y + e.h - 1) / TILE))) {
        e.x = (etx + (e.vx > 0 ? -0.6 : 0.6)) * TILE - e.w/2;
        e.vx = 0; e.dir *= -1;
      }
      e.y += e.vy;
      etx = Math.floor((e.x + e.w/2) / TILE);
      const ety = Math.floor((e.y + e.h) / TILE);
      if (isSolid(etx, ety) || isSolid(Math.floor(e.x / TILE), ety)) {
        if (e.vy > 0) { e.y = ety * TILE - e.h; e.onGround = true; }
        else { e.y = (ety + 1) * TILE; }
        e.vy = 0;
      } else { e.onGround = false; }
      
      if (edist < 20 && player.hp > 0) {
        const def = getArmorDef();
        const raw = e.type === 'slime' ? 0.3 : 0.5;
        player.hp -= Math.max(raw * (1 - def * 0.05), raw * 0.2);
        player.vx += (dx > 0 ? 1 : -1) * 3;
        player.vy -= 2;
      }
      if (player.swing > 0 && edist < 40) {
        const tool = player.hotbar[player.selected];
        const dmg = tool && ITEMS[tool.id]?.tool === 'sword' ? ITEMS[tool.id].dmg : 5;
        e.hp -= dmg;
        e.vx += (dx > 0 ? -1 : 1) * 4; e.vy -= 3;
        spawnParticle(e.x + e.w/2, e.y + e.h/2, '#f44');
        if (e.hp <= 0) {
          spawnDrop(e.x, e.y, e.type === 'slime' ? 34 : 35, 1);
          entities.splice(i, 1);
        }
      }
    } else if (e.type === 'arrow') {
      e.x += e.vx; e.y += e.vy; e.vy += 0.15;
      e.life--;
      const etx = Math.floor((e.x + e.w/2) / TILE);
      const ety = Math.floor((e.y + e.h/2) / TILE);
      if (isSolid(etx, ety)) { entities.splice(i, 1); continue; }
      for (let j = entities.length - 1; j >= 0; j--) {
        const en = entities[j];
        if (en.type === 'slime' || en.type === 'zombie') {
          const adx = (en.x + en.w/2) - e.x;
          const ady = (en.y + en.h/2) - e.y;
          if (Math.hypot(adx, ady) < 20) {
            en.hp -= 15;
            en.vx += e.dir * 3; en.vy -= 2;
            spawnParticle(en.x + en.w/2, en.y + en.h/2, '#f44');
            if (en.hp <= 0) {
              spawnDrop(en.x, en.y, en.type === 'slime' ? 34 : 35, 1);
              entities.splice(j, 1);
            }
            entities.splice(i, 1); break;
          }
        }
      }
      if (e.life <= 0) entities.splice(i, 1);
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function getArmorDef() {
  let def = 0;
  for (const slot of ['helm', 'chest', 'leg']) {
    const a = player.armor[slot];
    if (a) def += ITEMS[a.id]?.def || 0;
  }
  return def;
}

function updateRegen() {
  regenTimer++;
  if (regenTimer % 600 === 0) {
    for (let x = 0; x < WORLD_W; x += 7) {
      if (Math.random() < 0.1) {
        const s = Math.floor(60 + (Math.sin(x * 0.05) * 8 + Math.sin(x * 0.13) * 4 + Math.sin(x * 0.03) * 12));
        const top = getBlock(x, s);
        if ((top === 3 || top === 19) && getBlock(x, s-1) === 0) {
          for (let ty = s - 1; ty >= s - 5 && ty >= 0; ty--) {
            if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 4;
          }
          for (let dy = -3; dy >= -5; dy--) {
            for (let dx = -2; dx <= 2; dx++) {
              const ly = s + dy, lx = x + dx;
              if (ly >= 0 && lx >= 0 && lx < WORLD_W && getBlock(lx, ly) === 0) {
                world[ly * WORLD_W + lx] = 5;
              }
            }
          }
        }
      }
    }
    for (let i = 0; i < 20; i++) {
      const ox = Math.floor(Math.random() * WORLD_W);
      const oy = Math.floor(Math.random() * (WORLD_H - 100) + 80);
      if (getBlock(ox, oy) === 2) {
        const r = Math.random();
        if (r < 0.3) setBlock(ox, oy, 7);
        else if (r < 0.5) setBlock(ox, oy, 8);
        else if (r < 0.6) setBlock(ox, oy, 9);
      }
    }
  }
}

function shootArrow() {
  const slot = player.hotbar[player.selected];
  if (!slot || slot.id !== 37) return;
  let arrowSlot = null;
  for (let i = 0; i < 20; i++) {
    if (player.hotbar[i] && player.hotbar[i].id === 38) { arrowSlot = player.hotbar[i]; break; }
  }
  if (!arrowSlot) {
    for (const s of player.inv) { if (s.id === 38) { arrowSlot = s; break; } }
  }
  if (!arrowSlot) { showMsg('No arrows!'); return; }
  arrowSlot.count--;
  if (arrowSlot.count <= 0) {
    for (let i = 0; i < 20; i++) if (player.hotbar[i] === arrowSlot) player.hotbar[i] = null;
    const idx = player.inv.indexOf(arrowSlot);
    if (idx >= 0) player.inv.splice(idx, 1);
  }
  updateHotbar();
  entities.push({
    x: player.x + player.w/2, y: player.y + player.h/2,
    vx: player.facing * 8, vy: -1,
    w: 8, h: 3, type: 'arrow', life: 120, dir: player.facing
  });
}

function openChestUI(tx, ty) {
  const key = `${tx},${ty}`;
  if (!chests.has(key)) chests.set(key, []);
  openChest = { x: tx, y: ty, items: chests.get(key) };
  updateChestUI();
  document.getElementById('chest-ui').style.display = 'flex';
}

function closeChest() {
  if (openChest) {
    chests.set(`${openChest.x},${openChest.y}`, openChest.items);
    openChest = null;
  }
  document.getElementById('chest-ui').style.display = 'none';
}

function updateChestUI() {
  const grid = document.getElementById('chest-grid');
  grid.innerHTML = '';
  if (!openChest) return;
  for (let i = 0; i < 10; i++) {
    const s = openChest.items[i];
    const div = document.createElement('div');
    div.className = 'chest-slot';
    if (s) {
      const item = ITEMS[s.id] || BLOCKS[s.id];
      div.textContent = item.icon || item.name[0];
      div.style.color = item.color || '#fff';
    }
    div.onclick = () => {
      if (s) {
        addItem(s.id, s.count);
        openChest.items.splice(i, 1);
      } else {
        const hand = player.hotbar[player.selected];
        if (hand) {
          openChest.items[i] = { id: hand.id, count: hand.count };
          player.hotbar[player.selected] = null;
        }
      }
      updateChestUI();
      updateHotbar();
    };
    grid.appendChild(div);
  }
}

function toggleMinimap() {
  const mm = document.getElementById('minimap');
  mm.style.display = mm.style.display === 'none' ? 'block' : 'none';
}

function updateArmorUI() {
  const slots = { helm: 'helm-slot', chest: 'chest-slot', leg: 'leg-slot' };
  for (const [type, id] of Object.entries(slots)) {
    const el = document.getElementById(id);
    const a = player.armor[type];
    if (a) {
      const item = ITEMS[a.id];
      el.textContent = item.icon;
      el.style.color = item.color;
      el.style.borderColor = '#ffff44';
    } else {
      el.textContent = type[0].toUpperCase();
      el.style.color = '#fff';
      el.style.borderColor = '#777';
    }
  }
}

function equipArmor(type) {
  const slot = player.hotbar[player.selected];
  if (!slot || !ITEMS[slot.id]?.armor || ITEMS[slot.id].armor !== type) return;
  const old = player.armor[type];
  player.armor[type] = { id: slot.id, count: 1 };
  player.hotbar[player.selected] = old ? { id: old.id, count: 1 } : null;
  updateArmorUI();
  updateHotbar();
}

let musicOn = false;
let audioCtx = null;
let musicInterval = null;

function toggleMusic() {
  musicOn = !musicOn;
  document.getElementById('music-toggle').textContent = musicOn ? '♪ ON' : '♪ OFF';
  if (musicOn) startMusic(); else stopMusic();
}

function startMusic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
  let noteIdx = 0;
  musicInterval = setInterval(() => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = notes[noteIdx % notes.length] * (time < 12000 ? 1 : 0.5);
    gain.gain.value = 0.03;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
    noteIdx++;
  }, 250);
}

function stopMusic() {
  if (musicInterval) clearInterval(musicInterval);
}

function updateSpawning() {
  if (time < 12000) return;
  if (Math.random() < 0.003 && entities.filter(e => e.type === 'slime' || e.type === 'zombie').length < 8) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const sx = Math.floor((player.x + side * 400) / TILE);
    const sy = Math.floor(player.y / TILE);
    let gy = sy;
    while (gy < WORLD_H - 1 && getBlock(sx, gy) === 0) gy++;
    if (gy < WORLD_H - 1) spawnEnemy(sx * TILE, (gy - 1) * TILE, Math.random() < 0.6 ? 'slime' : 'zombie');
  }
}

function getMouseTile() {
  const mx = mouseX + camX;
  const my = mouseY + camY;
  return { x: Math.floor(mx / TILE), y: Math.floor(my / TILE) };
}

function mineBlock(tx, ty) {
  const b = getBlock(tx, ty);
  if (b === 0) return;
  const block = BLOCKS[b];
  const tool = player.hotbar[player.selected];
  let power = 1;
  if (tool && ITEMS[tool.id]?.tool === 'pick') power = ITEMS[tool.id].power;
  
  if (!player.mining || player.mining.x !== tx || player.mining.y !== ty) {
    player.mining = { x: tx, y: ty, progress: 0, max: block.hp * 10 / power };
  }
  player.mining.progress += 1;
  spawnParticle(tx * TILE + TILE/2, ty * TILE + TILE/2, block.color);
  
  if (player.mining.progress >= player.mining.max) {
    const dropId = block.drop || b;
    if (dropId !== 0) spawnDrop(tx * TILE + 4, ty * TILE, dropId, 1);
    setBlock(tx, ty, 0);
    player.mining = null;
  }
}

function placeBlock(tx, ty) {
  const b = getBlock(tx, ty);
  if (b === 23) { openChestUI(tx, ty); return; }
  const slot = player.hotbar[player.selected];
  if (!slot || (!BLOCKS[slot.id]?.solid && slot.id !== 10 && slot.id !== 14)) return;
  if (b !== 0) return;
  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  if (tx === px && ty === py) return;
  setBlock(tx, ty, slot.id);
  if (slot.id === 23) chests.set(`${tx},${ty}`, []);
  slot.count--;
  if (slot.count <= 0) player.hotbar[player.selected] = null;
  updateHotbar();
}

function updateLight() {
  const isDay = time < 12000;
  const ambient = isDay ? 180 : 30;
  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  const R = 50;
  const sx = Math.max(0, px - R), ex = Math.min(WORLD_W, px + R);
  const sy = Math.max(0, py - R), ey = Math.min(WORLD_H, py + R);
  for (let y = sy; y < ey; y++) {
    for (let x = sx; x < ex; x++) {
      light[y * WORLD_W + x] = ambient;
    }
  }
  for (let y = sy; y < ey; y++) {
    for (let x = sx; x < ex; x++) {
      const b = getBlock(x, y);
      if (BLOCKS[b]?.light) {
        const r = BLOCKS[b].light;
        const r2 = r * r;
        const ls = Math.max(sy, y - r), le = Math.min(ey, y + r + 1);
        const xs = Math.max(sx, x - r), xe = Math.min(ex, x + r + 1);
        for (let ly = ls; ly < le; ly++) {
          const dy = ly - y;
          const dy2 = dy * dy;
          const rem = r2 - dy2;
          if (rem < 0) continue;
          const maxDx = Math.floor(Math.sqrt(rem));
          const lxs = Math.max(xs, x - maxDx);
          const lxe = Math.min(xe, x + maxDx + 1);
          const base = ly * WORLD_W;
          for (let lx = lxs; lx < lxe; lx++) {
            const d = Math.abs(lx - x) + Math.abs(dy);
            const li = base + lx;
            light[li] = Math.max(light[li], 255 - d * 18);
          }
        }
      }
    }
  }
}

function draw() {
  const isDay = time < 12000;
  const skyR = isDay ? 100 : 10;
  const skyG = isDay ? 150 : 10;
  const skyB = isDay ? 220 : 30;
  ctx.fillStyle = `rgb(${skyR},${skyG},${skyB})`;
  ctx.fillRect(0, 0, W, H);
  
  const celestialX = W/2 + Math.cos((time / DAY_LEN) * Math.PI * 2 - Math.PI/2) * (W/2 - 40);
  const celestialY = H/2 + Math.sin((time / DAY_LEN) * Math.PI * 2 - Math.PI/2) * (H/2 - 40);
  if (isDay) {
    ctx.fillStyle = '#ffdd44';
    ctx.beginPath(); ctx.arc(celestialX, celestialY, 20, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#dddddd';
    ctx.beginPath(); ctx.arc(celestialX, celestialY, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 50; i++) {
      ctx.fillRect(((i * 137) % W), ((i * 89) % (H/2)), 2, 2);
    }
  }
  
  ctx.save();
  ctx.translate(-Math.floor(camX), -Math.floor(camY));
  
  const startX = Math.floor(camX / TILE);
  const startY = Math.floor(camY / TILE);
  const endX = Math.min(WORLD_W, startX + Math.ceil(W / TILE) + 2);
  const endY = Math.min(WORLD_H, startY + Math.ceil(H / TILE) + 2);
  
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const b = getBlock(x, y);
      if (b === 0) continue;
      const block = BLOCKS[b];
      const li = y * WORLD_W + x;
      const l = light[li] / 255;
      
      const c = block.color;
      let r, g, bval, a = 1;
      if (c.length === 4) {
        r = parseInt(c[1] + c[1], 16);
        g = parseInt(c[2] + c[2], 16);
        bval = parseInt(c[3] + c[3], 16);
      } else {
        r = parseInt(c.slice(1, 3), 16);
        g = parseInt(c.slice(3, 5), 16);
        bval = parseInt(c.slice(5, 7), 16);
        if (c.length > 7) a = parseInt(c.slice(7, 9), 16) / 255;
      }
      ctx.fillStyle = `rgba(${Math.floor(r * l)},${Math.floor(g * l)},${Math.floor(bval * l)},${a})`;
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      
      if (b === 3 && y > 0 && getBlock(x, y-1) === 0) {
        ctx.fillStyle = `rgba(60,160,40,${l})`;
        ctx.fillRect(x * TILE + 2, y * TILE, TILE - 4, 3);
      }
      if (b === 10) {
        ctx.fillStyle = `rgba(255,220,100,${l * 0.8})`;
        ctx.fillRect(x * TILE + 8, y * TILE + 4, 8, 14);
      }
    }
  }
  
  for (const e of entities) {
    if (e.type === 'drop') {
      const item = ITEMS[e.id] || BLOCKS[e.id];
      ctx.fillStyle = item.color || '#fff';
      ctx.font = '12px monospace';
      ctx.fillText(item.icon || item.name[0], e.x, e.y + 10);
    } else if (e.type === 'slime') {
      ctx.fillStyle = '#44aa44';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#66cc66';
      ctx.fillRect(e.x + 4, e.y + 4, 4, 4);
      ctx.fillRect(e.x + 12, e.y + 4, 4, 4);
    } else if (e.type === 'zombie') {
      ctx.fillStyle = '#336633';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(e.x + (e.dir > 0 ? 12 : 4), e.y + 6, 4, 4);
    }
  }
  
  ctx.fillStyle = '#4488aa';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = '#eeccaa';
  ctx.fillRect(player.x + 2, player.y + 2, 14, 10);
  ctx.fillStyle = '#222222';
  ctx.fillRect(player.x + (player.facing > 0 ? 10 : 4), player.y + 5, 3, 3);
  
  if (player.swing > 0) {
    ctx.fillStyle = '#eeccaa';
    const swingAngle = player.swing * 0.3 * player.facing;
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + 16);
    ctx.rotate(swingAngle);
    ctx.fillRect(0, -2, 16, 4);
    ctx.restore();
  }
  
  if (player.mining) {
    const crack = Math.floor(player.mining.progress / player.mining.max * 4);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    const mx = player.mining.x * TILE;
    const my = player.mining.y * TILE;
    if (crack >= 1) { ctx.beginPath(); ctx.moveTo(mx + 4, my + 4); ctx.lineTo(mx + 20, my + 20); ctx.stroke(); }
    if (crack >= 2) { ctx.beginPath(); ctx.moveTo(mx + 20, my + 4); ctx.lineTo(mx + 4, my + 20); ctx.stroke(); }
    if (crack >= 3) { ctx.beginPath(); ctx.moveTo(mx + 12, my + 2); ctx.lineTo(mx + 12, my + 22); ctx.stroke(); }
  }
  
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  
  if (!isDay) {
    ctx.fillStyle = 'rgba(0,0,20,0.4)';
    ctx.fillRect(0, 0, W, H);
  }
  
  const hpFill = document.getElementById('hp-fill');
  if (hpFill) hpFill.style.width = (player.hp / player.maxHp * 100) + '%';
  const timeEl = document.getElementById('time');
  if (timeEl) timeEl.textContent = isDay ? 'Day' : 'Night';
  const depthEl = document.getElementById('depth');
  if (depthEl) depthEl.textContent = Math.floor((player.y + player.h) / TILE - 60);

  // Minimap (throttled)
  const mm = document.getElementById('minimap');
  if (mm.style.display !== 'none' && time % 6 === 0) {
    const mmCtx = mm.getContext('2d');
    const mmW = mm.width, mmH = mm.height;
    const scaleX = mmW / WORLD_W;
    const scaleY = mmH / WORLD_H;
    mmCtx.fillStyle = '#000';
    mmCtx.fillRect(0, 0, mmW, mmH);
    for (let y = 0; y < WORLD_H; y += 6) {
      for (let x = 0; x < WORLD_W; x += 6) {
        const b = getBlock(x, y);
        if (b === 0) continue;
        const block = BLOCKS[b];
        let c = block.color;
        if (c.length === 4) c = '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
        else if (c.length > 7) c = c.slice(0, 7);
        mmCtx.fillStyle = c;
        mmCtx.fillRect(x * scaleX, y * scaleY, Math.max(1, scaleX * 6), Math.max(1, scaleY * 6));
      }
    }
    mmCtx.fillStyle = '#f00';
    mmCtx.fillRect(player.x / TILE * scaleX - 1, player.y / TILE * scaleY - 1, 3, 3);
  }
}

// Input
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouseDown = true;
    const t = getMouseTile();
    if (keys['Shift']) placeBlock(t.x, t.y);
    else { mineBlock(t.x, t.y); player.swing = 10; }
  } else if (e.button === 2) {
    const t = getMouseTile();
    placeBlock(t.x, t.y);
  }
});

canvas.addEventListener('mouseup', e => {
  if (e.button === 0) { mouseDown = false; player.mining = null; }
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key >= '1' && e.key <= '9') {
    player.selected = parseInt(e.key) - 1;
    updateHotbar();
  }
  if (e.key.toLowerCase() === 'e') toggleCrafting();
  if (e.key.toLowerCase() === 'f') shootArrow();
  if (e.key.toLowerCase() === 'm') toggleMinimap();
  if (e.key.toLowerCase() === 'q') {
    const slot = player.hotbar[player.selected];
    if (slot) {
      spawnDrop(player.x, player.y, slot.id, 1);
      slot.count--;
      if (slot.count <= 0) player.hotbar[player.selected] = null;
      updateHotbar();
    }
  }
});

window.addEventListener('keyup', e => { keys[e.key] = false; });

// Game loop
function gameLoop(now) {
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  accumulator += dt;
  while (accumulator >= FIXED_DT) {
    time = (time + 1) % DAY_LEN;
    updatePlayer();
    updateEntities();
    updateLight();
    updateSpawning();
    updateRegen();
    if (mouseDown && !keys['Shift']) {
      const t = getMouseTile();
      mineBlock(t.x, t.y);
    }
    if (player.swing > 0) player.swing--;
    accumulator -= FIXED_DT;
  }
  draw();
  requestAnimationFrame(gameLoop);
}

generate();
addItem(10, 8);
addItem(37, 1);
addItem(38, 50);
updateHotbar();
updateArmorUI();
updateLight();
document.getElementById('chest-close').onclick = closeChest;
document.getElementById('music-toggle').onclick = toggleMusic;
document.getElementById('helm-slot').onclick = () => equipArmor('helm');
document.getElementById('chest-slot').onclick = () => equipArmor('chest');
document.getElementById('leg-slot').onclick = () => equipArmor('leg');
requestAnimationFrame(gameLoop);
</script>
