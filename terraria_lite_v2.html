<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block World</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Press Start 2P', monospace; overflow: hidden; }
  #game-container { position: relative; image-rendering: pixelated; }
  canvas { border: 4px solid #333; cursor: crosshair; image-rendering: pixelated; }
  #ui { position: absolute; top: 8px; left: 8px; color: #fff; font-size: 10px; text-shadow: 2px 2px 0 #000; pointer-events: none; font-family: 'Press Start 2P', monospace; }
  #hp-bar { width: 160px; height: 16px; background: #222; border: 2px solid #555; margin-bottom: 6px; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #ff4444, #aa0000); transition: width 0.2s; }
  #stats { font-size: 8px; color: #ccc; }
  #hotbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 40px); gap: 3px; pointer-events: auto; }
  .slot { width: 40px; height: 40px; background: rgba(0,0,0,0.7); border: 2px solid #777; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; position: relative; font-family: 'Press Start 2P', monospace; cursor: pointer; }
  .slot.active { border-color: #ffff44; background: rgba(255,255,0,0.2); }
  .slot .count { position: absolute; bottom: 2px; right: 4px; font-size: 8px; color: #fff; text-shadow: 1px 1px 0 #000; }
  #inventory { position: absolute; top: 8px; right: 8px; background: rgba(15,15,25,0.95); border: 3px solid #555; width: 320px; display: none; flex-direction: column; font-family: 'Press Start 2P', monospace; max-height: 520px; }
  #inv-header { background: #2a2a3a; padding: 8px 10px; font-size: 10px; color: #ffff44; border-bottom: 2px solid #444; display: flex; justify-content: space-between; align-items: center; }
  #inv-close { cursor: pointer; color: #ff4444; font-size: 12px; }
  #inv-close:hover { color: #ff8888; }
  #inv-content { display: flex; flex-direction: column; padding: 8px; gap: 4px; overflow-y: auto; }
  #inv-crafting { flex: 1; }
  #inv-crafting h4 { color: #ffff44; font-size: 9px; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 3px; }
  .recipe { padding: 5px 6px; cursor: pointer; font-size: 8px; border-radius: 2px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }

  .recipe.can:hover { background: rgba(60,120,60,0.7); color: #aaffaa; }
  .recipe.cant { background: rgba(30,30,30,0.5); border: 1px solid #444; color: #666; }
  .recipe.cant:hover { background: rgba(40,40,40,0.6); color: #888; }
  .recipe-name { font-weight: bold; }
  .recipe-ing { font-size: 7px; color: #999; margin-top: 2px; }
  .recipe .out-icon { font-size: 12px; margin-right: 6px; }
  #msg { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); color: #ffff44; font-size: 10px; text-shadow: 2px 2px 0 #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; font-family: 'Press Start 2P', monospace; }
  #minimap { position: absolute; top: 8px; right: 8px; width: 160px; height: 100px; border: 2px solid #555; background: rgba(0,0,0,0.7); image-rendering: pixelated; display: none; }
  #armor-panel { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 4px; pointer-events: auto; }
  .armor-slot { width: 36px; height: 36px; background: rgba(0,0,0,0.7); border: 2px solid #777; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; font-family: 'Press Start 2P', monospace; cursor: pointer; }
  .armor-slot.active { border-color: #ffff44; }
  #chest-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(15,15,25,0.98); border: 3px solid #555; padding: 12px; display: none; flex-direction: column; gap: 8px; font-family: 'Press Start 2P', monospace; z-index: 10; }
  #chest-header { color: #ffff44; font-size: 10px; display: flex; justify-content: space-between; }

  .chest-slot { width: 36px; height: 36px; background: rgba(0,0,0,0.6); border: 2px solid #555; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; cursor: pointer; }
  #music-toggle { position: absolute; bottom: 8px; right: 8px; color: #888; font-size: 8px; cursor: pointer; pointer-events: auto; font-family: 'Press Start 2P', monospace; }

  #title-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #0a0a2e, #1a0a3e); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; font-family: 'Press Start 2P', monospace; }
  #title-screen h1 { color: #ffff44; font-size: 32px; text-shadow: 4px 4px 0 #8844aa; margin-bottom: 30px; }
  .menu-btn { background: #2a2a4a; border: 3px solid #555; color: #fff; padding: 10px 20px; margin: 6px; font-size: 10px; cursor: pointer; font-family: 'Press Start 2P', monospace; }
  .menu-btn:hover { border-color: #ffff44; color: #ffff44; }
  .menu-btn.active { border-color: #4a8a2a; color: #4a8a2a; }
  .world-slot { background: rgba(0,0,0,0.5); border: 2px solid #444; padding: 8px 12px; margin: 4px; width: 280px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

  .world-slot.selected { border-color: #4a8a2a; }
  .world-info { font-size: 8px; color: #aaa; }
  .world-name { font-size: 10px; color: #fff; }
  #world-list { margin: 12px 0; max-height: 200px; overflow-y: auto; }
  .menu-row { display: flex; gap: 8px; margin: 8px 0; }
  #tutorial-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 15; color: #fff; font-family: 'Press Start 2P', monospace; }

<div id="game-container">

    <div id="world-list"></div>
    <div class="menu-row">

    </div>
    <div class="menu-row">

      <button class="menu-btn mode-btn" data-mode="creative">Creative</button>
      <button class="menu-btn mode-btn" data-mode="coop">Co-op</button>
      <button class="menu-btn mode-btn" data-mode="tutorial">Tutorial</button>
    </div>
    <div class="menu-row">
      <button class="menu-btn diff-btn" data-diff="easy">Easy</button>
      <button class="menu-btn diff-btn active" data-diff="normal">Normal</button>
      <button class="menu-btn diff-btn" data-diff="hard">Hard</button>
    </div>
  </div>
  <div id="multiplayer-menu">
    <h2>MULTIPLAYER</h2>
    <div id="room-list"></div>
    <div class="menu-row">

      <input id="mp-input" placeholder="CODE" maxlength="6">
      <button class="menu-btn" id="btn-join">Join</button>
    </div>
    <div id="mp-status"></div>
    <button class="menu-btn" id="btn-mp-back" style="margin-top:12px;">Back</button>
  </div>
  <div id="tutorial-overlay">
    <div id="tutorial-text"></div>
    <button class="tutorial-btn" id="tutorial-next">Next</button>
  </div>
  <canvas id="c" width="960" height="540"></canvas>
  <div id="ui">
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="stats"><span id="time">Day</span> | Depth: <span id="depth">0</span>m | DEF: <span id="defense">0</span></div>
  </div>
  <button id="btn-exit" style="position:fixed;top:8px;right:8px;background:#2a2a4a;border:2px solid #555;color:#fff;padding:4px 8px;font-size:8px;cursor:pointer;font-family:'Press Start 2P',monospace;z-index:100;pointer-events:auto;display:none;">Exit</button>

  <div id="crafting"></div>
  <div id="inventory">
    <div id="inv-header">Crafting Guide <span id="inv-close">X</span></div>
    <div id="inv-content">

      </div>
    </div>
  </div>

  <div id="armor-panel">

    <div class="armor-slot" id="chest-slot" title="Chestplate">C</div>
    <div class="armor-slot" id="leg-slot" title="Leggings">L</div>
  </div>
  <div id="chest-ui">
    <div id="chest-header">Chest <span id="chest-close" style="cursor:pointer;color:#f44">X</span></div>
    <div id="chest-grid"></div>
  </div>
  <div id="music-toggle">♪ OFF</div>
  <div id="msg"></div>

  </div>
</div>

let biomeMap = [];

function generateBiomes(rng) {
  biomeMap = [];
  const biomes = ['forest', 'snow', 'desert', 'corruption'];
  let x = 0;
  while (x < WORLD_W) {
    const size = 60 + Math.floor(rng() * 140);
    const b = biomes[Math.floor(rng() * biomes.length)];
    for (let i = 0; i < size && x < WORLD_W; i++, x++) {
      biomeMap[x] = b;
    }
  }
}

function getBiome(x) {
  return biomeMap[x] || 'forest';
}

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generate(seed) {
  const rng = mulberry32(seed);
  generateBiomes(rng);
  function noise(x) {
    return Math.sin(x * 0.05) * 8 + Math.sin(x * 0.13) * 4 + Math.sin(x * 0.03) * 12;
  }
  const surface = [];
  for (let x = 0; x < WORLD_W; x++) surface[x] = Math.floor(60 + noise(x));

  for (let x = 0; x < WORLD_W; x++) {
    const biome = getBiome(x);
    for (let y = 0; y < WORLD_H; y++) {
      const i = y * WORLD_W + x;
      const s = surface[x];
      if (y < s) { world[i] = 0; continue; }

      if (biome === 'snow') {
        if (y === s) world[i] = 19;
        else if (y < s + 3) world[i] = 17;
        else if (y < s + 10) world[i] = 18;
        else {
          world[i] = 2;
          if (rng() < 0.03) world[i] = 7;
          if (rng() < 0.015) world[i] = 8;
        }
      } else if (biome === 'desert') {
        if (y === s) world[i] = 6;
        else if (y < s + 15) world[i] = 6;
        else {
          world[i] = 2;
          if (rng() < 0.02) world[i] = 7;
          if (rng() < 0.01) world[i] = 8;
        }
      } else if (biome === 'corruption') {
        if (y === s) world[i] = 21;
        else if (y < s + 3) world[i] = 1;
        else if (y < s + 12) world[i] = 22;
        else {
          world[i] = 22;
          if (rng() < 0.04) world[i] = 7;
          if (rng() < 0.02) world[i] = 8;
        }
      } else {
        if (y === s) world[i] = 3;
        else if (y < s + 3) world[i] = 1;
        else if (y < s + 8) world[i] = rng() < 0.3 ? 6 : 1;
        else if (y < s + 20) {
          world[i] = 2;
          if (rng() < 0.03) world[i] = 7;
          if (rng() < 0.015) world[i] = 8;
          if (y > s + 15 && rng() < 0.008) world[i] = 9;
        } else {
          world[i] = 2;
          if (rng() < 0.05) world[i] = 7;
          if (rng() < 0.02) world[i] = 8;
          if (y > s + 30 && rng() < 0.01) world[i] = 9;
          if (rng() < 0.1) world[i] = 16;
        }
      }
      if (y > s + 5) {
        // Multiple cave systems with varying sizes
        const cave1 = Math.sin(x * 0.08 + seed * 0.01) * Math.sin(y * 0.12 + seed * 0.02);
        const cave2 = Math.sin(x * 0.15 + y * 0.07 + seed * 0.03);
        const cave3 = Math.sin(x * 0.03 + seed * 0.05) * Math.cos(y * 0.05);
        const cave4 = Math.sin(x * 0.25 + y * 0.18) * Math.cos(x * 0.11);
        if (cave1 + cave2 > 0.5 + rng() * 0.3) world[i] = 0;
        if (cave3 > 0.7) world[i] = 0;
        if (cave4 > 0.8 && rng() < 0.3) world[i] = 0;
      }
    }

    // Trees / Cacti
    const base = surface[x];
    const topBlock = getBlock(x, base);
    if (x % 7 === 3 && rng() < 0.6) {
      if (biome === 'desert' && topBlock === 6) {
        for (let ty = base - 1; ty >= base - 3 && ty >= 0; ty--) {
          if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 20;
        }
      } else if ((topBlock === 3 || topBlock === 19) && getBlock(x, base) !== 0) {
        for (let ty = base - 1; ty >= base - 5 && ty >= 0; ty--) {
          if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 4;
        }
        for (let dy = -3; dy >= -5; dy--) {
          for (let dx = -2; dx <= 2; dx++) {
            const ly = base + dy, lx = x + dx;
            if (ly >= 0 && lx >= 0 && lx < WORLD_W && getBlock(lx, ly) === 0) {
              world[ly * WORLD_W + lx] = 5;
            }
          }
        }
      }
    }
  }

  // Random villages on surface
  const villageCount = 2 + Math.floor(rng() * 3);
  for (let v = 0; v < villageCount; v++) {
    const vx = Math.floor(80 + rng() * (WORLD_W - 160));
    const vy = surface[vx];
    const houseW = 5 + Math.floor(rng() * 4);
    const houseH = 3 + Math.floor(rng() * 2);
    for (let hx = 0; hx < houseW; hx++) {
      for (let hy = 0; hy < houseH; hy++) {
        const wx = vx + hx, wy = vy - 1 - hy;
        if (wx >= 0 && wx < WORLD_W && wy >= 0 && wy < WORLD_H) {
          if (hx === 0 || hx === houseW - 1 || hy === houseH - 1) {
            world[wy * WORLD_W + wx] = 11;
          } else if (hy === 0) {
            world[wy * WORLD_W + wx] = 0;
          }
        }
      }
    }
    const doorX = vx + Math.floor(houseW / 2);
    const doorY = vy - 1;
    if (doorX >= 0 && doorX < WORLD_W && doorY >= 0 && doorY < WORLD_H) {
      world[doorY * WORLD_W + doorX] = 29;
    }
    const villagerX = (vx + 1) * TILE;
    const villagerY = (vy - 2) * TILE;
    entities.push({ x: villagerX, y: villagerY, w: 16, h: 30, type: 'villager', life: 999999, dir: 1, timer: 0 });
  }

  // Random loot chests in caves
  const chestCount = 8 + Math.floor(rng() * 12);
  for (let i = 0; i < chestCount; i++) {
    const cx = Math.floor(rng() * WORLD_W);
    const cy = Math.floor(rng() * (WORLD_H - 100) + 60);
    if (getBlock(cx, cy) === 0 && isSolid(cx, cy + 1)) {
      setBlock(cx, cy, 23);
      const loot = [];
      const roll = rng();
      if (roll < 0.15) {
        loot.push({ id: 26, count: 1 });
        loot.push({ id: 30, count: 1 });
      } else if (roll < 0.3) {
        loot.push({ id: 37, count: 1 });
        loot.push({ id: 38, count: 20 + Math.floor(rng() * 30) });
      } else if (roll < 0.45) {
        loot.push({ id: 39, count: 1 });
        loot.push({ id: 40, count: 1 });
        loot.push({ id: 41, count: 1 });
      } else if (roll < 0.6) {
        loot.push({ id: 28, count: 1 });
      } else if (roll < 0.75) {
        loot.push({ id: 32, count: 1 });
      } else {
        loot.push({ id: 34, count: 3 + Math.floor(rng() * 5) });
        loot.push({ id: 10, count: 5 + Math.floor(rng() * 10) });
      }
      chests.set(`${cx},${cy}`, loot);
    }
  }

  // Water pools
  for (let i = 0; i < 15 + Math.floor(rng() * 10); i++) {
    const wx = Math.floor(rng() * WORLD_W);
    const wy = Math.floor(rng() * (WORLD_H - 150) + 80);
    const wsize = 3 + Math.floor(rng() * 8);
    for (let dx = -wsize; dx <= wsize; dx++) {
      for (let dy = 0; dy <= wsize; dy++) {
        const lx = wx + dx, ly = wy + dy;
        if (lx >= 0 && lx < WORLD_W && ly >= 0 && ly < WORLD_H) {
          if (getBlock(lx, ly) === 0 && isSolid(lx, ly + 1)) {
            world[ly * WORLD_W + lx] = 24;
          }
        }
      }
    }
  }

  // Lava at bottom + hell biome
  for (let x = 0; x < WORLD_W; x++) {
    for (let y = WORLD_H - 20; y < WORLD_H; y++) {
      const i = y * WORLD_W + x;
      if (world[i] === 2 || world[i] === 0) {
        if (y > WORLD_H - 8) world[i] = 25;
        else world[i] = 26;
      }
    }
  }

  // Ocean edges
  for (let x = 0; x < 30; x++) {
    const depth = Math.floor(30 - x * 0.8);
    for (let y = surface[x]; y < surface[x] + depth && y < WORLD_H; y++) {
      world[y * WORLD_W + x] = 24;
    }
  }
  for (let x = WORLD_W - 30; x < WORLD_W; x++) {
    const depth = Math.floor(30 - (WORLD_W - 1 - x) * 0.8);
    for (let y = surface[x]; y < surface[x] + depth && y < WORLD_H; y++) {
      world[y * WORLD_W + x] = 24;
    }
  }

  const px = Math.floor(50 + rng() * (WORLD_W - 100));
  player.x = px * TILE;
  const surfaceY = surface[px];
  let spawnY = surfaceY - 3;
  while (spawnY > 0 && getBlock(px, spawnY) !== 0) spawnY--;
  player.y = spawnY * TILE;
}

function getBlock(x, y) {
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return 0;
  return world[y * WORLD_W + x];
}

function setBlock(x, y, id) {
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return;
  world[y * WORLD_W + x] = id;
  if (mpRoomCode) {
    supaFetch('mp_blocks', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates' },
      body: { room_code: mpRoomCode, x, y, block_id: id, updated_at: new Date().toISOString() }
    }).catch(() => {});
  }
}

function isSolid(x, y) {
  const b = BLOCKS[getBlock(x, y)];
  return b && b.solid;
}

function addItem(id, count) {
  const item = ITEMS[id] || BLOCKS[id];
  if (!item) return;
  for (let i = 0; i < 20; i++) {
    if (player.hotbar[i] && player.hotbar[i].id === id) {
      player.hotbar[i].count += count;
      updateHotbar();
      if (craftingOpen) updateCrafting();
      return;
    }
  }
  for (let i = 0; i < 20; i++) {
    if (!player.hotbar[i]) {
      player.hotbar[i] = { id, count };
      updateHotbar();
      if (craftingOpen) updateCrafting();
      return;
    }
  }
  for (const s of player.inv) {
    if (s.id === id) { s.count += count; updateHotbar(); if (craftingOpen) updateCrafting(); return; }
  }
  player.inv.push({ id, count });
  updateHotbar();
  if (craftingOpen) updateCrafting();
}

function hasItems(need) {
  const all = [...player.hotbar.filter(s => s), ...player.inv];
  for (const [id, count] of need) {
    let have = 0;
    for (const s of all) if (s.id === id) have += s.count;
    if (have < count) return false;
  }
  return true;
}

function consumeItems(need) {
  for (const [id, count] of need) {
    let rem = count;
    for (const s of player.hotbar) {
      if (s && s.id === id) {
        const take = Math.min(rem, s.count);
        s.count -= take;
        rem -= take;
        if (s.count <= 0) {
          const idx = player.hotbar.indexOf(s);
          player.hotbar[idx] = null;
        }
        if (rem <= 0) break;
      }
    }
    for (const s of player.inv) {
      if (s.id === id) {
        const take = Math.min(rem, s.count);
        s.count -= take;
        rem -= take;
        if (s.count <= 0) {
          const idx = player.inv.indexOf(s);
          player.inv.splice(idx, 1);
        }
        if (rem <= 0) break;
      }
    }
  }
  updateHotbar();
}

function updateHotbar() {
  const el = document.getElementById('hotbar');
  el.innerHTML = '';
  // 5x4 grid = 20 slots, first 9 are hotbar
  for (let i = 0; i < 20; i++) {
    const s = player.hotbar[i];
    const div = document.createElement('div');
    div.className = 'slot' + (i === player.selected ? ' active' : '');
    div.dataset.index = i;
    if (s) {
      const item = ITEMS[s.id] || BLOCKS[s.id];
      div.textContent = item.icon || item.name[0];
      div.style.color = item.color || '#fff';
      if (s.count > 1) {
        const c = document.createElement('span');
        c.className = 'count';
        c.textContent = s.count;
        div.appendChild(c);
      }
    }
    div.onclick = () => {
      player.selected = i;
      updateHotbar();
    };
    el.appendChild(div);
  }
}

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 2000);
}

function toggleCrafting() {
  const panel = document.getElementById('inventory');
  const closeBtn = document.getElementById('inv-close');
  if (closeBtn) closeBtn.onclick = toggleCrafting;
  craftingOpen = !craftingOpen;
  panel.style.display = craftingOpen ? 'flex' : 'none';
  if (craftingOpen) updateCrafting();
}

function updateCrafting() {
  const recipesEl = document.getElementById('inv-recipes');
  recipesEl.innerHTML = '';

  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  let nearCraft = false, nearSmelt = false;
  for (let dy = -3; dy <= 3; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      const b = getBlock(px + dx, py + dy);
      if (b === 12) nearCraft = true;
      if (b === 13) nearSmelt = true;
    }
  }

  for (const r of RECIPES) {
    const outItem = ITEMS[r.out] || BLOCKS[r.out];
    const canCraft = hasItems(r.need);
    const stationOk = (!r.station || (r.station === 'smelt' && nearSmelt) || (r.station !== 'smelt' && (r.anywhere || nearCraft)));

    const div = document.createElement('div');
    div.className = 'recipe ' + (canCraft && stationOk ? 'can' : 'cant');

    const left = document.createElement('div');
    const icon = document.createElement('span');
    icon.className = 'out-icon';
    icon.textContent = outItem?.icon || outItem?.name?.[0] || '?';
    icon.style.color = outItem?.color || '#fff';

    const name = document.createElement('span');
    name.className = 'recipe-name';
    name.textContent = `${outItem?.name || '?'} x${r.count}`;

    left.appendChild(icon);
    left.appendChild(name);

    const ing = document.createElement('div');
    ing.className = 'recipe-ing';
    const needText = r.need.map(n => {
      const it = ITEMS[n[0]] || BLOCKS[n[0]];
      return `${it?.name || '?'} x${n[1]}`;
    }).join(', ');
    const stationText = r.station === 'smelt' ? ' [Furnace]' : (!r.anywhere ? ' [Table]' : '');
    ing.textContent = needText + stationText;

    div.appendChild(left);
    div.appendChild(ing);

    if (canCraft && stationOk) {
      div.onclick = () => {
        consumeItems(r.need);
        addItem(r.out, r.count);
        showMsg(`Crafted ${outItem?.name}`);
        updateCrafting();
      };
    }

    recipesEl.appendChild(div);
  }
}

function updatePlayer() {
  const speed = gameMode === 'creative' ? 0.8 : 0.4;
  const jump = -7.5, friction = 0.85, gravity = gameMode === 'creative' ? 0.15 : 0.35;

  if (gameMode === 'creative') {
    if (keys['a'] || keys['ArrowLeft']) { player.vx -= speed; player.facing = -1; }
    if (keys['d'] || keys['ArrowRight']) { player.vx += speed; player.facing = 1; }
    if (keys['w'] || keys['ArrowUp']) { player.vy -= speed; }
    if (keys['s'] || keys['ArrowDown']) { player.vy += speed; }
    player.vx *= friction; player.vy *= friction;
    player.x += player.vx; player.y += player.vy;
    player.onGround = false;
  } else {
    if (keys['a'] || keys['ArrowLeft']) { player.vx -= speed; player.facing = -1; }
    if (keys['d'] || keys['ArrowRight']) { player.vx += speed; player.facing = 1; }
    if ((keys['w'] || keys[' '] || keys['ArrowUp']) && player.onGround) {
      player.vy = jump; player.onGround = false; SFX.jump();
    }
    player.vx *= friction;
    player.vy += gravity;

    // X collision
    player.x += player.vx;
    const topY = Math.floor(player.y / TILE);
    const botY = Math.floor((player.y + player.h - 1) / TILE);
    if (player.vx > 0) {
      const rightEdge = Math.floor((player.x + player.w) / TILE);
      if (isSolid(rightEdge, topY) || isSolid(rightEdge, botY)) {
        player.x = rightEdge * TILE - player.w - 0.1;
        player.vx = 0;
      }
    } else if (player.vx < 0) {
      const leftEdge = Math.floor(player.x / TILE);
      if (isSolid(leftEdge, topY) || isSolid(leftEdge, botY)) {
        player.x = (leftEdge + 1) * TILE + 0.1;
        player.vx = 0;
      }
    }

    // Y collision
    player.y += player.vy;
    const leftX = Math.floor(player.x / TILE);
    const rightX = Math.floor((player.x + player.w - 1) / TILE);
    if (player.vy > 0) {
      const botEdge = Math.floor((player.y + player.h) / TILE);
      if (isSolid(leftX, botEdge) || isSolid(rightX, botEdge)) {
        player.y = botEdge * TILE - player.h - 0.1;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }
    } else if (player.vy < 0) {
      const topEdge = Math.floor(player.y / TILE);
      if (isSolid(leftX, topEdge) || isSolid(rightX, topEdge)) {
        player.y = (topEdge + 1) * TILE + 0.1;
        player.vy = 0;
      }
    } else {
      const botEdge = Math.floor((player.y + player.h) / TILE);
      player.onGround = isSolid(leftX, botEdge) || isSolid(rightX, botEdge);
    }
  }

  player.x = Math.max(0, Math.min(WORLD_W * TILE - player.w, player.x));
  player.y = Math.max(0, Math.min(WORLD_H * TILE - player.h, player.y));

  if (gameMode !== 'creative') {
    player.hunger -= 0.005 * getDiffMult();
    if (player.hunger <= 0) { player.hunger = 0; player.hp -= 0.05 * getDiffMult(); }
  }

  camX += (player.x - W/2 - camX) * 0.1;
  camY += (player.y - H/2 - camY) * 0.1;
  camX = Math.max(0, Math.min(WORLD_W * TILE - W, camX));
  camY = Math.max(0, Math.min(WORLD_H * TILE - H, camY));
}

function updateEntities() {
  const px = player.x + player.w/2, py = player.y + player.h/2;
  for (let i = entities.length - 1; i >= 0; i--) {
    const e = entities[i];
    const dist = Math.hypot(e.x - px, e.y - py);
    if (dist > 1200 && e.type !== 'drop') continue;
    if (e.type === 'drop') {
      e.vy += 0.3; e.x += e.vx; e.y += e.vy; e.vx *= 0.9;
      const ty = Math.floor((e.y + e.h) / TILE);
      const tx = Math.floor((e.x + e.w/2) / TILE);
      if (isSolid(tx, ty)) { e.y = ty * TILE - e.h; e.vy = 0; e.vx *= 0.5; }
      const dx = px - (e.x + e.w/2);
      const dy = py - (e.y + e.h/2);
      if (Math.hypot(dx, dy) < 30) {
        addItem(e.id, e.count);
        showMsg(`+${e.count} ${ITEMS[e.id]?.name || BLOCKS[e.id]?.name}`);
        SFX.collect();
        entities.splice(i, 1); continue;
      }
      e.life--;
      if (e.life <= 0) entities.splice(i, 1);
    } else if (e.type === 'slime' || e.type === 'zombie') {
      const dx = px - (e.x + e.w/2);
      const dy = py - (e.y + e.h/2);
      const edist = Math.hypot(dx, dy);
      
      if (edist < 300) {
        e.dir = dx > 0 ? 1 : -1;
        e.vx += e.dir * (e.type === 'slime' ? 0.08 : 0.12);
        if (e.onGround && Math.random() < 0.03) e.vy = -5;
      } else {
        e.vx += e.dir * 0.03;
        if (Math.random() < 0.01) e.dir *= -1;
      }
      
      e.vx *= 0.9; e.vy += 0.35;
      e.x += e.vx;
      let etx = Math.floor((e.x + e.w/2) / TILE);
      if (isSolid(etx, Math.floor(e.y / TILE)) || isSolid(etx, Math.floor((e.y + e.h - 1) / TILE))) {
        e.x = (etx + (e.vx > 0 ? -0.6 : 0.6)) * TILE - e.w/2;
        e.vx = 0; e.dir *= -1;
      }
      e.y += e.vy;
      etx = Math.floor((e.x + e.w/2) / TILE);
      const ety = Math.floor((e.y + e.h) / TILE);
      if (isSolid(etx, ety) || isSolid(Math.floor(e.x / TILE), ety)) {
        if (e.vy > 0) { e.y = ety * TILE - e.h; e.onGround = true; }
        else { e.y = (ety + 1) * TILE; }
        e.vy = 0;
      } else { e.onGround = false; }
      
      if (edist < 20 && player.hp > 0 && gameMode !== 'creative') {
        const def = getArmorDef();
        const mult = getDiffMult();
        const raw = (e.type === 'slime' ? 0.3 : 0.5) * mult;
        player.hp -= Math.max(raw * (1 - def * 0.05), raw * 0.2);
        player.vx += (dx > 0 ? 1 : -1) * 3;
        player.vy -= 2;
        SFX.hurt();
      }
      if (player.swing > 0 && edist < 40) {
        const tool = player.hotbar[player.selected];
        const dmg = tool && ITEMS[tool.id]?.tool === 'sword' ? ITEMS[tool.id].dmg : 5;
        e.hp -= dmg;
        e.vx += (dx > 0 ? -1 : 1) * 4; e.vy -= 3;
        SFX.hit();
        if (e.hp <= 0) {
          SFX.enemyDie();
          achievements.stats.killed++;
          checkAchievements();
          entities.splice(i, 1);
        }
      }
    } else if (e.type === 'arrow') {
      e.x += e.vx; e.y += e.vy; e.vy += 0.15;
      e.life--;
      const etx = Math.floor((e.x + e.w/2) / TILE);
      const ety = Math.floor((e.y + e.h/2) / TILE);
      if (isSolid(etx, ety)) { entities.splice(i, 1); continue; }
      for (let j = entities.length - 1; j >= 0; j--) {
        const en = entities[j];
        if (en.type === 'slime' || en.type === 'zombie') {
          const adx = (en.x + en.w/2) - e.x;
          const ady = (en.y + en.h/2) - e.y;
          if (Math.hypot(adx, ady) < 20) {
            en.hp -= 15;
            en.vx += e.dir * 3; en.vy -= 2;
            spawnParticle(en.x + en.w/2, en.y + en.h/2, '#f44');
            if (en.hp <= 0) {
              spawnDrop(en.x, en.y, en.type === 'slime' ? 34 : 35, 1);
              SFX.enemyDie();
              achievements.stats.killed++;
              checkAchievements();
              entities.splice(j, 1);
            }
            entities.splice(i, 1); break;
          }
        }
      }
      if (e.life <= 0) entities.splice(i, 1);
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function getArmorDef() {
  let def = 0;
  for (const slot of ['helm', 'chest', 'leg']) {
    const a = player.armor[slot];
    if (a) def += ITEMS[a.id]?.def || 0;
  }
  return def;
}

function updateRegen() {
  regenTimer++;
  if (regenTimer % 600 === 0) {
    // Tree regen - only at original tree positions (x % 7 === 3)
    for (let x = 3; x < WORLD_W; x += 7) {
      if (Math.random() < 0.1) {
        const s = Math.floor(60 + (Math.sin(x * 0.05) * 8 + Math.sin(x * 0.13) * 4 + Math.sin(x * 0.03) * 12));
        const top = getBlock(x, s);
        if ((top === 3 || top === 19) && getBlock(x, s-1) === 0) {
          for (let ty = s - 1; ty >= s - 5 && ty >= 0; ty--) {
            if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 4;
          }
          for (let dy = -3; dy >= -5; dy--) {
            for (let dx = -2; dx <= 2; dx++) {
              const ly = s + dy, lx = x + dx;
              if (ly >= 0 && lx >= 0 && lx < WORLD_W && getBlock(lx, ly) === 0) {
                world[ly * WORLD_W + lx] = 5;
              }
            }
          }
        }
      }
    }
    for (let i = 0; i < 20; i++) {
      const ox = Math.floor(Math.random() * WORLD_W);
      const oy = Math.floor(Math.random() * (WORLD_H - 100) + 80);
      if (getBlock(ox, oy) === 2) {
        const r = Math.random();
        if (r < 0.3) setBlock(ox, oy, 7);
        else if (r < 0.5) setBlock(ox, oy, 8);
        else if (r < 0.6) setBlock(ox, oy, 9);
        else if (r < 0.65) setBlock(ox, oy, 61);
      }
    }
  }
}

function shootArrow() {
  const slot = player.hotbar[player.selected];
  if (!slot || slot.id !== 37) return;
  if (gameMode !== 'creative') {
    let arrowSlot = null;
    for (let i = 0; i < 20; i++) {
      if (player.hotbar[i] && player.hotbar[i].id === 38) { arrowSlot = player.hotbar[i]; break; }
    }
    if (!arrowSlot) {
      for (const s of player.inv) { if (s.id === 38) { arrowSlot = s; break; } }
    }
    if (!arrowSlot) { showMsg('No arrows!'); return; }
    arrowSlot.count--;
    if (arrowSlot.count <= 0) {
      for (let i = 0; i < 20; i++) if (player.hotbar[i] === arrowSlot) player.hotbar[i] = null;
      const idx = player.inv.indexOf(arrowSlot);
      if (idx >= 0) player.inv.splice(idx, 1);
    }
    updateHotbar();
  }
  entities.push({
    x: player.x + player.w/2, y: player.y + player.h/2,
    vx: player.facing * 8, vy: -1,
    w: 8, h: 3, type: 'arrow', life: 120, dir: player.facing
  });
}

function openChestUI(tx, ty) {
  const key = `${tx},${ty}`;
  if (!chests.has(key)) chests.set(key, []);
  openChest = { x: tx, y: ty, items: chests.get(key) };
  SFX.openChest();
  achievements.stats.chestsOpened++;
  checkAchievements();
  updateChestUI();
  document.getElementById('chest-ui').style.display = 'flex';
}

function closeChest() {
  if (openChest) {
    chests.set(`${openChest.x},${openChest.y}`, openChest.items);
    openChest = null;
  }
  document.getElementById('chest-ui').style.display = 'none';
}

function updateChestUI() {
  const grid = document.getElementById('chest-grid');
  grid.innerHTML = '';
  if (!openChest) return;
  for (let i = 0; i < 10; i++) {
    const s = openChest.items[i];
    const div = document.createElement('div');
    div.className = 'chest-slot';
    if (s) {
      const item = ITEMS[s.id] || BLOCKS[s.id];
      div.textContent = item.icon || item.name[0];
      div.style.color = item.color || '#fff';
    }
    div.onclick = () => {
      if (s) {
        addItem(s.id, s.count);
        openChest.items.splice(i, 1);
      } else {
        const hand = player.hotbar[player.selected];
        if (hand) {
          openChest.items[i] = { id: hand.id, count: hand.count };
          player.hotbar[player.selected] = null;
        }
      }
      updateChestUI();
      updateHotbar();
      if (mpRoomCode) syncChest(`${openChest.x},${openChest.y}`, openChest.items);
    };
    grid.appendChild(div);
  }
}

function toggleMinimap() {
  const mm = document.getElementById('minimap');
  mm.style.display = mm.style.display === 'none' ? 'block' : 'none';
}

function updateArmorUI() {
  const slots = { helm: 'helm-slot', chest: 'chest-slot', leg: 'leg-slot' };
  for (const [type, id] of Object.entries(slots)) {
    const el = document.getElementById(id);
    const a = player.armor[type];
    if (a) {
      const item = ITEMS[a.id];
      el.textContent = item.icon;
      el.style.color = item.color;
      el.style.borderColor = '#ffff44';
    } else {
      el.textContent = type[0].toUpperCase();
      el.style.color = '#fff';
      el.style.borderColor = '#777';
    }
  }
}

function equipArmor(type) {
  const slot = player.hotbar[player.selected];
  if (!slot || !ITEMS[slot.id]?.armor || ITEMS[slot.id].armor !== type) return;
  const old = player.armor[type];
  player.armor[type] = { id: slot.id, count: 1 };
  player.hotbar[player.selected] = old ? { id: old.id, count: 1 } : null;
  updateArmorUI();
  updateHotbar();
}

let musicOn = false;
let audioCtx = null;
let musicInterval = null;

function playSfx(freq, duration, type, vol) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = vol || 0.08;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const SFX = {
  mine() { playSfx(200 + Math.random()*100, 0.08, 'sawtooth', 0.06); },
  place() { playSfx(400, 0.06, 'square', 0.05); },
  swing() { playSfx(150, 0.1, 'sawtooth', 0.04); },
  hit() { playSfx(100, 0.12, 'square', 0.08); },
  hurt() { playSfx(80, 0.15, 'sawtooth', 0.07); },
  jump() { playSfx(300, 0.05, 'sine', 0.04); },
  craft() { playSfx(600, 0.08, 'square', 0.05); playSfx(800, 0.06, 'square', 0.04); },
  openChest() { playSfx(500, 0.06, 'sine', 0.05); playSfx(700, 0.08, 'sine', 0.04); },
  enemyDie() { playSfx(120, 0.15, 'sawtooth', 0.06); },
  collect() { playSfx(440, 0.05, 'sine', 0.05); playSfx(660, 0.05, 'sine', 0.04); },
  achievement() { playSfx(523, 0.1, 'square', 0.06); setTimeout(()=>playSfx(659,0.1,'square',0.06),100); setTimeout(()=>playSfx(784,0.15,'square',0.08),200); }
};

function toggleMusic() {
  musicOn = !musicOn;
  document.getElementById('music-toggle').textContent = musicOn ? '♪ ON' : '♪ OFF';
  if (musicOn) startMusic(); else stopMusic();
}

function getBiomeNotes() {
  const bx = Math.floor((player.x + player.w/2) / TILE);
  const biome = getBiome(Math.max(0, Math.min(WORLD_W-1, bx)));
  if (biome === 'snow') return [349.23, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
  if (biome === 'desert') return [293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 554.37, 587.33];
  if (biome === 'corruption') return [130.81, 146.83, 155.56, 164.81, 196.00, 207.65, 233.08, 246.94];
  return [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
}

function startMusic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let noteIdx = 0;
  musicInterval = setInterval(() => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = getBiomeNotes();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    const isDay = time < 12000;
    osc.frequency.value = notes[noteIdx % notes.length] * (isDay ? 1 : 0.5);
    gain.gain.value = 0.03;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
    noteIdx++;
  }, 250);
}

function stopMusic() {
  if (musicInterval) clearInterval(musicInterval);
}

function updateSpawning() {
  if (gameMode === 'creative' || gameMode === 'tutorial') return;
  if (time < 12000) return;
  const mult = getDiffMult();
  const maxEnemies = difficulty === 'easy' ? 4 : difficulty === 'hard' ? 12 : 8;
  if (Math.random() < 0.003 * mult && entities.filter(e => e.type === 'slime' || e.type === 'zombie').length < maxEnemies) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const sx = Math.floor((player.x + side * 400) / TILE);
    const sy = Math.floor(player.y / TILE);
    let gy = sy;
    while (gy < WORLD_H - 1 && getBlock(sx, gy) === 0) gy++;
    if (gy < WORLD_H - 1) spawnEnemy(sx * TILE, (gy - 1) * TILE, Math.random() < 0.6 ? 'slime' : 'zombie');
  }
}

function getMouseTile() {
  const mx = mouseX + camX;
  const my = mouseY + camY;
  return { x: Math.floor(mx / TILE), y: Math.floor(my / TILE) };
}

function mineBlock(tx, ty) {
  const b = getBlock(tx, ty);
  if (b === 0) return;
  const block = BLOCKS[b];
  const tool = player.hotbar[player.selected];
  let power = 1;
  if (tool) {
    const ttype = ITEMS[tool.id]?.tool;
    if (ttype === 'pick' && block.hp >= 3) power = ITEMS[tool.id].power;
    else if (ttype === 'axe' && (b === 4 || b === 5 || b === 31)) power = ITEMS[tool.id].power;
    else if (ttype === 'hammer' && (b === 11 || b === 12 || b === 13 || b === 15 || b === 28 || b === 29 || b === 30)) power = ITEMS[tool.id].power;
    else if (ttype === 'shovel' && (b === 1 || b === 3 || b === 6 || b === 17 || b === 19 || b === 21)) power = ITEMS[tool.id].power;
    else if (ttype === 'pick') power = ITEMS[tool.id].power;
  }

  if (gameMode === 'creative') {
    const dropId = block.drop || b;
    if (dropId !== 0) spawnDrop(tx * TILE + 4, ty * TILE, dropId, 1);
    setBlock(tx, ty, 0);
    spawnParticle(tx * TILE + TILE/2, ty * TILE + TILE/2, block.color);
    return;
  }

  if (!player.mining || player.mining.x !== tx || player.mining.y !== ty) {
    player.mining = { x: tx, y: ty, progress: 0, max: block.hp * 10 / power };
  }
  player.mining.progress += 1;
  spawnParticle(tx * TILE + TILE/2, ty * TILE + TILE/2, block.color);

  if (player.mining.progress >= player.mining.max) {
    const dropId = block.drop || b;
    if (dropId !== 0) spawnDrop(tx * TILE + 4, ty * TILE, dropId, 1);
    setBlock(tx, ty, 0);
    player.mining = null;
    SFX.mine();
    achievements.stats.mined++;
    checkAchievements();
    // Break entire tree when mining any wood/leaves block
    if (b === 4 || b === 5) {
      breakTree(tx, ty);
    }
  }
}

function breakTree(tx, ty) {
  const queue = [[tx, ty]];
  const visited = new Set([`${tx},${ty}`]);
  while (queue.length > 0) {
    const [cx, cy] = queue.shift();
    const cb = getBlock(cx, cy);
    if (cb === 4 || cb === 5) {
      const dropId = BLOCKS[cb].drop || cb;
      if (dropId !== 0) spawnDrop(cx * TILE + 4, cy * TILE, dropId, 1);
      setBlock(cx, cy, 0);
      spawnParticle(cx * TILE + TILE/2, cy * TILE + TILE/2, BLOCKS[cb].color);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = cx + dx, ny = cy + dy;
          const key = `${nx},${ny}`;
          if (!visited.has(key)) {
            visited.add(key);
            const nb = getBlock(nx, ny);
            if (nb === 4 || nb === 5) queue.push([nx, ny]);
          }
        }
      }
    }
  }
}

function placeBlock(tx, ty) {
  const b = getBlock(tx, ty);
  if (b === 23) { openChestUI(tx, ty); return; }
  const slot = player.hotbar[player.selected];
  if (!slot || (!BLOCKS[slot.id]?.solid && slot.id !== 4 && slot.id !== 10 && slot.id !== 14 && slot.id !== 24 && slot.id !== 28 && slot.id !== 29 && slot.id !== 30)) return;
  const placeId = slot.id === 4 ? 31 : slot.id;
  if (b !== 0) return;
  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  if (tx === px && ty === py) return;
  setBlock(tx, ty, placeId);
  if (placeId === 23) {
    chests.set(`${tx},${ty}`, []);
    if (mpRoomCode) syncChest(`${tx},${ty}`, []);
  }
  if (gameMode !== 'creative') {
    slot.count--;
    if (slot.count <= 0) player.hotbar[player.selected] = null;
  }
  SFX.place();
  achievements.stats.placed++;
  checkAchievements();
  updateHotbar();
}

function updateLight() {
  const isDay = time < 12000;
  const ambient = isDay ? 180 : 30;
  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  const R = 50;
  const sx = Math.max(0, px - R), ex = Math.min(WORLD_W, px + R);
  const sy = Math.max(0, py - R), ey = Math.min(WORLD_H, py + R);
  for (let y = sy; y < ey; y++) {
    for (let x = sx; x < ex; x++) {
      light[y * WORLD_W + x] = ambient;
    }
  }
  for (let y = sy; y < ey; y++) {
    for (let x = sx; x < ex; x++) {
      const b = getBlock(x, y);
      if (BLOCKS[b]?.light) {
        const r = BLOCKS[b].light;
        const r2 = r * r;
        const ls = Math.max(sy, y - r), le = Math.min(ey, y + r + 1);
        const xs = Math.max(sx, x - r), xe = Math.min(ex, x + r + 1);
        for (let ly = ls; ly < le; ly++) {
          const dy = ly - y;
          const dy2 = dy * dy;
          const rem = r2 - dy2;
          if (rem < 0) continue;
          const maxDx = Math.floor(Math.sqrt(rem));
          const lxs = Math.max(xs, x - maxDx);
          const lxe = Math.min(xe, x + maxDx + 1);
          const base = ly * WORLD_W;
          for (let lx = lxs; lx < lxe; lx++) {
            const d = Math.abs(lx - x) + Math.abs(dy);
            const li = base + lx;
            light[li] = Math.max(light[li], 255 - d * 18);
          }
        }
      }
    }
  }
}

function draw() {
  const isDay = time < 12000;
  const skyR = isDay ? 100 : 10;
  const skyG = isDay ? 150 : 10;
  const skyB = isDay ? 220 : 30;
  ctx.fillStyle = `rgb(${skyR},${skyG},${skyB})`;
  ctx.fillRect(0, 0, W, H);
  
  const celestialX = W/2 + Math.cos((time / DAY_LEN) * Math.PI * 2 - Math.PI/2) * (W/2 - 40);
  const celestialY = H/2 + Math.sin((time / DAY_LEN) * Math.PI * 2 - Math.PI/2) * (H/2 - 40);
  if (isDay) {
    ctx.fillStyle = '#ffdd44';
    ctx.beginPath(); ctx.arc(celestialX, celestialY, 20, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#dddddd';
    ctx.beginPath(); ctx.arc(celestialX, celestialY, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 50; i++) {
      ctx.fillRect(((i * 137) % W), ((i * 89) % (H/2)), 2, 2);
    }
  }

  // Weather - rain at night
  if (time % 24000 > 18000 && time % 24000 < 24000) {
    ctx.fillStyle = 'rgba(100,150,200,0.3)';
    for (let i = 0; i < 50; i++) {
      const rx = ((i * 137 + time) % W);
      const ry = ((i * 89 + time * 2) % H);
      ctx.fillRect(rx, ry, 1, 4);
    }
  }

  ctx.save();
  ctx.translate(-Math.floor(camX), -Math.floor(camY));
  
  const startX = Math.floor(camX / TILE);
  const startY = Math.floor(camY / TILE);
  const endX = Math.min(WORLD_W, startX + Math.ceil(W / TILE) + 2);
  const endY = Math.min(WORLD_H, startY + Math.ceil(H / TILE) + 2);
  
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const b = getBlock(x, y);
      if (b === 0) continue;
      const block = BLOCKS[b];
      const li = y * WORLD_W + x;
      const l = light[li] / 255;
      
      const c = block.color;
      let r, g, bval, a = 1;
      if (c.length === 4) {
        r = parseInt(c[1] + c[1], 16);
        g = parseInt(c[2] + c[2], 16);
        bval = parseInt(c[3] + c[3], 16);
      } else {
        r = parseInt(c.slice(1, 3), 16);
        g = parseInt(c.slice(3, 5), 16);
        bval = parseInt(c.slice(5, 7), 16);
        if (c.length > 7) a = parseInt(c.slice(7, 9), 16) / 255;
      }
      ctx.fillStyle = `rgba(${Math.floor(r * l)},${Math.floor(g * l)},${Math.floor(bval * l)},${a})`;
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      
      if (b === 3 && y > 0 && getBlock(x, y-1) === 0) {
        ctx.fillStyle = `rgba(60,160,40,${l})`;
        ctx.fillRect(x * TILE + 2, y * TILE, TILE - 4, 3);
      }
      if (b === 10) {
        ctx.fillStyle = `rgba(255,220,100,${l * 0.8})`;
        ctx.fillRect(x * TILE + 8, y * TILE + 4, 8, 14);
      }
    }
  }
  
  for (const e of entities) {
    if (e.type === 'drop') {
      const item = ITEMS[e.id] || BLOCKS[e.id];
      ctx.fillStyle = item.color || '#fff';
      ctx.font = '12px monospace';
      ctx.fillText(item.icon || item.name[0], e.x, e.y + 10);
    } else if (e.type === 'slime') {
      ctx.fillStyle = '#44aa44';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#66cc66';
      ctx.fillRect(e.x + 4, e.y + 4, 4, 4);
      ctx.fillRect(e.x + 12, e.y + 4, 4, 4);
    } else if (e.type === 'zombie') {
      ctx.fillStyle = '#336633';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(e.x + (e.dir > 0 ? 12 : 4), e.y + 6, 4, 4);
    } else if (e.type === 'villager') {
      ctx.fillStyle = '#ccaa88';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#553311';
      ctx.fillRect(e.x + 2, e.y + 2, 12, 6);
      ctx.fillStyle = '#222222';
      ctx.fillRect(e.x + (e.dir > 0 ? 10 : 4), e.y + 4, 3, 3);
    } else if (e.type === 'arrow') {
      ctx.fillStyle = '#dddddd';
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(Math.atan2(e.vy, e.vx));
      ctx.fillRect(-4, -1, 8, 2);
      ctx.fillStyle = '#aa7744';
      ctx.fillRect(2, -2, 3, 4);
      ctx.restore();
    }
  }
  
  ctx.fillStyle = '#4488aa';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = '#eeccaa';
  ctx.fillRect(player.x + 2, player.y + 2, 14, 10);
  ctx.fillStyle = '#222222';
  ctx.fillRect(player.x + (player.facing > 0 ? 10 : 4), player.y + 5, 3, 3);

  drawOtherPlayers();
  
  if (player.swing > 0) {
    ctx.fillStyle = '#eeccaa';
    const swingAngle = player.swing * 0.3 * player.facing;
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + 16);
    ctx.rotate(swingAngle);
    ctx.fillRect(0, -2, 16, 4);
    ctx.restore();
  }
  
  if (player.mining) {
    const crack = Math.floor(player.mining.progress / player.mining.max * 4);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    const mx = player.mining.x * TILE;
    const my = player.mining.y * TILE;
    if (crack >= 1) { ctx.beginPath(); ctx.moveTo(mx + 4, my + 4); ctx.lineTo(mx + 20, my + 20); ctx.stroke(); }
    if (crack >= 2) { ctx.beginPath(); ctx.moveTo(mx + 20, my + 4); ctx.lineTo(mx + 4, my + 20); ctx.stroke(); }
    if (crack >= 3) { ctx.beginPath(); ctx.moveTo(mx + 12, my + 2); ctx.lineTo(mx + 12, my + 22); ctx.stroke(); }
  }
  
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  
  if (!isDay) {
    ctx.fillStyle = 'rgba(0,0,20,0.4)';
    ctx.fillRect(0, 0, W, H);
  }
  
  const hpFill = document.getElementById('hp-fill');
  if (hpFill) hpFill.style.width = (player.hp / player.maxHp * 100) + '%';
  const timeEl = document.getElementById('time');
  if (timeEl) timeEl.textContent = isDay ? 'Day' : 'Night';
  const depthEl = document.getElementById('depth');
  if (depthEl) depthEl.textContent = Math.floor((player.y + player.h) / TILE - 60);
  const defEl = document.getElementById('defense');
  if (defEl) defEl.textContent = getArmorDef();

  // Minimap (throttled)
  const mm = document.getElementById('minimap');
  if (mm.style.display !== 'none' && time % 6 === 0) {
    const mmCtx = mm.getContext('2d');
    const mmW = mm.width, mmH = mm.height;
    const scaleX = mmW / WORLD_W;
    const scaleY = mmH / WORLD_H;
    mmCtx.fillStyle = '#000';
    mmCtx.fillRect(0, 0, mmW, mmH);
    for (let y = 0; y < WORLD_H; y += 6) {
      for (let x = 0; x < WORLD_W; x += 6) {
        const b = getBlock(x, y);
        if (b === 0) continue;
        const block = BLOCKS[b];
        let c = block.color;
        if (c.length === 4) c = '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
        else if (c.length > 7) c = c.slice(0, 7);
        mmCtx.fillStyle = c;
        mmCtx.fillRect(x * scaleX, y * scaleY, Math.max(1, scaleX * 6), Math.max(1, scaleY * 6));
      }
    }
    mmCtx.fillStyle = '#f00';
    mmCtx.fillRect(player.x / TILE * scaleX - 1, player.y / TILE * scaleY - 1, 3, 3);
  }
}

// Game loop
function gameLoop(now) {
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  accumulator += dt;
  while (accumulator >= FIXED_DT) {
    time = (time + 1) % DAY_LEN;
    updatePlayer();
    updateEntities();
    updateLight();
    updateSpawning();
    updateRegen();
    if (mouseDown && !keys['Shift']) {
      const t = getMouseTile();
      mineBlock(t.x, t.y);
    }
    if (player.swing > 0) player.swing--;
    accumulator -= FIXED_DT;
  }
  draw();
  requestAnimationFrame(gameLoop);
}

    if (data) return JSON.parse(data);

  return null;

function newWorld(seed) {
  const name = prompt('World name:', 'World ' + (worlds.length + 1));
  if (!name) return;
  const finalSeed = seed || Math.floor(Math.random() * 2147483647);
  generate(finalSeed);
  chests.clear();
  entities.length = 0;
  particles.length = 0;
  time = 0;
  player.vx = 0; player.vy = 0;
  player.armor = { helm: null, chest: null, leg: null };
  player.hotbar = player.hotbar.map(() => null);
  player.inv = [];
  selectedWorld = worlds.length;
  worlds.push({ name, mode: gameMode, diff: difficulty, playTime: 0, seed: finalSeed });
  saveWorlds();
  renderWorldList();
  loadedFromSave = false;
  startGame();
}

  const input = document.getElementById('seed-input').value.trim();
  if (!input) return;
  const seed = parseInt(input);

  newWorld(seed);
};

function loadWorld() {
  if (selectedWorld === null || !worlds[selectedWorld]) { alert('Select a world first'); return; }
  const w = worlds[selectedWorld];
  gameMode = w.mode;
  difficulty = w.diff;
  const saved = loadWorldData(selectedWorld);
  if (saved) {
    const arr = base64ToWorld(saved.world);
    world.set(arr);
    chests.clear();
    for (const [k, v] of saved.chests) chests.set(k, v);
    time = saved.time || 0;
    player.x = saved.playerX || 0;
    player.y = saved.playerY || 0;
    player.hp = saved.playerHp || player.maxHp;
    player.armor = saved.playerArmor || { helm: null, chest: null, leg: null };
    player.hotbar = saved.playerHotbar || player.hotbar.map(() => null);
    player.inv = saved.playerInv || [];
    loadedFromSave = true;
  } else {
    generate(w.seed || 12345);
    loadedFromSave = false;
  }
  startGame();
}

function deleteWorld() {
  if (selectedWorld === null || !worlds[selectedWorld]) { alert('Select a world first'); return; }
  if (!confirm('Delete ' + worlds[selectedWorld].name + '?')) return;
  clearWorldData(selectedWorld);
  worlds.splice(selectedWorld, 1);
  selectedWorld = null;
  saveWorlds();
  renderWorldList();
}

function supaFetch(table, opts = {}) {
  const url = `${SUPA_URL}/rest/v1/${table}${opts.query || ''}`;
  const headers = {
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + SUPA_KEY,

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function worldToBase64(arr) {
  let s = '';
  for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
  return btoa(s);
}
function base64ToWorld(str) {
  const s = atob(str);
  const arr = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i);
  return arr;
}

function fetchRooms() {
  const list = document.getElementById('room-list');
  list.innerHTML = '<div style="color:#666;font-size:8px;text-align:center;">Loading...</div>';
  Promise.all([
    supaFetch('multiplayer_rooms', { query: '?select=code,world_name,created_at&order=created_at.desc&limit=20' }),
    supaFetch('mp_players', { query: '?select=room_code,updated_at' })
  ]).then(([rooms, players]) => {
    list.innerHTML = '';
    if (!Array.isArray(rooms) || rooms.length === 0) {
      list.innerHTML = '<div style="color:#666;font-size:8px;text-align:center;">No active rooms</div>';
      return;
    }
    const cutoff = Date.now() - 30000;
    const activeCounts = {};
    if (Array.isArray(players)) {
      players.forEach(p => {
        if (new Date(p.updated_at).getTime() > cutoff) {
          activeCounts[p.room_code] = (activeCounts[p.room_code] || 0) + 1;
        }
      });
    }
    rooms.forEach(r => {
      const count = activeCounts[r.code] || 0;
      const div = document.createElement('div');
      div.className = 'room-slot';
      div.innerHTML = `<div><span class="room-code">${r.code}</span><div class="room-info">${r.world_name || 'Unknown'} | ${count} players</div></div>`;
      div.onclick = () => { document.getElementById('mp-input').value = r.code; };
      list.appendChild(div);
    });
  }).catch(() => {
    list.innerHTML = '<div style="color:#a44;font-size:8px;text-align:center;">Error loading rooms</div>';
  });
}

function startMpBlockSync() {
  if (!mpRoomCode) return;
  mpBlockInterval = setInterval(() => {
    supaFetch('mp_blocks', { query: `?room_code=eq.${mpRoomCode}&updated_at=gt.${encodeURIComponent(mpLastBlockCheck)}&select=x,y,block_id,updated_at` })
      .then(data => {
        if (!Array.isArray(data)) return;
        for (const b of data) {
          world[b.y * WORLD_W + b.x] = b.block_id;
          if (b.updated_at > mpLastBlockCheck) mpLastBlockCheck = b.updated_at;
        }
      }).catch(() => {});
  }, 300);
}

  if (mpBlockInterval) { clearInterval(mpBlockInterval); mpBlockInterval = null; }

}

  if (!mpRoomCode) return;
  supaFetch('mp_chests', {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates' },
    body: { room_code: mpRoomCode, chest_key: key, items: JSON.stringify(items), updated_at: new Date().toISOString() }
  }).catch(() => {});
}

function startMpSync() {
  if (!mpRoomCode) return;
  startMpBlockSync();
  mpSyncInterval = setInterval(() => {
    // Sync chests
    supaFetch('mp_chests', { query: `?room_code=eq.${mpRoomCode}&select=chest_key,items,updated_at` })
      .then(data => {
        if (!Array.isArray(data)) return;
        for (const c of data) {
          try { chests.set(c.chest_key, JSON.parse(c.items)); } catch (e) {}
        }
      }).catch(() => {});
    // Upload my position
    supaFetch('mp_players', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates' },
      body: { room_code: mpRoomCode, player_id: mpPlayerId, x: Math.floor(player.x), y: Math.floor(player.y), updated_at: new Date().toISOString() }
    }).catch(() => {});
    // Download other players
    supaFetch('mp_players', { query: `?room_code=eq.${mpRoomCode}&player_id=neq.${mpPlayerId}&select=player_id,x,y,updated_at` })
      .then(data => {
        if (!Array.isArray(data)) return;
        const now = Date.now();
        mpOtherPlayers = {};
        for (const p of data) {
          if (now - new Date(p.updated_at).getTime() < 10000) {
            mpOtherPlayers[p.player_id] = { x: p.x, y: p.y };
          }
        }
      }).catch(() => {});
  }, 200);
}

function stopMpSync() {
  if (mpSyncInterval) { clearInterval(mpSyncInterval); mpSyncInterval = null; }
  stopMpBlockSync();
  stopChatSync();
  mpOtherPlayers = {};
}

    supaFetch('mp_chat', { query: `?room_code=eq.${mpRoomCode}&order=created_at.desc&limit=20` })
      .then(data => {
        if (!Array.isArray(data)) return;
        const log = document.getElementById('chat-log');
        log.innerHTML = '';
        data.reverse().forEach(c => {
          const div = document.createElement('div');
          div.textContent = (c.player_id === mpPlayerId ? 'You' : 'Player') + ': ' + c.message;
          div.style.color = c.player_id === mpPlayerId ? '#8aff8a' : '#ffff44';
          log.appendChild(div);
        });
      }).catch(() => {});
  }, 1000);
}

function stopChatSync() {
  if (chatInterval) { clearInterval(chatInterval); chatInterval = null; }
}

function drawOtherPlayers() {
  for (const id in mpOtherPlayers) {
    const p = mpOtherPlayers[id];
    ctx.fillStyle = '#aa4444';
    ctx.fillRect(p.x, p.y, 18, 34);
    ctx.fillStyle = '#eeccaa';
    ctx.fillRect(p.x + 2, p.y + 2, 14, 10);
    ctx.fillStyle = '#222222';
    ctx.fillRect(p.x + 10, p.y + 5, 3, 3);
  }
}

function hostMultiplayerRoom() {
  const code = genCode();
  const worldName = prompt('World name:', 'MP World ' + code);
  if (!worldName) return;
  setMpStatus('Creating room...', '#ffff44');
  gameMode = 'coop';
  const seed = Math.floor(Math.random() * 2147483647);
  generate(seed);
  chests.clear();
  entities.length = 0;
  particles.length = 0;
  time = 0;
  player.vx = 0; player.vy = 0;
  player.armor = { helm: null, chest: null, leg: null };
  player.hotbar = player.hotbar.map(() => null);
  player.inv = [];
  const worldData = worldToBase64(world);
  supaFetch('multiplayer_rooms', {
    method: 'POST',
    body: { code, world_name: worldName, world_data: worldData, last_active: new Date().toISOString(), seed }
  }).then(() => {
    setMpStatus('Room created! Code: ' + code, '#4a8a2a');
    mpRoomCode = code;
    mpIsHost = true;
    setTimeout(() => {
      document.getElementById('multiplayer-menu').style.display = 'none';
      startGame();
    }, 800);
  }).catch(() => setMpStatus('Failed to create room', '#ff4444'));
}

function joinMultiplayerRoom() {
  const code = document.getElementById('mp-input').value.trim().toUpperCase();
  if (code.length !== 6) { setMpStatus('Enter 6-char code', '#ff4444'); return; }
  setMpStatus('Joining...', '#ffff44');
  supaFetch('multiplayer_rooms', { query: `?code=eq.${code}&select=code,world_name,world_data,player_count` })
    .then(data => {
      if (!Array.isArray(data) || data.length === 0) { setMpStatus('Room not found', '#ff4444'); return; }
      const room = data[0];
      gameMode = 'coop';
      const seed = room.seed || 12345;
      generate(seed);
      const arr = base64ToWorld(room.world_data);
      world.set(arr);
      // Set spawn position after loading world
      const px = Math.floor(50 + Math.random() * (WORLD_W - 100));
      player.x = px * TILE;
      let spawnY = 0;
      while (spawnY < WORLD_H && getBlock(px, spawnY) === 0) spawnY++;
      while (spawnY > 0 && getBlock(px, spawnY) !== 0) spawnY--;
      player.y = spawnY * TILE;
      mpRoomCode = code;
      mpIsHost = false;
      supaFetch('multiplayer_rooms', { method: 'PATCH', query: `?code=eq.${code}`, body: { last_active: new Date().toISOString() } });
      document.getElementById('multiplayer-menu').style.display = 'none';
      startGame();
    })
    .catch(() => setMpStatus('Failed to join', '#ff4444'));
}

document.getElementById('btn-multiplayer').onclick = showMultiplayerMenu;
document.getElementById('btn-host').onclick = hostMultiplayerRoom;
document.getElementById('btn-join').onclick = joinMultiplayerRoom;
document.getElementById('btn-mp-back').onclick = hideMultiplayerMenu;

function exitWorld() {
  inGame = false;
  saveWorldData();
  stopMpSync();
  mpRoomCode = null;
  mpIsHost = false;
  if (selectedWorld !== null && worlds[selectedWorld]) {
    worlds[selectedWorld].playTime += Math.floor(time / 60);
    saveWorlds();
  }
  document.getElementById('c').style.display = 'none';
  document.getElementById('btn-exit').style.display = 'none';
  document.getElementById('chat-box').style.display = 'none';
  document.getElementById('hotbar').style.display = 'none';
  document.getElementById('armor-panel').style.display = 'none';
  document.getElementById('minimap').style.display = 'none';
  document.getElementById('music-toggle').style.display = 'none';
  document.getElementById('ui').style.display = 'none';
  document.getElementById('msg').style.display = 'none';
  document.getElementById('title-screen').style.display = 'flex';
  document.getElementById('inventory').style.display = 'none';
  document.getElementById('chest-ui').style.display = 'none';
  document.getElementById('tutorial-overlay').style.display = 'none';
  craftingOpen = false;
  openChest = null;
  renderWorldList();
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const input = document.getElementById('chat-input');
    sendChat(input.value);
    input.value = '';
  }
});

document.getElementById('btn-exit').onclick = exitWorld;
loadWorlds();
renderWorldList();
</script>
