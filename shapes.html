<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shapes</title>
<style>
  body { margin: 0; background: #1a0b2e; color: #fff; font-family: -apple-system, sans-serif; text-align: center; }
  h1 { letter-spacing: 4px; }
  #wrap { display: flex; gap: 20px; justify-content: center; align-items: flex-start; margin-top: 1rem; }
  #game { background: #0a0a1a; border: 2px solid #444; border-radius: 8px; display: block; }
  #side { text-align: left; min-width: 140px; }
  #next { background: #0a0a1a; border: 2px solid #444; border-radius: 8px; }
  button { background: #ff006e; color: #fff; border: none; padding: 8px 16px; border-radius: 16px; cursor: pointer; margin-top: 0.5rem; }
</style>
</head>
<body>
  <h1>SHAPES</h1>
  <div id="wrap">
    <canvas id="game" width="240" height="480"></canvas>
    <div id="side">
      <div>Score: <span id="score">0</span></div>
      <div>Lines: <span id="lines">0</span></div>
      <div>Next:</div>
      <canvas id="next" width="100" height="100"></canvas>
      <button id="start">START</button>
    </div>
  </div>

<script>
  // ── Canvas + state ──
  const canvas = document.getElementById('game');
  const ctx    = canvas.getContext('2d');
  const nextCv = document.getElementById('next');
  const nextCtx = nextCv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const startBtn = document.getElementById('start');

  const COLS = 10, ROWS = 20, CELL = 24;
  let board, current, next, dropTimer, score, lines, gameOver;

  // ── Pieces ──
  // Each piece is a list of rotations. Each rotation is a list of [x,y] cells.
  const SHAPES = {
    I: { color: '#00f5d4', cells: [[[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]], [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]]] },
    O: { color: '#ffbe0b', cells: [[[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]]] },
    T: { color: '#a78bfa', cells: [[[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]]] },
    S: { color: '#22c55e', cells: [[[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]], [[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]]] },
    Z: { color: '#ef4444', cells: [[[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]]] },
    J: { color: '#3b82f6', cells: [[[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]]] },
    L: { color: '#f97316', cells: [[[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]]] }
  };
  const PIECE_KEYS = Object.keys(SHAPES);

  function randomPiece() {
    const k = PIECE_KEYS[Math.floor(Math.random() * PIECE_KEYS.length)];
    return { key: k, color: SHAPES[k].color, cells: SHAPES[k].cells, rot: 0, x: 3, y: -1 };
  }

  // ── Board = 2D array; null = empty, color = filled ──
  function emptyBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function pieceCells(p) {
    return p.cells[p.rot].map(([x, y]) => [x + p.x, y + p.y]);
  }

  function collides(p) {
    for (const [x, y] of pieceCells(p)) {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y][x]) return true;
    }
    return false;
  }

  function lockPiece() {
    for (const [x, y] of pieceCells(current)) {
      if (y >= 0 && y < ROWS) board[y][x] = current.color;
    }
    clearLines();
    spawn();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (board[y].every(c => c)) {
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        y++; // re-check this row
      }
    }
    if (cleared) {
      score += [0, 40, 100, 300, 1200][cleared];
      lines += cleared;
      scoreEl.textContent = score;
      linesEl.textContent = lines;
    }
  }

  function spawn() {
    current = next;
    next = randomPiece();
    if (collides(current)) gameOver = true;
    drawNext();
  }

  // ── Movement ──
  function move(dx, dy) {
    current.x += dx;
    current.y += dy;
    if (collides(current)) {
      current.x -= dx;
      current.y -= dy;
      if (dy === 1) lockPiece();
      return false;
    }
    return true;
  }

  function rotate() {
    current.rot = (current.rot + 1) % 4;
    if (collides(current)) current.rot = (current.rot + 3) % 4; // unrotate
  }

  function hardDrop() {
    while (move(0, 1)) {}
  }

  // ── Drawing ──
  function drawCell(c, x, y, color) {
    c.fillStyle = color;
    c.fillRect(x * CELL, y * CELL, CELL, CELL);
    c.strokeStyle = 'rgba(0,0,0,0.4)';
    c.strokeRect(x * CELL, y * CELL, CELL, CELL);
  }

  // Outline-only ghost cell. Used to show where the current piece
  // would land if hard-dropped right now.
  function drawGhostCell(x, y, color) {
    ctx.fillStyle = hexToRgba(color, 0.18);
    ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    ctx.strokeStyle = hexToRgba(color, 0.9);
    ctx.lineWidth = 2;
    ctx.strokeRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    ctx.lineWidth = 1;
  }

  // Tiny helper: turn "#ffbe0b" into "rgba(255, 190, 11, 0.5)" so the
  // ghost can reuse the piece's color at a custom alpha.
  function hexToRgba(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a + ')';
  }

  // Find the lowest y the current piece could reach from its current
  // x/rotation by stepping down until it would collide. We use a
  // temporary copy of the piece so we don't move the real one.
  function ghostDropY() {
    const ghost = { x: current.x, y: current.y, rot: current.rot,
                    cells: current.cells };
    while (true) {
      ghost.y++;
      for (const [x, y] of pieceCells(ghost)) {
        if (y >= ROWS) return ghost.y - 1;
        if (x < 0 || x >= COLS) return ghost.y - 1;
        if (y >= 0 && board[y][x]) return ghost.y - 1;
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // grid + board
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (board[y][x]) drawCell(ctx, x, y, board[y][x]);
      }
    }
    // ghost piece (drawn first so the real piece sits on top)
    const gy = ghostDropY();
    for (const [x, y] of pieceCells(current)) {
      const absY = y + (gy - current.y);
      if (absY >= 0) drawGhostCell(x, absY, current.color);
    }
    // current piece
    for (const [x, y] of pieceCells(current)) {
      if (y >= 0) drawCell(ctx, x, y, current.color);
    }
  }

  function drawNext() {
    nextCtx.fillStyle = '#0a0a1a';
    nextCtx.fillRect(0, 0, nextCv.width, nextCv.height);
    const cs = 16;
    for (const [x, y] of next.cells[0]) {
      nextCtx.fillStyle = next.color;
      nextCtx.fillRect(x * cs + 8, y * cs + 8, cs, cs);
    }
  }

  // ── Game loop ──
  function tick() {
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
      startBtn.disabled = false;
      return;
    }
    move(0, 1);
    draw();
    dropTimer = setTimeout(tick, 500);
  }

  function startGame() {
    board = emptyBoard();
    score = 0; lines = 0; gameOver = false;
    scoreEl.textContent = 0; linesEl.textContent = 0;
    next = randomPiece();
    spawn();
    startBtn.disabled = true;
    draw();
    if (dropTimer) clearTimeout(dropTimer);
    dropTimer = setTimeout(tick, 500);
  }

  // ── Input ──
  document.addEventListener('keydown', (e) => {
    if (gameOver) return;
    if (e.key === 'ArrowLeft')  move(-1, 0);
    else if (e.key === 'ArrowRight') move(1, 0);
    else if (e.key === 'ArrowDown')  move(0, 1);
    else if (e.key === 'ArrowUp')    rotate();
    else if (e.key === ' ')          hardDrop();
    draw();
  });

  startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
