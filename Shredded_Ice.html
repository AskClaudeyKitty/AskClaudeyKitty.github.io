<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shredded Ice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(180deg, #e0f7fa 0%, #b2ebf2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        /* Title Section */
        .title-box {
            background: #fff;
            border: 3px solid #00bcd4;
            border-radius: 50px;
            padding: 15px 60px;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
        }
        .title-box h1 {
            color: #00bcd4;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #00838f;
            font-size: 3rem;
            font-weight: bold;
            margin-top: -10px;
        }
        /* Main Content */
        .main-content {
            display: flex;
            gap: 30px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }
        /* Clues Box */
        .clues-section {
            flex: 1;
            max-width: 400px;
        }
        .clues-box {
            background: #fff;
            border: 2px solid #4dd0e1;
            border-radius: 20px;
            padding: 30px;
            min-height: 200px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .clues-box h2 {
            color: #00838f;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .clue-item {
            background: #e0f7fa;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 10px;
            color: #006064;
        }
        /* Menu Box */
        .menu-section {
            width: 250px;
        }
        .menu-box {
            background: #fff;
            border: 3px solid #00bcd4;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
        }
        .menu-box h3 {
            color: #00bcd4;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid #e0f7fa;
            padding-bottom: 10px;
        }
        .menu-item {
            padding: 12px;
            margin: 8px 0;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            border-radius: 15px;
            text-align: center;
            color: #006064;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .menu-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
        }
        /* Order Section */
        .order-section {
            width: 100%;
            max-width: 600px;
        }
        .order-box {
            background: #fff;
            border: 3px solid #00bcd4;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
        }
        .order-box h3 {
            color: #00838f;
            margin-bottom: 15px;
        }
        .order-btn {
            background: linear-gradient(135deg, #00bcd4 0%, #00838f 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .order-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 188, 212, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Title -->
        <div class="title-box">
            <h1>Shredded</h1>
        </div>
        <div class="subtitle">ICE</div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Clues Section -->
            <div class="clues-section">
                <div class="clues-box">
                    <h2>Put Clues Here</h2>
                    <div class="clue-item">Something on...</div>
                    <div class="clue-item">Something on...</div>
                    <div class="clue-item">Something on...</div>
                </div>
            </div>

            <!-- Menu Section -->
            <div class="menu-section">
                <div class="menu-box">
                    <h3>Flavors</h3>
                    <div class="menu-item">Cherry</div>
                    <div class="menu-item">Blue Raspberry</div>
                    <div class="menu-item">Mango</div>
                    <div class="menu-item">Lemon</div>
                    <div class="menu-item">Grape</div>
                    <div class="menu-item">Watermelon</div>
                </div>
            </div>
        </div>

        <!-- Order Section -->
        <div class="order-section">
            <div class="order-box">
                <h3>Put Order Here</h3>
                <button class="order-btn">Order Now</button>
            </div>
        </div>
    </div>
</body>
</html>
