<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Wars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #0f0f23 0%, #1a1a3e 50%, #2d1b4e 100%);
        }
        
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .menu-title {
            font-size: 64px;
            font-weight: bold;
            text-shadow: 0 0 20px #ff6b35, 0 0 40px #ff6b35;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .menu-section {
            background: rgba(30, 30, 60, 0.9);
            border: 2px solid #4a4a8a;
            border-radius: 15px;
            padding: 25px;
            margin: 10px;
            max-width: 800px;
        }
        
        .menu-section h2 {
            color: #ff6b35;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .tank-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        
        .tank-card {
            background: rgba(50, 50, 90, 0.8);
            border: 2px solid #6a6aaa;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tank-card:hover {
            background: rgba(70, 70, 120, 0.9);
            transform: scale(1.05);
        }
        
        .tank-card.selected {
            border-color: #ff6b35;
            box-shadow: 0 0 15px #ff6b35;
        }
        
        .tank-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .tank-icon {
            width: 50px;
            height: 30px;
            margin: 0 auto 5px;
            border-radius: 5px;
        }
        
        .tank-name {
            font-size: 12px;
            font-weight: bold;
        }
        
        .tank-stats {
            font-size: 10px;
            color: #aaa;
        }
        
        .map-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        
        .map-card {
            background: rgba(50, 50, 90, 0.8);
            border: 2px solid #6a6aaa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .map-card:hover {
            background: rgba(70, 70, 120, 0.9);
        }
        
        .map-card.selected {
            border-color: #4ecdc4;
            box-shadow: 0 0 15px #4ecdc4;
        }
        
        .toggle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .toggle-btn {
            background: rgba(50, 50, 90, 0.8);
            border: 2px solid #6a6aaa;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .toggle-btn:hover {
            background: rgba(70, 70, 120, 0.9);
        }
        
        .toggle-btn.active {
            background: #4ecdc4;
            border-color: #4ecdc4;
            color: #000;
        }
        
        .toggle-btn.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .action-btn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #ff6b35;
        }
        
        .code-input {
            background: rgba(30, 30, 60, 0.9);
            border: 2px solid #6a6aaa;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            width: 150px;
            margin: 5px;
        }
        
        .ui-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 10px;
        }
        
        .weapon-bar {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        
        .weapon-slot {
            width: 50px;
            height: 50px;
            background: rgba(50, 50, 90, 0.8);
            border: 2px solid #6a6aaa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
        }
        
        .weapon-slot:hover {
            background: rgba(70, 70, 120, 0.9);
        }
        
        .weapon-slot.active {
            border-color: #ff6b35;
            box-shadow: 0 0 10px #ff6b35;
        }
        
        .weapon-slot .key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #aaa;
        }
        
        .hud-panel {
            top: 10px;
            left: 10px;
            min-width: 200px;
        }
        
        .hud-panel.right {
            left: auto;
            right: 10px;
            text-align: right;
        }
        
        .hp-bar {
            width: 150px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .hp-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s;
        }
        
        .hp-fill.player { background: linear-gradient(90deg, #4ecdc4, #44a08d); }
        .hp-fill.enemy { background: linear-gradient(90deg, #ff6b6b, #ee5a5a); }
        
        .shield-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-left: 5px;
            vertical-align: middle;
        }
        
        .shield-indicator.active {
            background: #4ecdc4;
            box-shadow: 0 0 10px #4ecdc4;
        }
        
        .turn-indicator {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 107, 53, 0.9);
            padding: 10px 30px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .wind-indicator {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .wind-arrow {
            font-size: 24px;
            transition: transform 0.3s;
        }
        
        .fuel-bar {
            width: 100px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .fuel-fill {
            height: 100%;
            background: #f7931e;
            border-radius: 5px;
            transition: width 0.3s;
        }
        
        .trajectory-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        
        .game-over-screen.show {
            display: flex;
        }
        
        .winner-text {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 30px;
            animation: winnerPulse 1s ease-in-out infinite;
        }
        
        @keyframes winnerPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px gold; }
            50% { transform: scale(1.1); text-shadow: 0 0 40px gold, 0 0 60px gold; }
        }
        
        .stats-text {
            font-size: 24px;
            margin: 10px;
            color: #ccc;
        }
        
        .hidden {
            display: none !important;
        }
        
        .notification {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(78, 205, 196, 0.9);
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            animation: slideDown 0.5s ease-out;
            z-index: 150;
        }
        
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="trajectoryCanvas" class="trajectory-canvas"></canvas>
    
    <!-- Main Menu -->
    <div id="mainMenu" class="menu-overlay">
        <div class="menu-title">TANK WARS</div>
        
        <div class="menu-section">
            <h2>Game Mode</h2>
            <div class="toggle-grid">
                <button class="toggle-btn" id="toggleSimpleAim">Simple Aiming</button>
                <button class="toggle-btn" id="toggleChaos">Chaos Mode</button>
                <button class="toggle-btn" id="toggleTriple">Triple Mode</button>
                <button class="toggle-btn" id="toggleMusic">Music</button>
                <button class="toggle-btn" id="toggleTestBot">Test Bot</button>
                <button class="toggle-btn" id="toggleWind">Wind</button>
                <button class="toggle-btn locked" id="toggleShieldBox">Shield Box</button>
            </div>
            <div style="margin-top: 15px; text-align: center;">
                <span>Unlock Code:</span>
                <input type="text" class="code-input" id="codeInput" maxlength="3" placeholder="###">
                <button class="action-btn" style="padding: 10px 20px; font-size: 16px;" onclick="checkCode()">Unlock</button>
            </div>
        </div>
        
        <button class="action-btn" onclick="showTankSelect()">START GAME</button>
    </div>
    
    <!-- Tank Selection -->
    <div id="tankSelect" class="menu-overlay hidden">
        <div class="menu-title">SELECT YOUR TANK</div>
        <div class="menu-section">
            <div class="tank-grid" id="tankGrid"></div>
        </div>
        <button class="action-btn" onclick="showMapSelect()">NEXT: SELECT MAP</button>
        <button class="action-btn" style="background: linear-gradient(135deg, #666, #888);" onclick="showMainMenu()">BACK</button>
    </div>
    
    <!-- Map Selection -->
    <div id="mapSelect" class="menu-overlay hidden">
        <div class="menu-title">SELECT BATTLEFIELD</div>
        <div class="menu-section">
            <div class="map-grid" id="mapGrid"></div>
        </div>
        <button class="action-btn" onclick="startGame()">BATTLE!</button>
        <button class="action-btn" style="background: linear-gradient(135deg, #666, #888);" onclick="showTankSelect()">BACK</button>
    </div>
    
    <!-- Game UI -->
    <div id="gameUI" class="hidden">
        <div class="ui-panel hud-panel">
            <div>Player</div>
            <div class="hp-bar">
                <div class="hp-fill player" id="playerHp" style="width: 100%;"></div>
            </div>
            <div id="playerTankName">Abrams</div>
            <div>Fuel: <div class="fuel-bar"><div class="fuel-fill" id="playerFuel" style="width: 100%;"></div></div></div>
            <div>Shield: <span class="shield-indicator" id="playerShield"></span></div>
        </div>
        
        <div class="ui-panel hud-panel right">
            <div>Enemy</div>
            <div class="hp-bar">
                <div class="hp-fill enemy" id="enemyHp" style="width: 100%;"></div>
            </div>
            <div id="enemyTankName">Abrams</div>
            <div>Fuel: <div class="fuel-bar"><div class="fuel-fill" id="enemyFuel" style="width: 100%;"></div></div></div>
            <div>Shield: <span class="shield-indicator" id="enemyShield"></span></div>
        </div>
        
        <div class="wind-indicator" id="windIndicator">
            <span>Wind:</span>
            <span class="wind-arrow" id="windArrow">→</span>
            <span id="windValue">0</span>
        </div>
        
        <div class="turn-indicator" id="turnIndicator">YOUR TURN</div>
        
        <div class="ui-panel weapon-bar" id="weaponBar"></div>
    </div>
    
    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="game-over-screen">
        <div class="winner-text" id="winnerText">VICTORY!</div>
        <div class="stats-text" id="statsText"></div>
        <button class="action-btn" onclick="resetGame()">PLAY AGAIN</button>
        <button class="action-btn" style="background: linear-gradient(135deg, #666, #888);" onclick="showMainMenu()">MAIN MENU</button>
    </div>

    <script>
        // Game Constants
        const CANVAS_WIDTH = 1200;
        const CANVAS_HEIGHT = 700;
        const TERRAIN_RESOLUTION = 4;
        const GRAVITY_DEFAULT = 0.3;
        const FUEL_COST_MOVE = 0.5;
        const MAX_POWER = 25;
        const MIN_POWER = 2;
        
        // Tank Definitions
        const TANKS = {
            abrams: { name: 'Abrams', hp: 1000, speed: 1.5, fuel: 100, color: '#4a6741', theme: 'military', unlocked: true },
            frost: { name: 'Frost', hp: 1200, speed: 1.3, fuel: 110, color: '#87ceeb', theme: 'ice', unlocked: true },
            blaze: { name: 'Blaze', hp: 950, speed: 1.2, fuel: 90, color: '#ff4500', theme: 'fire', unlocked: true },
            toxic: { name: 'Toxic', hp: 850, speed: 1.6, fuel: 120, color: '#39ff14', theme: 'poison', unlocked: true },
            electro: { name: 'Electro', hp: 1100, speed: 1.0, fuel: 80, color: '#ffd700', theme: 'lightning', unlocked: true },
            atomic: { name: 'Atomic', hp: 1050, speed: 0.8, fuel: 70, color: '#ff69b4', theme: 'nuclear', unlocked: true },
            solar: { name: 'Solar', hp: 950, speed: 1.3, fuel: 100, color: '#ff8c00', theme: 'sun', unlocked: true },
            terra: { name: 'Terra', hp: 1150, speed: 0.9, fuel: 80, color: '#8b4513', theme: 'earth', unlocked: true },
            hades: { name: 'Hades', hp: 950, speed: 1.4, fuel: 110, color: '#800080', theme: 'fire_poison', unlocked: true },
            anubis: { name: 'Anubis', hp: 900, speed: 1.5, fuel: 120, color: '#c4a35a', theme: 'mud_poison', unlocked: true },
            thermonuclear: { name: 'Thermonuclear', hp: 1, speed: 0.5, fuel: 50, color: '#ff0000', theme: 'nuclear', special: 'H-Bomb', unlocked: false },
            chaos: { name: 'Chaos', hp: 66666, speed: 2.0, fuel: 200, color: '#000000', theme: 'oblivion', special: 'Oblivion', unlocked: false },
            drill: { name: 'Actual Drill', hp: 66666, speed: 2.0, fuel: 200, color: '#444444', theme: 'erase', special: 'Erase', unlocked: false },
            unknown: { name: '???', hp: 66666, speed: 2.0, fuel: 200, color: '#ffffff', theme: 'swarm', special: 'Swarm', unlocked: false },
            groundzero: { name: 'Ground Zero', hp: 66666, speed: 2.0, fuel: 200, color: '#8b0000', theme: 'nuke', special: 'NUKE', unlocked: false },
            rubber: { name: 'Rubber', hp: 66666, speed: 2.0, fuel: 200, color: '#ff69b4', theme: 'bouncy', special: 'Bouncy', unlocked: false },
            random: { name: 'Random', hp: 66666, speed: 2.0, fuel: 200, color: '#9400d3', theme: 'random', special: 'Random', unlocked: false },
            boomerang: { name: 'Boomerang', hp: 66666, speed: 2.0, fuel: 200, color: '#00ced1', theme: 'boomerang', special: 'Boomerang', unlocked: false },
            invincible: { name: 'Invincible', hp: 1, speed: 1.0, fuel: 100, color: '#ffd700', theme: 'invincible', special: 'Infinite Shield', unlocked: false }
        };
        
        // Map Definitions
        const MAPS = {
            plains: { name: 'Plains', gravity: 0.3, terrain: 'normal', boost: 'abrams' },
            desert: { name: 'Desert', gravity: 0.3, terrain: 'sand', boost: 'terra_anubis' },
            snow: { name: 'Snow', gravity: 0.3, terrain: 'normal', boost: 'frost' },
            moon: { name: 'Moon', gravity: 0.15, terrain: 'rock', boost: 'atomic_electro_thermo' },
            volcano: { name: 'Volcano', gravity: 0.3, terrain: 'rock', boost: 'blaze_solar_hades' }
        };
        
        // Weapon Definitions
        const WEAPONS = {
            standard: { name: 'Standard', damage: 100, radius: 25, behavior: 'normal', icon: '💥' },
            split: { name: 'Splitter', damage: 60, radius: 20, behavior: 'split', icon: '✨' },
            cluster: { name: 'Cluster', damage: 40, radius: 15, behavior: 'cluster', icon: '💣' },
            bounce: { name: 'Bouncer', damage: 80, radius: 20, behavior: 'bounce', icon: '⚡' },
            rain: { name: 'Rain', damage: 30, radius: 15, behavior: 'rain', icon: '🌧️' },
            drill: { name: 'Drill', damage: 150, radius: 30, behavior: 'drill', icon: '🔨' },
            homing: { name: 'Homing', damage: 90, radius: 25, behavior: 'homing', icon: '🎯' },
            drillRain: { name: 'Drill Rain', damage: 100, radius: 25, behavior: 'drillRain', icon: '⛈️' },
            tomb: { name: 'Tomb', damage: 120, radius: 35, behavior: 'tomb', icon: '🏛️' },
            erase: { name: 'Eraser', damage: 200, radius: 50, behavior: 'erase', icon: '🕳️' },
            swarm: { name: 'Swarm', damage: 10, radius: 10, behavior: 'swarm', icon: '🐝' },
            groundzero: { name: 'Ground Zero', damage: 300, radius: 100, behavior: 'groundzero', icon: '☢️' },
            pinball: { name: 'Pinball', damage: 50, radius: 15, behavior: 'pinball', icon: '🔮' },
            boomerang: { name: 'Boomerang', damage: 120, radius: 25, behavior: 'boomerang', icon: '🪃' },
            random: { name: 'Random', damage: 100, radius: 25, behavior: 'random', icon: '🎲' },
            hbomb: { name: 'H-Bomb', damage: 500, radius: 150, behavior: 'homing', icon: '💀' },
            oblivion: { name: 'Oblivion', damage: 666, radius: 80, behavior: 'split', icon: '🔥' },
            nuke: { name: 'NUKE', damage: 1000, radius: 200, behavior: 'groundzero', icon: '☠️' }
        };
        
        // Tank Weapon Loadouts
        const TANK_WEAPONS = {
            abrams: ['standard', 'split', 'cluster', 'bounce', 'drill'],
            frost: ['standard', 'split', 'rain', 'drill', 'homing'],
            blaze: ['standard', 'cluster', 'bounce', 'drillRain', 'tomb'],
            toxic: ['standard', 'split', 'cluster', 'rain', 'drill'],
            electro: ['standard', 'bounce', 'homing', 'drillRain', 'tomb'],
            atomic: ['standard', 'cluster', 'drill', 'tomb', 'erase'],
            solar: ['standard', 'split', 'bounce', 'drillRain', 'groundzero'],
            terra: ['standard', 'cluster', 'drill', 'tomb', 'erase'],
            hades: ['standard', 'split', 'cluster', 'drillRain', 'tomb'],
            anubis: ['standard', 'rain', 'drill', 'tomb', 'swarm'],
            thermonuclear: ['hbomb', 'hbomb', 'hbomb', 'hbomb', 'hbomb'],
            chaos: ['oblivion', 'oblivion', 'oblivion', 'oblivion', 'oblivion'],
            drill: ['erase', 'erase', 'erase', 'erase', 'erase'],
            unknown: ['swarm', 'swarm', 'swarm', 'swarm', 'swarm'],
            groundzero: ['nuke', 'nuke', 'nuke', 'nuke', 'nuke'],
            rubber: ['pinball', 'pinball', 'pinball', 'pinball', 'pinball'],
            random: ['random', 'random', 'random', 'random', 'random'],
            boomerang: ['boomerang', 'boomerang', 'boomerang', 'boomerang', 'boomerang'],
            invincible: ['standard', 'split', 'cluster', 'bounce', 'homing']
        };
        
        // Game State
        let canvas, ctx, trajCanvas, trajCtx;
        let terrain = [];
        let tanks = [];
        let projectiles = [];
        let particles = [];
        let crates = [];
        let currentTank = 0;
        let gameMode = {};
        let selectedPlayerTank = 'abrams';
        let selectedEnemyTank = 'abrams';
        let selectedMap = 'plains';
        let wind = 0;
        let gameActive = false;
        let unlockedTanks = false;
        let mousePos = { x: 0, y: 0 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let camera = { x: 0, y: 0 };
        let wins = { player: 0, enemy: 0 };
        let audioContext = null;
        let turnInProgress = false;
        let gameOver = false;
        
        // Initialize
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            trajCanvas = document.getElementById('trajectoryCanvas');
            trajCtx = trajCanvas.getContext('2d');
            
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            trajCanvas.width = CANVAS_WIDTH;
            trajCanvas.height = CANVAS_HEIGHT;
            
            // Load saved data
            loadGameData();
            
            // Setup event listeners
            setupEventListeners();
            
            // Initialize menus
            initTankSelect();
            initMapSelect();
            
            // Start render loop
            requestAnimationFrame(gameLoop);
        };
        
        function loadGameData() {
            const saved = localStorage.getItem('tankWarsData');
            if (saved) {
                const data = JSON.parse(saved);
                wins = data.wins || { player: 0, enemy: 0 };
                if (data.unlocked) {
                    unlockAllTanks();
                }
            }
        }
        
        function saveGameData() {
            localStorage.setItem('tankWarsData', JSON.stringify({
                wins: wins,
                unlocked: unlockedTanks
            }));
        }
        
        function unlockAllTanks() {
            unlockedTanks = true;
            Object.keys(TANKS).forEach(key => {
                TANKS[key].unlocked = true;
            });
            document.getElementById('toggleShieldBox').classList.remove('locked');
            initTankSelect();
        }
        
        function checkCode() {
            const code = document.getElementById('codeInput').value;
            if (code === '146') {
                unlockAllTanks();
                showNotification('All tanks unlocked!');
                document.getElementById('codeInput').value = '';
            } else {
                showNotification('Invalid code!');
            }
        }
        
        function showNotification(text) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }
        
        function initTankSelect() {
            const grid = document.getElementById('tankGrid');
            grid.innerHTML = '';
            
            Object.keys(TANKS).forEach(key => {
                const tank = TANKS[key];
                const card = document.createElement('div');
                card.className = 'tank-card' + (tank.unlocked ? '' : ' locked');

        function playSound(type) {
            if (!audioContext) return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            switch(type) {
                case 'shoot':
                    osc.frequency.setValueAtTime(200, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.3);
                    break;
                case 'explosion':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, audioContext.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.5, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.5);
                    break;
                case 'bounce':
                    osc.frequency.setValueAtTime(400, audioContext.currentTime);
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.1);
                    break;
                case 'shield':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioContext.currentTime);
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.3);
                    break;
            }
        }

        function generateTerrain() {
            terrain = [];
            const map = MAPS[selectedMap];
            
            // Base height - higher up = taller terrain
            let baseHeight = CANVAS_HEIGHT - 250;
            
            for (let x = 0; x < CANVAS_WIDTH; x += TERRAIN_RESOLUTION) {
                let height = baseHeight;
                
                // Add noise based on map type
                if (map.terrain === 'normal') {
                    height -= Math.sin(x * 0.01) * 80 + Math.sin(x * 0.03) * 40;
                } else if (map.terrain === 'sand') {
                    height -= Math.sin(x * 0.005) * 50 + Math.random() * 15;
                } else if (map.terrain === 'rock') {
                    height -= Math.sin(x * 0.02) * 120 + Math.sin(x * 0.05) * 50;
                }
                
                // Add platform areas for tanks
                if (Math.abs(x - 150) < 80 || Math.abs(x - (CANVAS_WIDTH - 150)) < 80) {
                    height = Math.min(height, baseHeight - 50);
                }
                
                terrain.push({ x: x, y: height });
            }
        }
        
        function getTerrainHeight(x) {
            const index = Math.floor(x / TERRAIN_RESOLUTION);
            if (index < 0) return terrain[0]?.y || CANVAS_HEIGHT;
            if (index >= terrain.length) return terrain[terrain.length - 1]?.y || CANVAS_HEIGHT;
            return terrain[index].y;
        }
        
        function setTerrainHeight(x, y) {
            const index = Math.floor(x / TERRAIN_RESOLUTION);
            if (index >= 0 && index < terrain.length) {
                terrain[index].y = y;
            }
        }
        
        function destroyTerrain(x, y, radius) {
            for (let i = -radius; i <= radius; i += TERRAIN_RESOLUTION) {
                const tx = x + i;
                const dist = Math.abs(i);
                const depth = Math.sqrt(radius * radius - dist * dist);
                
                const currentHeight = getTerrainHeight(tx);
                if (y + depth < currentHeight) {
                    setTerrainHeight(tx, y + depth);
                }
            }
        }
        
        function drillTerrain(x, y, radius) {
            // Deep crater
            for (let i = -radius; i <= radius; i += TERRAIN_RESOLUTION) {
                const tx = x + i;
                const dist = Math.abs(i);
                const depth = radius * 2 * Math.sqrt(1 - (dist / radius) * (dist / radius));
                
                const currentHeight = getTerrainHeight(tx);
                setTerrainHeight(tx, Math.min(currentHeight, y + depth * 2));
            }
        }
        
        function eraseTerrain(x, y, radius) {
            // Complete removal
            for (let i = -radius; i <= radius; i += TERRAIN_RESOLUTION) {
                const tx = x + i;
                const dist = Math.abs(i);
                if (dist <= radius) {
                    setTerrainHeight(tx, CANVAS_HEIGHT + 100);
                }
            }
        }
        
        function raiseTerrain(x, y, radius) {
            // Raise walls (tomb effect)
            for (let i = -radius; i <= radius; i += TERRAIN_RESOLUTION) {
                const tx = x + i;
                const dist = Math.abs(i);
                if (dist > radius * 0.5 && dist < radius) {
                    const currentHeight = getTerrainHeight(tx);
                    setTerrainHeight(tx, currentHeight - 40);
                }
            }
        }

        function onResize() {
            const scale = Math.min(window.innerWidth / CANVAS_WIDTH, window.innerHeight / CANVAS_HEIGHT);
            canvas.style.width = (CANVAS_WIDTH * scale) + 'px';
            canvas.style.height = (CANVAS_HEIGHT * scale) + 'px';
            trajCanvas.style.width = (CANVAS_WIDTH * scale) + 'px';
            trajCanvas.style.height = (CANVAS_HEIGHT * scale) + 'px';
        }
        
        function onMouseDown(e) {
            console.log('Mouse down', gameActive, currentTank, tanks.length);
            if (!gameActive || currentTank !== 0) return;
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            
            mousePos.x = (e.clientX - rect.left) * scaleX;
            mousePos.y = (e.clientY - rect.top) * scaleY;
            
            const tank = tanks[0];
            console.log('Tank pos:', tank.x, tank.y, 'Mouse:', mousePos.x, mousePos.y);
            const dx = mousePos.x - tank.x;
            const dy = mousePos.y - tank.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            console.log('Distance:', dist);
            
            if (dist < 100) {
                isDragging = true;
                dragStart.x = tank.x;
                dragStart.y = tank.y;
                console.log('Dragging started!');
            }
        }
        
        function onMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            
            mousePos.x = (e.clientX - rect.left) * scaleX;
            mousePos.y = (e.clientY - rect.top) * scaleY;
            
            if (isDragging && gameActive && currentTank === 0) {
                updateTrajectory();
            }
        }
        
        function onMouseUp(e) {
            if (isDragging && gameActive && currentTank === 0) {
                fireProjectile();
            }
            isDragging = false;
            trajCtx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        }
        
        function onKeyDown(e) {
            if (!gameActive) return;
            
            const tank = tanks[currentTank];
            
            // Weapon selection
            if (e.key >= '1' && e.key <= '5') {
                const index = parseInt(e.key) - 1;
                selectWeapon(index);
                return;
            }
            
            // Movement (only on player's turn)
            if (currentTank === 0) {
                if (e.key === 'q' || e.key === 'Q') {
                    moveTank(-1);
                } else if (e.key === 'e' || e.key === 'E') {
                    moveTank(1);
                }
            }
        }
        
        function moveTank(direction) {
            const tank = tanks[currentTank];
            if (tank.fuel <= 0) return;
            
            const tankType = TANKS[tank.type];
            const moveSpeed = 3 * tankType.speed;
            
            tank.x += direction * moveSpeed;
            tank.x = Math.max(30, Math.min(CANVAS_WIDTH - 30, tank.x));
            tank.y = getTerrainHeight(tank.x) - 15;
            tank.fuel -= FUEL_COST_MOVE;
            
            updateHUD();
        }
        
        function updateTrajectory() {
            trajCtx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            if (!isDragging) return;
            
            const tank = tanks[0];
            const dx = dragStart.x - mousePos.x;
            const dy = dragStart.y - mousePos.y;
            
            let power = Math.sqrt(dx * dx + dy * dy) / 10;
            power = Math.max(MIN_POWER, Math.min(MAX_POWER, power));
            
            const angle = Math.atan2(dy, dx);
            
            tank.angle = angle;
            tank.power = power;
            
            // Draw trajectory preview
            trajCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            trajCtx.lineWidth = 2;
            trajCtx.setLineDash([5, 5]);
            trajCtx.beginPath();
            
            let simX = tank.x + Math.cos(angle) * 25;
            let simY = tank.y + Math.sin(angle) * 25;
            let simVx = Math.cos(angle) * power;
            let simVy = Math.sin(angle) * power;
            const gravity = MAPS[selectedMap].gravity;
            
            for (let i = 0; i < 100; i++) {
                trajCtx.lineTo(simX, simY);
                
                simX += simVx;
                simY += simVy;
                simVy += gravity;
                simVx += wind;
                
                if (simX < 0 || simX > CANVAS_WIDTH || simY > CANVAS_HEIGHT) break;
                if (simY >= getTerrainHeight(simX)) break;
            }
            
            trajCtx.stroke();
            trajCtx.setLineDash([]);
        }
        
        function fireProjectile() {
            console.log('fireProjectile called', turnInProgress, currentTank);
            if (turnInProgress) {
                console.log('Turn already in progress, cannot fire');
                return;
            }
            
            const tank = tanks[currentTank];
            const weaponKey = tank.weapons[tank.currentWeapon];
            const weapon = WEAPONS[weaponKey];
            
            console.log('Firing!', weapon.name, 'power:', tank.power, 'angle:', tank.angle);
            turnInProgress = true;
            
            const shots = gameMode.triple ? 3 : 1;
            
            for (let i = 0; i < shots; i++) {
                const spread = shots > 1 ? (i - 1) * 0.1 : 0;
                const angle = tank.angle + spread;
                
                const projectile = {
                    x: tank.x + Math.cos(angle) * 25,
                    y: tank.y + Math.sin(angle) * 25,
                    vx: Math.cos(angle) * tank.power,
                    vy: Math.sin(angle) * tank.power,
                    weapon: { ...weapon },
                    weaponKey: weaponKey,
                    bounces: gameMode.chaos ? 10 : (weapon.behavior === 'bounce' || weapon.behavior === 'pinball' ? 50 : 0),
                    team: tank.team,
                    trail: []
                };
                
                projectiles.push(projectile);
            }
            
            playSound('shoot');
        }
        
        function updateProjectiles() {
            const gravity = MAPS[selectedMap].gravity;
            
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                
                // Store trail
                p.trail.push({ x: p.x, y: p.y });
                if (p.trail.length > 20) p.trail.shift();
                
                // Apply physics
                p.x += p.vx;
                p.y += p.vy;
                p.vy += gravity;
                p.vx += wind;
                
                // Bounce off walls
                if (p.x < 0 || p.x > CANVAS_WIDTH) {
                    if (p.bounces > 0) {
                        p.vx *= -0.8;
                        p.x = p.x < 0 ? 0 : CANVAS_WIDTH;
                        p.bounces--;
                        playSound('bounce');
                    } else {
                        explodeProjectile(i);
                        continue;
                    }
                }
                
                // Check terrain collision
                if (p.y >= getTerrainHeight(p.x)) {
                    if (p.bounces > 0 && p.weapon.behavior !== 'drill') {
                        p.vy *= -0.8;
                        p.y = getTerrainHeight(p.x) - 5;
                        p.bounces--;
                        playSound('bounce');
                    } else {
                        explodeProjectile(i);
                        continue;
                    }
                }
                
                // Check tank collision
                for (let t = 0; t < tanks.length; t++) {
                    const tank = tanks[t];
                    const dx = p.x - tank.x;
                    const dy = p.y - (tank.y - 10);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 25) {
                        // Check shield
                        if (tank.shield) {
                            // Rebound shot
                            p.vx *= -0.8;
                            p.vy *= -0.8;
                            p.weapon.damage *= 0.6;
                            p.weapon.radius *= 0.7;
                            
                            // Vampire heal
                            const ownerTank = tanks.find(ta => ta.team === p.team);
                            if (ownerTank) {
                                const heal = Math.floor(p.weapon.damage * 0.5);
                                ownerTank.hp = Math.min(ownerTank.maxHp, ownerTank.hp + heal);
                                createFloatingText(ownerTank.x, ownerTank.y - 30, `+${heal}`, '#4ecdc4');
                            }
                            
                            // Remove shield if not infinite
                            if (!tank.infiniteShield) {
                                tank.shield = false;
                            }
                            
                            playSound('shield');
                            createParticles(tank.x, tank.y - 10, 10, '#4ecdc4');
                        } else {
                            explodeProjectile(i, tank);
                        }
                        break;
                    }
                }
                
                // Boomerang behavior
                if (p.weapon.behavior === 'boomerang') {
                    const ownerTank = tanks.find(t => t.team === p.team);
                    if (ownerTank) {
                        const dx = ownerTank.x - p.x;
                        const dy = ownerTank.y - p.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 100 && p.vx * dx < 0) {
                            // Turn back
                            p.vx += dx * 0.01;
                            p.vy += dy * 0.01;
                        }
                    }
                }
                
                // Homing behavior
                if (p.weapon.behavior === 'homing') {
                    const target = tanks.find(t => t.team !== p.team);
                    if (target) {
                        const dx = target.x - p.x;
                        const dy = target.y - p.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 0) {
                            p.vx += (dx / dist) * 0.3;
                            p.vy += (dy / dist) * 0.3;
                            // Cap velocity
                            const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                            if (speed > 15) {
                                p.vx = (p.vx / speed) * 15;
                                p.vy = (p.vy / speed) * 15;
                            }
                        }
                    }
                }
                
                // Remove if out of bounds
                if (p.y > CANVAS_HEIGHT + 100) {
                    projectiles.splice(i, 1);
                }
            }
            
            if (projectiles.length === 0 && gameActive && turnInProgress) {
                turnInProgress = false;
                setTimeout(nextTurn, 500);
            }
        }
        
        function explodeProjectile(index, hitTank = null) {
            const p = projectiles[index];
            const weapon = p.weapon;
            
            playSound('explosion');
            createParticles(p.x, p.y, 20, '#ff6b35');
            
            switch (weapon.behavior) {
                case 'normal':
                case 'homing':
                case 'boomerang':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    destroyTerrain(p.x, p.y, weapon.radius);
                    break;
                    
                case 'split':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    destroyTerrain(p.x, p.y, weapon.radius);
                    // Create fragments
                    for (let i = 0; i < 5; i++) {
                        const angle = (Math.PI * 2 / 5) * i;
                        projectiles.push({
                            x: p.x,
                            y: p.y,
                            vx: Math.cos(angle) * 8,
                            vy: Math.sin(angle) * 8,
                            weapon: { ...WEAPONS.standard, damage: weapon.damage / 3, radius: weapon.radius / 2 },
                            weaponKey: 'standard',
                            bounces: 0,
                            team: p.team,
                            trail: []
                        });
                    }
                    break;
                    
                case 'cluster':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    destroyTerrain(p.x, p.y, weapon.radius);
                    // Arcing fragments
                    for (let i = 0; i < 4; i++) {
                        const angle = -Math.PI / 2 + (Math.PI / 6) * (i - 1.5);
                        projectiles.push({
                            x: p.x,
                            y: p.y,
                            vx: Math.cos(angle) * 6,
                            vy: Math.sin(angle) * 6,
                            weapon: { ...WEAPONS.standard, damage: weapon.damage / 2, radius: weapon.radius / 2 },
                            weaponKey: 'standard',
                            bounces: 0,
                            team: p.team,
                            trail: []
                        });
                    }
                    break;
                    
                case 'rain':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    destroyTerrain(p.x, p.y, weapon.radius);
                    // Falling bomblets
                    for (let i = 0; i < 6; i++) {
                        projectiles.push({
                            x: p.x + (Math.random() - 0.5) * 100,
                            y: p.y - 100 - Math.random() * 50,
                            vx: 0,
                            vy: 2,
                            weapon: { ...WEAPONS.standard, damage: weapon.damage / 2, radius: weapon.radius / 2 },
                            weaponKey: 'standard',
                            bounces: 0,
                            team: p.team,
                            trail: []
                        });
                    }
                    break;
                    
                case 'drill':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    drillTerrain(p.x, p.y, weapon.radius);
                    break;
                    
                case 'drillRain':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    drillTerrain(p.x, p.y, weapon.radius);
                    for (let i = 0; i < 4; i++) {
                        projectiles.push({
                            x: p.x + (Math.random() - 0.5) * 80,
                            y: p.y - 80,
                            vx: 0,
                            vy: 3,
                            weapon: { ...WEAPONS.standard, damage: weapon.damage / 2, radius: weapon.radius / 2, behavior: 'drill' },
                            weaponKey: 'standard',
                            bounces: 0,
                            team: p.team,
                            trail: []
                        });
                    }
                    break;
                    
                case 'tomb':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    drillTerrain(p.x, p.y, weapon.radius);
                    raiseTerrain(p.x, p.y, weapon.radius * 1.5);
                    break;
                    
                case 'erase':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    eraseTerrain(p.x, p.y, weapon.radius);
                    break;
                    
                case 'groundzero':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    // Strip entire map layer
                    for (let tx = 0; tx < CANVAS_WIDTH; tx += TERRAIN_RESOLUTION) {
                        const currentHeight = getTerrainHeight(tx);
                        if (Math.abs(tx - p.x) < weapon.radius) {
                            setTerrainHeight(tx, currentHeight + 30);
                        }
                    }
                    break;
                    
                case 'swarm':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    destroyTerrain(p.x, p.y, weapon.radius);
                    // Multiply on bounce
                    if (p.bounces > 0) {
                        for (let i = 0; i < 2; i++) {
                            projectiles.push({
                                x: p.x,
                                y: p.y,
                                vx: (Math.random() - 0.5) * 10,
                                vy: -Math.random() * 8,
                                weapon: weapon,
                                weaponKey: p.weaponKey,
                                bounces: p.bounces - 1,
                                team: p.team,
                                trail: []
                            });
                        }
                    }
                    break;
                    
                case 'pinball':
                    damageArea(p.x, p.y, weapon.radius, weapon.damage, p.team);
                    // No terrain damage
                    break;
                    
                case 'random':
                    const randomWeapon = Object.keys(WEAPONS)[Math.floor(Math.random() * Object.keys(WEAPONS).length)];
                    p.weapon = WEAPONS[randomWeapon];
                    explodeProjectile(index, hitTank);
                    return;
            }
            
            // Check for crate hit
            for (let c = crates.length - 1; c >= 0; c--) {
                const crate = crates[c];
                const dx = p.x - crate.x;
                const dy = p.y - crate.y;
                if (Math.sqrt(dx * dx + dy * dy) < 30) {
                    collectCrate(crate, hitTank);
                    crates.splice(c, 1);
                }
            }
            
            projectiles.splice(index, 1);
        }
        
        function damageArea(x, y, radius, damage, team) {
            tanks.forEach(tank => {
                const dx = tank.x - x;
                const dy = (tank.y - 10) - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < radius) {
                    const actualDamage = Math.floor(damage * (1 - dist / radius));
                    
                    if (tank.shield) {
                        // Vampire heal for attacker
                        const attacker = tanks.find(t => t.team === team);
                        if (attacker && attacker !== tank) {
                            const heal = Math.floor(actualDamage * 0.5);
                            attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
                            createFloatingText(attacker.x, attacker.y - 30, `+${heal}`, '#4ecdc4');
                        }
                        
                        if (!tank.infiniteShield) {
                            tank.shield = false;
                        }
                        createFloatingText(tank.x, tank.y - 30, 'BLOCKED', '#4ecdc4');
                        playSound('shield');
                    } else {
                        tank.hp -= actualDamage;
                        createFloatingText(tank.x, tank.y - 30, `-${actualDamage}`, '#ff6b6b');
                    }
                    
                    if (tank.hp <= 0) {
                        endGame(team === 'player' ? 'enemy' : 'player');
                    }
                }
            });
            
            updateHUD();
        }
        
        function createFloatingText(x, y, text, color) {
            particles.push({
                x: x,
                y: y,
                vx: 0,
                vy: -1,
                life: 60,
                text: text,
                color: color,
                type: 'text'
            });
        }
        
        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 30 + Math.random() * 20,
                    color: color,
                    type: 'particle'
                });
            }
        }
        
        function spawnCrate() {
            if (Math.random() > 0.3) return; // 30% chance per turn
            
            const x = 100 + Math.random() * (CANVAS_WIDTH - 200);
            const y = 50;
            
            crates.push({
                x: x,
                y: y,
                vy: 0,
                type: gameMode.shieldBox ? 'shield' : (Math.random() < 0.25 ? 'shield' : 'weapon')
            });
        }
        
        function updateCrates() {
            const gravity = MAPS[selectedMap].gravity;
            
            for (let i = crates.length - 1; i >= 0; i--) {
                const crate = crates[i];
                crate.vy += gravity;
                crate.y += crate.vy;
                
                // Land on terrain
                if (crate.y >= getTerrainHeight(crate.x) - 15) {
                    crate.y = getTerrainHeight(crate.x) - 15;
                    crate.vy = 0;
                }
                
                // Check tank collision
                tanks.forEach(tank => {
                    const dx = crate.x - tank.x;
                    const dy = crate.y - (tank.y - 10);
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        collectCrate(crate, tank);
                        crates.splice(i, 1);
                    }
                });
            }
        }
        
        function collectCrate(crate, tank) {
            if (crate.type === 'shield') {
                if (!tank.shield) {
                    tank.shield = true;
                    createFloatingText(tank.x, tank.y - 40, 'SHIELD!', '#4ecdc4');
                    playSound('shield');
                }
            } else {
                // Random weapon
                const allWeapons = Object.keys(WEAPONS);
                const randomWeapon = allWeapons[Math.floor(Math.random() * allWeapons.length)];
                tank.weapons[tank.currentWeapon] = randomWeapon;
                createFloatingText(tank.x, tank.y - 40, WEAPONS[randomWeapon].name, '#ffd700');
                
                if (tank.team === 'player') {
                    setupWeaponBar();
                }
            }
            updateHUD();
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function nextTurn() {
            if (gameOver) return;
            
            currentTank = (currentTank + 1) % tanks.length;
            
            // Replenish fuel
            tanks[currentTank].fuel = tanks[currentTank].maxFuel;
            
            // Spawn crate only at start of player's turn (once per full turn cycle)
            if (currentTank === 0) {
                spawnCrate();
            }
            
            // Update wind only at start of player's turn (once per full turn cycle)
            if (currentTank === 0 && gameMode.wind) {
                wind = (Math.random() - 0.5) * 0.3;
                updateWindDisplay();
            }
            
            updateHUD();
            
            // AI turn
            if (currentTank === 1 && !gameMode.testBot) {
                setTimeout(aiTurn, 1000);
            }
        }
        
        function aiTurn() {
            const ai = tanks[1];
            const player = tanks[0];
            
            // Calculate aim
            const dx = player.x - ai.x;
            const dy = player.y - ai.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // Simple aim calculation
            ai.angle = Math.atan2(dy, dx);
            ai.power = Math.min(MAX_POWER, Math.max(MIN_POWER, dist / 30));
            
            // Random weapon selection
            ai.currentWeapon = Math.floor(Math.random() * ai.weapons.length);
            
            // Random movement
            if (Math.random() < 0.3 && ai.fuel > 20) {
                const moveDir = player.x < ai.x ? -1 : 1;
                moveTank(moveDir);
            }
            
            // Fire
            setTimeout(() => {
                fireProjectile();
            }, 500);
        }
        
        function endGame(winner) {
            if (gameOver) return;
            gameOver = true;
            gameActive = false;
            
            if (winner === 'player') {
                wins.player++;
                document.getElementById('winnerText').textContent = 'VICTORY!';
                document.getElementById('winnerText').style.color = '#4ecdc4';
            } else {
                wins.enemy++;
                document.getElementById('winnerText').textContent = 'DEFEAT!';
                document.getElementById('winnerText').style.color = '#ff6b6b';
            }
            
            document.getElementById('statsText').textContent = `Wins: ${wins.player} | Losses: ${wins.enemy}`;
            document.getElementById('gameOverScreen').classList.add('show');
            
            saveGameData();
        }
        
        function resetGame() {
            gameOver = false;
            turnInProgress = false;
            document.getElementById('gameOverScreen').classList.remove('show');
            startGame();
        }
        
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Draw background based on map
            const map = MAPS[selectedMap];
            if (map.name === 'Moon') {
                // Stars
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 100; i++) {
                    ctx.fillRect((i * 137) % CANVAS_WIDTH, (i * 53) % (CANVAS_HEIGHT / 2), 2, 2);
                }
            } else if (map.name === 'Volcano') {
                // Gradient sky
                const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
                grad.addColorStop(0, '#1a0a0a');
                grad.addColorStop(0.5, '#4a1a1a');
                grad.addColorStop(1, '#8b0000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
            
            // Draw terrain
            ctx.fillStyle = map.terrain === 'sand' ? '#c2b280' : 
                           map.terrain === 'rock' ? '#696969' : '#4a6741';
            ctx.beginPath();
            ctx.moveTo(0, CANVAS_HEIGHT);
            for (let i = 0; i < terrain.length; i++) {
                ctx.lineTo(terrain[i].x, terrain[i].y);
            }
            ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.closePath();
            ctx.fill();
            
            // Draw crates
            crates.forEach(crate => {
                ctx.fillStyle = crate.type === 'shield' ? '#4ecdc4' : '#ffd700';
                ctx.fillRect(crate.x - 12, crate.y - 12, 24, 24);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(crate.x - 12, crate.y - 12, 24, 24);
                ctx.fillStyle = '#000';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(crate.type === 'shield' ? '🛡️' : '🔫', crate.x, crate.y + 5);
            });
            
            // Draw tanks
            tanks.forEach((tank, index) => {
                const tankType = TANKS[tank.type];
                
                // Tank body
                ctx.fillStyle = tankType.color;
                ctx.fillRect(tank.x - 20, tank.y - 20, 40, 20);
                
                // Turret
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(tank.x, tank.y - 15);
                ctx.lineTo(
                    tank.x + Math.cos(tank.angle) * 25,
                    tank.y - 15 + Math.sin(tank.angle) * 25
                );
                ctx.stroke();
                
                // Shield
                if (tank.shield) {
                    ctx.strokeStyle = '#4ecdc4';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(tank.x, tank.y - 10, 30, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Shield glow
                    ctx.fillStyle = 'rgba(78, 205, 196, 0.2)';
                    ctx.fill();
                }
                
                // HP bar above tank
                const hpPercent = tank.hp / tank.maxHp;
                ctx.fillStyle = '#333';
                ctx.fillRect(tank.x - 25, tank.y - 50, 50, 6);
                ctx.fillStyle = hpPercent > 0.5 ? '#4ecdc4' : hpPercent > 0.25 ? '#ffd700' : '#ff6b6b';
                ctx.fillRect(tank.x - 25, tank.y - 50, 50 * hpPercent, 6);
                
                // Selection indicator
                if (index === currentTank && gameActive) {
                    ctx.strokeStyle = '#ff6b35';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(tank.x, tank.y - 10, 35, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });
            
            // Draw projectiles
            projectiles.forEach(p => {
                // Trail
                if (p.trail.length > 1) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(p.trail[0].x, p.trail[0].y);
                    for (let i = 1; i < p.trail.length; i++) {
                        ctx.lineTo(p.trail[i].x, p.trail[i].y);
                    }
                    ctx.stroke();
                }
                
                // Projectile
                ctx.fillStyle = '#ff6b35';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Glow
                ctx.fillStyle = 'rgba(255, 107, 53, 0.3)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw particles
            particles.forEach(p => {
                if (p.type === 'text') {
                    ctx.fillStyle = p.color;
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.text, p.x, p.y);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / 50;
                    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
                    ctx.globalAlpha = 1;
                }
            });
            
            // Draw drag line
            if (isDragging && currentTank === 0) {
                const tank = tanks[0];
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(tank.x, tank.y - 15);
                ctx.lineTo(mousePos.x, mousePos.y);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Power indicator
                const dx = dragStart.x - mousePos.x;
                const dy = dragStart.y - mousePos.y;
                const power = Math.min(MAX_POWER, Math.max(MIN_POWER, Math.sqrt(dx * dx + dy * dy) / 10));
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText(`Power: ${power.toFixed(1)}`, mousePos.x + 10, mousePos.y);
            }
        }
        
        function gameLoop() {
            if (gameActive) {
                updateProjectiles();
                updateParticles();
                updateCrates();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
