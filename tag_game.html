<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tag!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: system-ui, sans-serif; overflow: hidden; }
  #game-container { position: relative; }
  canvas { border: 3px solid #444; background: #0f0f1a; display: block; }
  #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 14px; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  #ui span { margin-right: 16px; }
  #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 28px; font-weight: bold; text-align: center; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s; }
  #msg.show { opacity: 1; }
  #mobile-controls { display: none; position: absolute; bottom: 10px; left: 0; right: 0; justify-content: space-between; padding: 0 20px; pointer-events: auto; z-index: 100; }
  .mobile-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; user-select: none; -webkit-user-select: none; touch-action: manipulation; position: relative; }
  .mobile-btn:active { background: rgba(255,255,255,0.3); }
  .mobile-jump { width: 80px; height: 80px; background: rgba(100,200,255,0.2); border-color: rgba(100,200,255,0.4); }
  @media (max-width: 768px) { canvas { max-width: 100vw; max-height: 80vh; } }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="c" width="900" height="500"></canvas>
  <div id="ui">
    <span id="score">Score: 0</span>
    <span id="timer">Time: 0s</span>
    <span id="it">You are IT!</span>
  </div>
  <div id="msg"></div>
  <div id="mobile-controls">
    <div style="display: flex; gap: 15px;">
      <div class="mobile-btn" id="btn-left">←</div>
      <div class="mobile-btn" id="btn-right">→</div>
    </div>
    <div class="mobile-btn mobile-jump" id="btn-jump">↑</div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Game state
let state = 'menu'; // menu, playing, gameover
let score = 0;
let gameTime = 0;
let lastTime = 0;
let playerIsIt = false;
let tagCooldown = 0;
let roundTime = 0;
const GAME_DURATION = 120;

// Physics
const GRAVITY = 0.5;
const FRICTION = 0.85;
const JUMP = -11;
const SPEED = 5;
const BOT_SPEED = 4.2;

// Map - bigger, more complex
const platforms = [
  { x: 0, y: H - 40, w: W, h: 40 },
  { x: 80, y: H - 130, w: 180, h: 20 },
  { x: 320, y: H - 200, w: 260, h: 20 },
  { x: 680, y: H - 130, w: 180, h: 20 },
  { x: 40, y: H - 280, w: 140, h: 20 },
  { x: 720, y: H - 280, w: 140, h: 20 },
  { x: 250, y: H - 360, w: 200, h: 20 },
  { x: 550, y: H - 360, w: 200, h: 20 },
  { x: 400, y: H - 440, w: 120, h: 20 },
  { x: 150, y: H - 440, w: 100, h: 20 },
  { x: 650, y: H - 440, w: 100, h: 20 },
  { x: 380, y: H - 100, w: 160, h: 20 },
];

// Player
const player = { x: 200, y: H - 100, vx: 0, vy: 0, w: 24, h: 32, onGround: false, color: '#4af', trail: [] };

// Bots
const bots = [
  { x: W - 200, y: H - 100, vx: 0, vy: 0, w: 24, h: 32, onGround: false, color: '#f44', trail: [], dir: -1, jumpTimer: 0 },
  { x: W - 300, y: H - 150, vx: 0, vy: 0, w: 24, h: 32, onGround: false, color: '#f84', trail: [], dir: -1, jumpTimer: 0 },
  { x: W - 100, y: H - 200, vx: 0, vy: 0, w: 24, h: 32, onGround: false, color: '#f48', trail: [], dir: -1, jumpTimer: 0 },
];
let itIndex = 0; // 0 = player, 1-3 = bots

// Input
const keys = {};
let moveLeft = false, moveRight = false, doJump = false;

window.addEventListener('keydown', e => { keys[e.key] = true; if (e.code === 'Space') e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Mobile
const isMobile = 'ontouchstart' in window;
if (isMobile) {
  document.getElementById('mobile-controls').style.display = 'flex';
}
document.getElementById('btn-left').addEventListener('touchstart', e => { e.preventDefault(); moveLeft = true; });
document.getElementById('btn-left').addEventListener('touchend', e => { e.preventDefault(); moveLeft = false; });
document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); moveRight = true; });
document.getElementById('btn-right').addEventListener('touchend', e => { e.preventDefault(); moveRight = false; });
document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); doJump = true; });
document.getElementById('btn-jump').addEventListener('touchend', e => { e.preventDefault(); doJump = false; });

function resetGame() {
  player.x = 200; player.y = H - 100; player.vx = 0; player.vy = 0; player.onGround = false; player.trail = [];
  bots[0].x = W - 200; bots[0].y = H - 100; bots[0].vx = 0; bots[0].vy = 0; bots[0].onGround = false; bots[0].trail = [];
  bots[1].x = W - 300; bots[1].y = H - 150; bots[1].vx = 0; bots[1].vy = 0; bots[1].onGround = false; bots[1].trail = [];
  bots[2].x = W - 100; bots[2].y = H - 200; bots[2].vx = 0; bots[2].vy = 0; bots[2].onGround = false; bots[2].trail = [];
  itIndex = 0;
  tagCooldown = 120;
  score = 0;
  gameTime = 0;
  roundTime = 0;
  state = 'playing';
  showMsg('');
}

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = text ? 'show' : '';
}

function rectIntersect(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function onPlatform(x, y, w, h) {
  for (const p of platforms) {
    if (x < p.x + p.w && x + w > p.x && y + h >= p.y && y + h <= p.y + p.h + 5) {
      return p.y;
    }
  }
  return null;
}

function getPlatformBelow(x, y, w, h) {
  let best = null;
  for (const p of platforms) {
    if (x + w > p.x && x < p.x + p.w && p.y >= y + h) {
      if (!best || p.y < best.y) best = p;
    }
  }
  return best;
}

function canReachPlatform(fromX, fromY, toPlat) {
  const dx = toPlat.x + toPlat.w/2 - fromX;
  const dy = toPlat.y - fromY;
  if (dy > 0) return false; // can't jump down to reach up
  const jumpHeight = 120;
  const jumpDist = 180;
  return Math.abs(dx) < jumpDist && Math.abs(dy) < jumpHeight;
}

function nearestPlatform(x, y, w, h) {
  let best = null, bestDist = Infinity;
  for (const p of platforms) {
    const cx = p.x + p.w/2;
    const cy = p.y;
    const d = Math.hypot(cx - (x + w/2), cy - (y + h));
    if (d < bestDist) { bestDist = d; best = p; }
  }
  return best;
}

function updatePlayer() {
  const left = keys['ArrowLeft'] || keys['a'] || moveLeft;
  const right = keys['ArrowRight'] || keys['d'] || moveRight;
  const jump = keys['ArrowUp'] || keys['w'] || keys[' '] || doJump;

  if (left) player.vx -= 1;
  if (right) player.vx += 1;
  player.vx *= FRICTION;
  player.vx = Math.max(-SPEED, Math.min(SPEED, player.vx));

  if (jump && player.onGround) {
    player.vy = JUMP;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // Platform collision
  const py = onPlatform(player.x, player.y, player.w, player.h);
  if (py !== null && player.vy >= 0) {
    player.y = py - player.h;
    player.vy = 0;
    player.onGround = true;
  } else if (player.y + player.h >= H - 40) {
    player.y = H - 40 - player.h;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  // Walls
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // Trail
  if (Math.abs(player.vx) > 1 || Math.abs(player.vy) > 1) {
    player.trail.push({ x: player.x + player.w/2, y: player.y + player.h, life: 20 });
  }
  player.trail = player.trail.filter(t => { t.life--; return t.life > 0; });
}

function updateBots() {
  for (let bi = 0; bi < bots.length; bi++) {
    const bot = bots[bi];
    const isIt = itIndex === bi + 1;
    const itEntity = itIndex === 0 ? player : bots[itIndex - 1];

    let nearest = null, nearestDist = Infinity;
    if (itIndex !== 0) {
      const d = Math.hypot(player.x - bot.x, player.y - bot.y);
      if (d < nearestDist) { nearestDist = d; nearest = player; }
    }
    for (let i = 0; i < bots.length; i++) {
      if (itIndex === i + 1) continue;
      const b = bots[i];
      const d = Math.hypot(b.x - bot.x, b.y - bot.y);
      if (d < nearestDist) { nearestDist = d; nearest = b; }
    }

    if (isIt && nearest) {
      const tx = nearest.x, ty = nearest.y;
      const botPlat = nearestPlatform(bot.x, bot.y, bot.w, bot.h);
      const targetPlat = nearestPlatform(tx, ty, bot.w, bot.h);
      let targetX = tx, targetY = ty;
      if (botPlat && targetPlat && botPlat !== targetPlat) {
        const edge = tx > bot.x ? targetPlat.x : targetPlat.x + targetPlat.w;
        targetX = edge; targetY = targetPlat.y;
      }
      if (targetX > bot.x + 8) bot.vx += 0.5;
      else if (targetX < bot.x - 8) bot.vx -= 0.5;
      if (targetY < bot.y - 30 && bot.onGround) {
        if (Math.abs(targetX - bot.x) < 150) { bot.vy = JUMP; bot.onGround = false; }
      }
      const lookAhead = bot.vx > 0 ? 35 : -35;
      const aheadX = bot.x + bot.w/2 + lookAhead;
      const groundAhead = onPlatform(aheadX, bot.y + bot.h, bot.w, 5);
      const floorAhead = aheadX >= 0 && aheadX < W && (groundAhead !== null || bot.y + bot.h >= H - 45);
      if (!floorAhead && bot.onGround) {
        const nextPlat = getPlatformBelow(aheadX, bot.y - 50, bot.w, bot.h);
        bot.vy = (nextPlat && Math.abs(nextPlat.x + nextPlat.w/2 - aheadX) < 200) ? JUMP * 0.95 : JUMP * 0.8;
        bot.onGround = false;
      }
      if (targetY > bot.y + 40 && bot.onGround && botPlat && botPlat.y < H - 50) {
        const edgeDist = Math.min(bot.x - botPlat.x, botPlat.x + botPlat.w - bot.x - bot.w);
        if (edgeDist < 10) bot.vx += (bot.x < botPlat.x + botPlat.w/2 ? 1 : -1) * 0.5;
      }
    } else if (!isIt) {
      const chaser = itEntity;
      let runDir = chaser.x > bot.x ? -1 : 1;
      let escapePlat = null;
      for (const p of platforms) {
        const pcx = p.x + p.w/2;
        const awayFromChaser = (pcx - chaser.x) * runDir > 0;
        const reachable = canReachPlatform(bot.x, bot.y, p);
        if (awayFromChaser && reachable) {
          if (!escapePlat || Math.abs(pcx - bot.x) < Math.abs(escapePlat.x + escapePlat.w/2 - bot.x)) escapePlat = p;
        }
      }
      if (escapePlat) {
        const ecx = escapePlat.x + escapePlat.w/2;
        if (ecx > bot.x + 10) bot.vx += 0.45;
        else if (ecx < bot.x - 10) bot.vx -= 0.45;
        if (escapePlat.y < bot.y - 20 && bot.onGround && Math.abs(ecx - bot.x) < 120) { bot.vy = JUMP; bot.onGround = false; }
      } else {
        bot.vx += runDir * 0.4;
      }
      if (Math.abs(chaser.x - bot.x) < 60 && Math.abs(chaser.y - bot.y) < 40 && bot.onGround) { bot.vy = JUMP * 1.1; bot.onGround = false; }
      const lookAhead = bot.vx > 0 ? 30 : -30;
      const aheadX = bot.x + bot.w/2 + lookAhead;
      const groundAhead = onPlatform(aheadX, bot.y + bot.h, bot.w, 5);
      const floorAhead = aheadX >= 0 && aheadX < W && (groundAhead !== null || bot.y + bot.h >= H - 45);
      if (!floorAhead && bot.onGround) {
        const nextPlat = getPlatformBelow(aheadX, bot.y - 50, bot.w, bot.h);
        if (nextPlat && Math.abs(nextPlat.x + nextPlat.w/2 - aheadX) < 180) { bot.vy = JUMP; bot.onGround = false; }
      }
    }

    bot.vx *= FRICTION;
    bot.vx = Math.max(-BOT_SPEED, Math.min(BOT_SPEED, bot.vx));
    bot.vy += GRAVITY;
    bot.x += bot.vx;
    bot.y += bot.vy;

    const py = onPlatform(bot.x, bot.y, bot.w, bot.h);
    if (py !== null && bot.vy >= 0) {
      bot.y = py - bot.h; bot.vy = 0; bot.onGround = true;
    } else if (bot.y + bot.h >= H - 40) {
      bot.y = H - 40 - bot.h; bot.vy = 0; bot.onGround = true;
    } else {
      bot.onGround = false;
    }

    bot.x = Math.max(0, Math.min(W - bot.w, bot.x));
    if (Math.abs(bot.vx) > 1 || Math.abs(bot.vy) > 1) {
      bot.trail.push({ x: bot.x + bot.w/2, y: bot.y + bot.h, life: 20 });
    }
    bot.trail = bot.trail.filter(t => { t.life--; return t.life > 0; });
  }
}

function checkTag() {
  if (tagCooldown > 0) { tagCooldown--; return; }
  const all = [player, ...bots];
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      const aRect = { x: a.x + 4, y: a.y + 4, w: a.w - 8, h: a.h - 8 };
      const bRect = { x: b.x + 4, y: b.y + 4, w: b.w - 8, h: b.h - 8 };
      if (rectIntersect(aRect, bRect)) {
        const aIsIt = (i === 0 ? itIndex === 0 : itIndex === i);
        const bIsIt = (j === 0 ? itIndex === 0 : itIndex === j);
        if (aIsIt || bIsIt) {
          itIndex = aIsIt ? (j === 0 ? 0 : j) : (i === 0 ? 0 : i);
          tagCooldown = 120; roundTime = 0;
          if (itIndex === 0) {
            score += Math.floor(gameTime);
            showMsg('Tagged! +' + Math.floor(gameTime) + ' pts');
            setTimeout(() => showMsg(''), 1000);
          } else {
            showMsg("You're IT!");
            setTimeout(() => showMsg(''), 1000);
          }
          return;
        }
      }
    }
  }
}

function update() {
  if (state !== 'playing') return;

  gameTime += 1/60;
  roundTime += 1/60;

  updatePlayer();
  updateBots();
  checkTag();

  // Score for surviving as runner (1 pt/sec when NOT it)
  if (itIndex !== 0) {
    score += 1/60;
  }

  // End game after 2 minutes
  if (gameTime >= GAME_DURATION) {
    state = 'gameover';
    showMsg('Time\'s up! Score: ' + Math.floor(score));
  }

  const timeLeft = Math.max(0, GAME_DURATION - Math.floor(gameTime));

  document.getElementById('score').textContent = 'Score: ' + Math.floor(score);
  document.getElementById('timer').textContent = 'Time: ' + timeLeft + 's';
  document.getElementById('it').textContent = itIndex === 0 ? "You're IT! Chase the bots!" : "Run from the bots!";
  document.getElementById('it').style.color = itIndex === 0 ? '#f44' : '#4af';
}

function draw() {
  // Background
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  // Platforms
  for (const p of platforms) {
    ctx.fillStyle = '#2a2a4a';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#3a3a5a';
    ctx.fillRect(p.x, p.y, p.w, 4);
  }

  // Trails
  for (const t of player.trail) {
    ctx.fillStyle = `rgba(70,170,255,${t.life / 20 * 0.4})`;
    ctx.fillRect(t.x - 3, t.y - 2, 6, 4);
  }
  for (const b of bots) {
    for (const t of b.trail) {
      ctx.fillStyle = `rgba(255,70,70,${t.life / 20 * 0.4})`;
      ctx.fillRect(t.x - 3, t.y - 2, 6, 4);
    }
  }

  // Player
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(player.x + (player.vx >= 0 ? 14 : 4), player.y + 8, 6, 6);
  // Crown if IT
  if (playerIsIt) {
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.moveTo(player.x + 4, player.y - 6);
    ctx.lineTo(player.x + 8, player.y - 12);
    ctx.lineTo(player.x + 12, player.y - 6);
    ctx.lineTo(player.x + 16, player.y - 12);
    ctx.lineTo(player.x + 20, player.y - 6);
    ctx.lineTo(player.x + 20, player.y - 2);
    ctx.lineTo(player.x + 4, player.y - 2);
    ctx.closePath();
    ctx.fill();
  }

  // Bots
  for (let i = 0; i < bots.length; i++) {
    const bot = bots[i];
    ctx.fillStyle = bot.color;
    ctx.fillRect(bot.x, bot.y, bot.w, bot.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(bot.x + (bot.vx >= 0 ? 14 : 4), bot.y + 8, 6, 6);
    if (itIndex === i + 1) {
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.moveTo(bot.x + 4, bot.y - 6);
      ctx.lineTo(bot.x + 8, bot.y - 12);
      ctx.lineTo(bot.x + 12, bot.y - 6);
      ctx.lineTo(bot.x + 16, bot.y - 12);
      ctx.lineTo(bot.x + 20, bot.y - 6);
      ctx.lineTo(bot.x + 20, bot.y - 2);
      ctx.lineTo(bot.x + 4, bot.y - 2);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Tag cooldown indicator
  if (tagCooldown > 0) {
    const alpha = tagCooldown / 120;
    ctx.fillStyle = `rgba(255,255,0,${alpha * 0.3})`;
    ctx.beginPath();
    const itEnt = itIndex === 0 ? player : bots[itIndex - 1];
    ctx.arc(itEnt.x + itEnt.w/2, itEnt.y + itEnt.h/2, 40 + (1 - alpha) * 20, 0, Math.PI * 2);
    ctx.fill();
  }

  // Menu
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('TAG!', W / 2, 180);
    ctx.font = '18px system-ui';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Run from the bot. Tag it when you\'re IT!', W / 2, 230);
    ctx.fillStyle = '#4af';
    ctx.font = 'bold 22px system-ui';
    ctx.fillText('Click or SPACE to start', W / 2, 300);
    ctx.fillStyle = '#666';
    ctx.font = '14px system-ui';
    ctx.fillText('WASD / Arrows to move | SPACE to jump', W / 2, 340);
  }

  // Game over
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', W / 2, 200);
    ctx.font = '20px system-ui';
    ctx.fillText('Score: ' + Math.floor(score), W / 2, 250);
    ctx.fillStyle = '#4af';
    ctx.font = '18px system-ui';
    ctx.fillText('Click or SPACE to restart', W / 2, 300);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Start / restart
canvas.addEventListener('click', () => {
  if (state === 'menu' || state === 'gameover') resetGame();
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && (state === 'menu' || state === 'gameover')) {
    resetGame();
  }
});

loop();
</script>
