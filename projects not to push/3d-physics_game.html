<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Minigames</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }
      #fp-hand {
        position: fixed;
        right: -20px;
        bottom: -40px;
        width: 280px;
        height: 320px;
        pointer-events: none;
        z-index: 5;
        transform: translate(0px, 0px);
      }
      #fp-hand::before {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 70% 30%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.7) 35%, rgba(0,0,0,0) 70%),
          radial-gradient(circle at 30% 70%, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 60%);
        filter: blur(2px);
      }
      #fp-hand::after {
        content: "";
        position: absolute;
        right: 30px;
        bottom: 50px;
        width: 130px;
        height: 180px;
        background: linear-gradient(135deg, rgba(60,40,30,0.95) 0%, rgba(30,20,15,0.95) 60%, rgba(0,0,0,0.95) 100%);
        border-radius: 60px 60px 30px 30px / 100px 100px 30px 30px;
        box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 -10px 30px rgba(0,0,0,0.6);
        transform: rotate(-15deg);
      }
      #fp-cross {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 24px;
        height: 24px;
        pointer-events: none;
        z-index: 6;
        opacity: 0.4;
      }
      #fp-cross::before, #fp-cross::after {
        content: "";
        position: absolute;
        background: #fff;
        box-shadow: 0 0 4px #000;
      }
      #fp-cross::before { left: 50%; top: 0; width: 2px; height: 24px; transform: translateX(-50%); }
      #fp-cross::after { top: 50%; left: 0; height: 2px; width: 24px; transform: translateY(-50%); }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="fp-cross"></div>
    <div id="fp-hand"></div>
    <script src="scary.js" type="text/javascript"></script>
  </body>
</html>
