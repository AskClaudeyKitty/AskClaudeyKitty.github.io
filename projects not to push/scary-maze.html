<html lang="en">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">

<body>
<canvas id="c"></canvas>
<div id="info">WASD to move, Mouse to look | Find the red exit</div>

<script>
const canvas = document.getElementById('c');

function resizeCanvas() {
  canvas.width = Math.floor(window.innerHeight * 4 / 3);
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const gl = canvas.getContext('webgl', { alpha: false });
if (!gl) { alert('WebGL not supported'); }

canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
});
canvas.addEventListener('webglcontextrestored', () => {
  location.reload();
});

// ── Procedural Maze + Big Rooms ──
function generateMaze(width, height) {
  const maze = Array.from({length: height}, () => Array(width).fill(1));
  function carve(x, y) {
    maze[y][x] = 0;
    const dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(() => Math.random() - 0.5);
    for (const [dx, dy] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx > 0 && nx < width - 1 && ny > 0 && ny < height - 1 && maze[ny][nx] === 1) {
        maze[y + dy/2][x + dx/2] = 0;
        carve(nx, ny);
      }
    }
  }
  carve(1, 1);
  maze[1][1] = 0;

  const numRooms = 4 + Math.floor(Math.random() * 4);
  const rooms = [];
  for (let r = 0; r < numRooms; r++) {
    const rw = 3 + Math.floor(Math.random() * 3);
    const rh = 3 + Math.floor(Math.random() * 3);
    const rx = 2 + Math.floor(Math.random() * (width - rw - 4));
    const ry = 2 + Math.floor(Math.random() * (height - rh - 4));
    rooms.push({x: rx, y: ry, w: rw, h: rh});
    for (let y = ry; y < ry + rh; y++) {
      for (let x = rx; x < rx + rw; x++) {
        maze[y][x] = 0;
      }
    }
  }

  let exitX = width - 2, exitY = height - 2;
  while (maze[exitY][exitX] === 1) {
    exitX--;
    if (exitX < 2) { exitX = width - 2; exitY--; }
  }
  maze[exitY][exitX] = 2;

  for (let i = 0; i < (width * height) * 0.03; i++) {
    const rx = Math.floor(Math.random() * (width - 2)) + 1;
    const ry = Math.floor(Math.random() * (height - 2)) + 1;
    if (maze[ry][rx] === 1) {
      const neighbors = [[0,1],[0,-1],[1,0],[-1,0]].filter(([dx,dy]) => maze[ry+dy][rx+dx] === 0);
      if (neighbors.length >= 2) maze[ry][rx] = 0;
    }
  }

  const fakeWallCount = 8 + Math.floor(Math.random() * 12);
  let placed = 0;
  for (let attempts = 0; attempts < 200 && placed < fakeWallCount; attempts++) {
    const rx = Math.floor(Math.random() * (width - 2)) + 1;
    const ry = Math.floor(Math.random() * (height - 2)) + 1;
    if (maze[ry][rx] === 1) {
      const neighbors = [[0,1],[0,-1],[1,0],[-1,0]].filter(([dx,dy]) => maze[ry+dy][rx+dx] === 0);
      if (neighbors.length >= 1) { maze[ry][rx] = 3; placed++; }
    }
  }

  return { maze, rooms };
}

const MAP_W = 45, MAP_H = 35;
const CELL = 64;
let mazeData = generateMaze(MAP_W, MAP_H);
let map = mazeData.maze;
let rooms = mazeData.rooms;

let exitPos = { x: 0, y: 0 };
for (let y = 0; y < MAP_H; y++) {
  for (let x = 0; x < MAP_W; x++) {
    if (map[y][x] === 2) { exitPos = { x, y }; break; }
  }
}

// Arrows
let arrows = [];
function placeArrows() {
  arrows = [];
  for (let y = 1; y < MAP_H - 1; y++) {
    for (let x = 1; x < MAP_W - 1; x++) {
      if (map[y][x] === 1 && Math.random() < 0.08) {
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H && map[ny][nx] === 0) {
            const side = dx !== 0 ? 'x' : 'y';
            let angle;
            if (side === 'x') {
              const canGoUp = ny > 0 && map[ny-1][nx] === 0;
              const canGoDown = ny < MAP_H-1 && map[ny+1][nx] === 0;
              const distUp = canGoUp ? Math.abs(exitPos.y - (ny-1)) : Infinity;
              const distDown = canGoDown ? Math.abs(exitPos.y - (ny+1)) : Infinity;
              if (distUp < distDown) angle = -Math.PI / 2;
              else if (distDown < distUp) angle = Math.PI / 2;
              else angle = exitPos.y > y ? Math.PI / 2 : -Math.PI / 2;
            } else {
              const canGoRight = nx < MAP_W-1 && map[ny][nx+1] === 0;
              const canGoLeft = nx > 0 && map[ny][nx-1] === 0;
              const distRight = canGoRight ? Math.abs(exitPos.x - (nx+1)) : Infinity;
              const distLeft = canGoLeft ? Math.abs(exitPos.x - (nx-1)) : Infinity;
              if (distRight < distLeft) angle = 0;
              else if (distLeft < distRight) angle = Math.PI;
              else angle = exitPos.x > x ? 0 : Math.PI;
            }
            arrows.push({ x, y, angle, side });
            break;
          }
        }
      }
    }
  }
}
placeArrows();

// Lights
let lights = [];
function generateLights() {
  lights = [];
  for (let y = 2; y < MAP_H - 2; y += 3) {
    for (let x = 2; x < MAP_W - 2; x += 4) {
      if (map[y][x] === 0) lights.push({ x: (x + 0.5) * CELL, y: (y + 0.5) * CELL });
    }
  }
}
generateLights();

// Player
const player = { x: CELL * 1.5, y: CELL * 1.5, angle: 0, pitch: 0, speed: 2.5 };
const keys = {};
let gameState = 'playing';
let walkCycle = 0;
let cameraBob = 0;
let cameraSway = 0;

// Events
let isBlackout = false;
let blackoutTimer = 0;
let isFlickering = false;
let flickerTimer = 0;
let eventCooldown = 0;
let eventActive = null;
let eventTimer = 0;
let wallShiftCooldown = 15000;
let lastPlayerAngle = 0;
let shiftCount = 0;

// Audio
let audioCtx = null;
let buzzAudio = null;
let footstepPool = [];
let footstepIdx = 0;

function ensureBuzz() {
  if (buzzAudio) {
    if (buzzAudio.paused) buzzAudio.play().catch(() => {});
    return;
  }
  buzzAudio = new Audio('eldadtsabary-electric-buzz-8456.mp3');
  buzzAudio.preload = 'auto';
  buzzAudio.volume = 1.0;
  buzzAudio.loop = false;
  buzzAudio.currentTime = 0;
  buzzAudio.play().catch(() => {});
  buzzAudio.addEventListener('timeupdate', () => {
    if (buzzAudio.currentTime > 10.5) {
      buzzAudio.currentTime = 0;
    }
  });
  buzzAudio.addEventListener('ended', () => {
    buzzAudio.currentTime = 0;
    buzzAudio.play().catch(() => {});
  });
}

function ensureFootsteps() {
  if (footstepPool.length) return;
  for (let i = 0; i < 3; i++) footstepPool.push(new Audio('footsteps.mp3'));
}

function playFootstep(vol = 1.0) {
  ensureFootsteps();
  const a = footstepPool[footstepIdx];
  footstepIdx = (footstepIdx + 1) % footstepPool.length;
  a.volume = Math.max(0, Math.min(1, vol));
  try { a.currentTime = 0; } catch (e) {}
  a.play().catch(() => {});
}

function stopFootsteps() {
  for (const a of footstepPool) {
    try { a.pause(); a.currentTime = 0; } catch (e) {}
  }
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  ensureBuzz();
  ensureFootsteps();
}

const whisperSounds = [
  new Audio('dragon-studio-creepy-ghost-whisper-410564.mp3'),
  new Audio('dragon-studio-creepy-whisper-472369.mp3'),
  new Audio('dragon-studio-ghost-whisper-351569.mp3')
];
const breathingSound = new Audio('freesound_community-heavy-breathing-14431.mp3');

function playSound(audio, vol = 1.0) {
  if (audio.readyState < 2) return;
  audio.volume = vol;
  try { audio.currentTime = 0; } catch (e) {}
  audio.play().catch(() => {});
}

function playTone(freq, duration, type='sine', vol=0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol=0.08) {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  noise.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

function playRumble(duration, vol = 0.3) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(40, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
  playNoise(duration, vol * 0.5);
}

let lastFootstep = 0;
let lastBuzz = 0;

function triggerRandomEvent() {
  const events = ['light_flicker', 'blackout', 'audio_screech', 'grass_floor', 'whisper', 'static_burst', 'heavy_breathing'];
  const ev = events[Math.floor(Math.random() * events.length)];
  eventActive = ev;
  switch(ev) {
    case 'light_flicker': eventTimer = 3000; isFlickering = true; setTimeout(() => isFlickering = false, 3000); break;
    case 'blackout': eventTimer = 10000; isBlackout = true; blackoutTimer = 10000; break;
    case 'audio_screech': eventTimer = 1500; playTone(1200 + Math.random() * 800, 0.8, 'sawtooth', 0.15); playTone(600, 1.2, 'square', 0.08); break;
    case 'grass_floor': eventTimer = 1500; break;
    case 'whisper': eventTimer = 3000; playSound(whisperSounds[Math.floor(Math.random() * whisperSounds.length)], 0.6); break;
    case 'static_burst': eventTimer = 1500; playNoise(1.5, 0.12); break;
    case 'heavy_breathing': eventTimer = 4000; playSound(breathingSound, 1.0); break;
  }
}

// ── WebGL Setup ──
const vsSource = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}
`;

const fsSource = `
precision highp float;
varying vec2 v_uv;

uniform vec2 u_resolution;
uniform vec2 u_playerPos;
uniform float u_playerAngle;
uniform float u_playerPitch;
uniform float u_cameraBob;
uniform float u_cameraSway;
uniform float u_time;
uniform sampler2D u_mazeTex;
uniform vec2 u_mazeSize;
uniform float u_cellSize;
uniform float u_blackout;
uniform float u_flicker;
uniform float u_flashlightAngle;
uniform float u_exitX;
uniform float u_exitY;

uniform vec2 u_lights[20];
uniform int u_lightCount;

uniform vec4 u_arrows[30];
uniform int u_arrowCount;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float sampleMaze(vec2 coord) {
  return texture2D(u_mazeTex, (coord + 0.5) / u_mazeSize).r;
}

vec3 wallColor(vec2 cell, float side, float dist) {
  // Yellow wallpaper pattern
  vec2 p = fract(cell);
  float stripe = step(0.5, fract(p.y * 4.0));
  float dirt = noise(cell * 3.0) * 0.15;
  vec3 base = mix(vec3(0.77, 0.64, 0.35), vec3(0.72, 0.58, 0.31), stripe);
  base -= dirt;
  // Darken by distance
  float fog = exp(-dist * 0.003);
  return base * fog;
}

vec3 exitColor(float dist) {
  float fog = exp(-dist * 0.003);
  return vec3(0.8, 0.0, 0.0) * fog;
}

void main() {
  vec2 uv = v_uv;
  float aspect = u_resolution.x / u_resolution.y;

  // VHS chromatic aberration
  float ca = 0.002 + 0.001 * sin(u_time * 2.0);
  vec3 col = vec3(0.0);

  for(int i = 0; i < 3; i++) {
    float offset = (float(i) - 1.0) * ca;
    vec2 uvr = uv + vec2(offset, 0.0);
    vec2 uvg = uv;
    vec2 uvb = uv - vec2(offset, 0.0);

    vec2 screenR = (uvr - 0.5) * vec2(aspect, 1.0);
    vec2 screenG = (uvg - 0.5) * vec2(aspect, 1.0);
    vec2 screenB = (uvb - 0.5) * vec2(aspect, 1.0);

    float pitch = u_playerPitch / u_resolution.y;
    float bob = u_cameraBob / u_resolution.y;
    float sway = u_cameraSway / u_resolution.x;

    screenR.y += pitch + bob;
    screenG.y += pitch + bob;
    screenB.y += pitch + bob;
    screenR.x += sway;
    screenG.x += sway;
    screenB.x += sway;

    float fov = 1.0; // ~60 deg
    float rayAngleR = u_playerAngle + atan(screenR.x, fov);
    float rayAngleG = u_playerAngle + atan(screenG.x, fov);
    float rayAngleB = u_playerAngle + atan(screenB.x, fov);

    vec2 rayDirR = vec2(cos(rayAngleR), sin(rayAngleR));
    vec2 rayDirG = vec2(cos(rayAngleG), sin(rayAngleG));
    vec2 rayDirB = vec2(cos(rayAngleB), sin(rayAngleB));

    // DDA for each channel
    vec3 channel = vec3(0.0);
    float angles[3];
    vec2 dirs[3];
    angles[0] = rayAngleR; angles[1] = rayAngleG; angles[2] = rayAngleB;
    dirs[0] = rayDirR; dirs[1] = rayDirG; dirs[2] = rayDirB;

    vec2 screen = (i == 0) ? screenR : ((i == 1) ? screenG : screenB);
    float rayAngle = angles[i];
    vec2 rayDir = dirs[i];

    vec2 mapPos = floor(u_playerPos / u_cellSize);
    vec2 sideDist;
    vec2 deltaDist = abs(vec2(length(rayDir)) / rayDir);
    vec2 stepDir;
    if (rayDir.x < 0.0) { stepDir.x = -1.0; sideDist.x = (u_playerPos.x / u_cellSize - mapPos.x) * deltaDist.x; }
    else { stepDir.x = 1.0; sideDist.x = (mapPos.x + 1.0 - u_playerPos.x / u_cellSize) * deltaDist.x; }
    if (rayDir.y < 0.0) { stepDir.y = -1.0; sideDist.y = (u_playerPos.y / u_cellSize - mapPos.y) * deltaDist.y; }
    else { stepDir.y = 1.0; sideDist.y = (mapPos.y + 1.0 - u_playerPos.y / u_cellSize) * deltaDist.y; }

    float perpDist = 0.0;
    int side = 0;
    float hitType = 0.0;
    vec2 hitCell = vec2(0.0);
    bool hit = false;

    for (int step = 0; step < 200; step++) {
      if (sideDist.x < sideDist.y) {
        sideDist.x += deltaDist.x;
        mapPos.x += stepDir.x;
        side = 0;
      } else {
        sideDist.y += deltaDist.y;
        mapPos.y += stepDir.y;
        side = 1;
      }
      if (mapPos.x < 0.0 || mapPos.x >= u_mazeSize.x || mapPos.y < 0.0 || mapPos.y >= u_mazeSize.y) break;
      float cell = sampleMaze(mapPos);
      if (cell > 0.5) {
        hit = true;
        hitType = cell;
        hitCell = mapPos;
        if (side == 0) perpDist = (mapPos.x - u_playerPos.x / u_cellSize + (1.0 - stepDir.x) * 0.5) / rayDir.x * u_cellSize;
        else perpDist = (mapPos.y - u_playerPos.y / u_cellSize + (1.0 - stepDir.y) * 0.5) / rayDir.y * u_cellSize;
        perpDist = abs(perpDist);
        break;
      }
    }

    if (!hit) {
      channel = vec3(0.02, 0.02, 0.02);
    } else {
      float wallH = (u_cellSize / perpDist) * 300.0;
      float y1 = (u_resolution.y - wallH) * 0.5 + u_playerPitch + u_cameraBob;
      float py = (1.0 - uv.y) * u_resolution.y;

      if (py < y1) {
        // Ceiling
        float shade = 1.0 - (py / (u_resolution.y * 0.5)) * 0.8;
        channel = vec3(0.1, 0.1, 0.1) * shade;
        // Ceiling lights
        for (int li = 0; li < 20; li++) {
          if (li >= u_lightCount) break;
          vec2 lpos = u_lights[li];
          float dx = lpos.x - u_playerPos.x;
          float dy = lpos.y - u_playerPos.y;
          float dist = sqrt(dx*dx + dy*dy);
          if (dist < 400.0) {
            float langle = atan(dy, dx) - rayAngle;
            float sx = u_resolution.x * 0.5 + tan(langle) * (u_resolution.x * 0.5) / tan(0.5);
            float sy = u_resolution.y * 0.5 - 100.0 + u_playerPitch + u_cameraBob;
            if (abs(py - sy) < 8.0 && abs(screen.x * u_resolution.x - sx) < 16.0) {
              float bright = max(0.0, 1.0 - dist / 400.0) * (1.0 - u_flicker + u_flicker * fract(sin(u_time * 10.0 + float(li)) * 43758.0));
              channel += vec3(1.0, 0.94, 0.78) * bright * 0.5;
            }
          }
        }
      } else if (py > y1 + wallH) {
        // Floor
        float shade = 0.2 + ((py - u_resolution.y * 0.5) / (u_resolution.y * 0.5)) * 0.3;
        channel = vec3(0.1, 0.08, 0.06) * shade;
      } else {
        // Wall
        float wallShade = max(0.1, 1.0 - perpDist / 800.0);
        if (side == 1) wallShade *= 0.6;

        // Flashlight cone
        float rayOffset = abs(rayAngle - u_playerAngle);
        float flashFade = max(0.0, 1.0 - rayOffset / u_flashlightAngle);
        wallShade *= (0.15 + 0.85 * flashFade);

        if (u_blackout > 0.5) wallShade *= 0.05;
        else if (u_flicker > 0.5) wallShade *= (0.3 + 0.7 * fract(sin(u_time * 15.0 + screen.x * 100.0) * 43758.0));

        if (hitType > 1.5) {
          channel = exitColor(perpDist);
        } else {
          channel = wallColor(hitCell, float(side), perpDist);
        }
        channel *= wallShade;

        // Arrow on wall
        if (hitType < 1.5 && u_blackout < 0.5) {
          for (int ai = 0; ai < 30; ai++) {
            if (ai >= u_arrowCount) break;
            vec4 a = u_arrows[ai];
            if (abs(a.x - hitCell.x) < 0.1 && abs(a.y - hitCell.y) < 0.1) {
              float arrowY = y1 + wallH * 0.4;
              float arrowSize = min(14.0, wallH * 0.22);
              if (arrowSize > 2.0 && abs(py - arrowY) < arrowSize && abs(screen.x * u_resolution.x - (u_resolution.x * 0.5 + screen.x * u_resolution.x)) < arrowSize) {
                float ang = a.z;
                float cosA = cos(ang);
                float sinA = sin(ang);
                float lx = (py - arrowY) * cosA + (screen.x * u_resolution.x - u_resolution.x * 0.5) * sinA;
                float ly = -(py - arrowY) * sinA + (screen.x * u_resolution.x - u_resolution.x * 0.5) * cosA;
                if (abs(lx) < arrowSize * 0.5 && abs(ly) < arrowSize * 0.15) {
                  channel = vec3(1.0, 0.31, 0.31) * wallShade * 0.9;
                }
                if (lx > arrowSize * 0.2 && lx < arrowSize * 0.5 && abs(ly) < arrowSize * 0.3 * (1.0 - (lx - arrowSize * 0.2) / (arrowSize * 0.3))) {
                  channel = vec3(1.0, 0.31, 0.31) * wallShade * 0.9;
                }
              }
            }
          }
        }
      }
    }

    if (i == 0) col.r = channel.r;
    else if (i == 1) col.g = channel.g;
    else col.b = channel.b;
  }

  // Scanlines
  float scanline = sin(uv.y * u_resolution.y * 1.5 + u_time * 0.5) * 0.5 + 0.5;
  col *= 0.92 + 0.08 * scanline;

  // Film grain
  float grain = hash(uv * u_resolution + fract(u_time * 100.0));
  col += (grain - 0.5) * 0.04;

  // Vignette
  float vig = 1.0 - length((uv - 0.5) * vec2(1.2, 1.0)) * 0.6;
  col *= max(0.0, vig);

  gl_FragColor = vec4(col, 1.0);
}
`;

function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}

const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error('Program error:', gl.getProgramInfoLog(program));
}
gl.useProgram(program);

// Fullscreen quad
const posBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Maze texture
const mazeTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, mazeTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

function updateMazeTexture() {
  const data = new Uint8Array(MAP_W * MAP_H * 4);
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const i = (y * MAP_W + x) * 4;
      const v = map[y][x];
      data[i] = v === 0 ? 0 : (v === 2 ? 255 : (v === 3 ? 128 : 200));
      data[i+1] = 0;
      data[i+2] = 0;
      data[i+3] = 255;
    }
  }
  gl.bindTexture(gl.TEXTURE_2D, mazeTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, MAP_W, MAP_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
}
updateMazeTexture();

// Uniforms
const uResolution = gl.getUniformLocation(program, 'u_resolution');
const uPlayerPos = gl.getUniformLocation(program, 'u_playerPos');
const uPlayerAngle = gl.getUniformLocation(program, 'u_playerAngle');
const uPlayerPitch = gl.getUniformLocation(program, 'u_playerPitch');
const uCameraBob = gl.getUniformLocation(program, 'u_cameraBob');
const uCameraSway = gl.getUniformLocation(program, 'u_cameraSway');
const uTime = gl.getUniformLocation(program, 'u_time');
const uMazeTex = gl.getUniformLocation(program, 'u_mazeTex');
const uMazeSize = gl.getUniformLocation(program, 'u_mazeSize');
const uCellSize = gl.getUniformLocation(program, 'u_cellSize');
const uBlackout = gl.getUniformLocation(program, 'u_blackout');
const uFlicker = gl.getUniformLocation(program, 'u_flicker');
const uFlashlightAngle = gl.getUniformLocation(program, 'u_flashlightAngle');
const uExitX = gl.getUniformLocation(program, 'u_exitX');
const uExitY = gl.getUniformLocation(program, 'u_exitY');
const uLights = gl.getUniformLocation(program, 'u_lights');
const uLightCount = gl.getUniformLocation(program, 'u_lightCount');
const uArrows = gl.getUniformLocation(program, 'u_arrows');
const uArrowCount = gl.getUniformLocation(program, 'u_arrowCount');

gl.uniform1i(uMazeTex, 0);
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, mazeTex);
gl.uniform2f(uMazeSize, MAP_W, MAP_H);
gl.uniform1f(uCellSize, CELL);
gl.uniform1f(uFlashlightAngle, Math.PI / 5);
gl.uniform1f(uExitX, exitPos.x);
gl.uniform1f(uExitY, exitPos.y);

// Pointer lock
let isPointerLocked = false;
function enterPointerLock() {
  canvas.requestPointerLock();
  initAudio();
}
canvas.addEventListener('click', enterPointerLock);
canvas.addEventListener('mousedown', enterPointerLock);
document.addEventListener('pointerlockchange', () => {
  isPointerLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', e => {
  if (!isPointerLocked) return;
  const dx = Math.max(-50, Math.min(50, e.movementX));
  const dy = Math.max(-50, Math.min(50, e.movementY));
  player.angle += dx * 0.003;
  player.pitch = Math.max(-200, Math.min(200, player.pitch - dy * 1.0));
});

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  initAudio();
  if (gameState === 'won' && (e.key === ' ' || e.key === 'r' || e.key === 'R')) restartGame();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function canMoveTo(x, y) {
  const mx = Math.floor(x / CELL);
  const my = Math.floor(y / CELL);
  if (my < 0 || my >= MAP_H || mx < 0 || mx >= MAP_W) return false;
  return map[my][mx] !== 1;
}

function restartGame() {
  gameState = 'playing';
  mazeData = generateMaze(MAP_W, MAP_H);
  map = mazeData.maze;
  rooms = mazeData.rooms;
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (map[y][x] === 2) { exitPos = { x, y }; break; }
    }
  }
  placeArrows();
  generateLights();
  updateMazeTexture();
  player.x = CELL * 1.5;
  player.y = CELL * 1.5;
  player.angle = 0;
  player.pitch = 0;
  eventCooldown = 0;
  eventActive = null;
  isBlackout = false;
  isFlickering = false;
  wallShiftCooldown = 15000;
  shiftCount = 0;
}

let lastTime = 0;

function update(dt) {
  if (gameState !== 'playing') return;

  let moveX = 0, moveY = 0;
  if (keys['w']) { moveX += Math.cos(player.angle) * player.speed; moveY += Math.sin(player.angle) * player.speed; }
  if (keys['s']) { moveX -= Math.cos(player.angle) * player.speed; moveY -= Math.sin(player.angle) * player.speed; }
  if (keys['a']) { moveX += Math.cos(player.angle - Math.PI/2) * player.speed; moveY += Math.sin(player.angle - Math.PI/2) * player.speed; }
  if (keys['d']) { moveX += Math.cos(player.angle + Math.PI/2) * player.speed; moveY += Math.sin(player.angle + Math.PI/2) * player.speed; }

  if (canMoveTo(player.x + moveX, player.y)) player.x += moveX;
  if (canMoveTo(player.x, player.y + moveY)) player.y += moveY;

  const isMoving = moveX !== 0 || moveY !== 0;
  if (isMoving) {
    walkCycle += 0.15;
    cameraBob = Math.sin(walkCycle) * 8;
    cameraSway = Math.cos(walkCycle * 0.5) * 3;
    if (walkCycle - lastFootstep > Math.PI) {
      lastFootstep = walkCycle;
      playFootstep(1.0);
    }
  } else {
    walkCycle = 0;
    lastFootstep = 0;
    cameraBob *= 0.9;
    cameraSway *= 0.5;
    stopFootsteps();
  }

  // Keep buzz playing
  ensureBuzz();

  let mx = Math.floor(player.x / CELL);
  let my = Math.floor(player.y / CELL);
  if (map[my][mx] === 2) gameState = 'won';

  if (isBlackout) {
    blackoutTimer -= dt;
    if (blackoutTimer <= 0) {
      isBlackout = false;
      eventActive = null;
      if (Math.random() < 0.33) {
        let tx, ty;
        do {
          tx = Math.floor(Math.random() * (MAP_W - 2)) + 1;
          ty = Math.floor(Math.random() * (MAP_H - 2)) + 1;
        } while (map[ty][tx] !== 0);
        player.x = (tx + 0.5) * CELL;
        player.y = (ty + 0.5) * CELL;
      }
    }
  }

  flickerTimer -= dt;
  if (flickerTimer <= 0) {
    isFlickering = Math.random() < 0.1;
    flickerTimer = 200 + Math.random() * 800;
  }

  const distToExit = Math.sqrt((player.x - exitPos.x * CELL)**2 + (player.y - exitPos.y * CELL)**2);
  const maxDist = Math.sqrt((MAP_W * CELL)**2 + (MAP_H * CELL)**2);
  const proximity = 1 - (distToExit / maxDist);
  const eventChance = 0.01 + proximity * 0.09;

  eventCooldown -= dt;
  if (eventCooldown <= 0) {
    eventCooldown = 1000;
    if (!eventActive && Math.random() < eventChance) {
      if (proximity > 0.5 && Math.random() < 0.4) {
        eventActive = 'blackout';
        isBlackout = true;
        blackoutTimer = 10000;
        eventTimer = 10000;
      } else {
        triggerRandomEvent();
      }
    }
  }
  if (eventTimer > 0) {
    eventTimer -= dt;
    if (eventTimer <= 0 && !isBlackout) eventActive = null;
  }

  wallShiftCooldown -= dt;
  const angleDelta = Math.abs(player.angle - lastPlayerAngle);
  lastPlayerAngle = player.angle;
  if (wallShiftCooldown <= 0 && angleDelta > 0.8 && !isBlackout) {
    const px = Math.floor(player.x / CELL);
    const py = Math.floor(player.y / CELL);
    const candidates = [];
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const nx = px + dx, ny = py + dy;
        if (nx > 0 && nx < MAP_W - 1 && ny > 0 && ny < MAP_H - 1) {
          if (map[ny][nx] === 1) {
            const openNeighbors = [[0,1],[0,-1],[1,0],[-1,0]].filter(([odx,ody]) => map[ny+ody][nx+odx] === 0).length;
            if (openNeighbors >= 1) candidates.push({x: nx, y: ny, open: openNeighbors});
          } else if (map[ny][nx] === 0) {
            const wallNeighbors = [[0,1],[0,-1],[1,0],[-1,0]].filter(([odx,ody]) => map[ny+ody][nx+odx] === 1).length;
            if (wallNeighbors >= 2) candidates.push({x: nx, y: ny, open: -1});
          }
        }
      }
    }
    if (candidates.length > 0) {
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      if (pick.open >= 0) map[pick.y][pick.x] = 0;
      else map[pick.y][pick.x] = 1;
      shiftCount++;
      playRumble(1.2, 0.4);
      wallShiftCooldown = 8000 + Math.random() * 12000;
      updateMazeTexture();
    }
  }
}

function draw(time) {
  const dt = time - lastTime;
  lastTime = time;
  update(dt);

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform2f(uPlayerPos, player.x, player.y);
  gl.uniform1f(uPlayerAngle, player.angle);
  gl.uniform1f(uPlayerPitch, player.pitch);
  gl.uniform1f(uCameraBob, cameraBob);
  gl.uniform1f(uCameraSway, cameraSway);
  gl.uniform1f(uTime, time * 0.001);
  gl.uniform1f(uBlackout, isBlackout ? 1.0 : 0.0);
  gl.uniform1f(uFlicker, isFlickering ? 1.0 : 0.0);

  // Lights
  const lightArr = new Float32Array(40);
  for (let i = 0; i < Math.min(lights.length, 20); i++) {
    lightArr[i*2] = lights[i].x;
    lightArr[i*2+1] = lights[i].y;
  }
  gl.uniform2fv(uLights, lightArr);
  gl.uniform1i(uLightCount, Math.min(lights.length, 20));

  // Arrows
  const arrowArr = new Float32Array(120);
  for (let i = 0; i < Math.min(arrows.length, 30); i++) {
    arrowArr[i*4] = arrows[i].x;
    arrowArr[i*4+1] = arrows[i].y;
    arrowArr[i*4+2] = arrows[i].angle;
    arrowArr[i*4+3] = arrows[i].side === 'x' ? 1.0 : 0.0;
  }
  gl.uniform4fv(uArrows, arrowArr);
  gl.uniform1i(uArrowCount, Math.min(arrows.length, 30));

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (gameState === 'won') {
    // Overlay win text
    // Since we're in WebGL, we'd need another pass or canvas overlay
    // For simplicity, just alert or keep it shader-only
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
