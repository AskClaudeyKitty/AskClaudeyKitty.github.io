<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scary Maze</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    image-rendering: pixelated;
    height: 100vh;
    width: auto;
    aspect-ratio: 4 / 3;
  }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #0f0;
    font-family: monospace;
    font-size: 14px;
    pointer-events: none;
    opacity: 0.7;
    text-shadow: 0 0 4px #0f0;
  }
  #event-text {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #c00;
    font-family: monospace;
    font-size: 18px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    text-shadow: 0 0 8px #c00;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">WASD to move, Mouse to look | Find the red exit</div>
<div id="event-text"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = Math.floor(window.innerHeight * 4 / 3);
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const W = canvas.width, H = canvas.height;

// ── Procedural Maze + Big Rooms ──
function generateMaze(width, height) {
  const maze = Array.from({length: height}, () => Array(width).fill(1));

  function carve(x, y) {
    maze[y][x] = 0;
    const dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(() => Math.random() - 0.5);
    for (const [dx, dy] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx > 0 && nx < width - 1 && ny > 0 && ny < height - 1 && maze[ny][nx] === 1) {
        maze[y + dy/2][x + dx/2] = 0;
        carve(nx, ny);
      }
    }
  }

  carve(1, 1);
  maze[1][1] = 0;

  // Carve big rooms (3x3 to 5x5)
  const numRooms = 4 + Math.floor(Math.random() * 4);
  const rooms = [];
  for (let r = 0; r < numRooms; r++) {
    const rw = 3 + Math.floor(Math.random() * 3);
    const rh = 3 + Math.floor(Math.random() * 3);
    const rx = 2 + Math.floor(Math.random() * (width - rw - 4));
    const ry = 2 + Math.floor(Math.random() * (height - rh - 4));
    rooms.push({x: rx, y: ry, w: rw, h: rh});
    for (let y = ry; y < ry + rh; y++) {
      for (let x = rx; x < rx + rw; x++) {
        maze[y][x] = 0;
      }
    }
  }

  // Place exit far from start
  let exitX = width - 2, exitY = height - 2;
  while (maze[exitY][exitX] === 1) {
    exitX--;
    if (exitX < 2) { exitX = width - 2; exitY--; }
  }
  maze[exitY][exitX] = 2;

  // Add loops
  for (let i = 0; i < (width * height) * 0.03; i++) {
    const rx = Math.floor(Math.random() * (width - 2)) + 1;
    const ry = Math.floor(Math.random() * (height - 2)) + 1;
    if (maze[ry][rx] === 1) {
      const neighbors = [[0,1],[0,-1],[1,0],[-1,0]].filter(([dx,dy]) => maze[ry+dy][rx+dx] === 0);
      if (neighbors.length >= 2) maze[ry][rx] = 0;
    }
  }

  return { maze, rooms };
}

const MAP_W = 45, MAP_H = 35;
const CELL = 64;
let mazeData = generateMaze(MAP_W, MAP_H);
let map = mazeData.maze;
let rooms = mazeData.rooms;

// Find exit position
let exitPos = { x: 0, y: 0 };
for (let y = 0; y < MAP_H; y++) {
  for (let x = 0; x < MAP_W; x++) {
    if (map[y][x] === 2) { exitPos = { x, y }; break; }
  }
}

// Place arrows on walls pointing to exit
let arrows = [];
function placeArrows() {
  arrows = [];
  for (let y = 1; y < MAP_H - 1; y++) {
    for (let x = 1; x < MAP_W - 1; x++) {
      if (map[y][x] === 1 && Math.random() < 0.08) {
        // Check if adjacent to floor
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H && map[ny][nx] === 0) {
            // Arrow lies flat on wall surface, pointing along the wall toward the exit
            const side = dx !== 0 ? 'x' : 'y';
            let angle;
            if (side === 'x') {
              // Vertical wall — arrow points up/down along wall
              angle = exitPos.y > y ? Math.PI / 2 : -Math.PI / 2;
            } else {
              // Horizontal wall — arrow points left/right along wall
              angle = exitPos.x > x ? 0 : Math.PI;
            }
            arrows.push({ x: x * CELL, y: y * CELL, angle, side });
            break;
          }
        }
      }
    }
  }
}
placeArrows();

// Player
const player = { x: CELL * 1.5, y: CELL * 1.5, angle: 0, pitch: 0, speed: 2.5, rotSpeed: 0.04 };
const keys = {};
const mouse = { x: 0, y: 0 };
let gameState = 'playing';
let walkCycle = 0;
let cameraBob = 0;
let cameraSway = 0;

// Raycasting constants
const FOV = Math.PI / 3.5;
const HALF_FOV = FOV / 2;
const NUM_RAYS = W;
const MAX_DEPTH = 1200;

// Colors - yellow wallpaper walls
const CEIL = '#1a1a1a';
const FLOOR = '#2a2520';
const WALL_COLORS = ['#c4a35a', '#b8944f', '#a88445'];
const WALL_STRIPE = '#8a7038';
const EXIT_COLOR = '#c00';

// Ceiling lights
let lights = [];
function generateLights() {
  lights = [];
  for (let y = 2; y < MAP_H - 2; y += 3) {
    for (let x = 2; x < MAP_W - 2; x += 4) {
      if (map[y][x] === 0) {
        lights.push({ x: (x + 0.5) * CELL, y: (y + 0.5) * CELL, on: true });
      }
    }
  }
}
generateLights();

// VHS / Horror state
let vhsOffset = 0;
let scanlineOffset = 0;
let flickerTimer = 0;
let isFlickering = false;
let blackoutTimer = 0;
let isBlackout = false;

// Wall shift state
let wallShiftTimer = 0;
let wallShiftCooldown = 15000; // first shift after 15s
let lastPlayerAngle = 0;
let shiftCount = 0;

// Random Events
let eventCooldown = 0;
let eventActive = null;
let eventTimer = 0;
const eventText = document.getElementById('event-text');

// Audio
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// Preload sound effects
const whisperSounds = [
  new Audio('dragon-studio-creepy-ghost-whisper-410564.mp3'),
  new Audio('dragon-studio-creepy-whisper-472369.mp3'),
  new Audio('dragon-studio-ghost-whisper-351569.mp3')
];
const breathingSound = new Audio('freesound_community-heavy-breathing-14431.mp3');

function playSound(audio, vol = 1.0) {
  if (audio.readyState < 2) return; // not loaded enough
  audio.volume = vol;
  try { audio.currentTime = 0; } catch (e) {}
  audio.play().catch(() => {});
}

function playRumble(duration, vol = 0.3) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(40, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
  // Layer noise for texture
  playNoise(duration, vol * 0.5);
}

function playTone(freq, duration, type='sine', vol=0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol=0.08) {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  noise.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

function showEventText(text) {
  eventText.textContent = text;
  eventText.style.opacity = '1';
  setTimeout(() => eventText.style.opacity = '0', 2000);
}

function triggerRandomEvent() {
  const events = ['light_flicker', 'blackout', 'audio_screech', 'grass_floor', 'whisper', 'static_burst', 'heavy_breathing'];
  const ev = events[Math.floor(Math.random() * events.length)];
  eventActive = ev;

  switch(ev) {
    case 'light_flicker':
      eventTimer = 3000;
      isFlickering = true;
      setTimeout(() => isFlickering = false, 3000);
      break;
    case 'blackout':
      eventTimer = 10000;
      isBlackout = true;
      blackoutTimer = 10000;
      break;
    case 'audio_screech':
      eventTimer = 1500;
      playTone(1200 + Math.random() * 800, 0.8, 'sawtooth', 0.15);
      playTone(600, 1.2, 'square', 0.08);
      break;
    case 'grass_floor':
      eventTimer = 1500;
      break;
    case 'whisper':
      eventTimer = 3000;
      const w = whisperSounds[Math.floor(Math.random() * whisperSounds.length)];
      playSound(w, 0.6);
      break;
    case 'static_burst':
      eventTimer = 1500;
      playNoise(1.5, 0.12);
      break;
    case 'heavy_breathing':
      eventTimer = 4000;
      playSound(breathingSound, 1.5);
      break;
  }
}

let lastTime = 0;

function castRay(rayAngle) {
  let sin = Math.sin(rayAngle);
  let cos = Math.cos(rayAngle);
  let x = player.x;
  let y = player.y;
  let dx = cos * 2;
  let dy = sin * 2;
  let depth = 0;
  let hit = 0;
  let side = 0;
  let mx = 0, my = 0;

  while (depth < MAX_DEPTH) {
    x += dx;
    y += dy;
    depth += 2;

    mx = Math.floor(x / CELL);
    my = Math.floor(y / CELL);
    if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H) break;
    if (map[my][mx] > 0) {
      hit = map[my][mx];
      side = Math.abs(dx) > Math.abs(dy) ? 0 : 1;
      break;
    }
  }

  let perpDist = depth * Math.cos(rayAngle - player.angle);
  return { dist: perpDist, hit, side, depth, mx, my };
}

function restartGame() {
  gameState = 'playing';
  mazeData = generateMaze(MAP_W, MAP_H);
  map = mazeData.maze;
  rooms = mazeData.rooms;
  // Find exit
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (map[y][x] === 2) { exitPos = { x, y }; break; }
    }
  }
  placeArrows();
  generateLights();
  player.x = CELL * 1.5;
  player.y = CELL * 1.5;
  player.angle = 0;
  eventCooldown = 0;
  eventActive = null;
}

function canMoveTo(x, y) {
  const mx = Math.floor(x / CELL);
  const my = Math.floor(y / CELL);
  if (my < 0 || my >= MAP_H || mx < 0 || mx >= MAP_W) return false;
  return map[my][mx] !== 1;
}

// Input
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  initAudio();
  if (gameState === 'won' && (e.key === ' ' || e.key === 'r' || e.key === 'R')) {
    restartGame();
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

// Also capture on canvas for pointer lock
function handleKeyDown(e) {
  keys[e.key.toLowerCase()] = true;
}
function handleKeyUp(e) {
  keys[e.key.toLowerCase()] = false;
}
canvas.addEventListener('keydown', handleKeyDown);
canvas.addEventListener('keyup', handleKeyUp);

// Pointer lock for camera
let isPointerLocked = false;
canvas.setAttribute('tabindex', '0');
function enterPointerLock() {
  canvas.requestPointerLock().catch(() => {});
  canvas.focus();
}
canvas.addEventListener('click', enterPointerLock);
canvas.addEventListener('mousedown', enterPointerLock);
document.addEventListener('pointerlockchange', () => {
  isPointerLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', e => {
  if (!isPointerLocked) return;
  // Ignore huge deltas that happen on pointer lock entry
  const dx = Math.max(-50, Math.min(50, e.movementX));
  const dy = Math.max(-50, Math.min(50, e.movementY));
  player.angle += dx * 0.002;
  player.pitch = Math.max(-200, Math.min(200, player.pitch - dy * 0.3));
});

function update(dt) {
  if (gameState !== 'playing') return;

  // Movement with furniture collision
  let moveX = 0, moveY = 0;
  if (keys['w']) { moveX += Math.cos(player.angle) * player.speed; moveY += Math.sin(player.angle) * player.speed; }
  if (keys['s']) { moveX -= Math.cos(player.angle) * player.speed; moveY -= Math.sin(player.angle) * player.speed; }
  if (keys['a']) { moveX += Math.cos(player.angle - Math.PI/2) * player.speed; moveY += Math.sin(player.angle - Math.PI/2) * player.speed; }
  if (keys['d']) { moveX += Math.cos(player.angle + Math.PI/2) * player.speed; moveY += Math.sin(player.angle + Math.PI/2) * player.speed; }

  if (canMoveTo(player.x + moveX, player.y)) player.x += moveX;
  if (canMoveTo(player.x, player.y + moveY)) player.y += moveY;

  // Camera bob / sway based on movement
  const isMoving = moveX !== 0 || moveY !== 0;
  if (isMoving) {
    walkCycle += 0.15;
    cameraBob = Math.sin(walkCycle) * 8;
    cameraSway = Math.cos(walkCycle * 0.5) * 3;
  } else {
    walkCycle = 0;
    cameraBob *= 0.9;
    cameraSway *= 0.7;
  }

  // Check exit
  let mx = Math.floor(player.x / CELL);
  let my = Math.floor(player.y / CELL);
  if (map[my][mx] === 2) {
    gameState = 'won';
  }

  // Blackout
  if (isBlackout) {
    blackoutTimer -= dt;
    if (blackoutTimer <= 0) {
      isBlackout = false;
      eventActive = null;
      // 33% chance to teleport player to random floor location
      if (Math.random() < 0.33) {
        let tx, ty;
        do {
          tx = Math.floor(Math.random() * (MAP_W - 2)) + 1;
          ty = Math.floor(Math.random() * (MAP_H - 2)) + 1;
        } while (map[ty][tx] !== 0);
        player.x = (tx + 0.5) * CELL;
        player.y = (ty + 0.5) * CELL;
      }
    }
  }

  // VHS
  vhsOffset = (vhsOffset + 0.5) % H;
  scanlineOffset = (scanlineOffset + 0.3) % 4;

  flickerTimer -= dt;
  if (flickerTimer <= 0) {
    isFlickering = Math.random() < 0.1;
    flickerTimer = 200 + Math.random() * 800;
  }

  // Events - chance increases as you get closer to exit
  const distToExit = Math.sqrt((player.x - exitPos.x * CELL)**2 + (player.y - exitPos.y * CELL)**2);
  const maxDist = Math.sqrt((MAP_W * CELL)**2 + (MAP_H * CELL)**2);
  const proximity = 1 - (distToExit / maxDist); // 0 = far, 1 = close
  const eventChance = 0.01 + proximity * 0.09; // 1/100 to 1/10

  eventCooldown -= dt;
  if (eventCooldown <= 0) {
    eventCooldown = 1000;
    if (!eventActive && Math.random() < eventChance) {
      // Blackout more likely when closer
      if (proximity > 0.5 && Math.random() < 0.4) {
        eventActive = 'blackout';
        isBlackout = true;
        blackoutTimer = 10000;
        eventTimer = 10000;
      } else {
        triggerRandomEvent();
      }
    }
  }
  if (eventTimer > 0) {
    eventTimer -= dt;
    if (eventTimer <= 0 && !isBlackout) eventActive = null;
  }

  // Wall shifts — impossible geometry when you look away
  wallShiftCooldown -= dt;
  const angleDelta = Math.abs(player.angle - lastPlayerAngle);
  lastPlayerAngle = player.angle;
  if (wallShiftCooldown <= 0 && angleDelta > 0.8 && !isBlackout) {
    // Player looked away significantly — shift a nearby wall
    const px = Math.floor(player.x / CELL);
    const py = Math.floor(player.y / CELL);
    const candidates = [];
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const nx = px + dx, ny = py + dy;
        if (nx > 0 && nx < MAP_W - 1 && ny > 0 && ny < MAP_H - 1) {
          if (map[ny][nx] === 1) {
            // Check if it would create a valid path (not fully enclosed)
            const openNeighbors = [[0,1],[0,-1],[1,0],[-1,0]].filter(([odx,ody]) => map[ny+ody][nx+odx] === 0).length;
            if (openNeighbors >= 1) candidates.push({x: nx, y: ny, open: openNeighbors});
          } else if (map[ny][nx] === 0) {
            // Check if closing it would trap anything
            const wallNeighbors = [[0,1],[0,-1],[1,0],[-1,0]].filter(([odx,ody]) => map[ny+ody][nx+odx] === 1).length;
            if (wallNeighbors >= 2) candidates.push({x: nx, y: ny, open: -1});
          }
        }
      }
    }
    if (candidates.length > 0) {
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      if (pick.open >= 0) {
        map[pick.y][pick.x] = 0; // Open a wall
      } else {
        map[pick.y][pick.x] = 1; // Close a path
      }
      shiftCount++;
      // Rumble noise
      playRumble(1.2, 0.4);
      wallShiftCooldown = 8000 + Math.random() * 12000; // 8-20s until next
    }
  }
}

function draw() {
  const now = Date.now();
  const dt = now - lastTime;
  lastTime = now;
  update(dt);

  // Reset arrow draw flags
  for (const arrow of arrows) arrow.drawnThisFrame = false;

  // Flashlight darkness - only render what's in cone
  const flashlightAngle = Math.PI / 5;

  // Ceiling with lights
  for (let y = 0; y < H/2; y++) {
    const shade = 1 - (y / (H/2)) * 0.8;
    ctx.fillStyle = `rgb(${26*shade},${26*shade},${26*shade})`;
    ctx.fillRect(0, y, W, 1);
  }

  // Draw ceiling lights
  if (!isBlackout) {
    for (const light of lights) {
      const dx = light.x - player.x;
      const dy = light.y - player.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 400) {
        const angle = Math.atan2(dy, dx) - player.angle;
        const screenX = W/2 + Math.tan(angle) * (W/2) / Math.tan(FOV/2);
        const screenY = H/2 - 100 + player.pitch + cameraBob;
        if (screenX > 0 && screenX < W) {
          const brightness = Math.max(0, 1 - dist/400) * (isFlickering ? Math.random() : 1);
          ctx.fillStyle = `rgba(255,240,200,${brightness * 0.8})`;
          ctx.fillRect(screenX - 8, screenY - 4, 16, 8);
          ctx.fillStyle = `rgba(255,255,220,${brightness})`;
          ctx.fillRect(screenX - 4, screenY - 2, 8, 4);
        }
      }
    }
  }

  // Floor - grass effect during event
  const isGrass = eventActive === 'grass_floor';
  for (let y = H/2; y < H; y++) {
    const shade = 0.2 + ((y - H/2) / (H/2)) * 0.3;
    if (isGrass) {
      const g = Math.floor(40 * shade);
      ctx.fillStyle = `rgb(${10*shade},${g},${10*shade})`;
    } else {
      ctx.fillStyle = `rgb(${26*shade},${26*shade},${26*shade})`;
    }
    ctx.fillRect(0, y, W, 1);
  }

  // Cast rays
  for (let i = 0; i < NUM_RAYS; i++) {
    let rayAngle = player.angle - HALF_FOV + (i / NUM_RAYS) * FOV;
    let ray = castRay(rayAngle);

    if (ray.hit) {
      let wallH = (CELL / ray.dist) * 277;
      wallH = Math.min(wallH, H);
      let y1 = (H - wallH) / 2 + player.pitch + cameraBob + cameraSway;
      let shade = Math.max(0.1, 1 - ray.dist / 800);
      if (ray.side) shade *= 0.6;

      const rayOffset = Math.abs(rayAngle - player.angle);
      const flashFade = Math.max(0, 1 - rayOffset / flashlightAngle);
      shade *= (0.15 + 0.85 * flashFade);

      if (isBlackout) shade *= 0.05;
      else if (isFlickering) shade *= (0.3 + Math.random() * 0.7);

      if (ray.hit === 2) {
        ctx.fillStyle = EXIT_COLOR;
      } else {
        let c = WALL_COLORS[ray.hit - 1] || WALL_COLORS[0];
        const r = parseInt(c.slice(1,3), 16) * shade;
        const g = parseInt(c.slice(3,5), 16) * shade;
        const b = parseInt(c.slice(5,7), 16) * shade;
        ctx.fillStyle = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
      }
      ctx.globalAlpha = shade;
      ctx.fillRect(i, y1, 1, wallH);
      ctx.globalAlpha = 1;

      // Roof line
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(i, y1 - 1, 1, 1);

      // Arrow on wall pointing to exit
      if (ray.hit === 1 && !isBlackout) {
        for (const arrow of arrows) {
          if (Math.floor(arrow.x / CELL) === ray.mx && Math.floor(arrow.y / CELL) === ray.my) {
            const arrowY = y1 + wallH * 0.4;
            const arrowSize = Math.min(14, wallH * 0.22);
            if (arrowSize > 2 && !arrow.drawnThisFrame) {
              arrow.drawnThisFrame = true;
              const arrowX = i;
              const a = arrow.angle;
              const cosA = Math.cos(a);
              const sinA = Math.sin(a);
              // Shaft
              const sx = arrowX - cosA * arrowSize * 0.5;
              const sy = arrowY - sinA * arrowSize * 0.5;
              const ex = arrowX + cosA * arrowSize * 0.5;
              const ey = arrowY + sinA * arrowSize * 0.5;
              // Arrowhead
              const hx = arrowX + cosA * arrowSize * 0.5;
              const hy = arrowY + sinA * arrowSize * 0.5;
              const hw = arrowSize * 0.5;
              ctx.lineWidth = Math.max(2, arrowSize * 0.2);
              ctx.strokeStyle = `rgba(255,80,80,${shade * 0.9})`;
              ctx.fillStyle = `rgba(255,80,80,${shade * 0.9})`;
              ctx.beginPath();
              ctx.moveTo(sx, sy);
              ctx.lineTo(ex, ey);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(hx, hy);
              ctx.lineTo(hx - cosA * hw - sinA * hw * 0.6, hy - sinA * hw + cosA * hw * 0.6);
              ctx.lineTo(hx - cosA * hw + sinA * hw * 0.6, hy - sinA * hw - cosA * hw * 0.6);
              ctx.closePath();
              ctx.fill();
            }
            break;
          }
        }
      }
    }
  }

  // VHS Effects
  drawVHSEffect();

  if (gameState === 'won') drawWin();

  requestAnimationFrame(draw);
}

function drawVHSEffect() {
  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y + scanlineOffset, W, 1);
  }

  // Tracking lines (horizontal bands)
  if (Math.random() < 0.015) {
    const lineY = Math.floor(Math.random() * H);
    const lineH = 2 + Math.floor(Math.random() * 6);
    ctx.fillStyle = `rgba(255,255,255,${0.05 + Math.random() * 0.1})`;
    ctx.fillRect(0, lineY, W, lineH);
  }

  // Occasional chromatic shift line
  if (Math.random() < 0.01) {
    const shiftY = Math.floor(Math.random() * H);
    ctx.fillStyle = 'rgba(255,0,0,0.08)';
    ctx.fillRect(0, shiftY, W, 1);
    ctx.fillStyle = 'rgba(0,255,0,0.08)';
    ctx.fillRect(2, shiftY + 1, W, 1);
  }

  // Vignette
  const grad = ctx.createRadialGradient(W/2, H/2, H/3, W/2, H/2, H/1.2);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Static burst overlay
  if (eventActive === 'static_burst') {
    ctx.fillStyle = `rgba(200,200,200,${0.08 + Math.random() * 0.1})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawWin() {
  ctx.fillStyle = 'rgba(0,0,0,0.9)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#c00';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('ESCAPED', W / 2, H / 2 - 30);
  ctx.fillStyle = '#666';
  ctx.font = '18px monospace';
  ctx.fillText('Press SPACE or R to restart', W / 2, H / 2 + 20);
  ctx.textAlign = 'left';
}

requestAnimationFrame(draw);
</script>
</body>
