<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block World v3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' fill='%23aa7a3a'/%3E%3Crect x='2' y='2' width='12' height='4' fill='%234a8a3a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Press Start 2P', monospace; overflow: hidden; }
  #game-container { position: relative; image-rendering: pixelated; }
  canvas { border: 4px solid #333; cursor: crosshair; image-rendering: pixelated; background: #87ceeb; }
  #ui { position: absolute; top: 8px; left: 8px; color: #fff; font-size: 10px; text-shadow: 2px 2px 0 #000; pointer-events: none; }
  #hp-bar { width: 160px; height: 16px; background: #222; border: 2px solid #555; margin-bottom: 6px; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #ff4444, #aa0000); transition: width 0.2s; }
  #mana-bar { width: 160px; height: 8px; background: #222; border: 2px solid #555; margin-bottom: 6px; position: relative; }
  #mana-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #4488ff, #2244aa); transition: width 0.2s; }
  #stats { font-size: 8px; color: #ccc; }
  #hotbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(8, 40px); gap: 3px; pointer-events: auto; }
  .slot { width: 40px; height: 40px; background: rgba(0,0,0,0.7); border: 2px solid #777; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; position: relative; cursor: pointer; image-rendering: pixelated; }
  .slot.active { border-color: #ffff44; background: rgba(255,255,0,0.2); }
  .slot .count { position: absolute; bottom: 2px; right: 4px; font-size: 8px; color: #fff; text-shadow: 1px 1px 0 #000; }
  #inventory { position: absolute; top: 8px; right: 8px; background: rgba(15,15,25,0.95); border: 3px solid #555; width: 360px; display: none; flex-direction: column; max-height: 560px; }
  #inv-header { background: #2a2a3a; padding: 8px 10px; font-size: 10px; color: #ffff44; border-bottom: 2px solid #444; display: flex; justify-content: space-between; align-items: center; }
  #inv-close { cursor: pointer; color: #ff4444; font-size: 12px; }
  #inv-content { display: flex; flex-direction: column; padding: 8px; gap: 4px; overflow-y: auto; }
  #inv-crafting h4 { color: #ffff44; font-size: 9px; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 3px; }
  .recipe { padding: 5px 6px; cursor: pointer; font-size: 8px; border-radius: 2px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
  .recipe.can { background: rgba(40,80,40,0.6); border: 1px solid #4a8a2a; color: #8aff8a; }
  .recipe.can:hover { background: rgba(60,120,60,0.7); }
  .recipe.cant { background: rgba(30,30,30,0.5); border: 1px solid #444; color: #666; }
  .recipe.cant:hover { background: rgba(40,40,40,0.6); color: #888; }
  .recipe .out-swatch { width: 14px; height: 14px; margin-right: 6px; border: 1px solid #000; image-rendering: pixelated; }
  .recipe-ing { font-size: 7px; color: #999; margin-top: 2px; }
  #msg { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); color: #ffff44; font-size: 10px; text-shadow: 2px 2px 0 #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  #minimap { position: absolute; top: 8px; right: 8px; width: 180px; height: 120px; border: 2px solid #555; background: rgba(0,0,0,0.7); image-rendering: pixelated; }
  #biome-label { position: absolute; top: 16px; right: 200px; color: #ffff44; font-size: 9px; text-shadow: 2px 2px 0 #000; }
  #armor-panel { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 4px; pointer-events: auto; }
  .armor-slot { width: 36px; height: 36px; background: rgba(0,0,0,0.7); border: 2px solid #777; display: flex; align-items: center; justify-content: center; cursor: pointer; image-rendering: pixelated; }
  .armor-slot.active { border-color: #ffff44; }
  #boss-bar { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 4px; }
  #boss-name { color: #ff4444; font-size: 10px; text-shadow: 2px 2px 0 #000; }
  #boss-hp-bg { width: 360px; height: 12px; background: #222; border: 2px solid #ff4444; }
  #boss-hp-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #ff2222, #aa0000); transition: width 0.1s; }
  #title-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #0a0a2e, #1a0a3e); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
  #title-screen h1 { color: #ffff44; font-size: 28px; text-shadow: 4px 4px 0 #8844aa; margin-bottom: 30px; }
  .menu-btn { background: #2a2a4a; border: 3px solid #555; color: #fff; padding: 10px 20px; margin: 6px; font-size: 10px; cursor: pointer; font-family: 'Press Start 2P', monospace; }
  .menu-btn:hover { border-color: #ffff44; color: #ffff44; }
  .menu-btn.active { border-color: #4a8a2a; color: #4a8a2a; }
  #world-list { margin: 12px 0; max-height: 180px; overflow-y: auto; }
  .world-slot { background: rgba(0,0,0,0.5); border: 2px solid #444; padding: 8px 12px; margin: 4px; width: 280px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .world-slot:hover { border-color: #ffff44; }
  .world-slot.selected { border-color: #4a8a2a; }
  .menu-row { display: flex; gap: 8px; margin: 8px 0; }
  #multiplayer-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #0a0a2e, #1a0a3e); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 25; }
  #multiplayer-menu h2 { color: #ffff44; font-size: 20px; text-shadow: 3px 3px 0 #8844aa; margin-bottom: 16px; }
  #room-list { margin: 8px 0; max-height: 160px; overflow-y: auto; width: 300px; }
  .room-slot { background: rgba(0,0,0,0.5); border: 2px solid #444; padding: 6px 10px; margin: 3px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .room-slot:hover { border-color: #ffff44; }
  .room-code { font-size: 10px; color: #ffff44; }
  #mp-input { background: #1a1a2e; border: 2px solid #555; color: #fff; padding: 8px; font-family: 'Press Start 2P', monospace; font-size: 10px; width: 140px; text-align: center; text-transform: uppercase; }
  #mp-status { font-size: 8px; color: #888; margin-top: 8px; min-height: 14px; }
  .furnace-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(15,15,15,0.98); border: 3px solid #aa6a3a; padding: 12px; display: none; flex-direction: column; gap: 8px; font-family: 'Press Start 2P', monospace; z-index: 10; min-width: 320px; }
  .furnace-title { color: #ff8844; font-size: 10px; }
  .furnace-slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .fs { width: 50px; height: 50px; background: rgba(0,0,0,0.6); border: 2px solid #555; display: flex; align-items: center; justify-content: center; cursor: pointer; image-rendering: pixelated; }
  .furnace-progress { width: 100%; height: 8px; background: #222; border: 1px solid #555; }
  .furnace-progress-fill { height: 100%; width: 0%; background: #ff5a1f; transition: width 0.2s; }
</style>
</head>
<body>
<div id="game-container">
  <div id="title-screen">
    <h1>BLOCK WORLD v3</h1>
    <div id="world-list"></div>
    <div class="menu-row">
      <button class="menu-btn" id="btn-new">New World</button>
      <button class="menu-btn" id="btn-load">Play</button>
      <button class="menu-btn" id="btn-delete">Delete</button>
      <button class="menu-btn" id="btn-multiplayer">Multiplayer</button>
    </div>
    <div class="menu-row">
      <input id="seed-input" class="menu-btn" style="width:160px;font-size:8px;text-align:center;" placeholder="Seed (optional)" maxlength="12">
      <button class="menu-btn" id="btn-seed" style="font-size:8px;">Use Seed</button>
    </div>
    <div class="menu-row">
      <button class="menu-btn mode-btn" data-mode="survival">Survival</button>
      <button class="menu-btn mode-btn" data-mode="creative">Creative</button>
      <button class="menu-btn mode-btn" data-mode="coop">Co-op</button>
    </div>
    <div class="menu-row">
      <button class="menu-btn diff-btn" data-diff="easy">Easy</button>
      <button class="menu-btn diff-btn active" data-diff="normal">Normal</button>
      <button class="menu-btn diff-btn" data-diff="hard">Hard</button>
    </div>
  </div>
  <div id="multiplayer-menu">
    <h2>MULTIPLAYER</h2>
    <div id="room-list"></div>
    <div class="menu-row">
      <button class="menu-btn" id="btn-host">Host Room</button>
      <input id="mp-input" placeholder="CODE">
      <button class="menu-btn" id="btn-join">Join</button>
    </div>
    <button class="menu-btn" id="btn-mp-back">Back</button>
    <div id="mp-status"></div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="mana-bar"><div id="mana-fill"></div></div>
    <div id="stats">HP/Mana shown above</div>
  </div>
  <div id="hotbar"></div>
  <div id="inventory">
    <div id="inv-header"><span>Inventory & Crafting</span><span id="inv-close">X</span></div>
    <div id="inv-content">
      <div id="inv-crafting"><h4>Recipes</h4><div id="recipes"></div></div>
    </div>
  </div>
  <canvas id="minimap" width="180" height="120"></canvas>
  <div id="biome-label"></div>
  <div id="armor-panel">
    <div class="armor-slot" data-slot="head" title="Helmet">H</div>
    <div class="armor-slot" data-slot="chest" title="Chestplate">C</div>
    <div class="armor-slot" data-slot="legs" title="Leggings">L</div>
    <div class="armor-slot" data-slot="boots" title="Boots">B</div>
  </div>
  <div id="boss-bar">
    <div id="boss-name">Eye of Cthulhu</div>
    <div id="boss-hp-bg"><div id="boss-hp-fill"></div></div>
  </div>
  <div class="furnace-ui" id="furnace-ui">
    <div class="furnace-title">FURNACE <span id="furnace-close" style="float:right;cursor:pointer;color:#ff4444">X</span></div>
    <div class="furnace-slots">
      <div><div style="font-size:7px;color:#888;margin-bottom:2px">Input</div><div class="fs" id="fu-in"></div></div>
      <div><div style="font-size:7px;color:#888;margin-bottom:2px">Fuel</div><div class="fs" id="fu-fuel"></div></div>
      <div><div style="font-size:7px;color:#888;margin-bottom:2px">Output</div><div class="fs" id="fu-out"></div></div>
    </div>
    <div class="furnace-progress"><div class="furnace-progress-fill" id="fu-prog"></div></div>
  </div>
  <div id="msg"></div>
</div>
<script>
// =============================================================
// BLOCK WORLD v3 — pixel art, biomes, enemies, items, crafting
// =============================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width = 960;
const H = canvas.height = 600;
ctx.imageSmoothingEnabled = false;

// world (2x bigger than v2)
const TILE = 16;
const WORLD_W = 800, WORLD_H = 200, GROUND = 90;
const world = []; // world[y][x] = tile id

// tile ids
const T = {
  AIR: 0, DIRT: 1, GRASS: 2, STONE: 3, SAND: 4, SNOW: 5, ICE: 6,
  WATER: 7, LAVA: 8, WOOD: 9, LEAF: 10, SANDSTONE: 11, CACTUS: 12,
  SNOWY_GRASS: 13, JUNGLE_GRASS: 14, MUSHROOM: 15, MUD: 16,
  COAL: 17, IRON: 18, GOLD: 19, DIAMOND: 20, RUBY: 21, EMERALD: 22,
  COBBLE: 23, PLANKS: 24, GLASS: 25, BRICK: 26, CLOUD: 27,
  LAVA_ROCK: 28, MOSSY_STONE: 29, JUNGLE_WOOD: 30, BAMBOO: 31,
  SANDSTONE_RED: 32, PACKED_ICE: 33, ASH: 34, MARBLE: 35,
  PUMICE: 36, CORAL: 37, KELP: 38, JELLY: 39,
  TORCH: 40, WORKBENCH: 41, FURNACE: 42, CHEST: 43, DOOR: 44, LADDER: 45,
  BEDROCK: 99,
};

// item ids
const I = {
  NONE:0,
  // blocks
  DIRT:1, GRASS:2, STONE:3, SAND:4, SNOW:5, ICE:6, WATER_B:7, LAVA_B:8,
  WOOD:9, LEAF:10, SANDSTONE:11, CACTUS:12, SNOWY_GRASS:13, JUNGLE_GRASS:14,
  MUSHROOM:15, MUD:16, COBBLE:23, PLANKS:24, GLASS:25, BRICK:26, CLOUD:27,
  LAVA_ROCK:28, MOSSY_STONE:29, JUNGLE_WOOD:30, BAMBOO:31, SANDSTONE_RED:32,
  PACKED_ICE:33, ASH:34, MARBLE:35, PUMICE:36, CORAL:37, KELP:38, JELLY:39,
  TORCH:40, WORKBENCH:41, FURNACE:42, CHEST:43, DOOR:44, LADDER:45,
  // ores
  COAL:50, IRON:51, GOLD:52, DIAMOND:53, RUBY:54, EMERALD:55,
  // weapons
  WOOD_SWORD:100, STONE_SWORD:101, IRON_SWORD:102, GOLD_SWORD:103, DIAMOND_SWORD:104, RUBY_SWORD:105,
  WOOD_BOW:110, IRON_BOW:111, DIAMOND_BOW:112,
  ARROW:120, FLAME_ARROW:121,
  // tools
  WOOD_PICK:130, STONE_PICK:131, IRON_PICK:132, GOLD_PICK:133, DIAMOND_PICK:134, RUBY_PICK:135,
  WOOD_AXE:140, STONE_AXE:141, IRON_AXE:142, GOLD_AXE:143, DIAMOND_AXE:144, RUBY_AXE:145,
  WOOD_SHOVEL:150, STONE_SHOVEL:151, IRON_SHOVEL:152, GOLD_SHOVEL:153, DIAMOND_SHOVEL:154, RUBY_SHOVEL:155,
  WOOD_HOE:160, STONE_HOE:161, IRON_HOE:162, DIAMOND_HOE:163,
  FISHING_ROD:170, HAMMER:171, BUCKET:172, WATER_BUCKET:173, LAVA_BUCKET:174,
  // armor
  WOOD_HELMET:200, IRON_HELMET:201, GOLD_HELMET:202, DIAMOND_HELMET:203, RUBY_HELMET:204,
  WOOD_CHEST:210, IRON_CHEST:211, GOLD_CHEST:212, DIAMOND_CHEST:213, RUBY_CHEST:214,
  WOOD_LEGS:220, IRON_LEGS:221, GOLD_LEGS:222, DIAMOND_LEGS:223, RUBY_LEGS:224,
  WOOD_BOOTS:230, IRON_BOOTS:231, GOLD_BOOTS:232, DIAMOND_BOOTS:233, RUBY_BOOTS:234,
  // potions
  POTION_HEAL:300, POTION_MANA:301, POTION_SPEED:302, POTION_STR:303, POTION_REGEN:304,
  POTION_FIRE:305, POTION_NIGHT:306,
  // mob drops / food
  GEL:400, BONE:401, FEATHER:402, LEATHER:403, FUR:404, EYE:405,
  SCALE:406, PEARL:407, STAR:408, SOUL:409, BLAZE_ROD:410, ENDER:411,
  // seeds / food
  APPLE:500, CHERRY:501, BANANA:502, ORANGE:503, BREAD:504, COOKIE:505, MEAT:506,
  COOKED_MEAT:507, PUMPKIN:508, CARROT:509, POTATO:510, SEED:511, MELON:512, FISH:513,
  COOKED_FISH:514,
  // misc
  ROPE:600, BONE_ITEM:601, STRING:602, FLINT:603, FEATHER_M:604,
  COIN_C:700, COIN_S:701, COIN_G:702, KEY:710,
  STAR_INV:800, CRYSTAL_SHARD:801, ESSENCE:802, BLOOD:803, BONE_TOOTH:804,
};

// tile colors (16-bit-ish palette)
const TILE_COL = {};
TILE_COL[T.AIR] = null;
TILE_COL[T.DIRT] = '#8a5a3a';
TILE_COL[T.GRASS] = '#4a8a3a';
TILE_COL[T.STONE] = '#7a7a7a';
TILE_COL[T.SAND] = '#e8c87a';
TILE_COL[T.SNOW] = '#e8eef0';
TILE_COL[T.ICE] = '#aae0ee';
TILE_COL[T.WATER] = '#3a6ea5';
TILE_COL[T.LAVA] = '#ff5a1f';
TILE_COL[T.WOOD] = '#6a4a2a';
TILE_COL[T.LEAF] = '#2a6a2a';
TILE_COL[T.SANDSTONE] = '#c8a06a';
TILE_COL[T.CACTUS] = '#3a8a3a';
TILE_COL[T.SNOWY_GRASS] = '#aaccd0';
TILE_COL[T.JUNGLE_GRASS] = '#1a6a1a';
TILE_COL[T.MUSHROOM] = '#aa3030';
TILE_COL[T.MUD] = '#4a2a1a';
TILE_COL[T.COAL] = '#3a3a3a';
TILE_COL[T.IRON] = '#c8a8a8';
TILE_COL[T.GOLD] = '#e8c83a';
TILE_COL[T.DIAMOND] = '#aae0ee';
TILE_COL[T.RUBY] = '#e83a5a';
TILE_COL[T.EMERALD] = '#3acc5a';
TILE_COL[T.COBBLE] = '#5a5a5a';
TILE_COL[T.PLANKS] = '#aa7a3a';
TILE_COL[T.GLASS] = '#aae0ee';
TILE_COL[T.BRICK] = '#aa5a3a';
TILE_COL[T.CLOUD] = '#e8e8e8';
TILE_COL[T.LAVA_ROCK] = '#3a1a1a';
TILE_COL[T.MOSSY_STONE] = '#5a7a4a';
TILE_COL[T.JUNGLE_WOOD] = '#4a3a1a';
TILE_COL[T.BAMBOO] = '#5a8a3a';
TILE_COL[T.SANDSTONE_RED] = '#aa5a3a';
TILE_COL[T.PACKED_ICE] = '#88c8d8';
TILE_COL[T.ASH] = '#3a3a3a';
TILE_COL[T.MARBLE] = '#dadada';
TILE_COL[T.PUMICE] = '#9a8a7a';
TILE_COL[T.CORAL] = '#ff7a8a';
TILE_COL[T.KELP] = '#3a6a3a';
TILE_COL[T.JELLY] = '#aa3a8a';
TILE_COL[T.TORCH] = '#e8c83a';
TILE_COL[T.WORKBENCH] = '#aa7a3a';
TILE_COL[T.FURNACE] = '#5a5a5a';
TILE_COL[T.CHEST] = '#8a6a4a';
TILE_COL[T.DOOR] = '#6a4a3a';
TILE_COL[T.LADDER] = '#aa7a3a';
TILE_COL[T.BEDROCK] = '#1a1a1a';

// pixel sprite lookup (returns 16x16 color array per tile/item)
function pixelSprite(kind, id) {
  // base color
  const c = kind === 'tile' ? TILE_COL[id] : itemColor(id);
  if (!c) return null;
  const s = new Array(16*16).fill(0).map(() => null);
  const set = (x,y,col) => { if (x>=0&&x<16&&y>=0&&y<16) s[y*16+x] = col; };
  // solid
  if (kind === 'tile') {
    if (id === T.AIR) return null;
    if (id === T.TORCH) {
      for (let y=4;y<14;y++) set(7,y,'#6a4a3a');
      set(6,3,'#e8c83a'); set(7,2,'#ff5a1f'); set(8,2,'#e8c83a'); set(9,3,'#ff5a1f');
      set(6,2,'#ffffaa'); set(9,2,'#ffffaa');
      return s;
    }
    if (id === T.LADDER) {
      for (let y=0;y<16;y++) { set(5,y,c); set(10,y,c); }
      for (let y=2;y<16;y+=4) { set(5,y,c); set(6,y,c); set(7,y,c); set(8,y,c); set(9,y,c); set(10,y,c); }
      return s;
    }
    if (id === T.DOOR) {
      for (let y=0;y<16;y++) for (let x=4;x<12;x++) set(x,y,c);
      set(11,2,'#e8c83a'); set(11,8,'#e8c83a');
      return s;
    }
    if (id === T.CHEST) {
      for (let y=4;y<14;y++) for (let x=2;x<14;x++) set(x,y,c);
      for (let y=2;y<4;y++) for (let x=2;x<14;x++) set(x,y,'#5a3a1a');
      set(7,8,'#1a1a1a'); set(8,8,'#1a1a1a');
      return s;
    }
    if (id === T.FURNACE) {
      for (let y=2;y<14;y++) for (let x=2;x<14;x++) set(x,y,c);
      for (let y=4;y<12;y++) for (let x=5;x<11;x++) set(x,y,'#1a1a1a');
      for (let y=10;y<12;y++) for (let x=5;x<11;x++) set(x,y,'#ff5a1f');
      return s;
    }
    if (id === T.WORKBENCH) {
      for (let y=4;y<12;y++) for (let x=2;x<14;x++) set(x,y,c);
      for (let y=8;y<14;y++) { set(2,y,c); set(13,y,c); }
      return s;
    }
    if (id === T.WOOD || id === T.JUNGLE_WOOD) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if ((x+y)%3===0) set(x,y,darken(c,0.7));
        else if ((x*2+y)%5===0) set(x,y,lighten(c,1.2));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.LEAF) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.7) set(x,y,c);
        else if (Math.random() < 0.5) set(x,y,darken(c,0.6));
        else set(x,y,lighten(c,1.3));
      }
      return s;
    }
    if (id === T.GRASS) {
      for (let y=0;y<4;y++) for (let x=0;x<16;x++) set(x,y,c);
      for (let y=4;y<16;y++) for (let x=0;x<16;x++) set(x,y,TILE_COL[T.DIRT]);
      return s;
    }
    if (id === T.SNOWY_GRASS) {
      for (let y=0;y<4;y++) for (let x=0;x<16;x++) set(x,y,c);
      for (let y=4;y<16;y++) for (let x=0;x<16;x++) set(x,y,TILE_COL[T.DIRT]);
      return s;
    }
    if (id === T.JUNGLE_GRASS) {
      for (let y=0;y<4;y++) for (let x=0;x<16;x++) set(x,y,c);
      for (let y=4;y<16;y++) for (let x=0;x<16;x++) set(x,y,TILE_COL[T.DIRT]);
      return s;
    }
    if (id === T.SAND) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.2) set(x,y,lighten(c,1.1));
        else if (Math.random() < 0.2) set(x,y,darken(c,0.9));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.STONE || id === T.COBBLE) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (id === T.COBBLE) {
          // brick pattern
          if (y%4===0 || (x+(y>=8?4:0))%8===0) set(x,y,darken(c,0.7));
          else set(x,y,c);
        } else {
          if (Math.random() < 0.3) set(x,y,lighten(c,1.15));
          else if (Math.random() < 0.3) set(x,y,darken(c,0.85));
          else set(x,y,c);
        }
      }
      return s;
    }
    if (id === T.MOSSY_STONE) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        const m = (Math.sin(x*0.5)+Math.cos(y*0.5)) > 0.5;
        if (m) set(x,y,'#3a8a3a');
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.COAL || id === T.IRON || id === T.GOLD || id === T.DIAMOND || id === T.RUBY || id === T.EMERALD) {
      // ore in stone background
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) set(x,y, TILE_COL[T.STONE]);
      const orePositions = [[3,3],[10,5],[6,8],[12,10],[4,12],[9,2],[7,11]];
      for (const [ox,oy] of orePositions) {
        for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) {
          if (Math.abs(dx)+Math.abs(dy) <= 1) set(ox+dx, oy+dy, c);
        }
        if (id === T.DIAMOND || id === T.RUBY || id === T.EMERALD) {
          // sparkle
          if (ox>0&&oy>0) set(ox-1, oy-1, lighten(c, 1.5));
        }
      }
      return s;
    }
    if (id === T.WATER) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.3) set(x,y,lighten(c,1.3));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.LAVA) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.3) set(x,y,'#ffffaa');
        else if (Math.random() < 0.3) set(x,y,'#aa3030');
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.ICE || id === T.PACKED_ICE) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (id === T.PACKED_ICE) set(x,y,c);
        else if (Math.random() < 0.2) set(x,y,lighten(c,1.2));
        else set(x,y,c);
      }
      set(2,2,lighten(c,1.5)); set(13,13,lighten(c,1.5));
      return s;
    }
    if (id === T.CACTUS) {
      for (let y=2;y<16;y++) for (let x=6;x<10;x++) set(x,y,c);
      set(4,4,c); set(4,5,c); set(4,6,c); set(4,7,c);
      set(11,8,c); set(11,9,c); set(11,10,c);
      return s;
    }
    if (id === T.MUSHROOM) {
      for (let y=4;y<16;y++) for (let x=6;x<10;x++) set(x,y,'#e8e0c0');
      for (let y=2;y<6;y++) for (let x=3;x<13;x++) set(x,y,c);
      for (const [px,py] of [[5,3],[8,3],[11,3],[6,4],[10,4]]) set(px,py,'#e8e8e8');
      return s;
    }
    if (id === T.BAMBOO) {
      for (let y=0;y<16;y++) for (let x=6;x<9;x++) set(x,y,c);
      for (let y=4;y<16;y+=3) for (let x=5;x<10;x++) set(x,y,darken(c,0.7));
      return s;
    }
    if (id === T.CORAL) {
      for (let y=8;y<16;y++) for (let x=4;x<12;x++) set(x,y,c);
      for (let x=2;x<14;x+=3) for (let y=4;y<8;y++) set(x,y,c);
      return s;
    }
    if (id === T.KELP) {
      for (let y=0;y<16;y+=3) for (let x=4;x<12;x++) set(x,y,c);
      return s;
    }
    if (id === T.JELLY) {
      for (let y=4;y<10;y++) for (let x=4;x<12;x++) set(x,y,c);
      for (const [x,y] of [[5,5],[9,5],[5,8],[9,8]]) set(x,y,'#e8e8e8');
      return s;
    }
    if (id === T.CLOUD) {
      for (let y=4;y<10;y++) for (let x=0;x<16;x+=2) set(x,y,c);
      return s;
    }
    if (id === T.ASH) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.5) set(x,y,lighten(c,1.2));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.MARBLE) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.1) set(x,y,lighten(c,1.1));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.PUMICE) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.3) set(x,y,lighten(c,1.15));
        else if (Math.random() < 0.3) set(x,y,darken(c,0.9));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.SANDSTONE || id === T.SANDSTONE_RED) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (y%4===0 || (x+(y>=8?8:0))%8===0) set(x,y,darken(c,0.85));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.LAVA_ROCK) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.15) set(x,y,'#ff5a1f');
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.MUD) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.2) set(x,y,lighten(c,1.1));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.BRICK) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (y%4===0 || (x+(y>=8?4:0))%8===0) set(x,y,'#3a1a1a');
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.PLANKS) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (x%4===0) set(x,y,darken(c,0.7));
        else if (y%2===0) set(x,y,lighten(c,1.1));
        else set(x,y,c);
      }
      return s;
    }
    if (id === T.GLASS) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (x===0||x===15||y===0||y===15) set(x,y,'#5a8a8a');
        else if (x===1||x===14||y===1||y===14) set(x,y,c);
        else if (Math.random() < 0.05) set(x,y,'#ffffff');
        else {/* transparent */}
      }
      return s;
    }
    if (id === T.BEDROCK) {
      for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
        if (Math.random() < 0.3) set(x,y,lighten(c,1.2));
        else set(x,y,c);
      }
      return s;
    }
    // default: solid color w/ noise
    for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
      if (Math.random() < 0.15) set(x,y,lighten(c,1.15));
      else if (Math.random() < 0.15) set(x,y,darken(c,0.85));
      else set(x,y,c);
    }
    return s;
  }
  // items
  return itemPixelSprite(id, c, s, set);
}

function itemPixelSprite(id, c, s, set) {
  const dark = (col) => darken(col, 0.7);
  const lite = (col) => lighten(col, 1.3);
  // tools
  if (id >= I.WOOD_SWORD && id <= I.RUBY_SWORD) {
    const tier = Math.floor((id - 100) / 1);
    const col = c;
    // handle bottom
    for (let y=10;y<16;y++) for (let x=6;x<9;x++) set(x,y,'#3a2a1a');
    // hilt
    for (let x=4;x<11;x++) set(x,9,dark(col));
    // blade
    for (let y=1;y<9;y++) { set(7,y,col); set(6,y,lite(col)); set(8,y,dark(col)); }
    set(7,0,col);
    return s;
  }
  if (id === I.ARROW || id === I.FLAME_ARROW) {
    for (let y=4;y<14;y++) set(7,y,c);
    set(7,2,c); set(6,3,c); set(8,3,c); set(7,1,c);
    for (let y=14;y<16;y++) set(7,y,'#aa6a3a');
    return s;
  }
  if (id >= I.WOOD_PICK && id <= I.RUBY_PICK) {
    // handle
    for (let y=10;y<16;y++) set(7,y,'#3a2a1a');
    // head
    for (let x=3;x<12;x++) set(x,9,c);
    set(2,9,c); set(2,8,c);
    for (let y=7;y<10;y++) set(3,y,c);
    return s;
  }
  if (id >= I.WOOD_AXE && id <= I.RUBY_AXE) {
    for (let y=8;y<16;y++) set(7,y,'#3a2a1a');
    for (let y=2;y<10;y++) { set(4,y,c); set(5,y,c); set(3,y,c); }
    return s;
  }
  if (id >= I.WOOD_SHOVEL && id <= I.RUBY_SHOVEL) {
    for (let y=12;y<16;y++) set(7,y,'#3a2a1a');
    for (let y=3;y<12;y++) { set(5,y,c); set(6,y,c); set(7,y,c); set(8,y,c); set(9,y,c); }
    return s;
  }
  if (id >= I.WOOD_HOE && id <= I.DIAMOND_HOE) {
    for (let y=10;y<16;y++) set(7,y,'#3a2a1a');
    for (let x=2;x<8;x++) set(x,9,c);
    set(2,8,c); set(7,8,c);
    return s;
  }
  if (id === I.WOOD_BOW || id === I.IRON_BOW || id === I.DIAMOND_BOW) {
    for (let y=2;y<14;y++) { set(5,y,c); set(10,y,c); }
    set(5,1,dark(c)); set(10,1,dark(c));
    set(5,15,dark(c)); set(10,15,dark(c));
    set(5,8,'#e8e8e8');
    return s;
  }
  // armor
  if (id === I.WOOD_HELMET) { for (let y=2;y<7;y++) for (let x=3;x<13;x++) set(x,y,c); return s; }
  if (id === I.IRON_HELMET) { for (let y=3;y<7;y++) for (let x=3;x<13;x++) set(x,y,c); for (let x=5;x<11;x++) set(x,2,c); return s; }
  if (id === I.GOLD_HELMET) { for (let y=3;y<7;y++) for (let x=3;x<13;x++) set(x,y,c); set(2,4,c); set(13,4,c); return s; }
  if (id === I.DIAMOND_HELMET) { for (let y=2;y<7;y++) for (let x=3;x<13;x++) set(x,y,c); set(7,1,c); return s; }
  if (id === I.RUBY_HELMET) { for (let y=2;y<8;y++) for (let x=3;x<13;x++) set(x,y,c); for (let x=6;x<10;x++) set(x,1,c); return s; }
  if (id === I.WOOD_CHEST) { for (let y=4;y<14;y++) for (let x=3;x<13;x++) set(x,y,c); return s; }

function darken(hex, factor) {
  const c = hexToRgb(hex);
  return rgbToHex(Math.max(0, c.r*factor|0), Math.max(0, c.g*factor|0), Math.max(0, c.b*factor|0));
}
function lighten(hex, factor) {
  const c = hexToRgb(hex);
  return rgbToHex(Math.min(255, c.r*factor|0), Math.min(255, c.g*factor|0), Math.min(255, c.b*factor|0));
}
function hexToRgb(h) { return { r:parseInt(h.slice(1,3),16), g:parseInt(h.slice(3,5),16), b:parseInt(h.slice(5,7),16) }; }
function rgbToHex(r,g,b) { return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0'); }

// cache sprites
const spriteCache = {};
function getSprite(kind, id) {
  const k = kind+':'+id;
  if (spriteCache[k]) return spriteCache[k];
  spriteCache[k] = pixelSprite(kind, id);
  return spriteCache[k];
}

// draw sprite to ctx (solid color block, no pixel art)
function drawSprite(spr, x, y, size, color) {
  if (!color) return;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, size, size);
}

// draw sprite as swatch (for hotbar/inventory)
function drawSwatch(spr, x, y, size, color) {
  drawSprite(spr, x, y, size, color);
}

const mobs = [];
// mobs sprite (will generate procedurally)
const mobSprites = {};
function makeMobSprite(mob) {
  const s = new Array(16*16).fill(null);
  const set = (x,y,col) => { if (x>=0&&x<16&&y>=0&&y<16) s[y*16+x] = col; };
  const c = mob.col;
  const dark = darken(c, 0.6);
  const lite = lighten(c, 1.3);
  // body based on mob.shape
  if (mob.shape === 'humanoid') {
    // head
    for (let y=1;y<5;y++) for (let x=5;x<11;x++) set(x,y, lite);
    set(6,3,'#1a1a1a'); set(7,3,'#1a1a1a'); set(8,3,'#1a1a1a'); set(9,3,'#1a1a1a');
    // body
    for (let y=5;y<12;y++) for (let x=4;x<12;x++) set(x,y,c);
    // arms
    for (let y=6;y<11;y++) { set(3,y,c); set(12,y,c); }
    // legs
    for (let y=12;y<16;y++) { set(5,y,dark); set(10,y,dark); }
  } else if (mob.shape === 'quad') {
    // body
    for (let y=4;y<10;y++) for (let x=2;x<14;x++) set(x,y,c);
    for (let y=3;y<5;y++) for (let x=4;x<12;x++) set(x,y, lite);
    // legs
    for (let y=10;y<13;y++) for (let x=2;x<6;x++) set(x,y,dark);
    for (let y=10;y<13;y++) for (let x=10;x<14;x++) set(x,y,dark);
    // tail
    set(14,8,dark); set(15,8,dark);
  } else if (mob.shape === 'spider') {
    for (let y=5;y<10;y++) for (let x=4;x<12;x++) set(x,y,c);
    for (let y=4;y<6;y++) for (let x=5;x<11;x++) set(x,y, lite);
    // legs
    for (let i=0;i<4;i++) {
      const y = 6+i;
      set(2,y,dark); set(13,y,dark);
      set(3,y,dark); set(12,y,dark);
    }
    // eyes
    set(6,7,'#ff5a1f'); set(9,7,'#ff5a1f');
  } else if (mob.shape === 'fish') {
    for (let y=6;y<10;y++) for (let x=3;x<13;x++) set(x,y,c);
    for (let y=4;y<12;y++) set(14,y,dark);
    set(5,7,'#e8e8e8');
  } else if (mob.shape === 'bird') {
    for (let y=4;y<8;y++) for (let x=4;x<12;x++) set(x,y,c);
    for (let y=3;y<5;y++) for (let x=5;x<11;x++) set(x,y, lite);
    // wings
    for (let y=5;y<9;y++) { set(2,y,dark); set(13,y,dark); }
    // beak
    set(7,3,'#e8c83a'); set(8,3,'#e8c83a');
  } else if (mob.shape === 'boss') {
    // huge eye
    for (let y=3;y<13;y++) for (let x=1;x<15;x++) set(x,y,c);
    for (let y=5;y<11;y++) for (let x=3;x<13;x++) set(x,y,'#e83a5a');
    for (let y=6;y<10;y++) for (let x=5;x<11;x++) set(x,y,'#1a1a1a');
    for (let y=7;y<9;y++) for (let x=6;x<10;x++) set(x,y,'#ff5a1f');
  } else if (mob.shape === 'slime') {
    for (let y=5;y<13;y++) for (let x=3;x<13;x++) set(x,y,c);
    for (let y=3;y<5;y++) for (let x=5;x<11;x++) set(x,y, lite);
    for (let y=8;y<11;y++) { set(5,y,'#1a1a1a'); set(10,y,'#1a1a1a'); }
  }
  mobSprites[mob.name] = s;
  return s;
}

// utility
function rng(seed) {
  let s = 0;
  for (let i=0;i<seed.length;i++) s = (s*31 + seed.charCodeAt(i)) & 0xffffffff;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}
let _rng = rng(Date.now().toString());
let seed = 'default';
const R = () => _rng();
const Ri = (a,b) => Math.floor(R()*(b-a+1))+a;
const noise = (() => {
  // simple value noise w/ 1D perlin-ish
  const perm = new Array(512);
  for (let i=0;i<256;i++) perm[i] = i;
  for (let i=255;i>0;i--) { const j = Math.floor(R()*(i+1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i=0;i<256;i++) perm[256+i] = perm[i];
  const fade = t => t*t*t*(t*(t*6-15)+10);
  const grad = (h,x) => (h&1)?-x:x;
  return (x) => {
    const X = Math.floor(x) & 255;
    x -= Math.floor(x);
    const u = fade(x);
    return grad(perm[X], x) * (1-u) + grad(perm[X+1], x) * u;
  };
})();
const noise2 = (() => {
  const perm = new Array(512);
  for (let i=0;i<256;i++) perm[i] = i;
  for (let i=255;i>0;i--) { const j = Math.floor(R()*(i+1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i=0;i<256;i++) perm[256+i] = perm[i];
  const fade = t => t*t*t*(t*(t*6-15)+10);
  const grad2 = (h,x,y) => { const h2=h&3; return ((h2&1)?-x:x) + ((h2&2)?-y:y); };
  return (x,y) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u=fade(x), v=fade(y);
    const A=perm[X]+Y, AA=perm[A], AB=perm[A+1], B=perm[X+1]+Y, BA=perm[B], BB=perm[B+1];
    return grad2(perm[AA],x,y)*(1-u)*(1-v) + grad2(perm[BA],x-1,y)*u*(1-v) +
           grad2(perm[AB],x,y-1)*(1-u)*v + grad2(perm[BB],x-1,y-1)*u*v;
  };
})();

// get biome at world x
function getBiome(x) {
  const scale = 0.005;
  const t = noise2(x*scale*0.5, 0) * 2;
  const t2 = noise2(x*scale*0.7, 100) * 2;
  const v = (t + t2) / 2;
  if (v < -0.6) return BIOMES.SNOW;
  if (v < -0.2) return BIOMES.PLAINS;
  if (v < 0.2) return BIOMES.FOREST;
  if (v < 0.5) return BIOMES.JUNGLE;
  if (v < 0.8) return BIOMES.DESERT;
  return BIOMES.MUSHROOM;
}

// generate world
function genWorld() {
  for (let y=0;y<WORLD_H;y++) world.push(new Array(WORLD_W).fill(T.AIR));
  // heightmap
  const hm = new Array(WORLD_W);
  for (let x=0;x<WORLD_W;x++) {
    const base = GROUND;
    const n1 = noise2(x*0.02, 0) * 8;
    const n2 = noise2(x*0.05, 100) * 3;
    const n3 = noise2(x*0.005, 200) * 15;
    hm[x] = Math.max(20, Math.min(WORLD_H-10, base + n1 + n2 + n3));
  }
  // fill ground
  for (let x=0;x<WORLD_W;x++) {
    const biome = getBiome(x);
    const surfaceTile = biome === BIOMES.DESERT ? T.SAND :
                       biome === BIOMES.SNOW ? T.SNOWY_GRASS :
                       biome === BIOMES.JUNGLE ? T.JUNGLE_GRASS :
                       biome === BIOMES.MUSHROOM ? T.MUSHROOM : T.GRASS;
    const subTile = biome === BIOMES.DESERT ? T.SANDSTONE : T.DIRT;
    const h = Math.floor(hm[x]);
    for (let y=h;y<WORLD_H;y++) {
      if (y < WORLD_H-3) {
        world[y][x] = T.STONE;
      } else {
        world[y][x] = T.BEDROCK;
      }
      if (y === h) world[y][x] = surfaceTile;
      else if (y < h+4) world[y][x] = subTile;
    }
    // trees
    if (biome === BIOMES.FOREST && R() < 0.12) placeTree(x, h-1, T.WOOD, T.LEAF);
    else if (biome === BIOMES.PLAINS && R() < 0.04) placeTree(x, h-1, T.WOOD, T.LEAF);
    else if (biome === BIOMES.JUNGLE && R() < 0.2) placeTree(x, h-1, T.JUNGLE_WOOD, T.LEAF);
    else if (biome === BIOMES.MUSHROOM && R() < 0.15) placeTree(x, h-1, T.MUSHROOM, T.LEAF);
    // desert cactus
    else if (biome === BIOMES.DESERT && R() < 0.04) placeCactus(x, h-1);
    // snow tree (pine)
    else if (biome === BIOMES.SNOW && R() < 0.1) placeTree(x, h-1, T.WOOD, T.SNOW);
  }
  // caves
  for (let x=2;x<WORLD_W-2;x++) {
    for (let y=30;y<WORLD_H-3;y++) {
      if (world[y][x] === T.STONE) {
        const c1 = noise2(x*0.08, y*0.08);
        const c2 = noise2(x*0.04, y*0.04);
        if (c1 + c2 > 1.1) world[y][x] = T.AIR;
      }
    }
  }
  // ores
  for (let x=0;x<WORLD_W;x++) for (let y=30;y<WORLD_H-3;y++) {
    if (world[y][x] !== T.STONE) continue;
    const r = R();
    if (y > WORLD_H-30 && r < 0.005) world[y][x] = T.RUBY;
    else if (y > 50 && r < 0.005) world[y][x] = T.DIAMOND;
    else if (y > 40 && r < 0.01) world[y][x] = T.GOLD;
    else if (y > 30 && r < 0.02) world[y][x] = T.IRON;
    else if (r < 0.03) world[y][x] = T.COAL;
  }
  // lava pools deep
  for (let x=0;x<WORLD_W;x+=Ri(8,16)) {
    for (let y=WORLD_H-12;y<WORLD_H-3;y++) {
      if (world[y][x] === T.AIR) { world[y][x] = T.LAVA; }
    }
  }
  // find spawn
  const spawnX = Math.floor(WORLD_W/2);
  const spawnY = Math.floor(hm[spawnX]) - 2;
  player.x = spawnX * TILE + TILE/2;
  player.y = spawnY * TILE;
  // spawn mobs
  spawnMobs();
}

function placeTree(x, topY, wood, leaf) {
  const height = Ri(4, 6);
  for (let i=0;i<height;i++) {
    if (topY-i < 0) break;
    world[topY-i][x] = wood;
  }
  const top = topY - height;
  // leaves
  for (let dy=-2;dy<=0;dy++) for (let dx=-2;dx<=2;dx++) {
    if (Math.abs(dx) === 2 && dy === 0) continue;
    const ly = top+dy, lx = x+dx;
    if (ly>=0 && lx>=0 && lx<WORLD_W && world[ly][lx] === T.AIR) world[ly][lx] = leaf;
  }
  if (top-1 >= 0 && world[top-1][x] === T.AIR) world[top-1][x] = leaf;
}

function placeCactus(x, topY) {
  const h = Ri(2, 4);
  for (let i=0;i<h;i++) {
    if (topY-i < 0) break;
    world[topY-i][x] = T.CACTUS;
  }
}

function spawnMobs() {
  mobs.length = 0;
  const count = 30;
  for (let i=0;i<count;i++) {
    const x = Ri(0, WORLD_W-1);
    const biome = getBiome(x);
    const candidates = Object.values(MOB).filter(m => m.biome.includes(biome));
    if (!candidates.length) continue;
    const mDef = candidates[Ri(0, candidates.length-1)];
    // find surface
    let y = 0;
    for (let yy=0;yy<WORLD_H-1;yy++) {
      if (world[yy][x] !== T.AIR && world[yy+1][x] === T.AIR) { y = yy; break; }
    }
    if (!y) continue;
    const m = {
      ...mDef,
      x: x * TILE, y: y * TILE, vx: 0, vy: 0, onGround: false,
      facing: Ri(0,1) ? 1 : -1, age: 0, hitT: 0,
    };
    if (!mobSprites[m.name]) makeMobSprite(m);
    mobs.push(m);
  }
}

genWorld();

// inventory helpers
function invCount(id) {
  let total = 0;
  for (const s of player.inventory) if (s && s.id === id) total += s.count;
  return total;
}
function invAdd(id, count=1) {
  for (const s of player.inventory) {
    if (s && s.id === id) { s.count += count; return true; }
  }
  for (let i=0;i<player.inventory.length;i++) {
    if (!player.inventory[i]) { player.inventory[i] = {id, count}; return true; }
  }
  return false;
}
function invHas(id, count) {
  return invCount(id) >= count;
}
function invRemove(id, count) {
  let left = count;
  for (let i=0;i<player.inventory.length;i++) {
    if (left <= 0) break;
    if (player.inventory[i] && player.inventory[i].id === id) {
      if (player.inventory[i].count <= left) {
        left -= player.inventory[i].count;
        player.inventory[i] = null;
      } else {
        player.inventory[i].count -= left;
        left = 0;
      }
    }
  }
  return left === 0;
}

// collision check
function aabbBlocks(ax, ay, aw, ah) {
  const x0 = Math.floor(ax/aw);
  // actually: ax,ay is pos in pixels, aw,ah in pixels (width,height)
  const px = ax, py = ay;
  const xMin = Math.floor((px - aw/2) / TILE);
  const xMax = Math.floor((px + aw/2) / TILE);
  const yMin = Math.floor((py - ah) / TILE);
  const yMax = Math.floor((py - 1) / TILE);
  for (let xi=xMin; xi<=xMax; xi++) for (let yi=yMin; yi<=yMax; yi++) {
    const t = getTile(xi, yi);
    if (isSolid(t) && t !== T.LADDER) return true;
  }
  return false;
}

// update loop
function update(dt) {
  if (!gameRunning) return;
  // player movement
  let mx = 0;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (mx) player.facing = mx;
  const sp = 4.5 * (player.mode === 'creative' ? 1.5 : 1);
  player.vx = mx * sp;
  // gravity
  player.vy += 0.5;
  if (player.vy > 12) player.vy = 12;
  // jump
  if ((keys['w'] || keys[' '] || keys['arrowup']) && player.onGround) {
    player.vy = -9;
    player.onGround = false;
  }
  // fly in creative
  if (player.mode === 'creative' && (keys['w'] || keys[' '] || keys['arrowup'])) player.vy = -8;
  if (player.mode === 'creative' && (keys['s'] || keys['arrowdown'])) player.vy = 8;
  // move
  const oldX = player.x, oldY = player.y;
  const pxw = player.w * TILE, pxh = player.h * TILE;
  // X
  player.x += player.vx;
  if (aabbBlocks(player.x, player.y, pxw, pxh)) { player.x = oldX; player.vx = 0; }
  // Y
  player.y += player.vy;
  player.onGround = false;
  if (aabbBlocks(player.x, player.y, pxw, pxh)) {
    if (player.vy > 0) player.onGround = true;
    player.y = oldY; player.vy = 0;
  }
  // tile damage
  const t = tileAtPixel(player.x, player.y);
  if (player.mode === 'survival') {
    const d = tileDamage(t);
    if (d > 0) {
      player.hp -= d * dt * 30;
      if (player.hp <= 0) { player.hp = player.hpMax; player.x = Math.floor(WORLD_W/2) * TILE; player.y = 0; showMsg('Respawned'); }
    }
  }
  // regen
  player.hp = Math.min(player.hpMax, player.hp + 0.05);
  player.mana = Math.min(player.manaMax, player.mana + 0.02);
  // camera
  cam.x += (player.x - cam.x - W/2) * 0.2;
  cam.y += (player.y - cam.y - H/2) * 0.2;
  if (cam.x < 0) cam.x = 0;
  if (cam.y < 0) cam.y = 0;
  if (cam.x > WORLD_W*TILE - W) cam.x = WORLD_W*TILE - W;
  if (cam.y > WORLD_H*TILE - H) cam.y = WORLD_H*TILE - H;
  // mouse mining/placing
  if (mouse.justPressed) {
    handleClick();
  }
  mouse.justPressed = false;
  // bow charge
  if (getHeldTool() === I.BOW && mouse.down) {
    bowCharge = Math.min(60, bowCharge + 1);
  } else if (bowCharge > 0 && getHeldTool() === I.BOW) {
    // release
    if (invCount(I.ARROW) > 0) {
      invRemove(I.ARROW, 1);
      const ang = Math.atan2(mouse.y - H/2, mouse.x - W/2);
      projectiles.push({
        x: player.x, y: player.y - pxh/2, vx: Math.cos(ang) * (8 + bowCharge*0.2), vy: Math.sin(ang) * (8 + bowCharge*0.2), life: 120, type:'arrow', dmg: 6 + bowCharge*0.1
      });
    }
    bowCharge = 0;
  }
  // update projectiles
  for (let i=projectiles.length-1;i>=0;i--) {
    const p = projectiles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--;
    if (p.life <= 0 || tileAtPixel(p.x, p.y) !== T.AIR && isSolid(tileAtPixel(p.x, p.y))) { projectiles.splice(i, 1); continue; }
    // hit mob
    for (const m of mobs) {
      if (Math.abs(p.x - m.x) < 12 && Math.abs(p.y - m.y) < 12) {
        damageMob(m, p.dmg); projectiles.splice(i, 1); break;
      }
    }
  }
  // update mobs
  for (let i=mobs.length-1;i>=0;i--) {
    const m = mobs[i];
    m.age++;
    if (m.hpT) m.hpT--;
    const dx = player.x - m.x;
    if (m.aggro > 0 && Math.abs(dx) < 200) {
      m.vx = Math.sign(dx) * 0.8;
      if (m.aggro === 2) m.vx *= 1.3;
    } else if (m.aggro === 0) {
      // neutral, just stand
      m.vx = 0;
    } else {
      // wander
      if (m.age % 120 === 0) m.vx = (R() < 0.5 ? 1 : -1) * 0.5;
    }
    // gravity
    m.vy += 0.4;
    if (m.vy > 10) m.vy = 10;
    // move
    const mOldX = m.x, mOldY = m.y;
    const mw = 0.6*TILE, mh = 0.8*TILE;
    m.x += m.vx;
    if (aabbBlocks(m.x, m.y, mw, mh)) { m.x = mOldX; m.vx = -m.vx; }
    m.y += m.vy;
    m.onGround = false;
    if (aabbBlocks(m.x, m.y, mw, mh)) {
      if (m.vy > 0) m.onGround = true;
      m.y = mOldY; m.vy = 0;
    }
    // hit player
    if (m.aggro > 0 && Math.abs(m.x - player.x) < 14 && Math.abs(m.y - player.y) < 14) {
      if (m.age % 30 === 0) { player.hp -= m.dmg; m.vx = -Math.sign(dx) * 3; }
    }
  }
  // particles
  for (let i=particles.length-1;i>=0;i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // msg timer
  if (msgT > 0) msgT--;
  // minimap
  drawMinimap();
}

function getHeldTool() {
  const it = player.inventory[player.selectedSlot];
  return it ? it.id : 0;
}

function damageMob(m, dmg) {
  m.hp -= dmg; m.hpT = 8; m.vx = (R() < 0.5 ? 1 : -1) * 4;
  if (m.hp <= 0) {
    for (const k in m.drops) invAdd(parseInt(k), m.drops[k]);
    mobs.splice(mobs.indexOf(m), 1);
    // respawn elsewhere
    setTimeout(() => {
      const x = Math.max(0, Math.min(WORLD_W-1, Math.floor(player.x/TILE) + Ri(-40, 40)));
      const biome = getBiome(x);
      const candidates = Object.values(MOB).filter(mm => mm.biome.includes(biome));
      if (!candidates.length) return;
      const mDef = candidates[Ri(0, candidates.length-1)];
      let yy = 0;
      for (let y=0;y<WORLD_H-1;y++) if (world[y][x] !== T.AIR && world[y+1][x] === T.AIR) { yy = y; break; }
      if (!yy) return;
      const nm = { ...mDef, x: x*TILE, y: yy*TILE, vx:0, vy:0, onGround:false, facing:1, age:0, hitT:0 };
      if (!mobSprites[nm.name]) makeMobSprite(nm);
      mobs.push(nm);
    }, 3000);
  }
}

function handleClick() {
  if (showInventory) return;
  const tx = Math.floor((cam.x + mouse.x) / TILE);
  const ty = Math.floor((cam.y + mouse.y) / TILE);
  const t = getTile(tx, ty);
  // distance check
  const ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
  if (Math.abs(tx - ptx) > 6 || Math.abs(ty - pty) > 6) return;
  // left click = mine
  if (!mouse.right) {
    if (t === T.AIR) {
      // place block from hotbar
      const it = player.inventory[player.selectedSlot];
      if (!it) return;
      // items that can place blocks
      const placeable = [I.DIRT,I.GRASS,I.STONE,I.SAND,I.SNOW,I.ICE,I.WATER_B,I.LAVA_B,I.WOOD,I.LEAF,I.PLANKS,I.COBBLE,I.GLASS,I.BRICK,I.CLOUD,I.SANDSTONE,I.CACTUS,I.SNOWY_GRASS,I.JUNGLE_GRASS,I.MUSHROOM,I.MUD,I.LAVA_ROCK,I.MOSSY_STONE,I.JUNGLE_WOOD,I.BAMBOO,I.SANDSTONE_RED,I.PACKED_ICE,I.ASH,I.MARBLE,I.PUMICE,I.CORAL,I.KELP,I.JELLY,I.TORCH,I.WORKBENCH,I.FURNACE,I.CHEST,I.DOOR,I.LADDER];
      if (!placeable.includes(it.id)) return;
      // can't place where player is
      const playertx = Math.floor(player.x / TILE), playerty = Math.floor(player.y / TILE);
      if (tx === playertx && (ty === playerty || ty === playerty - 1 || ty === Math.floor((player.y - 1) / TILE))) return;
      setTile(tx, ty, placeToTile(it.id));
      it.count--;
      if (it.count <= 0) player.inventory[player.selectedSlot] = null;
      buildHotbar();
      return;
    }
    if (t === T.CHEST) { /* TODO: open chest */ return; }
    if (t === T.FURNACE) { openFurnace(tx, ty); return; }
    // mine
    const held = getHeldTool();
    const tier = pickTier(held);
    if (held === I.BOW) {
      // handled by charge loop
      return;
    }
    // swords can mine too (slower / lower tier). use 1 for tier
    const mineTier = tier > 0 ? tier : (held >= I.WOOD_SWORD && held <= I.RUBY_SWORD) ? 1 : 0;
    if (!canMine(t, mineTier)) { showMsg('need better tool'); return; }
    const drop = mineDrop(t);
    invAdd(drop, 1);
    setTile(tx, ty, T.AIR);
    // particles
    for (let i=0;i<6;i++) {
      particles.push({ x: tx*TILE+TILE/2, y: ty*TILE+TILE/2, vx:(R()-0.5)*2, vy:(R()-0.5)*2 - 1, life: 30, col: TILE_COL[t] || '#888' });
    }
    buildHotbar();
  } else {
    // right click = use tool (interact)
    const held = getHeldTool();
    if (held >= I.WOOD_SWORD && held <= I.RUBY_SWORD) {
      // hit nearest mob in front
      const range = 50;
      for (const m of mobs) {
        const dx = m.x - player.x, dy = m.y - player.y;
        if (Math.abs(dx) < range && Math.abs(dy) < range && Math.sign(dx) === player.facing) {
          damageMob(m, tierToolDmg(held) + (player.mana > 10 ? 5 : 0));
          if (player.mana >= 10) player.mana -= 10;
          return;
        }
      }
    } else if (held === I.BOW) {
      // bow is left-click charged
    } else {
      // try to use item (food/potion/place)
      const it = player.inventory[player.selectedSlot];
      if (!it) return;
      // eat food
      if ([I.APPLE,I.CHERRY,I.BANANA,I.ORANGE,I.BREAD,I.COOKIE,I.COOKED_MEAT,I.COOKED_FISH].includes(it.id)) {
        const food = { [I.APPLE]: 20, [I.CHERRY]: 10, [I.BANANA]: 15, [I.ORANGE]: 18, [I.BREAD]: 25, [I.COOKIE]: 8, [I.COOKED_MEAT]: 40, [I.COOKED_FISH]: 30 }[it.id] || 10;
        player.hp = Math.min(player.hpMax, player.hp + food);
        it.count--; if (it.count <= 0) player.inventory[player.selectedSlot] = null;
        showMsg('+'+food+' HP');
        buildHotbar();
        return;
      }
      // potions
      if ([I.POTION_HEAL,I.POTION_MANA,I.POTION_SPEED,I.POTION_STR,I.POTION_REGEN].includes(it.id)) {
        if (it.id === I.POTION_HEAL) player.hp = Math.min(player.hpMax, player.hp + 50);
        if (it.id === I.POTION_MANA) player.mana = Math.min(player.manaMax, player.mana + 50);
        if (it.id === I.POTION_REGEN) { player.hp = Math.min(player.hpMax, player.hp + 100); }
        if (it.id === I.POTION_STR) {/* dmg boost tick */}
        if (it.id === I.POTION_SPEED) {/* speed boost tick */}
        it.count--; if (it.count <= 0) player.inventory[player.selectedSlot] = null;
        showMsg('used ' + itemName(it.id));
        buildHotbar();
        return;
      }
      // bucket
      if (it.id === I.BUCKET) {
        // pick up water/lava
        const t2 = tileAtPixel(player.x, player.y);
        if (t2 === T.WATER) { it.id = I.WATER_BUCKET; it.count = 1; showMsg('picked up water'); buildHotbar(); }
        else if (t2 === T.LAVA) { it.id = I.LAVA_BUCKET; it.count = 1; showMsg('picked up lava'); buildHotbar(); }
      } else if (it.id === I.WATER_BUCKET || it.id === I.LAVA_BUCKET) {
        // place
        if (t === T.AIR) {
          setTile(tx, ty, it.id === I.WATER_BUCKET ? T.WATER : T.LAVA);
          it.id = I.BUCKET; it.count = 1; showMsg('placed ' + itemName(it.id));
          buildHotbar();
        }
      }
    }
  }
}

function tierToolDmg(id) {
  if (id === I.RUBY_SWORD) return 12;
  if (id === I.DIAMOND_SWORD) return 10;
  if (id === I.GOLD_SWORD) return 7;
  if (id === I.IRON_SWORD) return 7;
  if (id === I.STONE_SWORD) return 5;
  if (id === I.WOOD_SWORD) return 3;
  return 1;
}

function openFurnace(tx, ty) {
  furnaceOpen = { tx, ty, in: null, fuel: null, out: null, prog: 0, burning: false };
  document.getElementById('furnace-ui').style.display = 'flex';
  drawFurnace();
}
function drawFurnace() {
  const ui = document.getElementById('furnace-ui');
  if (!furnaceOpen) { ui.style.display = 'none'; return; }
  const drawSlot = (el, item) => {
    el.innerHTML = '';
    if (item) {
      const c = document.createElement('canvas');
      c.width = 48; c.height = 48;
      const cx = c.getContext('2d'); cx.imageSmoothingEnabled = false;
      drawSpriteInto(item, cx, 0, 0, 48);
      el.appendChild(c);
    }
  };
  drawSlot(document.getElementById('fu-in'), furnaceOpen.in);
  drawSlot(document.getElementById('fu-fuel'), furnaceOpen.fuel);
  drawSlot(document.getElementById('fu-out'), furnaceOpen.out);
  document.getElementById('fu-prog').style.width = (furnaceOpen.prog * 100) + '%';
}
function updateFurnace(dt) {
  if (!furnaceOpen) return;
  if (furnaceOpen.burning) {
    furnaceOpen.prog += dt * 0.3;
    if (furnaceOpen.prog >= 1) {
      furnaceOpen.prog = 0;
      if (furnaceOpen.in && furnaceOpen.in.id) {
        // process recipe
        const r = RECIPES.find(rr => rr.out === getSmeltOut(furnaceOpen.in.id));
        if (r) {
          furnaceOpen.out = { id: r.out, count: 1 };
          furnaceOpen.in.count--;
          if (furnaceOpen.in.count <= 0) furnaceOpen.in = null;
        }
      }
    }
    if (furnaceOpen.fuel && furnaceOpen.fuel.count > 0) {
      // consume fuel
      if (Math.random() < dt * 0.5) { furnaceOpen.fuel.count -= 0.1; if (furnaceOpen.fuel.count <= 0) furnaceOpen.fuel = null; }
    } else {
      furnaceOpen.burning = false;
    }
  }
  // auto-start if input + fuel
  if (furnaceOpen.in && furnaceOpen.fuel && !furnaceOpen.burning) furnaceOpen.burning = true;
  drawFurnace();
}
function getSmeltOut(id) {
  const map = { [I.SAND]: I.GLASS, [I.COBBLE]: I.BRICK, [I.WOOD]: I.COAL, [I.MEAT]: I.COOKED_MEAT, [I.FISH]: I.COOKED_FISH };
  return map[id];
}

// click furnace slots
document.getElementById('fu-in').addEventListener('click', () => {
  if (!furnaceOpen) return;
  // swap with hotbar
  const hold = player.inventory[player.selectedSlot];
  if (hold && getSmeltOut(hold.id)) {
    furnaceOpen.in = hold;
    player.inventory[player.selectedSlot] = null;
  } else if (furnaceOpen.in) {
    player.inventory[player.selectedSlot] = furnaceOpen.in;
    furnaceOpen.in = null;
  }
  buildHotbar();
});
document.getElementById('fu-fuel').addEventListener('click', () => {
  if (!furnaceOpen) return;
  const hold = player.inventory[player.selectedSlot];
  if (hold && (hold.id === I.COAL || hold.id === I.WOOD || hold.id === I.PLANKS)) {
    furnaceOpen.fuel = hold;
    player.inventory[player.selectedSlot] = null;
  } else if (furnaceOpen.fuel) {
    player.inventory[player.selectedSlot] = furnaceOpen.fuel;
    furnaceOpen.fuel = null;
  }
  buildHotbar();
});
document.getElementById('fu-out').addEventListener('click', () => {
  if (!furnaceOpen) return;
  if (furnaceOpen.out) {
    invAdd(furnaceOpen.out.id, furnaceOpen.out.count);
    furnaceOpen.out = null;
    buildHotbar();
  }
});

// draw loop
function draw() {
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(0, 0, W, H);
  if (!gameRunning) return;
  // background tiles (sky/space)
  const tx0 = Math.floor(cam.x / TILE);
  const ty0 = Math.floor(cam.y / TILE);
  const tx1 = Math.ceil((cam.x + W) / TILE);
  const ty1 = Math.ceil((cam.y + H) / TILE);
  for (let y = ty0; y < ty1; y++) {
    for (let x = tx0; x < tx1; x++) {
      if (y < 0 || y >= WORLD_H) continue;
      const t = getTile(x, y);
      if (t === T.AIR) continue;
      drawSprite(null, x*TILE - cam.x, y*TILE - cam.y, TILE, TILE_COL[t]);
    }
  }
  // mobs
  for (const m of mobs) {
    if (m.x < cam.x - 30 || m.x > cam.x + W + 30) continue;
    ctx.fillStyle = m.col;
    ctx.fillRect(m.x - cam.x - 8, m.y - cam.y - 16, 16, 16);
    // hp bar
    if (m.hpT) {
      const mx = m.x - cam.x - 12, my = m.y - cam.y - 24;
      ctx.fillStyle = '#3a1a1a'; ctx.fillRect(mx, my, 24, 3);
      ctx.fillStyle = '#e83a3a'; ctx.fillRect(mx, my, 24 * Math.max(0, m.hp / (MOB[m.name] ? MOB[m.name].hp * 2 : 30)), 3);
    }
    if (m.name === 'eye of cthulhu') {
      // boss hp bar
      document.getElementById('boss-bar').style.display = 'flex';
      document.getElementById('boss-name').textContent = 'Eye of Cthulhu';
      document.getElementById('boss-hp-fill').style.width = (m.hp / 280 * 100) + '%';
    }
  }
  // player
  drawPlayer();
  // projectiles
  for (const p of projectiles) {
    const x = p.x - cam.x, y = p.y - cam.y;
    ctx.fillStyle = p.type === 'arrow' ? '#aa6a3a' : '#ff5a1f';
    ctx.fillRect(x-1, y-1, 3, 3);
  }
  // particles
  for (const p of particles) {
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - cam.x, p.y - cam.y, 2, 2);
  }
  // bow charge indicator
  if (bowCharge > 0) {
    ctx.fillStyle = '#ffff44';
    ctx.fillRect(W/2 - 30, H - 40, 60 * bowCharge/60, 4);
  }
  // msg
  if (msgT > 0) {
    const msgEl = document.getElementById('msg');
    msgEl.textContent = msg;
    msgEl.style.opacity = Math.min(1, msgT / 30);
  } else {
    document.getElementById('msg').style.opacity = 0;
  }
  // biome label
  const btx = Math.floor(player.x / TILE);
  const b = getBiome(btx);
  document.getElementById('biome-label').textContent = b.toUpperCase();
  // HP/MP
  document.getElementById('hp-fill').style.width = (player.hp / player.hpMax * 100) + '%';
  document.getElementById('mana-fill').style.width = (player.mana / player.manaMax * 100) + '%';
}

function drawPlayer() {
  const x = player.x - cam.x, y = player.y - cam.y;
  const pw = player.w * TILE, ph = player.h * TILE;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x - pw/2, y - 2, pw, 3);
  // body
  ctx.save();
  ctx.translate(x, y - ph/2);
  if (player.facing < 0) { ctx.scale(-1, 1); }
  // legs
  const legOffset = Math.sin(player.animWalk) * 1;
  ctx.fillStyle = '#3a4a6a';
  ctx.fillRect(-3, 4, 2, 8);
  ctx.fillRect(1, 4, 2, 8);
  // body
  ctx.fillStyle = player.armor.chest ? itemColor(player.armor.chest.id) : '#5a8acd';
  ctx.fillRect(-4, -4, 8, 10);
  // head
  ctx.fillStyle = '#e8c87a';
  ctx.fillRect(-3, -10, 6, 6);
  // eyes
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, -8, 1, 1);
  ctx.fillRect(2, -8, 1, 1);
  // helmet
  if (player.armor.head) {
    ctx.fillStyle = itemColor(player.armor.head.id);
    ctx.fillRect(-3, -11, 6, 2);
  }
  // held tool
  const held = getHeldTool();
  if (held) {
    const col = itemColor(held);
    if (col) {
      ctx.fillStyle = col;
      ctx.fillRect(4, -2, 11, 11);
    }
  }
  ctx.restore();
}

function drawMinimap() {
  const mm = document.getElementById('minimap');
  if (!gameRunning) { mm.style.display = 'none'; return; }
  mm.style.display = 'block';
  const cx = mm.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.fillStyle = '#0a0a0a'; cx.fillRect(0,0,180,120);
  const sc = 180 / WORLD_W;
  // draw ground as 1px tall strips
  for (let x=0;x<WORLD_W;x++) {
    let topY = -1;
    for (let y=0;y<WORLD_H;y++) {
      if (getTile(x,y) !== T.AIR) { topY = y; break; }
    }
    if (topY >= 0) {
      const t = getTile(x, topY);
      cx.fillStyle = TILE_COL[t] || '#000';
      cx.fillRect(x*sc, 0, Math.max(1, sc), 120);
    }
  }
  // player dot
  cx.fillStyle = '#ff4444';
  cx.fillRect(player.x/TILE * sc - 1, 0, 2, 120);
}

// main loop
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt * 60);
  updateFurnace(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
