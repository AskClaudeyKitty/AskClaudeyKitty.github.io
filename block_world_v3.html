<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2344aa44'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Press Start 2P', monospace; overflow: hidden; }
  #game-container { position: relative; image-rendering: pixelated; width: 960px; height: 540px; }
  canvas { border: 4px solid #333; cursor: crosshair; image-rendering: pixelated; }
  #ui { position: absolute; top: 8px; left: 8px; color: #fff; font-size: 10px; text-shadow: 2px 2px 0 #000; pointer-events: none; font-family: 'Press Start 2P', monospace; }
  #hp-bar { width: 160px; height: 16px; background: #222; border: 2px solid #555; margin-bottom: 6px; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #ff4444, #aa0000); transition: width 0.2s; }
  #stats { font-size: 8px; color: #ccc; }
  #hotbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 40px); gap: 3px; pointer-events: auto; }
  .slot { width: 40px; height: 40px; background: rgba(0,0,0,0.7); border: 2px solid #777; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; position: relative; font-family: 'Press Start 2P', monospace; cursor: pointer; }
  .slot.active { border-color: #ffff44; background: rgba(255,255,0,0.2); }
  .slot .count { position: absolute; bottom: 2px; right: 4px; font-size: 8px; color: #fff; text-shadow: 1px 1px 0 #000; }
  #inventory { position: absolute; top: 8px; right: 8px; background: rgba(15,15,25,0.95); border: 3px solid #555; width: 320px; display: none; flex-direction: column; font-family: 'Press Start 2P', monospace; max-height: 520px; }
  #inv-header { background: #2a2a3a; padding: 8px 10px; font-size: 10px; color: #ffff44; border-bottom: 2px solid #444; display: flex; justify-content: space-between; align-items: center; }
  #inv-close { cursor: pointer; color: #ff4444; font-size: 12px; }
  #inv-close:hover { color: #ff8888; }
  #inv-content { display: flex; flex-direction: column; padding: 8px; gap: 4px; overflow-y: auto; }
  #inv-crafting { flex: 1; }
  #inv-crafting h4 { color: #ffff44; font-size: 9px; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 3px; }
  .recipe { padding: 5px 6px; cursor: pointer; font-size: 8px; border-radius: 2px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }

  .recipe.can:hover { background: rgba(60,120,60,0.7); color: #aaffaa; }
  .recipe.cant { background: rgba(30,30,30,0.5); border: 1px solid #444; color: #666; }
  .recipe.cant:hover { background: rgba(40,40,40,0.6); color: #888; }
  .recipe-name { font-weight: bold; }
  .recipe-ing { font-size: 7px; color: #999; margin-top: 2px; }
  .recipe .out-icon { font-size: 12px; margin-right: 6px; }
  #msg { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); color: #ffff44; font-size: 10px; text-shadow: 2px 2px 0 #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; font-family: 'Press Start 2P', monospace; }
  #minimap { position: absolute; top: 8px; right: 8px; width: 200px; height: 120px; border: 2px solid #555; background: rgba(0,0,0,0.85); image-rendering: pixelated; display: none; }
  #armor-panel { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 4px; pointer-events: auto; }
  .armor-slot { width: 36px; height: 36px; background: rgba(0,0,0,0.7); border: 2px solid #777; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; font-family: 'Press Start 2P', monospace; cursor: pointer; }
  .armor-slot.active { border-color: #ffff44; }
  #chest-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(15,15,25,0.98); border: 3px solid #555; padding: 12px; display: none; flex-direction: column; gap: 8px; font-family: 'Press Start 2P', monospace; z-index: 10; }
  #chest-header { color: #ffff44; font-size: 10px; display: flex; justify-content: space-between; }
  #chest-grid { display: grid; grid-template-columns: repeat(5, 36px); gap: 3px; }
  .chest-slot { width: 36px; height: 36px; background: rgba(0,0,0,0.6); border: 2px solid #555; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; cursor: pointer; }

</style>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const TILE = 24;
let PIX = 1; // sub-tile pixel grid: 1=super low, 2=low(4), 3=med(9), 4=high(16)
let WORLD_W = 800, WORLD_H = 400;
let world = new Uint8Array(WORLD_W * WORLD_H);
let light = new Uint8Array(WORLD_W * WORLD_H);
const WORLD_SIZES = {
  small:  { w: 800,  h: 400,  label: 'Small' },
  medium: { w: 1800, h: 900,  label: 'Medium' },
  large:  { w: 4000, h: 2000, label: 'Large' },
};
const DAY_LEN = 24000;

// block texture patterns. Each pattern is an 8x8 string array using:
//   . = base color
//   b = darker (-25%)
//   d = darkest (-45%)
//   l = lighter (+15%)
//   w = white
//   k = black
//   s = saturated (+20% saturation)
//   * = accent (block-specific color)
// patterns are tiled across the world
const PATTERNS = {
  // dirt: brown specks
  1: [
    '.b.d..db',
    'd..b.d..',
    '..d.b.d.',
    'b..d..b.',
    'd.b..d.b',
    '..d.b.d.',
    'b.d..b.d',
    '.b.d..b.',
  ],
  // stone: gray with cracks
  2: [
    '..b..b..',
    'b..b..b.',
    '..k....b',
    '....b...',
    'b...b..b',
    '...k....',
    '..b...b.',
    'b....b..',
  ],
  // grass top: green w/ texture
  3: [
    'gGg.GgGg',
    'GgG..GgG',
    'gG.gGg.G',
    'GgG..gGg',
    'g.Gg.Gg.',
    'GgG..GgG',
    'gG.gGg.G',
    'GgG..GgG',
  ],
  // wood: vertical grain
  4: [
    'l..l..l.',
    '..l..l..',
    'd..d..d.',
    '..d..d..',
    'l..l..l.',
    '..l..l..',
    'd..d..d.',
    '..d..d..',
  ],
  31: null,
  // leaves: green clumps
  5: [
    'gG.gG.gG',
    '.gG.gG.g',
    'gG.gG.gG',
    '.gG.gG.g',
    'gG.gG.gG',
    '.gG.gG.g',
    'gG.gG.gG',
    '.gG.gG.g',
  ],
  // sand: yellow specks
  6: [
    '..l..l..',
    '.l..l..l',
    '..s..s..',
    '.s..s..s',
    '..l..l..',
    '.l..l..l',
    '..s..s..',
    '.s..s..s',
  ],
  // coal: dark w/ shiny black
  7: [
    '..k..k..',
    'k.KKK.k.',
    '..k..k..',
    '.kkk.kk.',
    '..k..k..',
    'k.K.K.k.',
    '..k..k..',
    '.kk.kkk.',
  ],
  // iron
  8: [
    '..b..b..',
    'b.RRR.b.',
    '..b..b..',
    '.bbb.bb.',
    '..b..b..',
    'b.R.b.b.',

// parse a pattern char into rgb modifier
function patColor(baseCol, ch) {
  if (!ch || ch === '.') return baseCol;
  // base to rgb
  let r, g, b, a = 1;
  const c = baseCol;
  if (c.length === 4) {
    r = parseInt(c[1] + c[1], 16);
    g = parseInt(c[2] + c[2], 16);
    b = parseInt(c[3] + c[3], 16);
  } else if (c.length === 7 || c.length === 9) {
    r = parseInt(c.slice(1, 3), 16);
    g = parseInt(c.slice(3, 5), 16);
    b = parseInt(c.slice(5, 7), 16);
    if (c.length === 9) a = parseInt(c.slice(7, 9), 16) / 255;
  }
  if (ch === 'b') { r = Math.floor(r * 0.75); g = Math.floor(g * 0.75); b = Math.floor(b * 0.75); }
  else if (ch === 'd') { r = Math.floor(r * 0.55); g = Math.floor(g * 0.55); b = Math.floor(b * 0.55); }
  else if (ch === 'l') { r = Math.min(255, Math.floor(r * 1.18)); g = Math.min(255, Math.floor(g * 1.18)); b = Math.min(255, Math.floor(b * 1.18)); }
  else if (ch === 'w') { r = 255; g = 255; b = 255; }
  else if (ch === 'k') { r = 0; g = 0; b = 0; }
  else if (ch === 'G') { r = Math.floor(r * 0.6); g = Math.min(255, Math.floor(g * 1.4)); b = Math.floor(b * 0.6); }
  else if (ch === 'g') { r = Math.floor(r * 0.7); g = Math.floor(g * 1.1); b = Math.floor(b * 0.7); }
  else if (ch === 'R') { r = Math.min(255, Math.floor(r * 1.4)); g = Math.floor(g * 0.6); b = Math.floor(b * 0.6); }
  else if (ch === 'Y') { r = Math.min(255, Math.floor(r * 1.4)); g = Math.min(255, Math.floor(g * 1.4)); b = Math.floor(b * 0.4); }
  else if (ch === 'O') { r = Math.min(255, Math.floor(r * 1.6)); g = Math.floor(g * 0.6); b = 0; }
  else if (ch === 'K') { r = Math.min(255, Math.floor(r * 1.6)); g = Math.min(255, Math.floor(g * 1.4)); b = 0; }
  else if (ch === 's') { r = Math.min(255, Math.floor(r * 1.2)); g = Math.min(255, Math.floor(g * 1.2)); b = Math.min(255, Math.floor(b * 1.2)); }
  return { r, g, b, a };
}

let biomeMap = [];

function generateBiomes(rng) {
  biomeMap = [];
  const biomes = ['forest', 'snow', 'desert', 'corruption', 'jungle', 'mushroom', 'ocean', 'lavaland'];
  let x = 0;
  while (x < WORLD_W) {
    const size = 60 + Math.floor(rng() * 140);
    const b = biomes[Math.floor(rng() * biomes.length)];
    for (let i = 0; i < size && x < WORLD_W; i++, x++) {
      biomeMap[x] = b;
    }
  }
}

function getBiome(x) {
  return biomeMap[x] || 'forest';
}

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generate(seed) {
  // ensure world/light arrays match WORLD_W * WORLD_H
  world = new Uint8Array(WORLD_W * WORLD_H);
  light = new Uint8Array(WORLD_W * WORLD_H);
  const rng = mulberry32(seed);
  generateBiomes(rng);
  function noise(x) {
    return Math.sin(x * 0.05) * 8 + Math.sin(x * 0.13) * 4 + Math.sin(x * 0.03) * 12;
  }
  const surface = [];
  for (let x = 0; x < WORLD_W; x++) surface[x] = Math.floor(60 + noise(x));

  for (let x = 0; x < WORLD_W; x++) {
    const biome = getBiome(x);
    for (let y = 0; y < WORLD_H; y++) {
      const i = y * WORLD_W + x;
      const s = surface[x];
      if (y < s) { world[i] = 0; continue; }

      if (biome === 'snow') {
        if (y === s) world[i] = 19;
        else if (y < s + 3) world[i] = 17;
        else if (y < s + 10) world[i] = 18;
        else {
          world[i] = 2;
          if (rng() < 0.03) world[i] = 7;
          if (rng() < 0.015) world[i] = 8;
        }
      } else if (biome === 'jungle') {
        if (y === s) world[i] = 32;
        else if (y < s + 3) world[i] = 33;
        else if (y < s + 12) world[i] = 1;
        else {
          world[i] = 2;
          if (rng() < 0.03) world[i] = 7;
          if (rng() < 0.015) world[i] = 8;
          if (rng() < 0.008) world[i] = 63; // emerald ore
        }
      } else if (biome === 'mushroom') {
        if (y === s) world[i] = 37;
        else if (y < s + 3) world[i] = 38;
        else if (y < s + 8) world[i] = rng() < 0.4 ? 38 : 1;
        else {
          world[i] = 2;
          if (rng() < 0.04) world[i] = 7;
          if (rng() < 0.02) world[i] = 8;
        }
      } else if (biome === 'ocean') {
        if (y < s + 8) world[i] = 24; // water
        else if (y < s + 11) world[i] = 6; // sand floor
        else { world[i] = 2; }
      } else if (biome === 'lavaland') {
        if (y < s + 4) world[i] = 25; // lava surface
        else if (y < s + 8) world[i] = 42; // lava rock
        else { world[i] = 2; if (rng() < 0.01) world[i] = 26; } // hellstone
      } else if (biome === 'desert') {
        if (y === s) world[i] = 6;
        else if (y < s + 15) world[i] = 6;
        else {
          world[i] = 2;
          if (rng() < 0.02) world[i] = 7;
          if (rng() < 0.01) world[i] = 8;
        }
      } else if (biome === 'corruption') {
        if (y === s) world[i] = 21;
        else if (y < s + 3) world[i] = 1;
        else if (y < s + 12) world[i] = 22;
        else {
          world[i] = 22;
          if (rng() < 0.04) world[i] = 7;
          if (rng() < 0.02) world[i] = 8;
        }
      } else {
        if (y === s) world[i] = 3;
        else if (y < s + 3) world[i] = 1;
        else if (y < s + 8) world[i] = rng() < 0.3 ? 6 : 1;
        else if (y < s + 20) {
          world[i] = 2;
          if (rng() < 0.03) world[i] = 7;
          if (rng() < 0.015) world[i] = 8;
          if (y > s + 15 && rng() < 0.008) world[i] = 9;
        } else {
          world[i] = 2;
          if (rng() < 0.05) world[i] = 7;
          if (rng() < 0.02) world[i] = 8;
          if (y > s + 30 && rng() < 0.01) world[i] = 9;
          if (rng() < 0.1) world[i] = 16;
        }
      }
      if (y > s + 5) {
        // Multiple cave systems with varying sizes
        const cave1 = Math.sin(x * 0.08 + seed * 0.01) * Math.sin(y * 0.12 + seed * 0.02);
        const cave2 = Math.sin(x * 0.15 + y * 0.07 + seed * 0.03);
        const cave3 = Math.sin(x * 0.03 + seed * 0.05) * Math.cos(y * 0.05);
        const cave4 = Math.sin(x * 0.25 + y * 0.18) * Math.cos(x * 0.11);
        if (cave1 + cave2 > 0.5 + rng() * 0.3) world[i] = 0;
        if (cave3 > 0.7) world[i] = 0;
        if (cave4 > 0.8 && rng() < 0.3) world[i] = 0;
      }
    }

    // Trees / Cacti
    const base = surface[x];
    const topBlock = getBlock(x, base);
    if (x % 7 === 3 && rng() < 0.6) {
      if (biome === 'desert' && topBlock === 6) {
        for (let ty = base - 1; ty >= base - 3 && ty >= 0; ty--) {
          if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 20;
        }
      } else if (biome === 'jungle' && topBlock === 32) {
        // jungle tree: tall, jungle wood + jungle leaves
        const h = 7 + Math.floor(rng() * 4);
        for (let ty = base - 1; ty >= base - h && ty >= 0; ty--) {
          if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 34;
        }
        for (let dy = -h + 1; dy >= -h - 1; dy--) {
          for (let dx = -3; dx <= 3; dx++) {
            const ly = base + dy, lx = x + dx;
            if (ly >= 0 && lx >= 0 && lx < WORLD_W && getBlock(lx, ly) === 0) {
              if (Math.abs(dx) === 3 && Math.abs(dy - (-h + 2)) < 2) continue;
              world[ly * WORLD_W + lx] = 35;
            }
          }
        }
        if (rng() < 0.5) world[(base - 1) * WORLD_W + x - 1] = 36; // bamboo vine
      } else if (biome === 'mushroom' && topBlock === 37) {
        // giant mushroom: cap
        const h = 4 + Math.floor(rng() * 2);
        for (let ty = base - 1; ty >= base - h && ty >= 0; ty--) {
          if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 38;
        }
        // cap
        for (let dy = -h; dy >= -h - 1; dy--) {
          for (let dx = -3; dx <= 3; dx++) {
            const ly = base + dy, lx = x + dx;
            if (ly >= 0 && lx >= 0 && lx < WORLD_W && getBlock(lx, ly) === 0) {
              if (Math.abs(dx) === 3 && dy === -h) continue;
              world[ly * WORLD_W + lx] = 39;
            }
          }
        }
      } else if ((topBlock === 3 || topBlock === 19) && getBlock(x, base) !== 0) {
        for (let ty = base - 1; ty >= base - 5 && ty >= 0; ty--) {
          if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 4;
        }
        for (let dy = -3; dy >= -5; dy--) {
          for (let dx = -2; dx <= 2; dx++) {
            const ly = base + dy, lx = x + dx;
            if (ly >= 0 && lx >= 0 && lx < WORLD_W && getBlock(lx, ly) === 0) {
              world[ly * WORLD_W + lx] = 5;
            }
          }
        }
      }
    }
  }

  // Random villages on surface
  const villageCount = 2 + Math.floor(rng() * 3);
  for (let v = 0; v < villageCount; v++) {
    const vx = Math.floor(80 + rng() * (WORLD_W - 160));
    const vy = surface[vx];
    const houseW = 5 + Math.floor(rng() * 4);
    const houseH = 3 + Math.floor(rng() * 2);
    for (let hx = 0; hx < houseW; hx++) {
      for (let hy = 0; hy < houseH; hy++) {
        const wx = vx + hx, wy = vy - 1 - hy;
        if (wx >= 0 && wx < WORLD_W && wy >= 0 && wy < WORLD_H) {
          if (hx === 0 || hx === houseW - 1 || hy === 0 || hy === houseH - 1) {
            world[wy * WORLD_W + wx] = 11;
          }
        }
      }
    }
    const doorX = vx + Math.floor(houseW / 2);
    const doorY = vy - 1;
    if (doorX >= 0 && doorX < WORLD_W && doorY >= 0 && doorY < WORLD_H) {
      world[doorY * WORLD_W + doorX] = 29;
    }
    const villagerX = (vx + Math.floor(houseW/2)) * TILE + 4;
    const villagerY = (vy - 2) * TILE;
    const tradePool = [
      { give: { id: 38, count: 10 }, get: { id: 26, count: 1 }, msg: "10 arrows for a bow" },
      { give: { id: 2, count: 20 }, get: { id: 37, count: 1 }, msg: "20 dirt for a wooden pick" },
      { give: { id: 6, count: 5 }, get: { id: 30, count: 1 }, msg: "5 stone for a sword" },
      { give: { id: 7, count: 3 }, get: { id: 38, count: 30 }, msg: "3 iron for 30 arrows" },
      { give: { id: 34, count: 5 }, get: { id: 7, count: 2 }, msg: "5 gel for 2 iron" }
    ];
    const trade = tradePool[Math.floor(rng() * tradePool.length)];
    entities.push({ x: villagerX, y: villagerY, w: 16, h: 30, type: 'villager', life: 999999, dir: 1, timer: 0, vx: 0, vy: 0, onGround: false, homeX: vx * TILE, homeW: houseW * TILE, trade: trade });
  }

  // Random loot chests in caves
  const chestCount = 8 + Math.floor(rng() * 12);
  for (let i = 0; i < chestCount; i++) {
    const cx = Math.floor(rng() * WORLD_W);
    const cy = Math.floor(rng() * (WORLD_H - 100) + 60);
    if (getBlock(cx, cy) === 0 && isSolid(cx, cy + 1)) {
      setBlock(cx, cy, 23);
      const loot = [];
      const roll = rng();
      if (roll < 0.15) {
        loot.push({ id: 26, count: 1 });
        loot.push({ id: 30, count: 1 });
      } else if (roll < 0.3) {
        loot.push({ id: 37, count: 1 });
        loot.push({ id: 38, count: 20 + Math.floor(rng() * 30) });
      } else if (roll < 0.45) {
        loot.push({ id: 39, count: 1 });
        loot.push({ id: 40, count: 1 });
        loot.push({ id: 41, count: 1 });
      } else if (roll < 0.6) {
        loot.push({ id: 28, count: 1 });
      } else if (roll < 0.75) {
        loot.push({ id: 32, count: 1 });
      } else {
        loot.push({ id: 34, count: 3 + Math.floor(rng() * 5) });
        loot.push({ id: 10, count: 5 + Math.floor(rng() * 10) });
      }
      chests.set(`${cx},${cy}`, loot);
    }
  }

  // Water pools
  for (let i = 0; i < 15 + Math.floor(rng() * 10); i++) {
    const wx = Math.floor(rng() * WORLD_W);
    const wy = Math.floor(rng() * (WORLD_H - 150) + 80);
    const wsize = 3 + Math.floor(rng() * 8);
    for (let dx = -wsize; dx <= wsize; dx++) {
      for (let dy = 0; dy <= wsize; dy++) {
        const lx = wx + dx, ly = wy + dy;
        if (lx >= 0 && lx < WORLD_W && ly >= 0 && ly < WORLD_H) {
          if (getBlock(lx, ly) === 0 && isSolid(lx, ly + 1)) {
            world[ly * WORLD_W + lx] = 24;
          }
        }
      }
    }
  }

  // Lava at bottom + hell biome
  for (let x = 0; x < WORLD_W; x++) {
    for (let y = WORLD_H - 20; y < WORLD_H; y++) {
      const i = y * WORLD_W + x;
      if (world[i] === 2 || world[i] === 0) {
        if (y > WORLD_H - 8) world[i] = 25;
        else world[i] = 26;
      }
    }
  }

  // Ocean edges
  for (let x = 0; x < 30; x++) {
    const depth = Math.floor(30 - x * 0.8);
    for (let y = surface[x]; y < surface[x] + depth && y < WORLD_H; y++) {
      world[y * WORLD_W + x] = 24;
    }
  }
  for (let x = WORLD_W - 30; x < WORLD_W; x++) {
    const depth = Math.floor(30 - (WORLD_W - 1 - x) * 0.8);
    for (let y = surface[x]; y < surface[x] + depth && y < WORLD_H; y++) {
      world[y * WORLD_W + x] = 24;
    }
  }

  const px = Math.floor(50 + rng() * (WORLD_W - 100));
  player.x = px * TILE;
  const surfaceY = surface[px];
  let spawnY = surfaceY - 3;
  while (spawnY > 0 && getBlock(px, spawnY) !== 0) spawnY--;
  player.y = spawnY * TILE;
}

function getBlock(x, y) {
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return 0;
  return world[y * WORLD_W + x];
}

function setBlock(x, y, id) {
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return;
  world[y * WORLD_W + x] = id;
  if (mpRoomCode) {
    supaFetch('mp_blocks', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates' },
      body: { room_code: mpRoomCode, x, y, block_id: id, updated_at: new Date().toISOString() }
    }).catch(() => {});
  }
}

function isSolid(x, y) {
  const b = BLOCKS[getBlock(x, y)];
  return b && b.solid;
}

function addItem(id, count) {
  const item = ITEMS[id] || BLOCKS[id];
  if (!item) return;
  for (let i = 0; i < 20; i++) {
    if (player.hotbar[i] && player.hotbar[i].id === id) {
      player.hotbar[i].count += count;
      updateHotbar();
      if (craftingOpen) updateCrafting();
      return;
    }
  }
  for (let i = 0; i < 20; i++) {
    if (!player.hotbar[i]) {
      player.hotbar[i] = { id, count };
      updateHotbar();
      if (craftingOpen) updateCrafting();
      return;
    }
  }
  for (const s of player.inv) {
    if (s.id === id) { s.count += count; updateHotbar(); if (craftingOpen) updateCrafting(); return; }
  }
  player.inv.push({ id, count });
  updateHotbar();
  if (craftingOpen) updateCrafting();
}

function hasItems(need) {
  const all = [...player.hotbar.filter(s => s), ...player.inv];
  for (const [id, count] of need) {
    let have = 0;
    for (const s of all) if (s.id === id) have += s.count;
    if (have < count) return false;
  }
  return true;
}

function consumeItems(need) {
  for (const [id, count] of need) {
    let rem = count;
    for (const s of player.hotbar) {
      if (s && s.id === id) {
        const take = Math.min(rem, s.count);
        s.count -= take;
        rem -= take;
        if (s.count <= 0) {
          const idx = player.hotbar.indexOf(s);
          player.hotbar[idx] = null;
        }
        if (rem <= 0) break;
      }
    }
    for (const s of player.inv) {
      if (s.id === id) {
        const take = Math.min(rem, s.count);
        s.count -= take;
        rem -= take;
        if (s.count <= 0) {
          const idx = player.inv.indexOf(s);
          player.inv.splice(idx, 1);
        }
        if (rem <= 0) break;
      }
    }
  }
  updateHotbar();
}

function updateHotbar() {
  const el = document.getElementById('hotbar');
  el.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const s = player.hotbar[i];
    const div = document.createElement('div');
    div.className = 'slot' + (i === player.selected ? ' active' : '');
    div.dataset.index = i;
    if (s) {
      const item = ITEMS[s.id] || BLOCKS[s.id];
      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 32;
      canvas.style.cssText = 'image-rendering: pixelated; display:block; margin: 0 auto;';
      const cx2 = canvas.getContext('2d');
      drawItemSprite(0, 0, 32, s.id, item, cx2);
      div.appendChild(canvas);
      if (s.count > 1) {
        const c = document.createElement('span');
        c.className = 'count';
        c.textContent = s.count;
        div.appendChild(c);
      }
    }
    div.onclick = () => {
      player.selected = i;
      updateHotbar();
    };
    el.appendChild(div);
  }
}

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 2000);
}

function toggleCrafting() {
  const panel = document.getElementById('inventory');
  const closeBtn = document.getElementById('inv-close');
  if (closeBtn) closeBtn.onclick = toggleCrafting;
  craftingOpen = !craftingOpen;
  panel.style.display = craftingOpen ? 'flex' : 'none';
  if (craftingOpen) updateCrafting();
}

function updateCrafting() {
  const recipesEl = document.getElementById('inv-recipes');
  recipesEl.innerHTML = '';

  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  let nearCraft = false, nearSmelt = false;
  for (let dy = -3; dy <= 3; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      const b = getBlock(px + dx, py + dy);
      if (b === 12) nearCraft = true;
      if (b === 13) nearSmelt = true;
    }
  }

  for (const r of RECIPES) {
    const outItem = ITEMS[r.out] || BLOCKS[r.out];
    const canCraft = hasItems(r.need);
    const stationOk = (!r.station || (r.station === 'smelt' && nearSmelt) || (r.station !== 'smelt' && (r.anywhere || nearCraft)));

    const div = document.createElement('div');
    div.className = 'recipe ' + (canCraft && stationOk ? 'can' : 'cant');

    const left = document.createElement('div');
    const icon = document.createElement('span');
    icon.className = 'out-icon';
    icon.textContent = outItem?.icon || outItem?.name?.[0] || '?';
    icon.style.color = outItem?.color || '#fff';

    const name = document.createElement('span');
    name.className = 'recipe-name';
    name.textContent = `${outItem?.name || '?'} x${r.count}`;

    left.appendChild(icon);
    left.appendChild(name);

    const ing = document.createElement('div');
    ing.className = 'recipe-ing';
    const needText = r.need.map(n => {
      const it = ITEMS[n[0]] || BLOCKS[n[0]];
      return `${it?.name || '?'} x${n[1]}`;
    }).join(', ');
    const stationText = r.station === 'smelt' ? ' [Furnace]' : (!r.anywhere ? ' [Table]' : '');
    ing.textContent = needText + stationText;

    div.appendChild(left);
    div.appendChild(ing);

    if (canCraft && stationOk) {
      div.onclick = () => {
        consumeItems(r.need);
        addItem(r.out, r.count);
        showMsg(`Crafted ${outItem?.name}`);
        updateCrafting();
      };
    }

    recipesEl.appendChild(div);
  }
}

function useItem(slot) {
  if (!slot || !ITEMS[slot.id]) return;
  const item = ITEMS[slot.id];
  if (item.use === 'summon_eye') {
    const ex = player.x + (Math.random() < 0.5 ? -200 : 200);
    const ey = player.y - 100;
    spawnEnemy(ex, ey, 'eye');
    showMsg('A terrible presence approaches...');
    slot.count--;
    if (slot.count <= 0) player.hotbar[player.selected] = null;
    updateHotbar();
    return;
  }
  // potions
  if (item.id === 86) { player.hp = Math.min(player.maxHp, player.hp + 80); showMsg('+80 HP'); }
  else if (item.id === 87) { showMsg('Mana restored'); }
  else if (item.id === 88) { player.status = 'swift'; player.statusT = 600; showMsg('Speed boost!'); }
  else if (item.id === 89) { player.status = 'strong'; player.statusT = 600; showMsg('Strength!'); }
  else if (item.id === 92) { player.status = 'ironskin'; player.statusT = 600; showMsg('Ironskin!'); }
  else if (item.id === 93) { player.status = 'regen'; player.statusT = 600; showMsg('Regeneration!'); }
  else if (item.id === 94) { player.status = 'obsidian'; player.statusT = 600; showMsg('Obsidian Skin!'); }
  else return;
  slot.count--;
  if (slot.count <= 0) player.hotbar[player.selected] = null;
  updateHotbar();
  SFX.collect();
}
function spawnEnemy(x, y, type) {
  const t = ENEMY_TYPES[type] || ENEMY_TYPES.slime;
  entities.push({ x, y, vx: 0, vy: 0, w: t.w, h: t.h, type,
    hp: t.hp, maxHp: t.hp, dmg: t.dmg, color: t.color, drops: t.drops,
    boss: t.boss, fly: t.fly,
    timer: 0, dir: Math.random() < 0.5 ? -1 : 1 });
}

function spawnDrop(x, y, id, count) {
  entities.push({ x, y, vx: (Math.random() - 0.5) * 3, vy: -2,
    w: 10, h: 10, type: 'drop', id, count, life: 600 });
}

function spawnParticle(x, y, color, count) {
  const n = count || 4;
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 - 1,
      life: 20 + Math.random() * 15, color, size: 2 + Math.random() * 3 });
  }
}

function spawnFloatingText(x, y, dmg, color) {
  floatingTexts.push({ x, y, text: '-' + Math.round(dmg), color: color || '#ffff66', life: 45, size: 9 });
}

function drawItemSprite(x, y, size, id, item, _ctx) {
  const c = _ctx || ctx;
  // shadow
  c.fillStyle = 'rgba(0,0,0,0.3)';
  c.fillRect(x + 1, y + size - 2, size - 2, 2);

  const pat = ITEM_PATTERNS[id];
  if (pat && item) {
    // render 16x16 pattern scaled to size
    const cell = size / 16;
    for (let py = 0; py < 16; py++) {
      const row = pat[py];
      if (!row) continue;
      for (let ppx = 0; ppx < 16; ppx++) {
        const ch = row[ppx];
        if (ch === 'g' || ch === '.' || ch === ' ') continue; // transparent
        const col = patColor(item.color || '#ffffff', ch);
        c.fillStyle = `rgba(${col.r},${col.g},${col.b},${col.a})`;
        c.fillRect(x + Math.floor(ppx * cell), y + Math.floor(py * cell), Math.ceil(cell) + 1, Math.ceil(cell) + 1);
      }
    }
    return;
  }

  if (!item) {
    c.fillStyle = '#fff';
    c.fillRect(x + 2, y + 2, size - 4, size - 4);
    return;
  }
  if (item.tool === 'pick') {
    const col = item.color || '#aa7744';
    c.fillStyle = '#888';
    c.fillRect(x + 2, y + 2, size - 4, Math.max(3, size/4));
    c.fillStyle = '#aaa';
    c.fillRect(x + 2, y + 2, size/2, Math.max(3, size/4));
    c.fillStyle = '#666';
    c.fillRect(x + size - 5, y + 1, 3, Math.max(3, size/4));
    c.fillStyle = col;
    c.fillRect(x + size/2 - 1, y + size/4, 2, size - size/4 - 1);
  } else {
    // generic fallback for items without specific 8x8 sprite
    const col = item.color || '#ffffff';
    c.fillStyle = col;
    c.fillRect(x + 2, y + 2, size - 4, size - 4);
    c.fillStyle = '#fff';
    c.fillRect(x + 3, y + 2, size - 6, 1);
    c.fillStyle = '#000';
    c.fillRect(x + 2, y + size - 3, size - 4, 1);
  }
}

function updatePlayer() {
  const speed = gameMode === 'creative' ? 0.8 : 0.4;
  let jump = -7.5, friction = 0.85, gravity = gameMode === 'creative' ? 0.15 : 0.35;
  // status effects
  if (player.status) {
    player.statusT--;
    if (player.status === 'swift') { speed *= 1.5; }
    if (player.status === 'burn') { player.hp -= 0.1; }
    if (player.status === 'poison') { player.hp -= 0.05; }
    if (player.status === 'regen') { if (time % 30 === 0) player.hp = Math.min(player.maxHp, player.hp + 1); }
    if (player.statusT <= 0) player.status = null;
  }

  if (gameMode === 'creative') {
    if (keys['a'] || keys['ArrowLeft']) { player.vx -= speed; player.facing = -1; }
    if (keys['d'] || keys['ArrowRight']) { player.vx += speed; player.facing = 1; }
    if (keys['w'] || keys['ArrowUp']) { player.vy -= speed; }
    if (keys['s'] || keys['ArrowDown']) { player.vy += speed; }
    player.vx *= friction; player.vy *= friction;
    player.x += player.vx; player.y += player.vy;
    player.onGround = false;
  } else {
    if (keys['a'] || keys['ArrowLeft']) { player.vx -= speed; player.facing = -1; }
    if (keys['d'] || keys['ArrowRight']) { player.vx += speed; player.facing = 1; }
    if ((keys['w'] || keys[' '] || keys['ArrowUp']) && player.onGround) {
      player.vy = jump; player.onGround = false; SFX.jump();
    }
    player.vx *= friction;
    player.vy += gravity;

    // X collision
    player.x += player.vx;
    const topY = Math.floor(player.y / TILE);
    const botY = Math.floor((player.y + player.h - 1) / TILE);
    if (player.vx > 0) {
      const rightEdge = Math.floor((player.x + player.w) / TILE);
      if (isSolid(rightEdge, topY) || isSolid(rightEdge, botY)) {
        player.x = rightEdge * TILE - player.w - 0.1;
        player.vx = 0;
      }
    } else if (player.vx < 0) {
      const leftEdge = Math.floor(player.x / TILE);
      if (isSolid(leftEdge, topY) || isSolid(leftEdge, botY)) {
        player.x = (leftEdge + 1) * TILE + 0.1;
        player.vx = 0;
      }
    }

    // Y collision
    player.y += player.vy;
    const leftX = Math.floor(player.x / TILE);
    const rightX = Math.floor((player.x + player.w - 1) / TILE);
    if (player.vy > 0) {
      const botEdge = Math.floor((player.y + player.h) / TILE);
      if (isSolid(leftX, botEdge) || isSolid(rightX, botEdge)) {
        player.y = botEdge * TILE - player.h - 0.1;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }
    } else if (player.vy < 0) {
      const topEdge = Math.floor(player.y / TILE);
      if (isSolid(leftX, topEdge) || isSolid(rightX, topEdge)) {
        player.y = (topEdge + 1) * TILE + 0.1;
        player.vy = 0;
      }
    } else {
      const botEdge = Math.floor((player.y + player.h) / TILE);
      player.onGround = isSolid(leftX, botEdge) || isSolid(rightX, botEdge);
    }
  }

  player.x = Math.max(0, Math.min(WORLD_W * TILE - player.w, player.x));
  player.y = Math.max(0, Math.min(WORLD_H * TILE - player.h, player.y));

  if (gameMode !== 'creative') {
    player.hunger -= 0.005 * getDiffMult();
    if (player.hunger <= 0) { player.hunger = 0; player.hp -= 0.05 * getDiffMult(); }
  }

  camX += (player.x - W/2 - camX) * 0.1;
  camY += (player.y - H/2 - camY) * 0.1;
  camX = Math.max(0, Math.min(WORLD_W * TILE - W, camX));
  camY = Math.max(0, Math.min(WORLD_H * TILE - H, camY));
}

function updateEntities() {
  const px = player.x + player.w/2, py = player.y + player.h/2;
  const playerTX = Math.floor((player.x + player.w/2) / TILE);
  const playerTY = Math.floor((player.y + player.h/2) / TILE);
  for (let i = entities.length - 1; i >= 0; i--) {
    const e = entities[i];
    const dist = Math.hypot(e.x - px, e.y - py);
    if (dist > 1200 && e.type !== 'drop') continue;
    if (e.type === 'drop') {
      e.vy += 0.3; e.x += e.vx; e.y += e.vy; e.vx *= 0.9;
      const ty = Math.floor((e.y + e.h) / TILE);
      const tx = Math.floor((e.x + e.w/2) / TILE);
      if (isSolid(tx, ty)) { e.y = ty * TILE - e.h; e.vy = 0; e.vx *= 0.5; }
      const dx = px - (e.x + e.w/2);
      const dy = py - (e.y + e.h/2);
      if (Math.hypot(dx, dy) < 30) {
        addItem(e.id, e.count);
        showMsg(`+${e.count} ${ITEMS[e.id]?.name || BLOCKS[e.id]?.name}`);
        SFX.collect();
        entities.splice(i, 1); continue;
      }
      e.life--;
      if (e.life <= 0) entities.splice(i, 1);
    } else if (e.drops || e.type === 'slime' || e.type === 'zombie') {
      const dx = px - (e.x + e.w/2);
      const dy = py - (e.y + e.h/2);
      const edist = Math.hypot(dx, dy);

      if (edist < 300) {
        e.dir = dx > 0 ? 1 : -1;
        e.vx += e.dir * 0.1;
        // slimes hop frequently
        if (e.type === 'slime') {
          if (e.onGround && Math.random() < 0.1) {
            e.vy = -7;
            e.bounceT = 8;
          }
        } else {
          if (e.onGround && Math.random() < 0.03) e.vy = -5;
        }
      } else {
        e.vx += e.dir * 0.03;
        if (Math.random() < 0.01) e.dir *= -1;
        if (e.type === 'slime' && e.onGround && Math.random() < 0.04) {
          e.vy = -6;
          e.bounceT = 8;
        }
      }
      if (e.bounceT > 0) e.bounceT--;
      // boss: eye of cthulhu attack pattern
      if (e.boss) {
        e.phase = (e.phase || 0) + 1;
        const tx = px, ty = py;
        const cdx = tx - (e.x + e.w/2);
        const cdy = ty - (e.y + e.h/2);
        const cdist = Math.hypot(cdx, cdy);
        if (e.type === 'eye') {
          // cycle: hover->dash->reposition
          e.timer = (e.timer || 0) + 1;
          if (e.timer < 60) {
            // hover to one side
            const sideTargetX = px + (e.dir > 0 ? 80 : -80);
            const sideTargetY = py - 60;
            e.vx += (sideTargetX - (e.x + e.w/2)) * 0.02;
            e.vy += (sideTargetY - (e.y + e.h/2)) * 0.02;
            e.vx *= 0.92;
            e.vy *= 0.92;
          } else if (e.timer < 90) {
            // dash toward player
            const ang = Math.atan2(cdy, cdx);
            e.vx = Math.cos(ang) * 4;
            e.vy = Math.sin(ang) * 4;
          } else if (e.timer < 150) {
            // retreat/reposition
            const ang = Math.atan2(-cdy, -cdx);
            e.vx += Math.cos(ang) * 0.05;
            e.vy += Math.sin(ang) * 0.05;
            e.vx *= 0.96;
            e.vy *= 0.96;
          } else {
            e.timer = 0;
            e.dir = cdx > 0 ? 1 : -1;
          }
          // spawn small "servant" occasionally
          if (e.hp < e.maxHp * 0.5 && Math.random() < 0.005) {
            spawnEnemy(e.x + 20, e.y + 20, 'eater');
          }
        } else {
          // generic boss hover
          const targetY = py - 80;
          e.vy += (targetY - (e.y + e.h/2)) * 0.01;
          e.vy *= 0.95;
        }
      } else if (!e.fly) {
        e.vy += 0.35;
      }
      e.vx *= 0.9;
      
      // X movement with proper edge collision
      e.x += e.vx;
      const topY = Math.floor(e.y / TILE);
      const botY = Math.floor((e.y + e.h - 1) / TILE);
      const leadX = e.vx > 0 ? Math.floor((e.x + e.w) / TILE) : Math.floor(e.x / TILE);
      if (isSolid(leadX, topY) || isSolid(leadX, botY)) {
        // Try step up
        if (!isSolid(leadX, topY - 1)) {
          e.y = (topY - 1) * TILE;
        } else {
          e.x = e.vx > 0 ? leadX * TILE - e.w - 0.1 : (leadX + 1) * TILE + 0.1;
          e.vx = 0;
          e.dir *= -1;
        }
      }
      
      // Y movement with proper edge collision
      e.y += e.vy;
      const leftX2 = Math.floor(e.x / TILE);
      const rightX2 = Math.floor((e.x + e.w - 1) / TILE);
      const botTile = Math.floor((e.y + e.h) / TILE);
      const topTile = Math.floor(e.y / TILE);
      if (e.vy > 0) {
        if (isSolid(leftX2, botTile) || isSolid(rightX2, botTile)) {
          e.y = botTile * TILE - e.h - 0.1;
          e.vy = 0;
          e.onGround = true;
        } else {
          e.onGround = false;
        }
      } else if (e.vy < 0) {
        if (isSolid(leftX2, topTile) || isSolid(rightX2, topTile)) {
          e.y = (topTile + 1) * TILE + 0.1;
          e.vy = 0;
        }
        e.onGround = false;
      } else {
        e.onGround = isSolid(leftX2, botTile) || isSolid(rightX2, botTile);
      }
      
      if (edist < 20 && player.hp > 0 && gameMode !== 'creative') {
        const def = getArmorDef();
        const mult = getDiffMult();
        const raw = (e.dmg || 5) * 0.1 * mult;
        player.hp -= Math.max(raw * (1 - def * 0.05), raw * 0.2);
        player.vx += (dx > 0 ? 1 : -1) * 3;
        player.vy -= 2;
        SFX.hurt();
      }
      if (player.swing > 0 && edist < 40) {
        const tool = player.hotbar[player.selected];
        const sword = tool && ITEMS[tool.id]?.tool === 'sword' ? ITEMS[tool.id] : null;
        let dmg = sword ? sword.dmg : 5;
        let knockback = 4;
        // status effects from sword
        if (sword && sword.id === 63) { e.status = 'burn'; e.statusT = 180; dmg += 5; } // hellstone
        if (sword && sword.id === 82) { e.status = 'poison'; e.statusT = 120; } // ruby
        e.hp -= dmg;
        e.vx += (dx > 0 ? -1 : 1) * knockback; e.vy -= 3;
        spawnParticle(e.x + e.w/2, e.y + e.h/2, '#fff');
        spawnParticle(e.x + e.w/2, e.y + e.h/2, sword ? sword.color : '#ffaa44');
        spawnFloatingText(e.x + e.w/2, e.y, dmg, sword ? sword.color : '#ffff66');
        SFX.hit();
        if (e.hp <= 0) {
          SFX.enemyDie();
          achievements.stats.killed++;
          checkAchievements();
          entities.splice(i, 1);
        }
      }
    } else if (e.type === 'arrow') {
      e.x += e.vx; e.y += e.vy; e.vy += 0.15;
      e.life--;
      const etx = Math.floor((e.x + e.w/2) / TILE);
      const ety = Math.floor((e.y + e.h/2) / TILE);
      if (isSolid(etx, ety)) { entities.splice(i, 1); continue; }
      for (let j = entities.length - 1; j >= 0; j--) {
        const en = entities[j];
        if (en.boss || en.drops) {
          const adx = (en.x + en.w/2) - e.x;
          const ady = (en.y + en.h/2) - e.y;
          if (Math.hypot(adx, ady) < 20) {
            en.hp -= 15;
            en.vx += e.dir * 3; en.vy -= 2;
            spawnParticle(en.x + en.w/2, en.y + en.h/2, '#f44');
            if (en.hp <= 0) {
              if (en.drops) for (const [id, cnt] of en.drops) spawnDrop(en.x, en.y, id, cnt);
              SFX.enemyDie();
              achievements.stats.killed++;
              checkAchievements();
              entities.splice(j, 1);
            }
            entities.splice(i, 1); break;
          }
        }
      }
      if (e.life <= 0) entities.splice(i, 1);
    } else if (e.type === 'villager') {
      e.timer++;
      if (e.timer % 120 === 0) {
        e.dir = Math.random() < 0.5 ? 1 : -1;
      }
      if (e.timer % 30 === 0 && e.onGround && Math.random() < 0.3) {
        e.vy = -3;
      }
      e.vx += e.dir * 0.04;
      e.vx *= 0.9; e.vy += 0.35;
      
      // X movement with proper edge collision
      e.x += e.vx;
      const vTopY = Math.floor(e.y / TILE);
      const vBotY = Math.floor((e.y + e.h - 1) / TILE);
      const vLeadX = e.vx > 0 ? Math.floor((e.x + e.w) / TILE) : Math.floor(e.x / TILE);
      if (isSolid(vLeadX, vTopY) || isSolid(vLeadX, vBotY)) {
        // Try step up
        if (!isSolid(vLeadX, vTopY - 1)) {
          e.y = (vTopY - 1) * TILE;
        } else {
          e.x = e.vx > 0 ? vLeadX * TILE - e.w - 0.1 : (vLeadX + 1) * TILE + 0.1;
          e.vx = 0;
          e.dir *= -1;
        }
      }
      
      // Y movement with proper edge collision
      e.y += e.vy;
      const vLeftX = Math.floor(e.x / TILE);
      const vRightX = Math.floor((e.x + e.w - 1) / TILE);
      const vBotTile = Math.floor((e.y + e.h) / TILE);
      const vTopTile = Math.floor(e.y / TILE);
      if (e.vy > 0) {
        if (isSolid(vLeftX, vBotTile) || isSolid(vRightX, vBotTile)) {
          e.y = vBotTile * TILE - e.h - 0.1;
          e.vy = 0;
          e.onGround = true;
        } else {
          e.onGround = false;
        }
      } else if (e.vy < 0) {
        if (isSolid(vLeftX, vTopTile) || isSolid(vRightX, vTopTile)) {
          e.y = (vTopTile + 1) * TILE + 0.1;
          e.vy = 0;
        }
        e.onGround = false;
      } else {
        e.onGround = isSolid(vLeftX, vBotTile) || isSolid(vRightX, vBotTile);
      }
      if (e.homeX !== undefined && (e.x < e.homeX - 20 || e.x > e.homeX + e.homeW + 20)) {
        e.dir = e.x < e.homeX ? 1 : -1;
      }
      const vdx = px - (e.x + e.w/2);
      const vdy = py - (e.y + e.h/2);
      if (Math.hypot(vdx, vdy) < 40 && keys['e']) {
        openTradeUI(e);
        keys['e'] = false;
      }
    }
  }
  // status effect processing on enemies
  for (const e of entities) {
    if (!e.status) continue;
    e.statusT--;
    if (e.status === 'burn') {
      if (time % 20 === 0) {
        e.hp -= 2;
        spawnParticle(e.x + e.w/2, e.y + e.h/2, '#ff6622', 2);
      }
    } else if (e.status === 'poison') {
      if (time % 30 === 0) {
        e.hp -= 1;
        spawnParticle(e.x + e.w/2, e.y + e.h/2, '#88ff44', 1);
      }
    } else if (e.status === 'slow') {
      e.vx *= 0.7;
    }
    if (e.statusT <= 0) e.status = null;
    if (e.hp <= 0 && entities.includes(e)) {
      const idx = entities.indexOf(e);
      if (idx >= 0) entities.splice(idx, 1);
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i, 1);

  // world-block liquid flow (water/lava) — throttled
  if (time % 6 === 0) {
    const sx0 = Math.max(0, Math.floor((camX) / TILE) - 2);
    const sy0 = Math.max(0, Math.floor((camY) / TILE) - 2);
    const sx1 = Math.min(WORLD_W, sx0 + Math.ceil(W / TILE) + 6);
    const sy1 = Math.min(WORLD_H, sy0 + Math.ceil(H / TILE) + 6);
    // wave 1: fall straight down
    for (let y = sy1 - 1; y >= sy0; y--) {
      for (let x = sx0; x < sx1; x++) {
        const b = getBlock(x, y);
        if ((b !== 24 && b !== 25) || y + 1 >= WORLD_H) continue;
        if (getBlock(x, y + 1) === 0) {
          setBlock(x, y + 1, b);
          setBlock(x, y, 0);
        }
      }
    }
    // wave 2: spread sideways at surface
    for (let y = sy1 - 1; y >= sy0; y--) {
      for (let x = sx0; x < sx1; x++) {
        const b = getBlock(x, y);
        if (b !== 24 && b !== 25) continue;
        if (y + 1 < WORLD_H && getBlock(x, y + 1) !== 0) {
          // surface — spread to one adjacent tile that has air + solid below
          const dirs = (x + y) % 2 === 0 ? [[1],[-1]] : [[-1],[1]];
          for (const [dx] of dirs) {
            const nx = x + dx;
            if (nx >= 0 && nx < WORLD_W && getBlock(nx, y) === 0 && getBlock(nx, y + 1) !== 0) {
              setBlock(nx, y, b);
              setBlock(x, y, 0);
              break;
            }
          }
        }
        // water + lava = stone (horizontal)
        for (const dx of [1, -1]) {
          const nb = getBlock(x + dx, y);
          if (b === 24 && nb === 25) { setBlock(x, y, 2); setBlock(x + dx, y, 2); break; }
          if (b === 25 && nb === 24) { setBlock(x, y, 2); setBlock(x + dx, y, 2); break; }
        }
      }
    }
  }
  // liquid physics — each liquid drop tries to fall, then flow sideways
  for (let i = liquids.length - 1; i >= 0; i--) {
    const l = liquids[i];
    const tx = Math.floor(l.x / TILE);
    const ty = Math.floor(l.y / TILE);
    l.life--;
    if (l.life <= 0) { liquids.splice(i, 1); continue; }
    // try fall
    if (ty + 1 < WORLD_H && getBlock(tx, ty + 1) === 0) {
      l.y += 4;
    } else {
      // try flow sides
      if (!l.flowDir || Math.random() < 0.1) l.flowDir = Math.random() < 0.5 ? -1 : 1;
      const nx = tx + l.flowDir;
      if (nx >= 0 && nx < WORLD_W && getBlock(nx, ty) === 0 && getBlock(nx, ty + 1) === 0) {
        l.x += l.flowDir * 3;
      } else if (Math.random() < 0.3) {
        l.flowDir *= -1;
      } else {
        l.vx = 0;
      }
    }
    // water + lava = stone
    if (l.type === 'water') {
      for (let j = liquids.length - 1; j >= 0; j--) {
        if (j === i) continue;
        const o = liquids[j];
        if (o.type === 'lava' && Math.abs(l.x - o.x) < TILE && Math.abs(l.y - o.y) < TILE) {
          const sx = Math.floor(l.x / TILE);
          const sy = Math.floor(l.y / TILE);
          if (getBlock(sx, sy) === 0) {
            // place stone
            setBlock && setBlock(sx, sy, 2);
          }
          liquids.splice(i, 1); liquids.splice(j, 1); break;
        }
      }
    }
    // damage entities in liquid
    for (const e of entities) {
      if (e.x < l.x + TILE && e.x + e.w > l.x && e.y < l.y + TILE && e.y + e.h > l.y) {
        if (l.type === 'lava') { e.hp -= 1; e.status = 'burn'; e.statusT = 60; }
        else if (l.type === 'water') { e.status = 'slow'; e.statusT = 30; }
      }
    }
  }
  // player in liquid (bucket-placed)
  for (const l of liquids) {
    if (Math.abs(l.x - player.x) < TILE && Math.abs(l.y - player.y) < TILE) {
      if (l.type === 'lava') {
        player.hp -= 1;
        player.status = 'burn'; player.statusT = 60;
      } else if (l.type === 'water') {
        player.vx *= 0.9;
        if (keys['Space'] || keys['w'] || keys['ArrowUp']) player.vy = Math.min(player.vy, -2);
      }
    }
  }
  // player in world-block liquid
  const pb = getBlock(playerTX, playerTY);
  const pb2 = getBlock(playerTX, Math.floor((player.y + player.h - 1) / TILE));
  if (pb === 25 || pb2 === 25) {
    if (player.status !== 'obsidian' && player.status !== 'burn') {
      player.hp -= 0.3;
      player.status = 'burn'; player.statusT = 30;
    }
  } else if (pb === 24 || pb2 === 24) {
    player.vx *= 0.85;
    if (keys['Space'] || keys['w'] || keys['ArrowUp']) player.vy = Math.min(player.vy, -1.5);
  }
}

function updateRegen() {
  regenTimer++;
  if (regenTimer % 600 === 0) {
    // Tree regen - only at original tree positions (x % 7 === 3)
    for (let x = 3; x < WORLD_W; x += 7) {
      if (Math.random() < 0.1) {
        const s = Math.floor(60 + (Math.sin(x * 0.05) * 8 + Math.sin(x * 0.13) * 4 + Math.sin(x * 0.03) * 12));
        const top = getBlock(x, s);
        if ((top === 3 || top === 19) && getBlock(x, s-1) === 0) {
          for (let ty = s - 1; ty >= s - 5 && ty >= 0; ty--) {
            if (getBlock(x, ty) === 0) world[ty * WORLD_W + x] = 4;
          }
          for (let dy = -3; dy >= -5; dy--) {
            for (let dx = -2; dx <= 2; dx++) {
              const ly = s + dy, lx = x + dx;
              if (ly >= 0 && lx >= 0 && lx < WORLD_W && getBlock(lx, ly) === 0) {
                world[ly * WORLD_W + lx] = 5;
              }
            }
          }
        }
      }
    }
    for (let i = 0; i < 20; i++) {
      const ox = Math.floor(Math.random() * WORLD_W);
      const oy = Math.floor(Math.random() * (WORLD_H - 100) + 80);
      if (getBlock(ox, oy) === 2) {
        const r = Math.random();
        if (r < 0.3) setBlock(ox, oy, 7);
        else if (r < 0.5) setBlock(ox, oy, 8);
        else if (r < 0.6) setBlock(ox, oy, 9);
        else if (r < 0.65) setBlock(ox, oy, 61);
      }
    }
  }
}

function updateWeather() {
  weatherTimer++;
  // Change weather every 5-10 minutes (18000-36000 ticks)
  if (weatherTimer > 18000 + Math.random() * 18000) {
    weatherTimer = 0;
    const biome = getBiome(Math.floor(player.x / TILE));
    const r = Math.random();
    if (biome === 'snow') {
      weather = r < 0.4 ? 'snow' : 'clear';
    } else if (biome === 'desert') {
      weather = r < 0.3 ? 'sandstorm' : 'clear';
    } else if (biome === 'corruption') {
      weather = r < 0.5 ? 'rain' : 'clear';
    } else {
      weather = r < 0.35 ? 'rain' : 'clear';
    }
  }
  // Fade in/out
  if (weather !== 'clear' && weatherIntensity < 1) weatherIntensity += 0.01;
  if (weather === 'clear' && weatherIntensity > 0) weatherIntensity -= 0.01;
  weatherIntensity = Math.max(0, Math.min(1, weatherIntensity));
}

function drawWeather() {
  if (weatherIntensity <= 0) return;
  const alpha = weatherIntensity;
  const t = Date.now();
  if (weather === 'rain') {
    ctx.fillStyle = `rgba(100,150,200,${0.3 * alpha})`;
    for (let i = 0; i < 100; i++) {
      const rx = ((i * 137 + t * 0.5) % W);
      const ry = ((i * 89 + t) % H);
      ctx.fillRect(rx, ry, 1, 5);
    }
  } else if (weather === 'snow') {
    ctx.fillStyle = `rgba(255,255,255,${0.6 * alpha})`;
    for (let i = 0; i < 60; i++) {
      const sx = ((i * 137 + t * 0.2) % W);
      const sy = ((i * 89 + t * 0.3) % H);
      ctx.fillRect(sx, sy, 2, 2);
    }
  } else if (weather === 'sandstorm') {
    ctx.fillStyle = `rgba(200,180,100,${0.4 * alpha})`;
    for (let i = 0; i < 80; i++) {
      const sx = ((i * 137 + t * 0.8) % W);
      const sy = ((i * 89 + t * 0.4) % H);
      ctx.fillRect(sx, sy, 3, 1);
    }
  }
}

function countItem(id) {
  let count = 0;
  for (const slot of player.hotbar) {
    if (slot && slot.id === id) count += slot.count;
  }
  for (const slot of player.inventory) {
    if (slot && slot.id === id) count += slot.count;
  }
  return count;
}

function removeItem(id, count) {
  let remaining = count;
  for (const slot of player.hotbar) {
    if (slot && slot.id === id) {
      const take = Math.min(slot.count, remaining);
      slot.count -= take;
      remaining -= take;
      if (slot.count <= 0) slot = null;
      if (remaining <= 0) break;
    }
  }
  for (let i = 0; i < player.inventory.length; i++) {
    const slot = player.inventory[i];
    if (slot && slot.id === id) {
      const take = Math.min(slot.count, remaining);
      slot.count -= take;
      remaining -= take;
      if (slot.count <= 0) player.inventory[i] = null;
      if (remaining <= 0) break;
    }
  }
  updateHotbar();
}

function playSfx(freq, duration, type, vol) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = vol || 0.08;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const SFX = {
  mine() { playSfx(200 + Math.random()*100, 0.08, 'sawtooth', 0.06); },
  place() { playSfx(400, 0.06, 'square', 0.05); },
  swing() { playSfx(150, 0.1, 'sawtooth', 0.04); },
  hit() { playSfx(100, 0.12, 'square', 0.08); },
  hurt() { playSfx(80, 0.15, 'sawtooth', 0.07); },
  jump() { playSfx(300, 0.05, 'sine', 0.04); },
  craft() { playSfx(600, 0.08, 'square', 0.05); playSfx(800, 0.06, 'square', 0.04); },
  openChest() { playSfx(500, 0.06, 'sine', 0.05); playSfx(700, 0.08, 'sine', 0.04); },
  enemyDie() { playSfx(120, 0.15, 'sawtooth', 0.06); },
  collect() { playSfx(440, 0.05, 'sine', 0.05); playSfx(660, 0.05, 'sine', 0.04); },
  achievement() { playSfx(523, 0.1, 'square', 0.06); setTimeout(()=>playSfx(659,0.1,'square',0.06),100); setTimeout(()=>playSfx(784,0.15,'square',0.08),200); },
  death() {
    // roblox oof: pitched "oof" voice-like
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    const oof = (fStart, fEnd, dur, type, vol) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || 'sawtooth';
      osc.frequency.setValueAtTime(fStart, t0);
      osc.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    };
    // classic oof: starts ~400Hz, drops to 100Hz over ~0.2s
    oof(400, 100, 0.22, 'sawtooth', 0.18);
    oof(800, 200, 0.18, 'square', 0.04);
  }
};

function noteHz(scale, semi) {
  return scale.root * Math.pow(2, semi / 12);
}
function scaleNote(scale, idx) {
  return noteHz(scale, scale.notes[((idx % scale.notes.length) + scale.notes.length) % scale.notes.length]);
}
function scaleChord(scale, idx, isMinor) {
  const r = scale.notes[idx % scale.notes.length];
  const third = scale.notes[(idx + 2) % scale.notes.length] + (isMinor ? -1 : 0);
  const fifth = scale.notes[(idx + 4) % scale.notes.length];
  return [noteHz(scale, r), noteHz(scale, third), noteHz(scale, fifth)];
}

    { melody: [0,2,3,2,0,3,5,3, 0,2,3,5,3,2,0,3, 0,1,3,5,6,5,3,1, 0,3,5,6,5,3,1,0], bass: [0,0,3,3,2,2,0,0, 0,0,2,2,3,3,0,0], speed: 320, inst: 'sawtooth', isMinor: true },
  ],
  jungle: [
    { melody: [0,2,4,5,4,2,0,4, 5,7,4,5,7,4,2,0, 0,2,5,4,2,5,7,4, 2,0,4,2,0,2,4,5], bass: [0,0,3,3,5,5,7,7, 0,0,4,4,5,5,0,0], speed: 200, inst: 'sine', isMinor: false },
  ],
  mushroom: [
    { melody: [0,2,3,5,7,5,3,2, 0,2,3,5,7,8,7,5, 3,2,0,2,3,5,7,5, 3,2,0,2,3,5,3,0], bass: [0,0,4,4,3,3,0,0, 0,0,5,5,3,3,0,0], speed: 260, inst: 'sine', isMinor: true },
  ],
  ocean: [
    { melody: [0,4,2,4,0,4,2,4, 0,4,7,4,5,4,2,0, 0,4,2,4,5,4,2,4, 0,2,4,5,4,2,0,4], bass: [0,0,0,4,0,0,0,4, 0,0,5,0,3,0,0,0], speed: 340, inst: 'triangle', isMinor: false },
  ],
