    { melody: [0,1,4,5,7,8,7,5, 0,1,4,5,7,8,7,4, 0,1,4,5,7,8,7,5, 4,1,0,4,1,0,4,1], bass: [0,0,5,5,3,3,4,4, 0,0,5,5,3,3,0,0], speed: 280, inst: 'sawtooth', isMinor: true },
  ],
};

// boss: intense fast pattern
const BOSS_PATTERN = {
  melody: [0,1,3,1,0,1,3,5, 3,1,0,1,3,5,3,1, 0,1,3,5,7,5,3,1, 0,1,0,1,0,1,0,1],
  bass:   [0,0,3,3,5,5,3,3, 0,0,4,4,5,5,3,3],
  speed: 200, inst: 'square', isMinor: true,
};

let currentPattern = null;
let currentBiome = null;
let patternStep = 0;
let patternTimer = null;
let drumStep = 0;

function pickPattern(biome) {
  const list = MUSIC_PATTERNS[biome] || MUSIC_PATTERNS.forest;
  return list[Math.floor(Math.random() * list.length)];
}

function playNote(freq, duration, type, vol, delay, attack) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  const a = attack || 0.005;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol || 0.03, t + a);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration + 0.05);
}

function playDrum(type) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  if (type === 'kick') {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.2);
  } else if (type === 'hat') {
    const noise = audioCtx.createBufferSource();
    const buf = audioCtx.createBuffer(1, 1024, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noise.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.02, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    const hpf = audioCtx.createBiquadFilter();
    hpf.type = 'highpass'; hpf.frequency.value = 6000;
    noise.connect(hpf); hpf.connect(g); g.connect(audioCtx.destination);
    noise.start(t); noise.stop(t + 0.06);
  } else if (type === 'snare') {
    const noise = audioCtx.createBufferSource();
    const buf = audioCtx.createBuffer(1, 2048, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noise.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    noise.connect(g); g.connect(audioCtx.destination);
    noise.start(t); noise.stop(t + 0.13);
  }
}

function startMusic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const bx = Math.floor((player.x + player.w/2) / TILE);
  currentBiome = getBiome(Math.max(0, Math.min(WORLD_W-1, bx)));
  currentPattern = pickPattern(currentBiome);
  patternStep = 0;
  drumStep = 0;

  function tick() {
    if (!musicOn) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const boss = entities.find(e => e.boss);
    const p = boss ? BOSS_PATTERN : currentPattern;
    const isDay = (time / DAY_LEN) < 0.75;
    const scale = SCALES[currentBiome] || SCALES.forest;
    const step = patternStep % p.melody.length;
    const bassStep = Math.floor(patternStep / 2) % p.bass.length;

    // melody
    const mi = p.melody[step];
    if (mi >= 0) {
      const f = scaleNote(scale, mi) * (isDay ? 1 : 0.75);
      const vol = isDay ? 0.035 : 0.018;
      playNote(f, 0.22, p.inst, vol, 0);
      // harmony a 3rd up
      if (step % 4 === 0) {
        playNote(f * Math.pow(2, (p.isMinor ? 3 : 4) / 12), 0.4, 'sine', vol * 0.5, 0);
      }
    }

    // bass on alternating
    if (patternStep % 2 === 0) {
      const bi = p.bass[bassStep];
      if (bi >= 0) {
        const bf = scaleNote(scale, bi) * 0.5;
        playNote(bf, 0.4, 'triangle', isDay ? 0.05 : 0.025, 0);
      }
    }

    // pad chord every 8 steps
    if (step === 0) {
      const chord = scaleChord(scale, Math.floor(patternStep / 16) % 5, p.isMinor);
      chord.forEach((f, i) => {
        playNote(f, 1.6, scale.pad, isDay ? 0.01 : 0.005, 0, 0.3);
      });
    }

    // drums
    drumStep++;
    if (boss || isDay) {
      if (drumStep % 4 === 0) playDrum('kick');
      if (drumStep % 8 === 4) playDrum('snare');
      if (drumStep % 2 === 0) playDrum('hat');
    }

    patternStep++;
    if (patternStep >= p.melody.length * 2) {
      patternStep = 0;
      if (!boss && Math.random() < 0.25) currentPattern = pickPattern(currentBiome);
    }

    // biome change
    const nbx = Math.floor((player.x + player.w/2) / TILE);
    const nextBiome = getBiome(Math.max(0, Math.min(WORLD_W-1, nbx)));
    if (nextBiome !== currentBiome) {
      currentBiome = nextBiome;
      currentPattern = pickPattern(currentBiome);
      patternStep = 0;
    }

    patternTimer = setTimeout(tick, p.speed);
  }
  tick();
}

function stopMusic() {
  if (patternTimer) clearTimeout(patternTimer);
  patternTimer = null;
}

function updateSpawning() {
  if (gameMode === 'creative' || gameMode === 'tutorial') return;
  if (time < 12000) return;
  const mult = getDiffMult();
  const isBloodMoon = (achievements.stats.nights % 5 === 0 && achievements.stats.nights > 0);
  const maxEnemies = isBloodMoon ? 16 : (difficulty === 'easy' ? 4 : difficulty === 'hard' ? 12 : 8);
  const spawnRate = isBloodMoon ? 0.006 * mult : 0.003 * mult;
  if (Math.random() < spawnRate && entities.filter(e => !e.boss).length < maxEnemies) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const sx = Math.floor((player.x + side * 400) / TILE);
    const sy = Math.floor(player.y / TILE);
    let gy = sy;
    while (gy < WORLD_H - 1 && getBlock(sx, gy) === 0) gy++;
    if (gy < WORLD_H - 1) {
      const biome = getBiome(sx);
      let types = BIOME_ENEMIES[biome] || ['slime', 'zombie'];
      if (isBloodMoon) types = types.concat(['zombie', 'eater', 'eater']); // more danger
      const type = types[Math.floor(Math.random() * types.length)];
      spawnEnemy(sx * TILE, (gy - 1) * TILE, type);
    }
  }
  // Eye of Cthulhu spawns at night randomly
  if (time > 18000 && time < 60000 && !entities.some(e => e.boss)) {
    const eyeRate = isBloodMoon ? 0.001 : 0.0001;
    if (Math.random() < eyeRate) {
      const sx = player.x + (Math.random() < 0.5 ? -300 : 300);
      const sy = player.y - 200;
      spawnEnemy(sx, sy, 'eye');
    }
  }
}

function getMouseTile() {
  const mx = mouseX + camX;
  const my = mouseY + camY;
  return { x: Math.floor(mx / TILE), y: Math.floor(my / TILE) };
}

function mineBlock(tx, ty) {
  const b = getBlock(tx, ty);
  if (b === 0) return;
  const block = BLOCKS[b];

  // Bucket collects liquids
  const tool = player.hotbar[player.selected];
  if ((b === 24 || b === 25) && tool && tool.id === 45) {
    setBlock(tx, ty, 0);
    spawnParticle(tx * TILE + TILE/2, ty * TILE + TILE/2, block.color);
    SFX.mine();
    return;
  }
  if (block.liquid) return;

  let power = 1;
  if (tool) {
    const ttype = ITEMS[tool.id]?.tool;
    if (ttype === 'pick' && block.hp >= 3) power = ITEMS[tool.id].power;
    else if (ttype === 'axe' && (b === 4 || b === 5 || b === 31)) power = ITEMS[tool.id].power;
    else if (ttype === 'hammer' && (b === 11 || b === 12 || b === 13 || b === 15 || b === 28 || b === 29 || b === 30)) power = ITEMS[tool.id].power;
    else if (ttype === 'shovel' && (b === 1 || b === 3 || b === 6 || b === 17 || b === 19 || b === 21)) power = ITEMS[tool.id].power;
    else if (ttype === 'pick') power = ITEMS[tool.id].power;
  }

  if (gameMode === 'creative') {
    const dropId = block.drop || b;
    if (dropId !== 0) spawnDrop(tx * TILE + 4, ty * TILE, dropId, 1);
    setBlock(tx, ty, 0);
    spawnParticle(tx * TILE + TILE/2, ty * TILE + TILE/2, block.color);
    return;
  }

  if (!player.mining || player.mining.x !== tx || player.mining.y !== ty) {
    player.mining = { x: tx, y: ty, progress: 0, max: block.hp * 10 / power };
  }
  player.mining.progress += 1;
  spawnParticle(tx * TILE + TILE/2, ty * TILE + TILE/2, block.color);

  if (player.mining.progress >= player.mining.max) {
    const dropId = block.drop || b;
    if (dropId !== 0) spawnDrop(tx * TILE + 4, ty * TILE, dropId, 1);
    setBlock(tx, ty, 0);
    player.mining = null;
    SFX.mine();
    achievements.stats.mined++;
    checkAchievements();
    // Break entire tree when mining any wood/leaves block
    if (b === 4 || b === 5) {
      breakTree(tx, ty);
    }
  }
}

function breakTree(tx, ty) {
  const queue = [[tx, ty]];
  const visited = new Set([`${tx},${ty}`]);
  while (queue.length > 0) {
    const [cx, cy] = queue.shift();
    const cb = getBlock(cx, cy);
    if (cb === 4 || cb === 5) {
      const dropId = BLOCKS[cb].drop || cb;
      if (dropId !== 0) spawnDrop(cx * TILE + 4, cy * TILE, dropId, 1);
      setBlock(cx, cy, 0);
      spawnParticle(cx * TILE + TILE/2, cy * TILE + TILE/2, BLOCKS[cb].color);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = cx + dx, ny = cy + dy;
          const key = `${nx},${ny}`;
          if (!visited.has(key)) {
            visited.add(key);
            const nb = getBlock(nx, ny);
            if (nb === 4 || nb === 5) queue.push([nx, ny]);
          }
        }
      }
    }
  }
}

function placeBlock(tx, ty) {
  const b = getBlock(tx, ty);
  if (b === 23) { openChestUI(tx, ty); return; }
  const slot = player.hotbar[player.selected];
  if (!slot) return;

  const item = ITEMS[slot.id];
  if (item && item.spawn) {
    if (item.spawn === 'slime') spawnEnemy(tx * TILE, ty * TILE, 'slime');
    else if (item.spawn === 'zombie') spawnEnemy(tx * TILE, ty * TILE, 'zombie');
    else if (item.spawn === 'villager') {
      entities.push({ x: tx * TILE + 4, y: ty * TILE, w: 16, h: 30, type: 'villager', life: 999999, dir: 1, timer: 0, vx: 0, vy: 0, onGround: false, homeX: tx * TILE, homeW: 5 * TILE, trade: { give: { id: 38, count: 10 }, get: { id: 26, count: 1 }, msg: "10 arrows for a bow" } });
    }
    if (gameMode !== 'creative') {
      slot.count--;
      if (slot.count <= 0) player.hotbar[player.selected] = null;
    }
    updateHotbar();
    return;
  }

  if ((!BLOCKS[slot.id]?.solid && slot.id !== 4 && slot.id !== 10 && slot.id !== 14 && slot.id !== 24 && slot.id !== 28 && slot.id !== 29 && slot.id !== 30)) return;

  // Bucket places water
  if (slot.id === 45) {
    if (b === 24) { addItem(90, 1); setBlock(tx, ty, 0); SFX.collect(); if (gameMode !== 'creative') { slot.count--; if (slot.count <= 0) player.hotbar[player.selected] = null; } updateHotbar(); return; }
    if (b === 25) { addItem(91, 1); setBlock(tx, ty, 0); SFX.collect(); if (gameMode !== 'creative') { slot.count--; if (slot.count <= 0) player.hotbar[player.selected] = null; } updateHotbar(); return; }
    if (b === 0) { setBlock(tx, ty, 24); SFX.place(); }
    return;
  }
  // Water bucket
  if (slot.id === 90) {
    if (b === 0) { setBlock(tx, ty, 24); addItem(45, 1); slot.count--; if (slot.count <= 0) player.hotbar[player.selected] = null; SFX.place(); updateHotbar(); }
    return;
  }
  // Lava bucket
  if (slot.id === 91) {
    if (b === 0) { setBlock(tx, ty, 25); addItem(45, 1); slot.count--; if (slot.count <= 0) player.hotbar[player.selected] = null; SFX.place(); updateHotbar(); }
    return;
  }

  const placeId = slot.id === 4 ? 31 : slot.id;
  if (b !== 0) return;
  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  if (tx === px && ty === py) return;
  setBlock(tx, ty, placeId);
  if (placeId === 23) {
    chests.set(`${tx},${ty}`, []);
    if (mpRoomCode) syncChest(`${tx},${ty}`, []);
  }
  if (gameMode !== 'creative') {
    slot.count--;
    if (slot.count <= 0) player.hotbar[player.selected] = null;
  }
  SFX.place();
  achievements.stats.placed++;
  checkAchievements();
  updateHotbar();
}

function updateLight() {
  // smooth day brightness
  const t = time / DAY_LEN;
  const dayArc = Math.sin(t * Math.PI * 2 - Math.PI/2) * 0.5 + 0.5;
  // ambient: bright day = 220, dusk = 140, deep night = 80
  const ambient = Math.floor(80 + dayArc * 140);
  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  const R = 50;
  const sx = Math.max(0, px - R), ex = Math.min(WORLD_W, px + R);
  const sy = Math.max(0, py - R), ey = Math.min(WORLD_H, py + R);
  for (let y = sy; y < ey; y++) {
    for (let x = sx; x < ex; x++) {
      light[y * WORLD_W + x] = ambient;
    }
  }
  for (let y = sy; y < ey; y++) {
    for (let x = sx; x < ex; x++) {
      const b = getBlock(x, y);
      if (BLOCKS[b]?.light) {
        const r = BLOCKS[b].light;
        const r2 = r * r;
        const ls = Math.max(sy, y - r), le = Math.min(ey, y + r + 1);
        const xs = Math.max(sx, x - r), xe = Math.min(ex, x + r + 1);
        for (let ly = ls; ly < le; ly++) {
          const dy = ly - y;
          const dy2 = dy * dy;
          const rem = r2 - dy2;
          if (rem < 0) continue;
          const maxDx = Math.floor(Math.sqrt(rem));
          const lxs = Math.max(xs, x - maxDx);
          const lxe = Math.min(xe, x + maxDx + 1);
          const base = ly * WORLD_W;
          for (let lx = lxs; lx < lxe; lx++) {
            const d = Math.abs(lx - x) + Math.abs(dy);
            const li = base + lx;
            light[li] = Math.max(light[li], 255 - d * 18);
          }
        }
      }
    }
  }
}

function draw() {
  // smooth day/night transition: brightness 0-1
  const t = time / DAY_LEN;
  // sun rises at 0.25, sets at 0.75
  const dayArc = Math.sin(t * Math.PI * 2 - Math.PI/2) * 0.5 + 0.5;
  const isDay = dayArc > 0.3;
  // sky color: warm orange at horizon, blue at zenith, dark at night
  // dayArc near 0 = night, ~0.5 = horizon (sunset/sunrise), 1.0 = zenith
  const sunAlt = dayArc; // 0 = horizon-down, 1 = zenith
  let skyR, skyG, skyB;
  if (sunAlt < 0.4) {
    // night → dawn
    const k = sunAlt / 0.4;
    skyR = Math.floor(10 + k * 200);   // dark blue → orange
    skyG = Math.floor(10 + k * 80);
    skyB = Math.floor(40 + k * 20);
  } else if (sunAlt < 0.7) {
    // dawn → day
    const k = (sunAlt - 0.4) / 0.3;
    skyR = Math.floor(210 - k * 110);  // orange → light blue
    skyG = Math.floor(90 + k * 110);
    skyB = Math.floor(60 + k * 195);
  } else {
    // day
    skyR = 100;
    skyG = 180;
    skyB = 245;
  }
  ctx.fillStyle = `rgb(${skyR},${skyG},${skyB})`;
  ctx.fillRect(0, 0, W, H);
  
  const celestialX = W/2 + Math.cos((time / DAY_LEN) * Math.PI * 2 - Math.PI/2) * (W/2 - 40);
  const celestialY = H/2 + Math.sin((time / DAY_LEN) * Math.PI * 2 - Math.PI/2) * (H/2 - 40);
  if (isDay) {
    ctx.fillStyle = '#ffdd44';
    ctx.beginPath(); ctx.arc(celestialX, celestialY, 20, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#dddddd';
    ctx.beginPath(); ctx.arc(celestialX, celestialY, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 50; i++) {
      ctx.fillRect(((i * 137) % W), ((i * 89) % (H/2)), 2, 2);
    }
  }

  // Weather - rain at night
  if (time % 24000 > 18000 && time % 24000 < 24000) {
    ctx.fillStyle = 'rgba(100,150,200,0.3)';
    for (let i = 0; i < 50; i++) {
      const rx = ((i * 137 + time) % W);
      const ry = ((i * 89 + time * 2) % H);
      ctx.fillRect(rx, ry, 1, 4);
    }
  }

  drawWeather();

  ctx.save();
  ctx.translate(-Math.floor(camX), -Math.floor(camY));
  
  const startX = Math.floor(camX / TILE);
  const startY = Math.floor(camY / TILE);
  const endX = Math.min(WORLD_W, startX + Math.ceil(W / TILE) + 2);
  const endY = Math.min(WORLD_H, startY + Math.ceil(H / TILE) + 2);
  
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const b = getBlock(x, y);
      if (b === 0) continue;
      const block = BLOCKS[b];
      const li = y * WORLD_W + x;
      const l = light[li] / 255;
      
      const c = block.color;
      let r, g, bval, a = 1;
      if (c.length === 4) {
        r = parseInt(c[1] + c[1], 16);
        g = parseInt(c[2] + c[2], 16);
        bval = parseInt(c[3] + c[3], 16);
      } else {
        r = parseInt(c.slice(1, 3), 16);
        g = parseInt(c.slice(3, 5), 16);
        bval = parseInt(c.slice(5, 7), 16);
        if (c.length > 7) a = parseInt(c.slice(7, 9), 16) / 255;
      }
      ctx.fillStyle = `rgba(${Math.floor(r * l)},${Math.floor(g * l)},${Math.floor(bval * l)},${a})`;
      if (PIX === 1) {
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      } else {
        // subdivide tile into PIX x PIX grid using deterministic pattern per block type
        const cell = TILE / PIX;
        const pat = PATTERNS[b];
        if (pat) {
          // map pixel to pattern coord
          for (let py = 0; py < PIX; py++) {
            for (let ppx = 0; ppx < PIX; ppx++) {
              const patRow = pat[py % 8];
              const ch = patRow ? patRow[(ppx) % 8] : '.';
              const col = patColor(block.color, ch);
              const cr = Math.min(255, Math.floor(col.r * l));
              const cg = Math.min(255, Math.floor(col.g * l));
              const cb = Math.min(255, Math.floor(col.b * l));
              ctx.fillStyle = `rgba(${cr},${cg},${cb},${col.a})`;
              ctx.fillRect(x * TILE + ppx * cell, y * TILE + py * cell, Math.ceil(cell) + 1, Math.ceil(cell) + 1);
            }
          }
        } else {
          // fallback: solid
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        }
      }
      
      if (b === 3 && y > 0 && getBlock(x, y-1) === 0) {
        ctx.fillStyle = `rgba(60,160,40,${l})`;
        ctx.fillRect(x * TILE + 2, y * TILE, TILE - 4, 3);
      }
      if (b === 10) {
        ctx.fillStyle = `rgba(255,220,100,${l * 0.8})`;
        ctx.fillRect(x * TILE + 8, y * TILE + 4, 8, 14);
      }
      // water
      if (b === 24) {
        const surface = getBlock(x, y - 1) === 0;
        ctx.fillStyle = surface ? `rgba(80,150,220,${l * 0.7})` : `rgba(40,100,180,${l * 0.85})`;
        ctx.fillRect(x * TILE, y * TILE + (surface ? 4 : 0), TILE, TILE - (surface ? 4 : 0));
        if (surface) {
          // animated wave
          const w = Math.sin(time * 0.05 + x * 0.3) * 2;
          ctx.fillStyle = `rgba(150,200,255,${l * 0.5})`;
          ctx.fillRect(x * TILE + 2 + w, y * TILE + 2, TILE - 4, 1);
        }
      }
      // lava
      if (b === 25) {
        const surface = getBlock(x, y - 1) === 0;
        ctx.fillStyle = surface ? `rgba(255,120,30,${l * 0.85})` : `rgba(180,50,10,${l})`;
        ctx.fillRect(x * TILE, y * TILE + (surface ? 4 : 0), TILE, TILE - (surface ? 4 : 0));
        if (surface) {
          // glow
          ctx.fillStyle = `rgba(255,200,80,${l * 0.5 + Math.sin(time * 0.1 + x * 0.5) * 0.2})`;
          ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, 2);
        }
      }
    }
  }
  
  for (const e of entities) {
    if (e.type === 'drop') {
      const item = ITEMS[e.id] || BLOCKS[e.id];
      drawItemSprite(e.x - 2, e.y - 2, 16, e.id, item);
    } else if (e.type === 'slime') {
      // bounce: stretch on Y when going up, squash on landing
      const vy = e.vy || 0;
      const onGround = e.onGround;
      let sx = 1, sy = 1;
      if (!onGround) {
        if (vy < 0) { sy = 1.2; sx = 0.85; } // stretched up
        else { sy = 0.85; sx = 1.15; } // squashed falling
      } else {
        // squash on ground (bounce anim)
        const bounce = e.bounceT || 0;
        if (bounce > 0) {
          const k = bounce / 8;
          sy = 0.7 + k * 0.3;
          sx = 1.3 - k * 0.3;
        }
      }
      const cx = e.x + e.w/2, cy = e.y + e.h;
      const dw = e.w * sx, dh = e.h * sy;
      const dx = cx - dw/2, dy = cy - dh;
      ctx.fillStyle = '#44aa44';
      ctx.fillRect(dx, dy, dw, dh);
      // shine
      ctx.fillStyle = '#66cc66';
      ctx.fillRect(dx + 4, dy + 4, 4, 4);
      ctx.fillRect(dx + dw - 8, dy + 4, 4, 4);
      // eyes (move with squash)
      const eyeY = dy + dh * 0.35;
      ctx.fillStyle = '#000';
      ctx.fillRect(dx + dw * 0.3, eyeY, 2, 3);
      ctx.fillRect(dx + dw * 0.65, eyeY, 2, 3);
    } else if (e.type === 'zombie') {
      ctx.fillStyle = '#336633';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(e.x + (e.dir > 0 ? 12 : 4), e.y + 6, 4, 4);
    } else if (e.type === 'villager') {
      ctx.fillStyle = '#ccaa88';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#553311';
      ctx.fillRect(e.x + 2, e.y + 2, 12, 6);
      ctx.fillStyle = '#222222';
      ctx.fillRect(e.x + (e.dir > 0 ? 10 : 4), e.y + 4, 3, 3);
    } else if (e.type === 'eye') {
      // big eye body
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(e.x, e.y + 4, e.w, e.h - 8);
      // veins
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(e.x + 4, e.y + 8, 2, 2);
      ctx.fillRect(e.x + e.w - 6, e.y + e.h - 10, 2, 2);
      ctx.fillRect(e.x + e.w/2 - 1, e.y + 6, 2, 2);
      // giant pupil
      ctx.fillStyle = '#aa0000';
      const pupilX = e.x + e.w/2 - 4;
      const pupilY = e.y + e.h/2 - 4;
      ctx.fillRect(pupilX, pupilY, 8, 8);
      ctx.fillStyle = '#000000';
      ctx.fillRect(pupilX + 2, pupilY + 2, 4, 4);
      // gleam
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(pupilX + 4, pupilY + 1, 1, 1);
      // iris outline
      ctx.fillStyle = '#660000';
      ctx.fillRect(e.x, e.y + 4, e.w, 1);
      ctx.fillRect(e.x, e.y + e.h - 5, e.w, 1);
    } else if (e.type === 'arrow') {
      ctx.fillStyle = '#dddddd';
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(Math.atan2(e.vy, e.vx));
      ctx.fillRect(-4, -1, 8, 2);
      ctx.fillStyle = '#aa7744';
      ctx.fillRect(2, -2, 3, 4);
      ctx.restore();
    }
    // enemy hp bar (non-boss, if damaged)
    if (!e.boss && e.maxHp && e.hp < e.maxHp && e.type !== 'arrow' && e.type !== 'drop') {
      const bw = e.w + 4;
      const bh = 3;
      const bx = e.x + e.w/2 - bw/2;
      const by = e.y - 6;
      ctx.fillStyle = '#222';
      ctx.fillRect(bx, by, bw, bh);
      const pct = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = pct > 0.5 ? '#44dd44' : pct > 0.25 ? '#dddd44' : '#dd4444';
      ctx.fillRect(bx, by, bw * pct, bh);
    }
  }
  
  // floating damage numbers
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i];
    f.life--;
    f.y -= 0.6;
    if (f.life <= 0) { floatingTexts.splice(i, 1); continue; }
    const alpha = Math.min(1, f.life / 30);
    ctx.font = `bold ${f.size || 9}px "Press Start 2P", monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(0,0,0,${alpha * 0.7})`;
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color || `rgba(255,255,100,${alpha})`;
    ctx.fillText(f.text, f.x, f.y);
    ctx.textAlign = 'left';
  }
  
  // body (pants)
  ctx.fillStyle = player.pants || '#4444aa';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  // head (skin)
  ctx.fillStyle = player.skin || '#eeccaa';
  ctx.fillRect(player.x + 2, player.y + 2, 14, 10);
  // hair top
  if (player.hair) {
    ctx.fillStyle = player.hair;
    ctx.fillRect(player.x + 2, player.y + 1, 14, 3);
  }
  // shirt overlay
  if (player.shirt) {
    ctx.fillStyle = player.shirt;
    ctx.fillRect(player.x + 2, player.y + 10, 14, player.h - 10);
  }
  // eye
  ctx.fillStyle = '#222222';
  ctx.fillRect(player.x + (player.facing > 0 ? 10 : 4), player.y + 5, 3, 3);

  // status icons above head
  if (player.status) {
    const sIcons = { burn: '🔥', poison: '☠', swift: '»', strong: '^', ironskin: 'i', regen: '+', obsidian: 'o' };
    const ic = sIcons[player.status] || '?';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ic, player.x + player.w/2, player.y - 4);
    ctx.textAlign = 'left';
  }

  drawOtherPlayers();
  
  if (player.swing > 0) {
    ctx.fillStyle = '#eeccaa';
    const swingAngle = player.swing * 0.3 * player.facing;
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + 16);
    ctx.rotate(swingAngle);
    ctx.fillRect(0, -2, 16, 4);
    ctx.restore();
  }
  
  if (player.mining) {
    const crack = Math.floor(player.mining.progress / player.mining.max * 4);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    const mx = player.mining.x * TILE;
    const my = player.mining.y * TILE;
    if (crack >= 1) { ctx.beginPath(); ctx.moveTo(mx + 4, my + 4); ctx.lineTo(mx + 20, my + 20); ctx.stroke(); }
    if (crack >= 2) { ctx.beginPath(); ctx.moveTo(mx + 20, my + 4); ctx.lineTo(mx + 4, my + 20); ctx.stroke(); }
    if (crack >= 3) { ctx.beginPath(); ctx.moveTo(mx + 12, my + 2); ctx.lineTo(mx + 12, my + 22); ctx.stroke(); }
  }
  
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  
  // smooth darkness overlay (subtle)
  const nightDark = 1 - dayArc; // 0 day, 1 deep night
  if (nightDark > 0.05) {
    ctx.fillStyle = `rgba(0,0,25,${nightDark * 0.25})`;
    ctx.fillRect(0, 0, W, H);
    // light radius around player (mostly for atmosphere)
    const px = player.x + player.w/2 - camX;
    const py = player.y + player.h/2 - camY;
    const lightR = 200;
    const grad = ctx.createRadialGradient(px, py, lightR * 0.4, px, py, lightR);
    grad.addColorStop(0, 'rgba(0,0,15,0)');
    grad.addColorStop(1, `rgba(0,0,15,${nightDark * 0.35})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // Save indicator
  if (showSaveIndicator > 0) {
    ctx.fillStyle = `rgba(74,138,42,${showSaveIndicator / 120})`;
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('SAVED', W - 8, H - 8);
  }

  const hpFill = document.getElementById('hp-fill');
  if (hpFill) hpFill.style.width = (player.hp / player.maxHp * 100) + '%';
  // boss bar
  const boss = entities.find(e => e.boss);
  const bossBar = document.getElementById('boss-bar');
  if (bossBar) {
    if (boss) {
      bossBar.style.display = 'block';
      const nameEl = document.getElementById('boss-name');
      if (nameEl) nameEl.textContent = boss.type === 'eye' ? 'Eye of Cthulhu' : boss.type;
      const hpEl = document.getElementById('boss-hp');
      if (hpEl) hpEl.style.width = (boss.hp / boss.maxHp * 100) + '%';
    } else {
      bossBar.style.display = 'none';
    }
  }
  const timeEl = document.getElementById('time');
  if (timeEl) timeEl.textContent = isDay ? 'Day' : 'Night';
  const depthEl = document.getElementById('depth');
  if (depthEl) depthEl.textContent = Math.floor((player.y + player.h) / TILE - 60);
  const defEl = document.getElementById('defense');
  if (defEl) defEl.textContent = getArmorDef();

  // Minimap (local view around player, throttled)
  const mm = document.getElementById('minimap');
  if (mm.style.display !== 'none' && time % 4 === 0) {
    const mmCtx = mm.getContext('2d');
    const mmW = mm.width, mmH = mm.height;
    // local view radius in tiles
    const viewTilesX = 40;
    const viewTilesY = 25;
    const tileW = mmW / viewTilesX;
    const tileH = mmH / viewTilesY;
    const pcx = (player.x + player.w/2) / TILE;
    const pcy = (player.y + player.h/2) / TILE;
    // background sky
    mmCtx.fillStyle = '#0a0a1e';
    mmCtx.fillRect(0, 0, mmW, mmH);
    // draw blocks in local area
    const x0 = Math.max(0, Math.floor(pcx - viewTilesX/2));
    const y0 = Math.max(0, Math.floor(pcy - viewTilesY/2));
    const x1 = Math.min(WORLD_W, x0 + viewTilesX);
    const y1 = Math.min(WORLD_H, y0 + viewTilesY);
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        const b = getBlock(x, y);
        if (b === 0) continue;
        const block = BLOCKS[b];
        let c = block.color;
        if (c.length === 4) c = '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
        else if (c.length > 7) c = c.slice(0, 7);
        mmCtx.fillStyle = c;
        const dx = (x - (pcx - viewTilesX/2)) * tileW;
        const dy = (y - (pcy - viewTilesY/2)) * tileH;
        mmCtx.fillRect(Math.floor(dx), Math.floor(dy), Math.ceil(tileW)+1, Math.ceil(tileH)+1);
      }
    }
    // other players
    if (typeof mpOtherPlayers !== 'undefined') {
      for (const id in mpOtherPlayers) {
        const p = mpOtherPlayers[id];
        const dx = (p.x / TILE - (pcx - viewTilesX/2)) * tileW;
        const dy = (p.y / TILE - (pcy - viewTilesY/2)) * tileH;
        if (dx < 0 || dx > mmW || dy < 0 || dy > mmH) continue;
        mmCtx.fillStyle = '#44ddff';
        mmCtx.fillRect(Math.floor(dx)-1, Math.floor(dy)-1, 3, 3);
      }
    }
    // bosses (enemies with .boss flag)
    for (const e of entities) {
      const t = ENEMY_TYPES[e.type];
      if (!t || !t.boss) continue;
      const dx = (e.x / TILE - (pcx - viewTilesX/2)) * tileW;
      const dy = (e.y / TILE - (pcy - viewTilesY/2)) * tileH;
      if (dx < -2 || dx > mmW+2 || dy < -2 || dy > mmH+2) continue;
      mmCtx.fillStyle = '#ff2222';
      mmCtx.fillRect(Math.floor(dx)-2, Math.floor(dy)-2, 5, 5);
      // pulsing border
      mmCtx.strokeStyle = '#ff8888';
      mmCtx.lineWidth = 1;
      mmCtx.strokeRect(Math.floor(dx)-3, Math.floor(dy)-3, 7, 7);
    }
    // enemies (small dots)
    for (const e of entities) {
      const t = ENEMY_TYPES[e.type];
      if (!t || t.boss) continue;
      const dx = (e.x / TILE - (pcx - viewTilesX/2)) * tileW;
      const dy = (e.y / TILE - (pcy - viewTilesY/2)) * tileH;
      if (dx < 0 || dx > mmW || dy < 0 || dy > mmH) continue;
      mmCtx.fillStyle = t.color || '#ff6666';
      mmCtx.fillRect(Math.floor(dx), Math.floor(dy), 2, 2);
    }
    // player (white triangle-ish)
    mmCtx.fillStyle = '#ffff44';
    mmCtx.fillRect(mmW/2 - 2, mmH/2 - 2, 4, 4);
    mmCtx.strokeStyle = '#000';
    mmCtx.lineWidth = 1;
    mmCtx.strokeRect(mmW/2 - 2, mmH/2 - 2, 4, 4);
    // viewport box (faint)
    mmCtx.strokeStyle = 'rgba(255,255,255,0.3)';
    mmCtx.lineWidth = 1;
    const vw = (canvas.width / TILE) * tileW;
    const vh = (canvas.height / TILE) * tileH;
    mmCtx.strokeRect(mmW/2 - vw/2, mmH/2 - vh/2, vw, vh);
  }
}

// Input
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouseDown = true;
    const t = getMouseTile();
    if (keys['Shift']) placeBlock(t.x, t.y);
    else { mineBlock(t.x, t.y); player.swing = 10; }
  } else if (e.button === 2) {
    const t = getMouseTile();
    const slot = player.hotbar[player.selected];
    if (slot && ITEMS[slot.id] && ITEMS[slot.id].use) {
      useItem(slot);
    } else {
      placeBlock(t.x, t.y);
    }
  }
});

canvas.addEventListener('mouseup', e => {
  if (e.button === 0) { mouseDown = false; player.mining = null; }
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const chatInput = document.getElementById('chat-input');
  const chatFocused = document.activeElement === chatInput;

  if (chatFocused) {
    if (e.key === 'Escape') {
      document.getElementById('chat-box').style.display = 'none';
      chatInput.blur();
    }
    return;
  }

  keys[e.key] = true;
  if (e.key >= '1' && e.key <= '9') {
    player.selected = parseInt(e.key) - 1;
    updateHotbar();
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    const chatBox = document.getElementById('chat-box');
    chatBox.style.display = chatBox.style.display === 'none' ? 'flex' : 'none';
    if (chatBox.style.display === 'flex') chatInput.focus();
  }
  if (e.key.toLowerCase() === 'e') toggleCrafting();
  if (e.key.toLowerCase() === 'f') shootArrow();
  if (e.key.toLowerCase() === 'm') toggleMinimap();
  if (e.key === 'Escape') {
    const chatBox = document.getElementById('chat-box');
    if (chatBox.style.display !== 'none') {
      chatBox.style.display = 'none';
      chatInput.blur();
      return;
    }
    if (inGame) exitWorld();
    else if (document.getElementById('char-screen').style.display !== 'none') hideCharScreen();
  }
  if (e.key.toLowerCase() === 'q') {
    const slot = player.hotbar[player.selected];
    if (!slot) return;
    if (gameMode === 'journey') {
      // duplicate (research) — costs nothing
      addItem(slot.id, 1);
      showMsg(`Researched +1 ${ITEMS[slot.id]?.name || BLOCKS[slot.id]?.name}`);
      SFX.collect();
    } else {
      spawnDrop(player.x, player.y, slot.id, 1);
      slot.count--;
      if (slot.count <= 0) player.hotbar[player.selected] = null;
      updateHotbar();
    }
  }
  if (e.key.toLowerCase() === 'd') {
    const slot = player.hotbar[player.selected];
    if (slot) {
      spawnDrop(player.x, player.y, slot.id, 1);
      slot.count--;
      if (slot.count <= 0) player.hotbar[player.selected] = null;
      updateHotbar();
    }
  }
});

window.addEventListener('keyup', e => { keys[e.key] = false; });

// Game loop
function gameLoop(now) {
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  accumulator += dt;
  while (accumulator >= FIXED_DT) {
    const prevTime = time;
    time = (time + 1) % DAY_LEN;
    if (prevTime > 23000 && time < prevTime) {
      // new day
      achievements.stats.nights++;
      if (achievements.stats.nights % 5 === 0) {
        showMsg('🩸 BLOOD MOON RISES 🩸');
        SFX.achievement();
      }
    }
    updatePlayer();
    updateEntities();
    updateLight();
    updateSpawning();
    updateRegen();
    updateWeather();
    if (mouseDown && !keys['Shift']) {
      const t = getMouseTile();
      mineBlock(t.x, t.y);
    }
    if (player.swing > 0) player.swing--;
    // player death
    if (player.hp <= 0) {
      onPlayerDeath();
    }
    accumulator -= FIXED_DT;
  }
  // Auto-save every 30 seconds
  autoSaveTimer += dt;
  if (autoSaveTimer >= 30) {
    autoSaveTimer = 0;
    saveWorldData();
    showSaveIndicator = 120; // 2 seconds at 60fps
  }
  if (showSaveIndicator > 0) showSaveIndicator--;
  draw();
  requestAnimationFrame(gameLoop);
}

const SKIN_COLORS = ['#e8c87a','#d4a86a','#8a5a3a','#5a3a2a','#f0d8b8','#c89878','#7a5a4a','#3a2a1a'];
const SHIRT_COLORS = ['#aa3030','#3a6ea5','#3a8a3a','#e8c83a','#aa3a8a','#5a3a8a','#1a1a1a','#dadada','#e8a83a','#3a8acd'];

function buildSwatchRow(id, colors, current, onPick) {
  const row = document.getElementById(id);
  row.innerHTML = '';
  colors.forEach((c, i) => {
    const s = document.createElement('span');
    s.className = 'char-swatch' + (current === c ? ' selected' : '');
    s.style.background = c;
    s.dataset.c = c;
    s.addEventListener('click', () => { onPick(c); });
    row.appendChild(s);
  });
}
function newChar() {
  editingChar = {
    name: '',
    hair: HAIR_COLORS[0],
    skin: SKIN_COLORS[0],
    shirt: SHIRT_COLORS[0],
    pants: PANT_COLORS[0],
    diff: 'classic',
  };
  openCharEdit();
}
function openCharEdit() {
  document.getElementById('char-list').style.display = 'none';
  document.querySelectorAll('#char-screen > .menu-row').forEach(el => el.style.display = 'none');
  document.getElementById('char-edit').style.display = 'flex';
  document.getElementById('char-name').value = editingChar.name || '';
  buildSwatchRow('char-hair', HAIR_COLORS, editingChar.hair, c => { editingChar.hair = c; openCharEdit(); });
  buildSwatchRow('char-skin', SKIN_COLORS, editingChar.skin, c => { editingChar.skin = c; openCharEdit(); });
  buildSwatchRow('char-shirt', SHIRT_COLORS, editingChar.shirt, c => { editingChar.shirt = c; openCharEdit(); });
  buildSwatchRow('char-pants', PANT_COLORS, editingChar.pants, c => { editingChar.pants = c; openCharEdit(); });
  // difficulty
  const dr = document.getElementById('char-diff');
  dr.innerHTML = '';
  ['classic','expert','master','journey','creative'].forEach(d => {
    const b = document.createElement('button');
    b.className = 'menu-btn' + (editingChar.diff === d ? ' active' : '');
    b.textContent = d;
    b.style.fontSize = '8px';
    b.addEventListener('click', () => { editingChar.diff = d; openCharEdit(); });
    dr.appendChild(b);
  });
}
function closeCharEdit() {
  editingChar = null;

  if (gameMode === 'creative') {
    player.maxHp = 9999; player.hp = 9999;
    player.hunger = 9999;
    for (let id = 1; id <= 31; id++) if (BLOCKS[id]) addItem(id, 999);
    if (BLOCKS[61]) addItem(61, 999);
    for (let id = 37; id <= 69; id++) if (ITEMS[id]) addItem(id, 99);
  } else if (!loadedFromSave) {
    const mult = getDiffMult();
    player.maxHp = gameMode === 'tutorial' ? 200 : Math.round(100 / mult);
    player.hp = player.maxHp;
    player.hunger = 100;
    addItem(10, 8);
    if (gameMode === 'tutorial') {
      addItem(26, 1); addItem(30, 1); addItem(37, 1); addItem(38, 50);
      addItem(39, 1); addItem(40, 1); addItem(41, 1);
    } else {
      addItem(37, 1); addItem(38, 50);
    }
  }

  updateHotbar();
  updateArmorUI();
  updateLight();
  if (mpRoomCode) { startMpSync(); startChatSync(); }
  requestAnimationFrame(gameLoop);

  if (gameMode === 'tutorial') {
    tutorialStep = 0;

  }
}

function newWorld(seed) {
  let name = 'World ' + (worlds.length + 1);
  if (selectedChar < 0) { showCharScreen(); return; }
  const finalSeed = seed || Math.floor(Math.random() * 2147483647);
  // set world size from selection
  const sz = WORLD_SIZES[selectedSize] || WORLD_SIZES.small;
  WORLD_W = sz.w;
  WORLD_H = sz.h;
  generate(finalSeed);
  chests.clear();
  entities.length = 0;
  particles.length = 0;
  time = 0;
  player.vx = 0; player.vy = 0;
  // apply character
  const c = characters[selectedChar];
  if (c) {
    player.charName = c.name;
    player.hair = c.hair;
    player.skin = c.skin;
    player.shirt = c.shirt;
    player.pants = c.pants;
  }
  // apply difficulty
  if (c) {
    difficulty = c.diff;
    if (c.diff === 'creative') gameMode = 'creative';
    else if (c.diff === 'journey') gameMode = 'journey';
    else gameMode = 'survival';
  }
  selectedWorld = worlds.length;
  worlds.push({ name, char: selectedChar, mode: gameMode, diff: difficulty, playTime: 0, seed: finalSeed, size: selectedSize });
  saveWorlds();
  renderWorldList();
  loadedFromSave = false;
  // apply difficulty mult for hp
  if (difficulty === 'expert') { player.maxHp = 175; player.hp = 175; }
  else if (difficulty === 'master') { player.maxHp = 200; player.hp = 200; }
  // load per-character inventory/armor if exists, else start fresh
  if (c) {
    const cd = loadCharData(c._id);
    if (cd) {
      player.armor = cd.armor || { helm: null, chest: null, leg: null };
      player.hotbar = cd.hotbar || player.hotbar.map(() => null);
      player.inv = cd.inv || [];
      if (cd.hp) player.hp = Math.min(cd.hp, player.maxHp);
      if (cd.hunger !== undefined) player.hunger = cd.hunger;
    } else {
      player.armor = { helm: null, chest: null, leg: null };
      player.hotbar = player.hotbar.map(() => null);
      player.inv = [];
    }
  }
  startGame();
}

function loadWorld() {
  if (selectedWorld === null || !worlds[selectedWorld]) { alert('Select a world first'); return; }
  const w = worlds[selectedWorld];
  if (w.char !== undefined && characters[w.char]) {
    selectedChar = w.char;
    const c = characters[w.char];
    player.charName = c.name;
    player.hair = c.hair;
    player.skin = c.skin;
    player.shirt = c.shirt;
    player.pants = c.pants;
  }
  gameMode = w.mode;
  difficulty = w.diff;
  if (w.size) {
    selectedSize = w.size;
    const sz = WORLD_SIZES[w.size] || WORLD_SIZES.small;
    WORLD_W = sz.w;
    WORLD_H = sz.h;
  }
  const saved = loadWorldData(selectedWorld);
  if (saved) {
    // resize world if needed
    const newW = saved.worldW || WORLD_W;
    const newH = saved.worldH || WORLD_H;
    if (newW !== WORLD_W || newH !== WORLD_H) {
      WORLD_W = newW;
      WORLD_H = newH;
      world = new Uint8Array(WORLD_W * WORLD_H);
      light = new Uint8Array(WORLD_W * WORLD_H);
    }
    const arr = base64ToWorld(saved.world);
    world.set(arr.slice(0, world.length));
    chests.clear();
    for (const [k, v] of saved.chests) chests.set(k, v);
    entities.length = 0;
    if (saved.entities) {
      for (const e of saved.entities) entities.push(e);
    }
    time = saved.time || 0;
    player.x = saved.playerX || 0;
    player.y = saved.playerY || 0;
    player.hp = saved.playerHp || player.maxHp;
    loadedFromSave = true;
  } else {
    generate(w.seed || 12345);
    loadedFromSave = false;
  }
  // load per-character inventory/armor/hotbar
  if (w.char !== undefined && characters[w.char]) {
    const cd = loadCharData(characters[w.char]._id);
    if (cd) {
      player.armor = cd.armor || { helm: null, chest: null, leg: null };
      player.hotbar = cd.hotbar || player.hotbar.map(() => null);
      player.inv = cd.inv || [];
      if (cd.hp) player.hp = Math.min(cd.hp, player.maxHp);
      if (cd.hunger !== undefined) player.hunger = cd.hunger;
    } else {
      player.armor = { helm: null, chest: null, leg: null };
      player.hotbar = player.hotbar.map(() => null);
      player.inv = [];
    }
  }
  startGame();
}

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function worldToBase64(arr) {
  let s = '';
  for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
  try { return btoa(s); } catch (e) {
    const b64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    let out = '', j = 0;
    while (j < arr.length) {
      const a = arr[j++], b = j < arr.length ? arr[j++] : 0, c = j < arr.length ? arr[j++] : 0;
      out += b64[a >> 2] + b64[((a & 3) << 4) | (b >> 4)] + (j - 1 < arr.length ? b64[((b & 15) << 2) | (c >> 6)] : '=') + (j < arr.length ? b64[c & 63] : '=');
    }
    return out;
  }
}
function base64ToWorld(str) {
  try {
    const s = atob(str);
    const arr = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i);
    return arr;
  } catch (e) {
    const b64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const map = {};
    for (let i = 0; i < b64.length; i++) map[b64[i]] = i;
    const arr = [];
    let i = 0;
    while (i < str.length) {
      const a = map[str[i++]] || 0, b = map[str[i++]] || 0, c = map[str[i++]] || 0, d = map[str[i++]] || 0;
      arr.push((a << 2) | (b >> 4));
      if (str[i - 2] !== '=') arr.push(((b & 15) << 4) | (c >> 6));
      if (str[i - 1] !== '=') arr.push(((c & 3) << 6) | d);
    }
    return new Uint8Array(arr);
  }
}

function fetchRooms() {
  const list = document.getElementById('room-list');
  list.innerHTML = '<div style="color:#666;font-size:8px;text-align:center;">Loading...</div>';
  Promise.all([
    supaFetch('multiplayer_rooms', { query: '?select=code,world_name,created_at&order=created_at.desc&limit=20' }),
    supaFetch('mp_players', { query: '?select=room_code,updated_at' })
  ]).then(([rooms, players]) => {
    list.innerHTML = '';
    if (!Array.isArray(rooms) || rooms.length === 0) {
      list.innerHTML = '<div style="color:#666;font-size:8px;text-align:center;">No active rooms</div>';
      return;
    }
    const cutoff = Date.now() - 30000;
    const activeCounts = {};
    if (Array.isArray(players)) {
      players.forEach(p => {
        if (new Date(p.updated_at).getTime() > cutoff) {
          activeCounts[p.room_code] = (activeCounts[p.room_code] || 0) + 1;
        }
      });
    }
    rooms.forEach(r => {
      const count = activeCounts[r.code] || 0;
      const div = document.createElement('div');
      div.className = 'room-slot';
      div.innerHTML = `<div><span class="room-code">${r.code}</span><div class="room-info">${r.world_name || 'Unknown'} | ${count} players</div></div>`;
      div.onclick = () => { document.getElementById('mp-input').value = r.code; };
      list.appendChild(div);
    });
  }).catch(() => {
    list.innerHTML = '<div style="color:#a44;font-size:8px;text-align:center;">Error loading rooms</div>';
  });
}

      body: { room_code: mpRoomCode, player_id: mpPlayerId, x: Math.floor(player.x), y: Math.floor(player.y), updated_at: new Date().toISOString() }
    }).catch(() => {});
    // Download other players
    supaFetch('mp_players', { query: `?room_code=eq.${mpRoomCode}&player_id=neq.${mpPlayerId}&select=player_id,x,y,updated_at` })
      .then(data => {
        if (!Array.isArray(data)) return;
        const now = Date.now();
        mpOtherPlayers = {};
        for (const p of data) {
          if (now - new Date(p.updated_at).getTime() < 10000) {
            mpOtherPlayers[p.player_id] = { x: p.x, y: p.y };
          }
        }
      }).catch(() => {});
  }, 200);
}

function stopMpSync() {
  if (mpSyncInterval) { clearInterval(mpSyncInterval); mpSyncInterval = null; }
  stopMpBlockSync();
  stopChatSync();
  mpOtherPlayers = {};
}

let chatInterval = null;

function appendChatLog(name, msg, color) {
  const log = document.getElementById('chat-log');
  const div = document.createElement('div');
  div.textContent = name + ': ' + msg;
  div.style.color = color || '#fff';
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function findItemByName(name) {
  const q = name.toLowerCase().replace(/\s+/g, ' ').trim();
  for (const id in BLOCKS) {
    if (BLOCKS[id].name.toLowerCase() === q) return parseInt(id);
  }
  for (const id in ITEMS) {
    if (ITEMS[id].name.toLowerCase() === q) return parseInt(id);
  }
  for (const id in BLOCKS) {
    if (BLOCKS[id].name.toLowerCase().includes(q)) return parseInt(id);
  }
  for (const id in ITEMS) {
    if (ITEMS[id].name.toLowerCase().includes(q)) return parseInt(id);
  }
  return null;
}

function sendChat(msg) {
  if (!msg.trim()) return;
  const trimmed = msg.trim();

  if (trimmed.startsWith('/')) {
    const parts = trimmed.slice(1).split(' ');
    const cmd = parts[0];
    if (cmd === 'give') {
      let id = parseInt(parts[1]);
      let count = parseInt(parts[parts.length - 1]) || 1;
      let nameArg = parts.slice(1).join(' ');
      if (!isNaN(parseInt(parts[parts.length - 1]))) {
        nameArg = parts.slice(1, -1).join(' ');
      }
      if (isNaN(id) || !BLOCKS[id] && !ITEMS[id]) {
        id = findItemByName(nameArg);
      }
      if (id && (BLOCKS[id] || ITEMS[id])) {
        if (gameMode === 'creative' || isOwner) {
          addItem(id, count);
          showMsg(`Gave ${count}x ${(ITEMS[id] || BLOCKS[id]).name}`);
          appendChatLog('System', `Gave ${count}x ${(ITEMS[id] || BLOCKS[id]).name}`, '#8aff8a');
        } else {
          appendChatLog('System', 'No permission', '#ff4444');
        }
      } else {
        appendChatLog('System', 'Usage: /give <name or id> <count>', '#ff4444');
      }
      return;
    }
  }

  if (!mpRoomCode) {
    appendChatLog('You', trimmed, '#8aff8a');
    return;
  }

  supaFetch('mp_chat', {
    method: 'POST',
    body: { room_code: mpRoomCode, player_id: isOwner ? 'OWNER' : mpPlayerId, message: trimmed, created_at: new Date().toISOString() }
  }).catch(() => {});
}

function startChatSync() {
  if (!mpRoomCode) return;
  chatInterval = setInterval(() => {
    supaFetch('mp_chat', { query: `?room_code=eq.${mpRoomCode}&order=created_at.desc&limit=20` })
      .then(data => {
        if (!Array.isArray(data)) return;
        const log = document.getElementById('chat-log');
        log.innerHTML = '';
        data.reverse().forEach(c => {
          const div = document.createElement('div');
          let name, color;
          if (c.player_id === 'OWNER') { name = 'owner of page'; color = '#ff4444'; }
          else if (c.player_id === mpPlayerId) { name = 'You'; color = '#8aff8a'; }
          else { name = 'Player'; color = '#ffff44'; }
          div.textContent = name + ': ' + c.message;
          div.style.color = color;
          log.appendChild(div);
        });
      }).catch(() => {});
  }, 1000);
}

function stopChatSync() {
  if (chatInterval) { clearInterval(chatInterval); chatInterval = null; }
}

function drawOtherPlayers() {
  for (const id in mpOtherPlayers) {
    const p = mpOtherPlayers[id];
    ctx.fillStyle = '#aa4444';
    ctx.fillRect(p.x, p.y, 18, 34);
    ctx.fillStyle = '#eeccaa';
    ctx.fillRect(p.x + 2, p.y + 2, 14, 10);
    ctx.fillStyle = '#222222';
    ctx.fillRect(p.x + 10, p.y + 5, 3, 3);
  }
}

function hostMultiplayerRoom() {
  const code = genCode();
  const worldName = prompt('World name:', 'MP World ' + code);
  if (!worldName) return;
  setMpStatus('Creating room...', '#ffff44');
  gameMode = 'coop';
  const seed = Math.floor(Math.random() * 2147483647);
  generate(seed);
  chests.clear();
  entities.length = 0;
  particles.length = 0;
  time = 0;
  player.vx = 0; player.vy = 0;
  player.armor = { helm: null, chest: null, leg: null };
  player.hotbar = player.hotbar.map(() => null);
  player.inv = [];
  const worldData = worldToBase64(world);
  supaFetch('multiplayer_rooms', {
    method: 'POST',
    body: { code, world_name: worldName, world_data: worldData, last_active: new Date().toISOString(), seed }
  }).then(() => {
    setMpStatus('Room created! Code: ' + code, '#4a8a2a');
    mpRoomCode = code;
    mpIsHost = true;
    setTimeout(() => {
      document.getElementById('multiplayer-menu').style.display = 'none';
      startGame();
    }, 800);
  }).catch(() => setMpStatus('Failed to create room', '#ff4444'));
}

function joinMultiplayerRoom() {
  const code = document.getElementById('mp-input').value.trim().toUpperCase();
  if (code.length !== 6) { setMpStatus('Enter 6-char code', '#ff4444'); return; }
  setMpStatus('Joining...', '#ffff44');
  supaFetch('multiplayer_rooms', { query: `?code=eq.${code}&select=code,world_name,world_data,player_count` })
    .then(data => {
      if (!Array.isArray(data) || data.length === 0) { setMpStatus('Room not found', '#ff4444'); return; }
      const room = data[0];
      gameMode = 'coop';
      const seed = room.seed || 12345;
      generate(seed);
      const arr = base64ToWorld(room.world_data);
      world.set(arr);
      // Set spawn position after loading world
      const px = Math.floor(50 + Math.random() * (WORLD_W - 100));
      player.x = px * TILE;
      let spawnY = 0;
      while (spawnY < WORLD_H && getBlock(px, spawnY) === 0) spawnY++;
      while (spawnY > 0 && getBlock(px, spawnY) !== 0) spawnY--;
      player.y = spawnY * TILE;
      mpRoomCode = code;
      mpIsHost = false;
      supaFetch('multiplayer_rooms', { method: 'PATCH', query: `?code=eq.${code}`, body: { last_active: new Date().toISOString() } });
      document.getElementById('multiplayer-menu').style.display = 'none';
      startGame();
    })
    .catch(() => setMpStatus('Failed to join', '#ff4444'));
}

document.getElementById('btn-multiplayer').onclick = showMultiplayerMenu;
document.getElementById('btn-host').onclick = hostMultiplayerRoom;
document.getElementById('btn-join').onclick = joinMultiplayerRoom;
document.getElementById('btn-mp-back').onclick = hideMultiplayerMenu;
