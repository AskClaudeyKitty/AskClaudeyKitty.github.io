<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Index</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem 4rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            margin-top: 0;
            color: #2d3748;
        }
        .game-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }
        a {
            display: inline-block;
            padding: 1rem 2rem;
            background: #48bb78;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            transition: background 0.2s ease;
        }
        a:hover {
            background: #38a169;
        }
        a:nth-child(1) {
            background: #ed8936;
        }
        a:nth-child(1):hover {
            background: #dd6b20;
        }
        a:nth-child(2) {
            background: #48bb78;
        }
        a:nth-child(2):hover {
            background: #38a169;
        }
        a:nth-child(3) {
            background: #e53e3e;
        }
        a:nth-child(3):hover {
            background: #c53030;
        }
        a:nth-child(4) {
            background: #805ad5;
        }
        a:nth-child(4):hover {
            background: #6b46c1;
        }
        a:nth-child(5) {
            background: #38b2ac;
        }
        a:nth-child(5):hover {
            background: #319795;
        }
        a:nth-child(6) {
            background: #9f7aea;
        }
        a:nth-child(6):hover {
            background: #805ad5;
        }
        a:nth-child(7) {
            background: #e53e3e;
        }
        a:nth-child(7):hover {
            background: #c53030;
        }
        a:nth-child(8) {
            background: #3182ce;
        }
        a:nth-child(8):hover {
            background: #2b6cb0;
        }
        #code-section {
            margin-top: 2rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1rem;
        }
        #code-section p { font-size: 0.85rem; color: #a0aec0; margin-bottom: 0.5rem; }
        #code-input {
            padding: 0.5rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            width: 140px;
            text-align: center;
            letter-spacing: 4px;
        }
        #code-input:focus { outline: none; border-color: #667eea; }
        #source-links { display: none; margin-top: 1.5rem; }
        #source-links h3 { color: #4a5568; margin-bottom: 1rem; font-size: 1rem; }
        .src-row { margin-bottom: 8px; text-align: left; }
        .src-row span { font-size: 0.85rem; color: #4a5568; display: block; margin-bottom: 2px; font-weight: bold; }
        .src-row a { display: inline !important; padding: 0 !important; background: none !important; color: #667eea !important; font-size: 0.78rem; word-break: break-all; }
        #wrong-code { color: #e53e3e; font-size: 0.8rem; margin-top: 4px; min-height: 1em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Game Collection</h1>
        <p>Welcome to the game hub!</p>
        <div class="game-links">
            <a href="lag_simulator.html">Lag Simulator</a>
            <a href="guessing_game.html">Play Guessing Game</a>
            <a href="explosion-button.html">Explosion Button</a>
            <a href="explosion-button-webgl.html">Explosion Button (WebGL)</a>
            <a href="bouncing_ball.html">Ball in a Ring</a>
            <a href="tower-defense.html">Tower Defense Game</a>
            <a href="regular-clicker-game.html">Regular Clicker Game</a>
            <a href="computer_crasher.html">Computer Crasher</a>
            <a href="python%20stuff/tank_game.html">Tank Battle</a>
            <a href="python%20stuff/index.html">Python Scripts</a>
        </div>

        <div id="code-section">
            <p>🔒 Enter code for source links</p>
            <input id="code-input" type="password" maxlength="6" placeholder="······" oninput="checkCode(this.value)" autocomplete="off">
            <div id="wrong-code"></div>
            <div id="source-links">
                <h3>📋 Source Code Links</h3>
                <div id="src-list"></div>
            </div>
        </div>
    </div>

<script>
const base = 'https://askclaudeykitty.github.io/';
const sources = [
    ['Index Page',               'source_index.txt'],
    ['Lag Simulator',            'source_lag_simulator.txt'],
    ['Guessing Game',            'source_guessing_game.txt'],
    ['Explosion Button',         'source_explosion-button.txt'],
    ['Explosion Button (WebGL)', 'source_explosion-button-webgl.txt'],
    ['Ball in a Ring',           'source_bouncing_ball.txt'],
    ['Tower Defense',            'source_tower-defense.txt'],
    ['Regular Clicker Game',     'source_regular-clicker-game.txt'],
    ['Computer Crasher',         'source_computer_crasher.txt'],
];

function checkCode(val) {
    const msg = document.getElementById('wrong-code');
    if (val.length < 6) { msg.textContent = ''; return; }
    if (val === '396967') {
        document.getElementById('source-links').style.display = 'block';
        msg.textContent = '';
        buildSources();
    } else {
        msg.textContent = 'Wrong code.';
        document.getElementById('source-links').style.display = 'none';
    }
}

function buildSources() {
    const list = document.getElementById('src-list');
    if (list.children.length) return;
    sources.forEach(([name, file]) => {
        const url = base + file;
        const row = document.createElement('div');
        row.className = 'src-row';
        row.innerHTML = `<span>${name}</span><a href="${url}" target="_blank">${url}</a>`;
        list.appendChild(row);
    });
}
</script>
</body>
</html>
