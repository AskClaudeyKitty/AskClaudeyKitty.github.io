<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Index</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem 4rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            margin-top: 0;
            color: #2d3748;
        }
        .section-title {
            font-size: 1.3rem;
            color: #718096;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .section-title:first-of-type {
            margin-top: 1rem;
        }
        .game-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        a {
            display: inline-block;
            padding: 1rem 2rem;
            background: #48bb78;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            transition: background 0.2s ease;
        }
        a:hover {
            background: #38a169;
        }
        .simulations a {
            background: #ed8936;
        }
        .simulations a:hover {
            background: #dd6b20;
        }
        .games a:nth-child(1) {
            background: #48bb78;
        }
        .games a:nth-child(1):hover {
            background: #38a169;
        }
        .games a:nth-child(2) {
            background: #e53e3e;
        }
        .games a:nth-child(2):hover {
            background: #c53030;
        }
        .games a:nth-child(3) {
            background: #805ad5;
        }
        .games a:nth-child(3):hover {
            background: #6b46c1;
        }
        .games a:nth-child(4) {
            background: #38b2ac;
        }
        .games a:nth-child(4):hover {
            background: #319795;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Game Collection</h1>
        <p>Welcome to the game hub!</p>

        <h2 class="section-title">🔬 Simulations</h2>
        <div class="game-links simulations">
            <a href="lag_simulator.html">Lag Simulator</a>
        </div>

        <h2 class="section-title">🎮 Games</h2>
        <div class="game-links games">
            <a href="guessing_game.html">Play Guessing Game</a>
            <a href="explosion-button.html">Explosion Button</a>
            <a href="explosion-button-webgl.html">Explosion Button (WebGL)</a>
            <a href="bouncing_ball.html">Ball in a Ring</a>
        </div>
    </div>
</body>
</html>
