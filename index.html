<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Index</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem 4rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            margin-top: 0;
            color: #2d3748;
        }
        .game-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }
        a {
            display: inline-block;
            padding: 1rem 2rem;
            background: #48bb78;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            transition: background 0.2s ease;
        }
        a:hover {
            background: #38a169;
        }
        a:nth-child(2) {
            background: #e53e3e;
        }
        a:nth-child(2):hover {
            background: #c53030;
        }
        a:nth-child(3) {
            background: #805ad5;
        }
        a:nth-child(3):hover {
            background: #6b46c1;
        }
        a:nth-child(4) {
            background: #ed8936;
        }
        a:nth-child(4):hover {
            background: #dd6b20;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Game Collection</h1>

        </div>
    </div>
</body>
</html>
