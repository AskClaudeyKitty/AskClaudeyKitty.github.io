<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-header .status {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: #f1f1f1;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message a {
            color: #667eea;
            text-decoration: underline;
        }

        .message a:hover {
            color: #764ba2;
        }

        .chat-input {
            padding: 20px;
            background: #f9f9f9;
            border-top: 1px solid #e0e0e0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #sendBtn:hover {
            transform: scale(1.05);
        }

        #sendBtn:active {
            transform: scale(0.95);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #f1f1f1;
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .welcome-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 14px;
        }

        .welcome-message h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .feedback-btns {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .feedback-btns:hover { opacity: 1; }
        .feedback-btn {
            background: none;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .feedback-btn:hover { background: #eee; }
        .feedback-btn.liked { background: #d4edda; border-color: #28a745; }
        .feedback-btn.disliked { background: #f8d7da; border-color: #dc3545; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Simple AI + Web Search</h1>
            <div class="status">Online with Web Search 🔍</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>Welcome!</h2>
                <p>I'm a simple AI with web search capabilities! 🔍</p>
                <br>
                <p>Try asking me:</p>
                <p>"Hello", "Tell me a joke", "What time is it?", "What's 5 + 3?"</p>
                <p>"Search for Python", "Who is Elon Musk?", "What is quantum computing?"</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <div class="chat-input">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type your message..." autofocus>
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        class SimpleAI {
            constructor() {
                this.responses = {
                    greetings: [
                        "Hello! How can I help you today?",
                        "Hi there! What's on your mind?",
                        "Hey! Ask me anything!",
                        "Hi! I'm here to help!"
                    ],
                    farewells: [
                        "Goodbye! Have a great day! 👋",
                        "See you later! 👋",
                        "Bye! Come back anytime! 🌟",
                        "Take care! 😊"
                    ],
                    howAreYou: [
                        "I'm doing great, thanks for asking! 😊",
                        "I'm just a simple AI, but I'm functioning perfectly!",
                        "Running smoothly! How about you?"
                    ],
                    thanks: [
                        "You're welcome! 🌟",
                        "Happy to help! 😊",
                        "Anytime! Let me know if you need anything else!"
                    ],
                    jokes: [
                        "Why do programmers prefer dark mode? Because light attracts bugs! 🐛😄",
                        "Why did the developer go broke? Because he used up all his cache! 💰",
                        "There are only 10 types of people in the world: those who understand binary and those who don't. 🔢😄",
                        "A SQL query walks into a bar, walks up to two tables, and asks: 'Can I join you?' 🍺😄",
                        "Why do Java developers wear glasses? Because they don't C#! 👓😄"
                    ],
                    weather: [
                        "I can't check the weather, but I hope it's nice where you are! ☀️",
                        "I don't have access to weather data, but you could check weather.com! 🌤️"
                    ],
                    time: [
                        `The current time is ${new Date().toLocaleTimeString()} ⏰`,
                        `It's ${new Date().toLocaleTimeString()} right now ⌚`
                    ],
                    date: [
                        `Today is ${new Date().toLocaleDateString()} 📅`,
                        `It's ${new Date().toLocaleDateString()} 🗓️`
                    ],
                    name: [
                        "I'm SimpleAI, a basic question-answering bot! 🤖",
                        "You can call me SimpleAI! I'm a friendly AI assistant! 😊"
                    ],
                    creator: [
                        "I was created by a developer like you! 👨‍💻",
                        "I'm a homegrown AI, built with JavaScript! 💻"
                    ],
                    meaningOfLife: [
                        "42! According to Douglas Adams, anyway. 🌌😄",
                        "That's a deep question! I'd say it's to learn and help others. 💭"
                    ],
                    search: [
                        "I'll search the web for you! 🔍",
                        "Let me look that up online! 🌐",
                        "Searching the internet... 🔎"
                    ],
                    math: [
                        "I can help with simple math! Try asking 'what is 5 + 3' ➕",
                        "Math? I can do basic calculations. Ask me 'what's 10 * 4' 🔢"
                    ],
                    help: [
                        "I can respond to greetings, tell jokes, give the time/date, do simple math, and search the web! 🎯",
                        "Try: hello, joke, time, date, what's 5+3, 'search for X', or help! 💡"
                    ],
                    identity: [
                        "I'm an AI assistant built with JavaScript! 🤖💻",
                        "I'm a simple chatbot running in your browser! 🌐"
                    ],
                    compliment: [
                        "Thank you so much! You're making my circuits warm! 😊💕",
                        "Aw, you're so sweet! Thanks! 🌟",
                        "That's very kind of you to say! 😄"
                    ],
                    sad: [
                        "I'm sorry to hear that. Want to talk about it? 💙",
                        "That sounds tough. I'm here if you need to vent. 🤗",
                        "Sending you virtual hugs. Things will get better! 💪"
                    ],
                    happy: [
                        "That's wonderful to hear! 🎉",
                        "Awesome! I'm happy for you! 😄",
                        "Yay! That's great news! 🌟"
                    ],
                    angry: [
                        "I understand you're frustrated. Take a deep breath. 🫂",
                        "That sounds really annoying. Want to talk about it? 😤",
                        "I get it. Sometimes things just suck. 💢"
                    ],
                    confused: [
                        "Let me try to explain that better! 🤔",
                        "I can see how that's confusing. Let me clarify! 💡",
                        "No worries, let's break it down step by step! 📚"
                    ]
                };

                this.patterns = [
                    { regex: /^(hi|hello|hey|greetings|howdy)/i, category: 'greetings' },
                    { regex: /^(bye|goodbye|see ya|farewell|exit|quit)/i, category: 'farewells' },
                    { regex: /(how are you|how's it going|what's up|how do you do)/i, category: 'howAreYou' },
                    { regex: /(thank|thanks|thx|appreciate)/i, category: 'thanks' },
                    { regex: /(joke|funny|laugh|humor)/i, category: 'jokes' },
                    { regex: /(weather|temperature|rain|sunny|forecast)/i, category: 'weather' },
                    { regex: /(what time|current time|time is it)/i, category: 'time' },
                    { regex: /(what day|today's date|what is the date)/i, category: 'date' },
                    { regex: /(your name|who are you|what are you)/i, category: 'name' },
                    { regex: /(made you|created you|who built you)/i, category: 'creator' },
                    { regex: /(meaning of life|purpose of life|why are we here)/i, category: 'meaningOfLife' },
                    { regex: /(math|calculation|calculate|add|subtract|multiply|divide)/i, category: 'math' },
                    { regex: /(help|what can you do|abilities|features)/i, category: 'help' },
                    { regex: /(are you (an )?ai|are you a bot|are you human|artificial intelligence)/i, category: 'identity' },
                    { regex: /(awesome|cool|great|amazing|you're (the )?best|good bot|nice)/i, category: 'compliment' },
                    { regex: /^(search|google|look up|find information about)/i, category: 'search' }
                ];

                // Conversation memory
                this.memory = [];
                this.maxMemory = 10;
                this.lastTopic = null;
                this.userName = null;
                this.conversationCount = 0;

                // Local Storage Learning
                this.learnedFacts = JSON.parse(localStorage.getItem('ai_learned_facts') || '[]');
                this.likedResponses = JSON.parse(localStorage.getItem('ai_liked_responses') || '[]');
                this.dislikedResponses = JSON.parse(localStorage.getItem('ai_disliked_responses') || '[]');
                this.userInterests = JSON.parse(localStorage.getItem('ai_user_interests') || '[]');
                this.searchCache = JSON.parse(localStorage.getItem('ai_search_cache') || '{}');
                this.responseStats = JSON.parse(localStorage.getItem('ai_response_stats') || '{}');
            }

            // Save learned data to localStorage
            saveLearning() {
                localStorage.setItem('ai_learned_facts', JSON.stringify(this.learnedFacts));
                localStorage.setItem('ai_liked_responses', JSON.stringify(this.likedResponses));
                localStorage.setItem('ai_disliked_responses', JSON.stringify(this.dislikedResponses));
                localStorage.setItem('ai_user_interests', JSON.stringify(this.userInterests));
                localStorage.setItem('ai_search_cache', JSON.stringify(this.searchCache));
                localStorage.setItem('ai_response_stats', JSON.stringify(this.responseStats));
            }

            // Extract facts from user messages ("X is Y", "I like X", "My favorite X is Y")
            extractFacts(input) {
                const facts = [];
                
                // "X is Y" pattern
                const isMatches = input.match(/([a-zA-Z\s]+)\s+is\s+([a-zA-Z0-9\s]+)/gi);
                if (isMatches) {
                    isMatches.forEach(match => {
                        const parts = match.split(/\s+is\s+/i);
                        if (parts.length === 2) {
                            facts.push({ subject: parts[0].trim().toLowerCase(), relation: 'is', object: parts[1].trim().toLowerCase() });
                        }
                    });
                }

                // "I like X" / "I love X" / "I hate X"
                const likeMatches = input.match(/i\s+(like|love|hate|enjoy|prefer)\s+([a-zA-Z0-9\s]+)/i);
                if (likeMatches) {
                    facts.push({ subject: 'user', relation: likeMatches[1].toLowerCase(), object: likeMatches[2].trim().toLowerCase() });
                    // Track interests
                    const interest = likeMatches[2].trim().toLowerCase();
                    if (!this.userInterests.includes(interest)) {
                        this.userInterests.push(interest);
                        if (this.userInterests.length > 20) this.userInterests.shift();
                    }
                }

                // "My favorite X is Y"
                const favMatches = input.match(/my\s+favorite\s+([a-zA-Z]+)\s+is\s+([a-zA-Z0-9\s]+)/i);
                if (favMatches) {
                    facts.push({ subject: `user_favorite_${favMatches[1]}`, relation: 'is', object: favMatches[2].trim().toLowerCase() });
                }

                // Store new facts
                facts.forEach(fact => {
                    const exists = this.learnedFacts.some(f => 
                        f.subject === fact.subject && f.relation === fact.relation && f.object === fact.object
                    );
                    if (!exists) {
                        this.learnedFacts.push({ ...fact, timestamp: Date.now() });
                        if (this.learnedFacts.length > 50) this.learnedFacts.shift();
                    }
                });

                if (facts.length > 0) this.saveLearning();
                return facts;
            }

            // Find relevant fact for a query
            findRelevantFact(input) {
                const words = input.toLowerCase().split(/\s+/);
                for (const fact of this.learnedFacts.slice().reverse()) {
                    if (words.some(w => fact.subject.includes(w) || fact.object.includes(w))) {
                        return fact;
                    }
                }
                return null;
            }

            // Track response feedback
            trackFeedback(response, liked) {
                const key = response.substring(0, 100);
                if (liked) {
                    if (!this.likedResponses.includes(key)) {
                        this.likedResponses.push(key);
                        if (this.likedResponses.length > 30) this.likedResponses.shift();
                    }
                    this.responseStats[key] = (this.responseStats[key] || 0) + 1;
                } else {
                    if (!this.dislikedResponses.includes(key)) {
                        this.dislikedResponses.push(key);
                        if (this.dislikedResponses.length > 30) this.dislikedResponses.shift();
                    }
                    this.responseStats[key] = (this.responseStats[key] || 0) - 1;
                }
                this.saveLearning();
            }

            // Check if response was previously liked
            wasLiked(response) {
                const key = response.substring(0, 100);
                return this.likedResponses.includes(key) || (this.responseStats[key] || 0) > 0;
            }

            // Check if response was previously disliked
            wasDisliked(response) {
                const key = response.substring(0, 100);
                return this.dislikedResponses.includes(key) || (this.responseStats[key] || 0) < 0;
            }

            // Get cached search result
            getCachedSearch(query) {
                const key = query.toLowerCase().substring(0, 50);
                const cached = this.searchCache[key];
                if (cached && Date.now() - cached.time < 24 * 60 * 60 * 1000) {
                    return cached.result;
                }
                return null;
            }

            // Cache search result
            cacheSearch(query, result) {
                const key = query.toLowerCase().substring(0, 50);
                this.searchCache[key] = { result, time: Date.now() };
                // Keep only 20 most recent
                const entries = Object.entries(this.searchCache);
                if (entries.length > 20) {
                    entries.sort((a, b) => a[1].time - b[1].time);
                    this.searchCache = Object.fromEntries(entries.slice(-20));
                }
                this.saveLearning();
            }

            // Store conversation in memory
            remember(userMsg, aiMsg) {
                this.memory.push({ user: userMsg, ai: aiMsg, time: Date.now() });
                if (this.memory.length > this.maxMemory) {
                    this.memory.shift();
                }
                this.conversationCount++;
            }

            // Detect sentiment
            detectSentiment(input) {
                const sadWords = /(sad|depressed|upset|cry|crying|hurt|pain|lonely|miss|lost|grief|sorry|bad day|terrible|awful)/i;
                const happyWords = /(happy|excited|great|awesome|amazing|wonderful|fantastic|love|best|good news|celebrate|yay|woohoo)/i;
                const angryWords = /(angry|mad|furious|hate|stupid|idiot|annoying|frustrated|pissed|damn|hell|shit)/i;
                const confusedWords = /(confused|don't understand|what do you mean|huh|wait what|not sure|clarify|explain)/i;

                if (angryWords.test(input)) return 'angry';
                if (sadWords.test(input)) return 'sad';
                if (happyWords.test(input)) return 'happy';
                if (confusedWords.test(input)) return 'confused';
                return 'neutral';
            }

            // Extract potential name
            extractName(input) {
                const nameMatch = input.match(/(?:my name is|i am|i'm|call me)\s+([a-zA-Z]+)/i);
                if (nameMatch && nameMatch[1]) {
                    this.userName = nameMatch[1];
                    return `Nice to meet you, ${this.userName}! 👋`;
                }
                return null;
            }

            // Check for follow-up questions
            isFollowUp(input) {
                const followUpWords = /^(what about|how about|and|also|what|why|how|tell me more|can you|could you|explain|elaborate)/i;
                return followUpWords.test(input.trim()) && this.memory.length > 0;
            }

            // Get context from memory
            getContext() {
                if (this.memory.length === 0) return null;
                const lastExchange = this.memory[this.memory.length - 1];
                return lastExchange;
            }

            getResponse(category) {
                const responses = this.responses[category];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            processMath(input) {
                try {
                    const mathExpression = input.toLowerCase()
                        .replace(/what is/g, '')
                        .replace(/what's/g, '')
                        .replace(/calculate/g, '')
                        .replace(/equals/g, '')
                        .replace(/[^0-9+\-*/().\s]/g, '')
                        .trim();

                    if (mathExpression && mathExpression.length > 0) {
                        const result = eval(mathExpression);
                        return `The answer is: ${result} 🔢`;
                    }
                } catch (e) {
                    return "I couldn't calculate that. Try something like 'what is 5 + 3' ➕";
                }
            }

            async searchWikipedia(query) {
                try {
                    const response = await fetch(
                        `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&titles=${encodeURIComponent(query)}`
                    );
                    const data = await response.json();
                    const pages = data.query.pages;
                    const pageId = Object.keys(pages)[0];

                    if (pageId === '-1') {
                        return null;
                    }

                    const extract = pages[pageId].extract;
                    return extract.split('\n\n')[0];
                } catch (e) {
                    return null;
                }
            }

            async searchDuckDuckGo(query) {
                try {
                    const response = await fetch(
                        `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json`
                    );
                    const data = await response.json();

                    if (data.AbstractText) {
                        return data.AbstractText;
                    } else if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                        const firstTopic = data.RelatedTopics.find(t => t.Text);
                        return firstTopic ? firstTopic.Text : null;
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            }

            async performSearch(query) {
                // Check cache first
                const cached = this.getCachedSearch(query);
                if (cached) {
                    this.lastTopic = query;
                    return `📚 (cached) ${cached}`;
                }

                let result = await this.searchWikipedia(query);
                if (result) {
                    this.lastTopic = query;
                    this.cacheSearch(query, result);
                    return `📚 From Wikipedia: ${result}`;
                }

                result = await this.searchDuckDuckGo(query);
                if (result) {
                    this.lastTopic = query;
                    this.cacheSearch(query, result);
                    return `🔍 ${result}`;
                }

                return `I couldn't find specific information, but you can search here: 🔗\nhttps://duckduckgo.com/?q=${encodeURIComponent(query)}`;
            }

            extractSearchQuery(input) {
                const trimmed = input.trim();
                let query = trimmed
                    .replace(/^(search for|search|google|look up|find information about|tell me about|what is|what's|who is|what are)/i, '')
                    .replace(/[?!.,;]$/g, '')
                    .trim();
                return query || trimmed;
            }

            async respond(input) {
                const trimmedInput = input.trim().toLowerCase();

                // Extract and learn facts
                const facts = this.extractFacts(input);

                // Check for name introduction
                const nameResponse = this.extractName(input);
                if (nameResponse) return nameResponse;

                // Check for learned facts relevance
                const relevantFact = this.findRelevantFact(input);
                if (relevantFact && Math.random() > 0.5) {
                    if (relevantFact.relation === 'is') {
                        return `I remember you told me that ${relevantFact.subject} is ${relevantFact.object}! 🤓`;
                    } else {
                        return `I know you ${relevantFact.relation} ${relevantFact.object}! 😊`;
                    }
                }

                // Detect sentiment
                const sentiment = this.detectSentiment(input);

                // Check for follow-up
                if (this.isFollowUp(input) && this.lastTopic) {
                    const context = this.getContext();
                    if (context && context.ai.includes('Wikipedia')) {
                        return `Want me to search for more about ${this.lastTopic}? Or ask me something else! 🤔`;
                    }
                }

                // Check for explicit search request
                if (/^(search|google|look up|find)/i.test(trimmedInput)) {
                    const query = this.extractSearchQuery(input);
                    return this.performSearch(query);
                }

                // Check patterns - prefer previously liked responses
                for (const pattern of this.patterns) {
                    if (pattern.regex.test(trimmedInput)) {
                        const responses = this.responses[pattern.category];
                        // Sort by preference (liked first)
                        const sorted = responses.slice().sort((a, b) => {
                            const aLiked = this.wasLiked(a) ? 1 : 0;
                            const bLiked = this.wasLiked(b) ? 1 : 0;
                            const aDisliked = this.wasDisliked(a) ? -1 : 0;
                            const bDisliked = this.wasDisliked(b) ? -1 : 0;
                            return (bLiked + bDisliked) - (aLiked + aDisliked);
                        });
                        const response = sorted[0];
                        if (this.userName && Math.random() > 0.7) {
                            return `${response} By the way, ${this.userName}, how's your day going?`;
                        }
                        return response;
                    }
                }

                // Check for math
                if (/[0-9+\-*/]/.test(input) &&
                    (trimmedInput.includes('calculate') || trimmedInput.includes('what\'s') ||
                     (/^what is/.test(trimmedInput) && /[0-9]/.test(input)))) {
                    const mathResponse = this.processMath(input);
                    if (!mathResponse.includes('couldn\'t')) {
                        return mathResponse;
                    }
                }

                // For unknown questions, try to search
                if (trimmedInput.includes('who') || trimmedInput.includes('what') ||
                    trimmedInput.includes('when') || trimmedInput.includes('where') ||
                    trimmedInput.includes('why') || trimmedInput.includes('how') ||
                    trimmedInput.includes('tell me about')) {
                    const query = this.extractSearchQuery(input);
                    return this.performSearch(query);
                }

                // Sentiment-based default responses
                if (sentiment === 'sad') return this.getResponse('sad');
                if (sentiment === 'happy') return this.getResponse('happy');
                if (sentiment === 'angry') return this.getResponse('angry');
                if (sentiment === 'confused') return this.getResponse('confused');

                // Context-aware defaults
                if (this.conversationCount > 5) {
                    return "We've been chatting for a while! What else is on your mind? 💭";
                }

                const defaultResponses = [
                    "That's interesting! Tell me more! 🤔",
                    "Hmm, I'm not sure about that. Try asking something else! 😅",
                    "I'm still learning! Could you rephrase that? 🤷",
                    "Interesting! What else would you like to know? 💭"
                ];
                return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
            }
        }

        // Chat UI
        const ai = new SimpleAI();
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        let isFirstMessage = true;

        function addMessage(text, isUser) {
            // Remove welcome message on first message
            if (isFirstMessage) {
                const welcome = chatMessages.querySelector('.welcome-message');
                if (welcome) welcome.remove();
                isFirstMessage = false;
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;

            if (isUser) {
                messageDiv.textContent = text;
            } else {
                let htmlText = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                htmlText = htmlText.replace(/(https?:\/\/[^\s\n<>]+)/g, '<a href="$1" target="_blank">$1</a>');
                htmlText = htmlText.replace(/\n/g, '<br>');
                messageDiv.innerHTML = htmlText;

                // Add feedback buttons
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback-btns';
                
                const likeBtn = document.createElement('button');
                likeBtn.className = 'feedback-btn';
                likeBtn.textContent = '👍';
                likeBtn.onclick = () => {
                    ai.trackFeedback(text, true);
                    likeBtn.classList.add('liked');
                    dislikeBtn.disabled = true;
                };
                
                const dislikeBtn = document.createElement('button');
                dislikeBtn.className = 'feedback-btn';
                dislikeBtn.textContent = '👎';
                dislikeBtn.onclick = () => {
                    ai.trackFeedback(text, false);
                    dislikeBtn.classList.add('disliked');
                    likeBtn.disabled = true;
                };
                
                feedbackDiv.appendChild(likeBtn);
                feedbackDiv.appendChild(dislikeBtn);
                messageDiv.appendChild(feedbackDiv);
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, true);
            userInput.value = '';

            // Disable input while processing
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Show typing indicator
            typingIndicator.classList.add('active');
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Simulate AI thinking
            setTimeout(async () => {
                const response = await ai.respond(text);
                typingIndicator.classList.remove('active');
                addMessage(response, false);
                
                // Store in memory
                ai.remember(text, response);
                
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }, 500 + Math.random() * 500);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
