<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powder Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d4a85a'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Press Start 2P', monospace; overflow: hidden; color: #fff; }
  #wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #toolbar { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 900px; padding: 8px; background: rgba(15,15,25,0.95); border: 2px solid #555; border-radius: 4px; }
  .elem { background: #2a2a4a; border: 2px solid #555; color: #fff; padding: 6px 10px; font-family: 'Press Start 2P', monospace; font-size: 8px; cursor: pointer; user-select: none; }
  .elem:hover { border-color: #ffff44; }
  .elem.active { border-color: #44ff44; color: #44ff44; }
  .elem span { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; border: 1px solid #000; }
  #controls { display: flex; gap: 8px; align-items: center; font-size: 8px; }
  #controls button { background: #2a2a4a; border: 2px solid #555; color: #fff; padding: 6px 10px; font-family: 'Press Start 2P', monospace; font-size: 8px; cursor: pointer; }
  #controls button:hover { border-color: #ffff44; }
  canvas { border: 4px solid #333; cursor: crosshair; image-rendering: pixelated; }
  #info { font-size: 8px; color: #aaa; }
</style>
</head>
<body oncontextmenu="return false;">
<div id="wrap">
  <div id="toolbar"></div>
  <div id="controls">
    <button id="btn-clear">Clear</button>
    <button id="btn-brush-small">Small</button>
    <button id="btn-brush-mid">Medium</button>
    <button id="btn-brush-big">Big</button>
    <button id="btn-pause">Pause</button>
    <span style="color:#888;font-size:8px;">LMB: place | RMB: erase | C: clear | Space: pause</span>
  </div>
  <canvas id="c" width="900" height="540"></canvas>
  <div id="info">Powder Game — falling sand simulator</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// pixel size — each cell is 3px
const CELL = 3;
const GW = Math.floor(W / CELL), GH = Math.floor(H / CELL);

// grid: -1 = empty, 0+ = element id
let grid = new Int16Array(GW * GH);
let grid2 = new Int16Array(GW * GH); // swap buffer
// color and other props stored in element def
let color = new Uint32Array(GW * GH); // 0xAABBGGRR
let life = new Uint8Array(GW * GH); // for fire, plant, etc

// elements
const E = {
  EMPTY: 0,
  SAND: 1,
  WATER: 2,
  STONE: 3,
  WOOD: 4,
  FIRE: 5,
  PLANT: 6,
  OIL: 7,
  SALT: 8,
  GUNPOWDER: 9,
  STEAM: 10,
  SMOKE: 11,
  ICE: 12,
  LAVA: 13,
  ACID: 14,
  SALT_WATER: 15,
  CLONE: 16,
  DIRT: 17,
  GLASS: 18,
};

// element definitions
const DEFS = {};
function def(id, opts) {
  DEFS[id] = Object.assign({ id, color: 0xffffff, density: 1, flammable: false, lifetime: 0, react: null }, opts);
}
def(E.EMPTY, { color: 0x000000, density: 0 });
def(E.SAND, { color: 0xd4a85a, density: 60 });
def(E.WATER, { color: 0x4488cc, density: 40 });
def(E.STONE, { color: 0x888888, density: 100 });
def(E.WOOD, { color: 0x8a5a2a, density: 80, flammable: true });
def(E.FIRE, { color: 0xff4400, density: 1, lifetime: 60, flammable: false });
def(E.PLANT, { color: 0x44aa44, density: 70, flammable: true });
def(E.OIL, { color: 0x664422, density: 30, flammable: true });
def(E.SALT, { color: 0xeeeeff, density: 55 });
def(E.GUNPOWDER, { color: 0x222222, density: 65, flammable: true, explosive: true });
def(E.STEAM, { color: 0xcccccc, density: 1, lifetime: 200 });
def(E.SMOKE, { color: 0x666666, density: 1, lifetime: 300 });
def(E.ICE, { color: 0xaaddff, density: 90 });
def(E.LAVA, { color: 0xff5a1f, density: 95, lifetime: 500 });
def(E.ACID, { color: 0xaaff44, density: 45 });
def(E.SALT_WATER, { color: 0x2244aa, density: 42 });
def(E.CLONE, { color: 0xffffff, density: 1 });
def(E.DIRT, { color: 0x6a3a1a, density: 65 });
def(E.GLASS, { color: 0xaaddff, density: 100 });

// palette for UI
const PALETTE = [
  { id: E.SAND,       name: 'Sand',       col: '#d4a85a' },
  { id: E.WATER,      name: 'Water',      col: '#4488cc' },
  { id: E.SALT_WATER, name: 'Saltwater',  col: '#2244aa' },
  { id: E.SALT,       name: 'Salt',       col: '#eeeeff' },
  { id: E.OIL,        name: 'Oil',        col: '#664422' },
  { id: E.ACID,       name: 'Acid',       col: '#aaff44' },
  { id: E.LAVA,       name: 'Lava',       col: '#ff5a1f' },
  { id: E.FIRE,       name: 'Fire',       col: '#ff4400' },
  { id: E.SMOKE,      name: 'Smoke',      col: '#666666' },
  { id: E.STEAM,      name: 'Steam',      col: '#cccccc' },
  { id: E.STONE,      name: 'Stone',      col: '#888888' },
  { id: E.DIRT,       name: 'Dirt',       col: '#6a3a1a' },
  { id: E.WOOD,       name: 'Wood',       col: '#8a5a2a' },
  { id: E.PLANT,      name: 'Plant',      col: '#44aa44' },
  { id: E.ICE,        name: 'Ice',        col: '#aaddff' },
  { id: E.GLASS,      name: 'Glass',      col: '#aaddff' },
  { id: E.GUNPOWDER,  name: 'Gunpowder',  col: '#222222' },
  { id: E.CLONE,      name: 'Clone',      col: '#ffffff' },
  { id: E.EMPTY,      name: 'Erase',      col: '#000000' },
];

let selected = E.SAND;
let brushSize = 3; // radius
let paused = false;
let mouseX = -1, mouseY = -1, mouseDown = false, rightDown = false;

function idx(x, y) { return y * GW + x; }
function inBounds(x, y) { return x >= 0 && x < GW && y >= 0 && y < GH; }
function get(x, y) { return inBounds(x, y) ? grid[idx(x, y)] : E.STONE; }
function set(x, y, e) { if (inBounds(x, y)) grid[idx(x, y)] = e; }

// convert hex color to packed int (RGBA bytes for ImageData)
function packColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (0xff << 24) | (b << 16) | (g << 8) | r;
}

function colorAt(x, y) {
  const e = get(x, y);
  return DEFS[e].color;
}

// physics step
function step() {
  if (paused) return;
  // swap to read from grid2 (prev frame)
  grid2.set(grid);
  // random direction
  const dir = Math.random() < 0.5 ? -1 : 1;

  for (let y = GH - 2; y >= 0; y--) {
    const xStart = dir < 0 ? 0 : GW - 1;
    const xEnd = dir < 0 ? GW : -1;
    for (let xi = 0; xi < GW; xi++) {
      const x = xStart + xi * dir;
      const i = idx(x, y);
      const e = grid2[i];
      if (e === E.EMPTY) continue;
      const def = DEFS[e];
      // gas: rise
      if (def.density < 5 && (e === E.SMOKE || e === E.STEAM || e === E.FIRE)) {
        if (life[i] > 0) life[i]--;
        if (life[i] === 0) { set(x, y, E.EMPTY); continue; }
        if (inBounds(x, y - 1) && (get(x, y - 1) === E.EMPTY || (DEFS[get(x, y-1)].density < def.density && get(x,y-1) !== e))) {
          set(x, y - 1, e); set(x, y, E.EMPTY); continue;
        }
        const dx = Math.random() < 0.5 ? -1 : 1;
        if (inBounds(x + dx, y) && (get(x + dx, y) === E.EMPTY || DEFS[get(x + dx, y)].density < def.density)) {
          set(x + dx, y, e); set(x, y, E.EMPTY); continue;
        }
        continue;
      }
      // liquid: fall
      if (def.density < 90) {
        // try down
        if (inBounds(x, y + 1)) {
          const below = get(x, y + 1);
          if (below === E.EMPTY || (DEFS[below].density < def.density && below !== e)) {
            set(x, y + 1, e); set(x, y, E.EMPTY); continue;
          }
          // try diagonal
          const ddx = Math.random() < 0.5 ? -1 : 1;
          if (inBounds(x + ddx, y + 1)) {
            const dbelow = get(x + ddx, y + 1);
            if (dbelow === E.EMPTY || (DEFS[dbelow].density < def.density && dbelow !== e)) {
              set(x + ddx, y + 1, e); set(x, y, E.EMPTY); continue;
            }
          }
          // try side
          if (inBounds(x + ddx, y)) {
            const side = get(x + ddx, y);
            if (side === E.EMPTY || (DEFS[side].density < def.density && side !== e)) {
              set(x + ddx, y, e); set(x, y, E.EMPTY); continue;
            }
          }
        }
      } else {
        // powder: fall only if below is empty or less dense
        if (inBounds(x, y + 1)) {
          const below = get(x, y + 1);
          if (below === E.EMPTY || (DEFS[below].density < def.density && below !== e)) {
            set(x, y + 1, e); set(x, y, E.EMPTY); continue;
          }
          const ddx = Math.random() < 0.5 ? -1 : 1;
          if (inBounds(x + ddx, y + 1) && get(x + ddx, y + 1) === E.EMPTY) {
            set(x + ddx, y + 1, e); set(x, y, E.EMPTY); continue;
          }
        }
      }

      // reactions
      if (e === E.FIRE) {
        // burn neighbors
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (!inBounds(nx, ny)) continue;
          const ne = get(nx, ny);
          if (ne === E.WOOD || ne === E.PLANT || ne === E.OIL) {
            if (Math.random() < 0.05) {
              set(nx, ny, E.FIRE);
              life[idx(nx, ny)] = 80;
            }
          } else if (ne === E.GUNPOWDER) {
            if (Math.random() < 0.3) {
              explode(nx, ny);
            }
          } else if (ne === E.SAND && life[i] < 50) {
            if (Math.random() < 0.01) set(nx, ny, E.GLASS);
          }
        }
        // water -> steam
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (inBounds(nx, ny) && get(nx, ny) === E.WATER) {
            if (Math.random() < 0.1) { set(nx, ny, E.STEAM); set(x, y, E.SMOKE); }
          }
        }
      } else if (e === E.LAVA) {
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (!inBounds(nx, ny)) continue;
          const ne = get(nx, ny);
          if (ne === E.WATER) {
            if (Math.random() < 0.3) {
              set(nx, ny, E.STEAM);
              set(x, y, E.STONE);
            }
          } else if (ne === E.WOOD || ne === E.PLANT || ne === E.OIL) {
            if (Math.random() < 0.05) { set(nx, ny, E.FIRE); }
          }
        }
        if (life[i] > 0) life[i]--;
        else set(x, y, E.STONE);
      } else if (e === E.ACID) {
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (!inBounds(nx, ny)) continue;
          const ne = get(nx, ny);
          if (ne !== E.EMPTY && ne !== E.ACID && ne !== E.WATER && ne !== E.SALT_WATER && ne !== E.STONE && ne !== E.GLASS) {
            if (Math.random() < 0.04) { set(nx, ny, E.SMOKE); }
          }
        }
      } else if (e === E.PLANT) {
        // grow into empty water
        if (Math.random() < 0.005) {
          const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
          const [dx, dy] = dirs[Math.floor(Math.random() * 4)];
          const nx = x + dx, ny = y + dy;
          if (inBounds(nx, ny) && get(nx, ny) === E.WATER) {
            set(nx, ny, E.PLANT);
            set(x, y, E.PLANT);
          }
        }
      } else if (e === E.SALT && Math.random() < 0.01) {
        // dissolve in water
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (inBounds(nx, ny) && get(nx, ny) === E.WATER) {
            if (Math.random() < 0.3) {
              set(nx, ny, E.SALT_WATER);
              set(x, y, E.EMPTY);
            }
          }
        }
      } else if (e === E.ICE && Math.random() < 0.001) {
        // melt
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (inBounds(nx, ny) && get(nx, ny) === E.LAVA) {
            set(x, y, E.WATER); set(nx, ny, E.STONE); break;
          }
        }
      }
    }
  }
}

function explode(cx, cy) {
  const r = 8;
  for (let y = -r; y <= r; y++) {
    for (let x = -r; x <= r; x++) {
      if (x*x + y*y > r*r) continue;
      const nx = cx + x, ny = cy + y;
      if (inBounds(nx, ny)) {
        if (Math.random() < 0.7) set(nx, ny, E.FIRE);
        else if (Math.random() < 0.5) set(nx, ny, E.SMOKE);
      }
    }
  }
}

// draw
function render() {
  const img = ctx.createImageData(W, H);
  const data = img.data;
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const e = grid[idx(x, y)];
      const col = DEFS[e].color;
      const r = (col) & 0xff;
      const g = (col >> 8) & 0xff;
      const b = (col >> 16) & 0xff;
      // life tint for fire/lava
      let tr = r, tg = g, tb = b;
      if (e === E.FIRE) {
        const k = life[idx(x, y)] / 60;
        tr = Math.floor(255 * (1 - k) + 255 * k);
        tg = Math.floor(140 * (1 - k) + 100 * k);
        tb = Math.floor(40 * (1 - k) + 30 * k);
      } else if (e === E.LAVA) {
        const k = life[idx(x, y)] / 500;
        tr = Math.floor(180 + 75 * k);
        tg = Math.floor(60 + 60 * k);
        tb = Math.floor(20 + 30 * k);
      }
      for (let py = 0; py < CELL; py++) {
        for (let px = 0; px < CELL; px++) {
          const i = ((y * CELL + py) * W + (x * CELL + px)) * 4;
          data[i] = tr; data[i+1] = tg; data[i+2] = tb; data[i+3] = 255;
        }
      }
    }
  }
  // brush preview
  if (mouseX >= 0 && !paused) {
    const gx = Math.floor(mouseX / CELL), gy = Math.floor(mouseY / CELL);
    for (let dy = -brushSize; dy <= brushSize; dy++) {
      for (let dx = -brushSize; dx <= brushSize; dx++) {
        if (dx*dx + dy*dy > brushSize*brushSize) continue;
        const px = (gx + dx) * CELL, py = (gy + dy) * CELL;
        if (px < 0 || py < 0 || px >= W || py >= H) continue;
        const i = (py * W + px) * 4;
        data[i] = 255; data[i+1] = 255; data[i+2] = 255; data[i+3] = 100;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

// input
function paint(gx, gy, e) {
  for (let dy = -brushSize; dy <= brushSize; dy++) {
    for (let dx = -brushSize; dx <= brushSize; dx++) {
      if (dx*dx + dy*dy > brushSize*brushSize) continue;
      const x = gx + dx, y = gy + dy;
      if (inBounds(x, y)) set(x, y, e);
    }
  }
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
});
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) mouseDown = true;
  if (e.button === 2) rightDown = true;
});
canvas.addEventListener('mouseup', e => {
  if (e.button === 0) mouseDown = false;
  if (e.button === 2) rightDown = false;
});

document.addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') { grid.fill(E.EMPTY); life.fill(0); }
  else if (e.key === ' ') { paused = !paused; document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause'; e.preventDefault(); }
  else if (e.key === '1') selected = E.SAND;
  else if (e.key === '2') selected = E.WATER;
  else if (e.key === '3') selected = E.STONE;
  else if (e.key === '4') selected = E.WOOD;
  else if (e.key === '5') selected = E.FIRE;
  else if (e.key === '6') selected = E.PLANT;
  else if (e.key === '7') selected = E.OIL;
  else if (e.key === '8') selected = E.GUNPOWDER;
  else if (e.key === '9') selected = E.LAVA;
  else if (e.key === '0') selected = E.ICE;
  updateActiveBtn();
});

function updateActiveBtn() {
  document.querySelectorAll('.elem').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.id) === selected);
  });
}

// build toolbar
const toolbar = document.getElementById('toolbar');
for (const p of PALETTE) {
  const btn = document.createElement('button');
  btn.className = 'elem' + (p.id === selected ? ' active' : '');
  btn.dataset.id = p.id;
  btn.innerHTML = `<span style="background:${p.col};"></span>${p.name}`;
  btn.onclick = () => { selected = p.id; updateActiveBtn(); };
  toolbar.appendChild(btn);
}

document.getElementById('btn-clear').onclick = () => { grid.fill(E.EMPTY); life.fill(0); };
document.getElementById('btn-pause').onclick = () => { paused = !paused; document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause'; };
document.getElementById('btn-brush-small').onclick = () => brushSize = 2;
document.getElementById('btn-brush-mid').onclick = () => brushSize = 4;
document.getElementById('btn-brush-big').onclick = () => brushSize = 8;

// game loop
let last = 0;
function loop(now) {
  if (now - last > 16) {
    step();
    render();
    if (mouseDown) {
      const gx = Math.floor(mouseX / CELL), gy = Math.floor(mouseY / CELL);
      if (inBounds(gx, gy)) paint(gx, gy, selected);
    } else if (rightDown) {
      const gx = Math.floor(mouseX / CELL), gy = Math.floor(mouseY / CELL);
      if (inBounds(gx, gy)) paint(gx, gy, E.EMPTY);
    }
    last = now;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
