<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        .game-container { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        #canvas { border: 3px solid rgba(255,255,255,0.3); border-radius: 0.5rem; background: #2d3748; cursor: pointer; }
        .stats { display: flex; gap: 2rem; font-size: 1.2rem; }
        .stat { background: rgba(0,0,0,0.3); padding: 0.5rem 1rem; border-radius: 0.5rem; }
        .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
        button { padding: 0.75rem 1.5rem; font-size: 1rem; border: none; border-radius: 0.5rem; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .tower-btn { background: #48bb78; color: white; }
        .start-btn { background: #4299e1; color: white; padding: 1rem 2rem; font-size: 1.2rem; }
        .tower-btn.selected { background: #f6e05e; color: #1a202c; box-shadow: 0 0 10px #f6e05e; }
        .hidden { display: none !important; }

        #main-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; padding: 2rem; }
        #main-menu h1 { font-size: 3rem; margin-bottom: 1rem; }
        .menu-section { background: rgba(0,0,0,0.3); padding: 1.5rem 2rem; border-radius: 1rem; text-align: center; }
        .menu-section h2 { margin-bottom: 1rem; font-size: 1.5rem; }
        .button-group { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
        .menu-btn { padding: 1rem 2rem; font-size: 1.2rem; border: none; border-radius: 0.5rem; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; color: white; }
        .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .menu-btn.selected { box-shadow: 0 0 15px currentColor; transform: scale(1.05); }
        .map-btn  { background: #48bb78; } .map-btn.selected  { background: #38a169; }
        .diff-btn { background: #ed8936; } .diff-btn.selected { background: #dd6b20; }
        #play-btn { background: #4299e1; font-size: 1.5rem; padding: 1.5rem 3rem; }
        #play-btn:hover { background: #3182ce; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            #canvas { max-width: 100%; height: auto; }
            .stats { flex-wrap: wrap; gap: 0.5rem; font-size: 1rem; }
            .stat { padding: 0.3rem 0.6rem; font-size: 0.9rem; }
            button { padding: 0.5rem 1rem; font-size: 0.9rem; }
            .tower-btn, .start-btn { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
            .menu-section { padding: 1rem; }
            .button-group { flex-direction: column; gap: 0.5rem; }
            .menu-btn { width: 100%; padding: 0.8rem; }
            #play-btn { font-size: 1.2rem; padding: 1rem 2rem; }
        }
    </style>
</head>
<body>
    <div id="main-menu">
        <h1>🏰 Tower Defense</h1>
        <div class="menu-section">
            <h2>Select Map</h2>
            <div class="button-group">
                <button class="menu-btn map-btn selected" onclick="selectMap('easy')"         id="map-easy">🗺️ Easy Map</button>
                <button class="menu-btn map-btn"          onclick="selectMap('intermediate')" id="map-intermediate">🗺️ Intermediate Map</button>
                <button class="menu-btn map-btn"          onclick="selectMap('expert')"       id="map-expert">🗺️ Expert Map</button>
            </div>
        </div>
        <div class="menu-section">
            <h2>Select Difficulty</h2>
            <div class="button-group">
                <button class="menu-btn diff-btn selected" onclick="selectDifficulty('easy')"      id="diff-easy">😊 Easy</button>
                <button class="menu-btn diff-btn"          onclick="selectDifficulty('medium')"    id="diff-medium">😐 Medium</button>
                <button class="menu-btn diff-btn"          onclick="selectDifficulty('hard')"      id="diff-hard">😈 Hard</button>
                <button class="menu-btn diff-btn"          onclick="selectDifficulty('nightmare')" id="diff-nightmare">☠️ Nightmare</button>
            </div>
        </div>
        <button class="menu-btn" id="play-btn" onclick="playGame()">▶️ PLAY</button>
    </div>

    <div class="game-container hidden">
        <button class="start-btn" onclick="backToMenu()" style="margin-bottom:1rem;">⬅️ Back to Menu</button>
        <div class="stats">
            <div class="stat">💰 Gold: <span id="gold">100</span></div>
            <div class="stat">❤️ Lives: <span id="lives">20</span></div>
            <div class="stat">🌊 Wave: <span id="wave">1</span></div>
        </div>
        <canvas id="canvas" width="800" height="500"></canvas>
        <div class="controls">
            <button class="tower-btn selected" onclick="selectTower('basic')"  id="basic-tower"  style="padding:0.4rem 0.8rem;font-size:0.85rem;">Trainee (50g)</button>
            <button class="tower-btn"          onclick="selectTower('sniper')" id="sniper-tower" style="padding:0.4rem 0.8rem;font-size:0.85rem;">Sniper (100g)</button>
            <button class="tower-btn"          onclick="selectTower('rapid')"  id="rapid-tower"  style="padding:0.4rem 0.8rem;font-size:0.85rem;">Machine Gun (150g)</button>
            <button class="tower-btn"          onclick="selectTower('bomb')"   id="bomb-tower"   style="padding:0.4rem 0.8rem;font-size:0.85rem;">Bomb (200g)</button>
            <button class="tower-btn"          onclick="selectTower('master')" id="master-tower" style="padding:0.4rem 0.8rem;font-size:0.85rem;">Master (10000g)</button>
            <button class="start-btn" id="start-btn" onclick="startGame()" style="padding:0.4rem 0.8rem;font-size:0.85rem;">▶️ Start Game</button>
            <button class="start-btn hidden" onclick="toggleSpeed()" id="speed-btn" style="background:#ed8936;padding:0.4rem 0.8rem;font-size:0.85rem;">⏩ 2x Speed</button>
        </div>
    </div>

    <script>
        // 60 FPS cap - runs at same speed regardless of display refresh rate
let __lastTime = 0;
const __TARGET_FPS = 60;
const __FRAME_TIME = 1000 / __TARGET_FPS;

const canvas = document.getElementById('canvas');
        const ctx    = canvas.getContext('2d');

        let gold = 100, lives = 20, wave = 1;
        let gameRunning = false, gameSpeed = 1, waveInProgress = false;
        let selectedTower = 'basic', freeTowers = false;
        let selectedMap = 'easy', selectedDifficulty = 'easy';
        let currentPath = [];
        let selectedPlacedTower = null;
        let towers = [], enemies = [], projectiles = [];
        let popupRegions = [];
        let notification = '', notificationTimer = 0;

        const paths = {
            easy: [
                {x:0,y:400},{x:100,y:400},{x:100,y:100},{x:200,y:100},
                {x:200,y:400},{x:300,y:400},{x:300,y:100},{x:400,y:100},
                {x:400,y:400},{x:500,y:400},{x:500,y:100},{x:600,y:100},
                {x:600,y:400},{x:700,y:400},{x:700,y:250},{x:800,y:250}
            ],
            intermediate: [
                {x:0,y:250},{x:150,y:250},{x:150,y:100},{x:300,y:100},
                {x:300,y:400},{x:500,y:400},{x:500,y:150},{x:650,y:150},
                {x:650,y:350},{x:800,y:350}
            ],
            expert: [
                {x:0,y:250},{x:300,y:250},{x:350,y:240},
                {x:450,y:260},{x:500,y:250},{x:800,y:250}
            ]
        };
        currentPath = paths.easy;

        const difficultyModifiers = {
            easy:      {healthMod:0.5, speedMod:0.7, goldMod:1.0, lives:30, costMod:1.0},
            medium:    {healthMod:1.0, speedMod:1.0, goldMod:1.0, lives:20, costMod:1.1},
            hard:      {healthMod:2.0, speedMod:1.3, goldMod:1.0, lives:10, costMod:1.3},
            nightmare: {healthMod:2.5, speedMod:1.5, goldMod:0.8, lives:1,  costMod:1.5}
        };

        const towerTypes = {
            basic:  {cost:50,    range:100, damage:10,  fireRate:60,  color:'#48bb78'},
            sniper: {cost:100,   range:200, damage:50,  fireRate:120, color:'#f6e05e'},
            rapid:  {cost:150,   range:80,  damage:5,   fireRate:10,  color:'#4299e1'},
            bomb:   {cost:200,   range:120, damage:30,  fireRate:90,  color:'#e53e3e', splashRadius:60},
            master: {cost:10000, range:200, damage:250, fireRate:1,   color:'#9f7aea', splashRadius:80}
        };

        // ── Notification ─────────────────────────────────────────────────────────

        function showNotification(msg) {
            notification = msg;
            notificationTimer = 180; // ~3 seconds
        }

        // ── Display ──────────────────────────────────────────────────────────────

        function updateDisplay() {
            document.getElementById('gold').textContent  = gold;
            document.getElementById('lives').textContent = lives;
            document.getElementById('wave').textContent  = wave;
        }

        // ── Tower selection ──────────────────────────────────────────────────────

        function selectTower(type) {
            selectedTower = type;
            selectedPlacedTower = null;
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(type + '-tower').classList.add('selected');
            if (!gameRunning) draw();
        }

        function setTargetPriority(priority) {
            if (selectedPlacedTower === null) return;
            towers[selectedPlacedTower].targetPriority = priority;
            if (!gameRunning) draw();
        }

        function sellTower() {
            if (selectedPlacedTower === null) return;
            const t = towers[selectedPlacedTower];
            gold += Math.floor(t.totalCost * 0.5);
            towers.splice(selectedPlacedTower, 1);
            selectedPlacedTower = null;
            updateDisplay();
            if (!gameRunning) draw();
        }

        function upgradeTower() {
            if (selectedPlacedTower === null) return;
            const t = towers[selectedPlacedTower];
            const cost = Math.floor(t.totalCost * 0.5);
            if (!freeTowers && gold < cost) return;
            if (!freeTowers) gold -= cost;
            t.level++;
            t.totalCost += cost;
            t.damage = Math.floor(t.damage * 1.3);
            t.range  = Math.floor(t.range  * 1.1);
            updateDisplay();
            if (!gameRunning) draw();
        }

        // ── Menu ─────────────────────────────────────────────────────────────────

        function selectMap(map) {
            selectedMap = map;
            document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('map-' + map).classList.add('selected');
        }

        function selectDifficulty(diff) {
            selectedDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('diff-' + diff).classList.add('selected');
        }

        function playGame() {
            currentPath = paths[selectedMap];
            lives = difficultyModifiers[selectedDifficulty].lives;
            updateTowerPrices();
            document.getElementById('main-menu').classList.add('hidden');
            document.querySelector('.game-container').classList.remove('hidden');
            gold = 100; wave = 1;
            towers = []; enemies = []; projectiles = [];
            selectedPlacedTower = null;
            updateDisplay();
            draw();
        }

        function backToMenu() {
            gameRunning = false; gameSpeed = 1;
            document.getElementById('main-menu').classList.remove('hidden');
            document.querySelector('.game-container').classList.add('hidden');
            document.getElementById('speed-btn').classList.add('hidden');
            document.getElementById('start-btn').classList.remove('hidden');
        }

        function updateTowerPrices() {
            const m = difficultyModifiers[selectedDifficulty].costMod;
            [
                {id:'basic-tower',  name:'Trainee',    base:50},
                {id:'sniper-tower', name:'Sniper',      base:100},
                {id:'rapid-tower',  name:'Machine Gun', base:150},
                {id:'bomb-tower',   name:'Bomb',        base:200},
                {id:'master-tower', name:'Master',      base:10000}
            ].forEach(({id, name, base}) => {
                document.getElementById(id).textContent = `${name} (${Math.floor(base * m)}g)`;
            });
        }

        // ── Canvas click ─────────────────────────────────────────────────────────

        canvas.addEventListener('click', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Cheat: free towers
            if (x < 50 && y > canvas.height - 50) {
                freeTowers = !freeTowers;
                showNotification(freeTowers ? 'FREE TOWERS ON! 🎉' : 'Free towers off');
                return;
            }

            // Popup buttons
            for (const r of popupRegions) {
                if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
                    if      (r.action === 'target')  setTargetPriority(r.value);
                    else if (r.action === 'upgrade') upgradeTower();
                    else if (r.action === 'sell')    sellTower();
                    return;
                }
            }

            // Select existing tower
            for (let i = 0; i < towers.length; i++) {
                if (Math.sqrt((x - towers[i].x) ** 2 + (y - towers[i].y) ** 2) < 20) {
                    selectedPlacedTower = i;
                    if (!gameRunning) draw();
                    return;
                }
            }

            // Deselect
            selectedPlacedTower = null;
            if (!gameRunning) draw();

            // Place tower — not allowed on path
            if (isOnPath(x, y)) return;
            const info    = towerTypes[selectedTower];
            const diffMod = difficultyModifiers[selectedDifficulty];
            const cost    = Math.floor(info.cost * diffMod.costMod);
            if (!freeTowers && gold < cost) return;

            towers.push({
                x, y, type: selectedTower, ...info,
                cooldown: 0, angle: 0, level: 1,
                totalCost: cost, targetPriority: 'first'
            });
            if (!freeTowers) gold -= cost;
            updateDisplay();
            if (!gameRunning) draw();
        });

        function isOnPath(x, y) {
            for (let i = 0; i < currentPath.length - 1; i++) {
                const p1 = currentPath[i], p2 = currentPath[i + 1];
                const A = x - p1.x, B = y - p1.y, C = p2.x - p1.x, D = p2.y - p1.y;
                const len2 = C * C + D * D;
                const t = len2 ? Math.max(0, Math.min(1, (A * C + B * D) / len2)) : 0;
                if (Math.sqrt((x - (p1.x + t * C)) ** 2 + (y - (p1.y + t * D)) ** 2) < 30) return true;
            }
            return false;
        }

        // ── Enemy ────────────────────────────────────────────────────────────────

        function spawnEnemy() {
            const diffMod = difficultyModifiers[selectedDifficulty];
            const health  = (20 + wave * 10) * diffMod.healthMod;
            enemies.push({
                x: currentPath[0].x, y: currentPath[0].y,
                health, maxHealth: health,
                speed: (0.5 + wave * 0.05) * diffMod.speedMod,
                pathIndex: 0,
                reward: Math.floor((10 + wave * 2) * diffMod.goldMod)
            });
        }

        // ── Update ───────────────────────────────────────────────────────────────

        function update() {
            if (!gameRunning) return;

            // Towers fire
            towers.forEach(tower => {
                if (tower.cooldown > 0) { tower.cooldown--; return; }

                let target = null;
                enemies.forEach(enemy => {
                    const dist = Math.sqrt((enemy.x - tower.x) ** 2 + (enemy.y - tower.y) ** 2);
                    if (dist > tower.range) return;
                    if (!target) { target = enemy; return; }

                    switch (tower.targetPriority) {
                        case 'first':
                            if (enemy.pathIndex > target.pathIndex) { target = enemy; break; }
                            if (enemy.pathIndex === target.pathIndex) {
                                const wp = currentPath[enemy.pathIndex + 1];
                                if (wp) {
                                    const de = (wp.x-enemy.x)**2 + (wp.y-enemy.y)**2;
                                    const dt = (wp.x-target.x)**2 + (wp.y-target.y)**2;
                                    if (de < dt) target = enemy;
                                }
                            }
                            break;
                        case 'last':
                            if (enemy.pathIndex < target.pathIndex) { target = enemy; break; }
                            if (enemy.pathIndex === target.pathIndex) {
                                const wp = currentPath[enemy.pathIndex + 1];
                                if (wp) {
                                    const de = (wp.x-enemy.x)**2 + (wp.y-enemy.y)**2;
                                    const dt = (wp.x-target.x)**2 + (wp.y-target.y)**2;
                                    if (de > dt) target = enemy;
                                }
                            }
                            break;
                        case 'strong': if (enemy.health > target.health) target = enemy; break;
                        case 'weak':   if (enemy.health < target.health) target = enemy; break;
                        case 'close': {
                            const de = (enemy.x-tower.x)**2 + (enemy.y-tower.y)**2;
                            const dt = (target.x-tower.x)**2 + (target.y-tower.y)**2;
                            if (de < dt) target = enemy;
                            break;
                        }
                    }
                });

                if (target) {
                    tower.angle = Math.atan2(target.y - tower.y, target.x - tower.x);
                    projectiles.push({
                        x: tower.x, y: tower.y,
                        targetX: target.x, targetY: target.y,
                        speed: 8, damage: tower.damage, color: tower.color,
                        splashRadius: tower.splashRadius || 0
                    });
                    tower.cooldown = tower.fireRate;
                }
            });

            // Projectiles
            projectiles = projectiles.filter(proj => {
                const dx = proj.targetX - proj.x, dy = proj.targetY - proj.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 10) {
                    enemies.forEach(enemy => {
                        const ex = enemy.x - proj.targetX, ey = enemy.y - proj.targetY;
                        const r = proj.splashRadius > 0 ? proj.splashRadius : 20;
                        if (Math.sqrt(ex * ex + ey * ey) < r) enemy.health -= proj.damage;
                    });
                    return false;
                }
                proj.x += (dx / dist) * proj.speed;
                proj.y += (dy / dist) * proj.speed;
                return true;
            });

            // Enemies move
            enemies = enemies.filter(enemy => {
                const wp = currentPath[enemy.pathIndex + 1];
                if (!wp) {
                    lives--;
                    updateDisplay();
                    if (lives <= 0) { resetGame(); showNotification('Game Over! Reached wave ' + wave); }
                    return false;
                }
                const dx = wp.x - enemy.x, dy = wp.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 5) {
                    enemy.pathIndex++;
                } else {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.y += (dy / dist) * enemy.speed;
                }
                if (enemy.health <= 0) { gold += enemy.reward; updateDisplay(); return false; }
                return true;
            });

            // Next wave (guarded so it only fires once)
            if (enemies.length === 0 && !waveInProgress) {
                waveInProgress = true;
                wave++;
                updateDisplay();
                const count = 3 + wave;
                for (let i = 0; i < count; i++) setTimeout(() => spawnEnemy(), i * 1000);
                setTimeout(() => { waveInProgress = false; }, count * 1000);
            }
        }

        // ── Draw ─────────────────────────────────────────────────────────────────

        function draw() {
            popupRegions = [];

            ctx.fillStyle = '#2d3748';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road (border → dark fill → lighter surface)
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            [
                [44, '#718096'],
                [40, '#4a5568'],
                [36, '#a0aec0']
            ].forEach(([lw, col]) => {
                ctx.strokeStyle = col; ctx.lineWidth = lw;
                ctx.beginPath();
                ctx.moveTo(currentPath[0].x, currentPath[0].y);
                currentPath.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            });

            // Towers
            towers.forEach((tower, index) => {
                const sel = index === selectedPlacedTower;
                ctx.save();
                ctx.translate(tower.x, tower.y);

                if (sel) {
                    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(246,224,94,0.35)'; ctx.fill();
                    ctx.strokeStyle = '#f6e05e'; ctx.lineWidth = 2; ctx.stroke();
                }

                // Range ring
                ctx.beginPath(); ctx.arc(0, 0, tower.range, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 1; ctx.stroke();

                // Body
                ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fillStyle = tower.color; ctx.fill();

                // Barrel
                ctx.rotate(tower.angle);
                ctx.fillStyle = '#1a202c';
                ctx.fillRect(-5, -5, 20, 10);
                ctx.restore();

                // Level text
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
                ctx.fillText(`L${tower.level}`, tower.x, tower.y + 5);

                // Target icon
                const icons = {first:'🎯', last:'🔄', strong:'💪', weak:'🤏', close:'📍'};
                ctx.font = '12px Arial';
                ctx.fillText(icons[tower.targetPriority] || '🎯', tower.x, tower.y - 22);
            });

            // Enemies
            enemies.forEach(enemy => {
                ctx.fillStyle = '#e53e3e';
                ctx.beginPath(); ctx.arc(enemy.x, enemy.y, 12, 0, Math.PI * 2); ctx.fill();
                const hp = enemy.health / enemy.maxHealth;
                ctx.fillStyle = '#1a202c'; ctx.fillRect(enemy.x - 15, enemy.y - 20, 30, 5);
                ctx.fillStyle = hp > 0.5 ? '#48bb78' : hp > 0.25 ? '#ed8936' : '#e53e3e';
                ctx.fillRect(enemy.x - 15, enemy.y - 20, 30 * hp, 5);
            });

            // Projectiles
            projectiles.forEach(proj => {
                ctx.fillStyle = proj.color;
                ctx.beginPath(); ctx.arc(proj.x, proj.y, proj.splashRadius > 0 ? 8 : 4, 0, Math.PI * 2); ctx.fill();
                if (proj.splashRadius > 0) {
                    ctx.strokeStyle = 'rgba(229,62,62,0.3)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(proj.x, proj.y, proj.splashRadius, 0, Math.PI * 2); ctx.stroke();
                }
            });

            // Tower popup
            if (selectedPlacedTower !== null && selectedPlacedTower < towers.length) {
                drawTowerPopup(towers[selectedPlacedTower]);
            }

            // Notification
            if (notificationTimer > 0) {
                notificationTimer--;
                const alpha = Math.min(1, notificationTimer / 30);
                ctx.fillStyle = `rgba(0,0,0,${0.75 * alpha})`;
                ctx.fillRect(canvas.width / 2 - 160, canvas.height / 2 - 28, 320, 52);
                ctx.strokeStyle = `rgba(246,224,94,${alpha})`;
                ctx.lineWidth = 2;
                ctx.strokeRect(canvas.width / 2 - 160, canvas.height / 2 - 28, 320, 52);
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(notification, canvas.width / 2, canvas.height / 2 + 7);
            }
        }

        // ── Canvas popup ─────────────────────────────────────────────────────────

        function drawTowerPopup(tower) {
            const popupW = 166, btnH = 22, gap = 3;
            const popupH = 18 + 2 * (btnH + gap) + 6 + (btnH + gap) + (btnH + gap) + 4;

            let px = Math.max(4, Math.min(canvas.width - popupW - 4, tower.x - popupW / 2));
            let py = tower.y - 32 - popupH;
            if (py < 4) py = tower.y + 32;

            // Background
            ctx.fillStyle = 'rgba(8,10,22,0.93)';
            ctx.fillRect(px, py, popupW, popupH);
            ctx.strokeStyle = '#f6e05e'; ctx.lineWidth = 2;
            ctx.strokeRect(px, py, popupW, popupH);

            // "Target:" label
            ctx.fillStyle = '#f6e05e'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'left';
            ctx.fillText('Target:', px + 5, py + 13);

            // 2×2 targeting buttons
            const targets = [
                {id:'first', label:'First'}, {id:'last',   label:'Last'},
                {id:'strong',label:'Strong'},{id:'close',  label:'Close'}
            ];
            const tBtnW = Math.floor((popupW - 12) / 2);
            for (let i = 0; i < 4; i++) {
                const col = i % 2, row = Math.floor(i / 2);
                const bx = px + 4 + col * (tBtnW + 4);
                const by = py + 17 + row * (btnH + gap);
                const sel = tower.targetPriority === targets[i].id;
                ctx.fillStyle = sel ? 'rgba(246,224,94,0.5)' : 'rgba(255,255,255,0.09)';
                ctx.fillRect(bx, by, tBtnW, btnH);
                if (sel) { ctx.strokeStyle = '#f6e05e'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, tBtnW, btnH); }
                ctx.fillStyle = sel ? '#f6e05e' : '#bbb'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
                ctx.fillText(targets[i].label, bx + tBtnW / 2, by + 15);
                popupRegions.push({x:bx, y:by, w:tBtnW, h:btnH, action:'target', value:targets[i].id});
            }

            const fullBW = popupW - 8;

            // Upgrade button
            const upgCost = Math.floor(tower.totalCost * 0.5);
            const upgY    = py + 17 + 2 * (btnH + gap) + 6;
            ctx.fillStyle = '#1a7065'; ctx.fillRect(px + 4, upgY, fullBW, btnH);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
            ctx.fillText(`Upgrade ${upgCost}g  [Lv ${tower.level}→${tower.level+1}]`, px + 4 + fullBW / 2, upgY + 15);
            popupRegions.push({x:px+4, y:upgY, w:fullBW, h:btnH, action:'upgrade'});

            // Sell button
            const sellVal = Math.floor(tower.totalCost * 0.5);
            const sellY   = upgY + btnH + gap;
            ctx.fillStyle = '#8b1a1a'; ctx.fillRect(px + 4, sellY, fullBW, btnH);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
            ctx.fillText(`Sell +${sellVal}g`, px + 4 + fullBW / 2, sellY + 15);
            popupRegions.push({x:px+4, y:sellY, w:fullBW, h:btnH, action:'sell'});
        }

        // ── Game control ─────────────────────────────────────────────────────────

        function toggleSpeed() {
            gameSpeed = gameSpeed === 1 ? 2 : 1;
            document.getElementById('speed-btn').textContent = gameSpeed === 1 ? '▶️ 1x Speed' : '⏩ 2x Speed';
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            if (gameSpeed === 2) update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameRunning) return;
            gameRunning = true; gameSpeed = 1;
            if (towers.length === 0) gold = 100;
            wave = 1; enemies = []; projectiles = [];
            selectedPlacedTower = null;
            updateDisplay();
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('speed-btn').classList.remove('hidden');
            document.getElementById('speed-btn').textContent = '⏩ 2x Speed';
            waveInProgress = true;
            for (let i = 0; i < 5; i++) setTimeout(() => spawnEnemy(), i * 1000);
            setTimeout(() => { waveInProgress = false; }, 5000);
            gameLoop();
        }

        function resetGame() {
            gameRunning = false; gameSpeed = 1; waveInProgress = false;
            gold = 100;
            lives = difficultyModifiers[selectedDifficulty].lives;
            wave = 1; towers = []; enemies = []; projectiles = [];
            selectedPlacedTower = null;
            updateDisplay(); draw();
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('speed-btn').classList.add('hidden');
        }

        // ── Init ─────────────────────────────────────────────────────────────────
        draw();
    </script>
