<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense Game for Lincoln</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        h1 {
            text-align: center;
            margin-bottom: 1rem;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        #canvas {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.5rem;
            background: #2d3748;
        }
        .stats {
            display: flex;
            gap: 2rem;
            font-size: 1.2rem;
        }
        .stat {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .tower-btn {
            background: #48bb78;
            color: white;
        }
        .start-btn {
            background: #4299e1;
            color: white;
            padding: 1rem 2rem;
            font-size: 1.2rem;
        }
        .tower-btn.selected {
            background: #f6e05e;
            box-shadow: 0 0 10px #f6e05e;
        }
        .hidden {
            display: none !important;
        }
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
        }
        #main-menu h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .menu-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            text-align: center;
        }
        .menu-section h2 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .menu-btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
        }
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        .menu-btn.selected {
            box-shadow: 0 0 15px currentColor;
            transform: scale(1.05);
        }
        .map-btn {
            background: #48bb78;
        }
        .map-btn.selected {
            background: #38a169;
        }
        .diff-btn {
            background: #ed8936;
        }
        .diff-btn.selected {
            background: #dd6b20;
        }
        #play-btn {
            background: #4299e1;
            font-size: 1.5rem;
            padding: 1.5rem 3rem;
        }
        #play-btn:hover {
            background: #3182ce;
        }
        #back-btn {
            background: #e53e3e;
        }
        #back-btn:hover {
            background: #c53030;
        }
    </style>
</head>
<body>
    <!-- Main Menu -->
    <div id="main-menu">
        <h1>🏰 Tower Defense for Lincoln</h1>

        <div class="menu-section">
            <h2>Select Map Difficulty</h2>
            <div class="button-group">
                <button class="menu-btn map-btn selected" onclick="selectMap('easy')" id="map-easy">
                    🗺️ Easy Map
                </button>
                <button class="menu-btn map-btn" onclick="selectMap('intermediate')" id="map-intermediate">
                    🗺️ Intermediate Map
                </button>
                <button class="menu-btn map-btn" onclick="selectMap('expert')" id="map-expert">
                    🗺️ Expert Map
                </button>
            </div>
        </div>

        <div class="menu-section">
            <h2>Select Game Difficulty</h2>
            <div class="button-group">
                <button class="menu-btn diff-btn selected" onclick="selectDifficulty('easy')" id="diff-easy">
                    😊 Easy
                </button>
                <button class="menu-btn diff-btn" onclick="selectDifficulty('medium')" id="diff-medium">
                    😐 Medium
                </button>
                <button class="menu-btn diff-btn" onclick="selectDifficulty('hard')" id="diff-hard">
                    😈 Hard
                </button>
            </div>
        </div>

        <button class="menu-btn" id="play-btn" onclick="playGame()">▶️ PLAY</button>
    </div>

    <!-- Game Container -->
    <div class="game-container hidden">
        <button class="start-btn" onclick="backToMenu()" style="margin-bottom: 1rem;">⬅️ Back to Menu</button>
        <div class="stats">
            <div class="stat">💰 Gold: <span id="gold">100</span></div>
            <div class="stat">❤️ Lives: <span id="lives">20</span></div>
            <div class="stat">🌊 Wave: <span id="wave">1</span></div>
        </div>

        <canvas id="canvas" width="800" height="500"></canvas>

        <div class="controls">
            <button class="tower-btn selected" onclick="selectTower('basic')" id="basic-tower">
                🗼 Trainee (50g)
            </button>
            <button class="tower-btn" onclick="selectTower('sniper')" id="sniper-tower">
                🎯 Sniper Tower (100g)
            </button>
            <button class="tower-btn" onclick="selectTower('rapid')" id="rapid-tower">
                🔫 Machine Gunner (150g)
            </button>
            <button class="tower-btn" onclick="selectTower('master')" id="master-tower">
                🎖️ Master Gunsman (10000g)
            </button>
            <button class="start-btn" onclick="startGame()">▶️ Start Game</button>
            <button class="start-btn hidden" onclick="toggleSpeed()" id="speed-btn" style="background: #ed8936;">⏩ 2x Speed</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gold = 100;
        let lives = 20;
        let wave = 1;
        let gameRunning = false;
        let selectedTower = 'basic';
        let freeTowers = false;
        let selectedMap = 'easy';
        let selectedDifficulty = 'easy';
        let currentPath = [];
        let gameSpeed = 1;

        // Arrays
        let towers = [];
        let enemies = [];
        let projectiles = [];

        // Map paths
        const paths = {
            easy: [
                {x: 0, y: 250},
                {x: 200, y: 250},
                {x: 200, y: 150},
                {x: 400, y: 150},
                {x: 400, y: 350},
                {x: 600, y: 350},
                {x: 600, y: 250},
                {x: 800, y: 250}
            ],
            intermediate: [
                {x: 0, y: 250},
                {x: 150, y: 250},
                {x: 150, y: 100},
                {x: 300, y: 100},
                {x: 300, y: 400},
                {x: 500, y: 400},
                {x: 500, y: 150},
                {x: 650, y: 150},
                {x: 650, y: 350},
                {x: 800, y: 350}
            ],
            expert: [
                {x: 0, y: 400},
                {x: 100, y: 400},
                {x: 100, y: 100},
                {x: 200, y: 100},
                {x: 200, y: 400},
                {x: 300, y: 400},
                {x: 300, y: 100},
                {x: 400, y: 100},
                {x: 400, y: 400},
                {x: 500, y: 400},
                {x: 500, y: 100},
                {x: 600, y: 100},
                {x: 600, y: 400},
                {x: 700, y: 400},
                {x: 700, y: 250},
                {x: 800, y: 250}
            ]
        };

        // Initialize currentPath with default
        currentPath = paths.easy;

        // Difficulty modifiers
        const difficultyModifiers = {
            easy: { healthMod: 0.5, speedMod: 0.7, goldMod: 1.0, lives: 30, costMod: 1.0 },
            medium: { healthMod: 1.0, speedMod: 1.0, goldMod: 1.0, lives: 20, costMod: 1.1 },
            hard: { healthMod: 2.0, speedMod: 1.3, goldMod: 1.0, lives: 10, costMod: 1.3 }
        };

        // Tower types
        const towerTypes = {
            basic: { cost: 50, range: 100, damage: 10, fireRate: 60, color: '#48bb78' },
            sniper: { cost: 100, range: 200, damage: 50, fireRate: 120, color: '#f6e05e' },
            rapid: { cost: 150, range: 80, damage: 5, fireRate: 10, color: '#4299e1' },
            master: { cost: 10000, range: 200, damage: 250, fireRate: 1, color: '#9f7aea' }
        };

        // Update display
        function updateDisplay() {
            document.getElementById('gold').textContent = gold;
            document.getElementById('lives').textContent = lives;
            document.getElementById('wave').textContent = wave;
        }

        // Select tower type
        function selectTower(type) {
            selectedTower = type;
            document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(type + '-tower').classList.add('selected');
        }

        // Menu functions
        function selectMap(map) {
            selectedMap = map;
            document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('map-' + map).classList.add('selected');
        }

        function selectDifficulty(diff) {
            selectedDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('diff-' + diff).classList.add('selected');
        }

        function playGame() {
            // Set path based on selection
            currentPath = paths[selectedMap];

            // Set difficulty modifiers
            const diffMod = difficultyModifiers[selectedDifficulty];
            lives = diffMod.lives;

            // Update tower prices based on difficulty
            updateTowerPrices();

            // Hide menu, show game
            document.getElementById('main-menu').classList.add('hidden');
            document.querySelector('.game-container').classList.remove('hidden');

            // Reset game state but don't start until user clicks Start Game
            gold = 100;
            wave = 1;
            towers = [];
            enemies = [];
            projectiles = [];
            updateDisplay();
            draw();
        }

        function backToMenu() {
            gameRunning = false;
            gameSpeed = 1;
            document.getElementById('main-menu').classList.remove('hidden');
            document.querySelector('.game-container').classList.add('hidden');
            document.getElementById('speed-btn').classList.add('hidden');
        }

        // Update tower button prices based on difficulty
        function updateTowerPrices() {
            const diffMod = difficultyModifiers[selectedDifficulty];
            const towerButtons = {
                basic: { baseCost: 50, elementId: 'basic-tower', name: 'Trainee' },
                sniper: { baseCost: 100, elementId: 'sniper-tower', name: 'Sniper Tower' },
                rapid: { baseCost: 150, elementId: 'rapid-tower', name: 'Machine Gunner' },
                master: { baseCost: 10000, elementId: 'master-tower', name: 'Master Gunsman' }
            };

            for (const [type, info] of Object.entries(towerButtons)) {
                const cost = Math.floor(info.baseCost * diffMod.costMod);
                const btn = document.getElementById(info.elementId);
                btn.textContent = btn.textContent.replace(/\(\d+g\)/, `(${cost}g)`);
            }
        }

        // Place tower
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Check for bottom-left corner click (cheat: free towers)
            if (x < 50 && y > canvas.height - 50) {
                freeTowers = !freeTowers;
                alert(freeTowers ? 'FREE TOWERS ENABLED! 🎉' : 'Free towers disabled');
                return;
            }

            if (!gameRunning) return;

            const towerInfo = towerTypes[selectedTower];
            const diffMod = difficultyModifiers[selectedDifficulty];
            const actualCost = Math.floor(towerInfo.cost * diffMod.costMod);
            const canAfford = freeTowers || gold >= actualCost;
            if (canAfford && !isOnPath(x, y)) {
                towers.push({
                    x: x,
                    y: y,
                    type: selectedTower,
                    ...towerInfo,
                    cooldown: 0,
                    angle: 0
                });
                if (!freeTowers) {
                    gold -= actualCost;
                }
                updateDisplay();
            }
        });

        // Check if position is on path
        function isOnPath(x, y) {
            for (let i = 0; i < currentPath.length - 1; i++) {
                const p1 = currentPath[i];
                const p2 = currentPath[i + 1];
                const dist = pointToSegmentDistance(x, y, p1.x, p1.y, p2.x, p2.y);
                if (dist < 30) return true;
            }
            return false;
        }

        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;

            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;

            if (lenSq !== 0) param = dot / lenSq;

            let xx, yy;

            if (param < 0) {
                xx = x1;
                yy = y1;
            } else if (param > 1) {
                xx = x2;
                yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }

            const dx = px - xx;
            const dy = py - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Spawn enemy
        function spawnEnemy() {
            const diffMod = difficultyModifiers[selectedDifficulty];
            const baseHealth = 20 + wave * 10;
            const health = baseHealth * diffMod.healthMod;
            const baseReward = 10 + wave * 2;

            enemies.push({
                x: currentPath[0].x,
                y: currentPath[0].y,
                health: health,
                maxHealth: health,
                speed: (0.5 + wave * 0.05) * diffMod.speedMod,
                pathIndex: 0,
                reward: Math.floor(baseReward * diffMod.goldMod)
            });
        }

        // Update game
        function update() {
            if (!gameRunning) return;

            // Update towers
            towers.forEach(tower => {
                if (tower.cooldown > 0) {
                    tower.cooldown--;
                    return;
                }

                // Find target
                let target = null;
                let minDist = tower.range;

                enemies.forEach(enemy => {
                    const dist = Math.sqrt((enemy.x - tower.x) ** 2 + (enemy.y - tower.y) ** 2);
                    if (dist < minDist) {
                        minDist = dist;
                        target = enemy;
                    }
                });

                if (target) {
                    tower.angle = Math.atan2(target.y - tower.y, target.x - tower.x);
                    projectiles.push({
                        x: tower.x,
                        y: tower.y,
                        targetX: target.x,
                        targetY: target.y,
                        speed: 8,
                        damage: tower.damage,
                        color: tower.color
                    });
                    tower.cooldown = tower.fireRate;
                }
            });

            // Update projectiles
            projectiles = projectiles.filter(proj => {
                const dx = proj.targetX - proj.x;
                const dy = proj.targetY - proj.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 10) {
                    // Hit enemy
                    enemies.forEach(enemy => {
                        const ex = enemy.x - proj.targetX;
                        const ey = enemy.y - proj.targetY;
                        if (Math.sqrt(ex * ex + ey * ey) < 20) {
                            enemy.health -= proj.damage;
                        }
                    });
                    return false;
                }

                proj.x += (dx / dist) * proj.speed;
                proj.y += (dy / dist) * proj.speed;
                return true;
            });

            // Update enemies
            enemies = enemies.filter(enemy => {
                // Move along path
                const target = currentPath[enemy.pathIndex + 1];
                if (!target) {
                    lives--;
                    updateDisplay();
                    if (lives <= 0) {
                        alert('Game Over! You reached wave ' + wave);
                        resetGame();
                    }
                    return false;
                }

                const dx = target.x - enemy.x;
                const dy = target.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 5) {
                    enemy.pathIndex++;
                } else {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.y += (dy / dist) * enemy.speed;
                }

                // Check if dead
                if (enemy.health <= 0) {
                    gold += enemy.reward;
                    updateDisplay();
                    return false;
                }

                return true;
            });

            // Next wave
            if (enemies.length === 0) {
                wave++;
                updateDisplay();
                for (let i = 0; i < 3 + wave; i++) {
                    setTimeout(() => spawnEnemy(), i * 1000);
                }
            }
        }

        // Draw game
        function draw() {
            // Clear
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw path
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(currentPath[0].x, currentPath[0].y);
            currentPath.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();

            // Draw path border
            ctx.strokeStyle = '#718096';
            ctx.lineWidth = 44;
            ctx.beginPath();
            ctx.moveTo(currentPath[0].x, currentPath[0].y);
            currentPath.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();

            // Draw path center
            ctx.strokeStyle = '#a0aec0';
            ctx.lineWidth = 36;
            ctx.beginPath();
            ctx.moveTo(currentPath[0].x, currentPath[0].y);
            currentPath.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();

            // Draw towers
            towers.forEach(tower => {
                ctx.save();
                ctx.translate(tower.x, tower.y);

                // Range indicator
                ctx.beginPath();
                ctx.arc(0, 0, tower.range, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fill();

                // Tower base
                ctx.fillStyle = tower.color;
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();

                // Tower turret
                ctx.rotate(tower.angle);
                ctx.fillStyle = '#1a202c';
                ctx.fillRect(-5, -5, 20, 10);

                ctx.restore();
            });

            // Draw enemies
            enemies.forEach(enemy => {
                ctx.fillStyle = '#e53e3e';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, 12, 0, Math.PI * 2);
                ctx.fill();

                // Health bar
                const healthPercent = enemy.health / enemy.maxHealth;
                ctx.fillStyle = '#1a202c';
                ctx.fillRect(enemy.x - 15, enemy.y - 20, 30, 5);
                ctx.fillStyle = '#48bb78';
                ctx.fillRect(enemy.x - 15, enemy.y - 20, 30 * healthPercent, 5);
            });

            // Draw projectiles
            projectiles.forEach(proj => {
                ctx.fillStyle = proj.color;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Toggle game speed
        function toggleSpeed() {
            gameSpeed = gameSpeed === 1 ? 2 : 1;
            const btn = document.getElementById('speed-btn');
            btn.textContent = gameSpeed === 1 ? '▶️ 1x Speed' : '⏩ 2x Speed';
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            // Update twice if 2x speed
            update();
            if (gameSpeed === 2) {
                update();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            gameSpeed = 1;
            gold = 100;
            // lives is set by playGame() based on difficulty
            wave = 1;
            towers = [];
            enemies = [];
            projectiles = [];
            updateDisplay();

            // Show speed button, reset its text
            document.getElementById('speed-btn').classList.remove('hidden');
            document.getElementById('speed-btn').textContent = '⏩ 2x Speed';

            // Spawn first wave
            for (let i = 0; i < 5; i++) {
                setTimeout(() => spawnEnemy(), i * 1000);
            }

            gameLoop();
        }

        // Reset game
        function resetGame() {
            gameRunning = false;
            gameSpeed = 1;
            gold = 100;
            const diffMod = difficultyModifiers[selectedDifficulty];
            lives = diffMod.lives;
            wave = 1;
            towers = [];
            enemies = [];
            projectiles = [];
            updateDisplay();
            draw();
            // Hide speed button when game over
            document.getElementById('speed-btn').classList.add('hidden');
        }

        // Initial draw
        draw();
    </script>
</body>
</html>
