<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Sky background -->
  <rect width="500" height="400" fill="#87CEEB"/>
  <rect y="320" width="500" height="80" fill="#90C060"/>

  <!-- Ground line -->
  <line x1="0" y1="320" x2="500" y2="320" stroke="#6A9040" stroke-width="3"/>

  <!-- BICYCLE -->
  <!-- Back wheel -->
  <circle cx="180" cy="290" r="45" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="180" cy="290" r="3" fill="#666"/>
  <!-- Back spokes -->
  <line x1="180" y1="245" x2="180" y2="335" stroke="#999" stroke-width="1"/>
  <line x1="135" y1="290" x2="225" y2="290" stroke="#999" stroke-width="1"/>
  <line x1="148" y1="258" x2="212" y2="322" stroke="#999" stroke-width="1"/>
  <line x1="212" y1="258" x2="148" y2="322" stroke="#999" stroke-width="1"/>

  <!-- Front wheel -->
  <circle cx="340" cy="290" r="45" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="340" cy="290" r="3" fill="#666"/>
  <!-- Front spokes -->
  <line x1="340" y1="245" x2="340" y2="335" stroke="#999" stroke-width="1"/>
  <line x1="295" y1="290" x2="385" y2="290" stroke="#999" stroke-width="1"/>
  <line x1="308" y1="258" x2="372" y2="322" stroke="#999" stroke-width="1"/>
  <line x1="372" y1="258" x2="308" y2="322" stroke="#999" stroke-width="1"/>

  <!-- Frame -->
  <!-- Seat tube -->
  <line x1="220" y1="220" x2="240" y2="280" stroke="#D44" stroke-width="5" stroke-linecap="round"/>
  <!-- Down tube -->
  <line x1="220" y1="220" x2="300" y2="280" stroke="#D44" stroke-width="5" stroke-linecap="round"/>
  <!-- Chain stay -->
  <line x1="240" y1="280" x2="180" y2="290" stroke="#D44" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat stay -->
  <line x1="220" y1="220" x2="180" y2="290" stroke="#D44" stroke-width="4" stroke-linecap="round"/>
  <!-- Top tube to head tube -->
  <line x1="220" y1="220" x2="310" y2="230" stroke="#D44" stroke-width="5" stroke-linecap="round"/>
  <!-- Head tube / fork -->
  <line x1="310" y1="230" x2="300" y2="280" stroke="#D44" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="280" x2="340" y2="290" stroke="#D44" stroke-width="4" stroke-linecap="round"/>
  <!-- Fork to front wheel -->
  <line x1="310" y1="230" x2="340" y2="290" stroke="#D44" stroke-width="4" stroke-linecap="round"/>

  <!-- Seat -->
  <ellipse cx="218" cy="215" rx="18" ry="5" fill="#333"/>

  <!-- Handlebars -->
  <line x1="305" y1="218" x2="310" y2="230" stroke="#666" stroke-width="4" stroke-linecap="round"/>
  <line x1="290" y1="215" x2="320" y2="215" stroke="#666" stroke-width="5" stroke-linecap="round"/>
  <!-- Grips -->
  <circle cx="290" cy="215" r="4" fill="#222"/>
  <circle cx="320" cy="215" r="4" fill="#222"/>

  <!-- Pedal crank -->
  <circle cx="240" cy="280" r="6" fill="#666"/>
  <line x1="240" y1="280" x2="225" y2="265" stroke="#666" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="280" x2="255" y2="295" stroke="#666" stroke-width="4" stroke-linecap="round"/>
  <!-- Pedals -->
  <rect x="216" y="261" width="16" height="6" rx="2" fill="#555" transform="rotate(-10 224 264)"/>
  <rect x="248" y="293" width="16" height="6" rx="2" fill="#555" transform="rotate(-10 256 296)"/>

  <!-- Chain -->
  <ellipse cx="210" cy="285" rx="32" ry="8" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- PELICAN -->
  <!-- Body -->
  <ellipse cx="230" cy="185" rx="45" ry="30" fill="#F5F0E0" transform="rotate(-10 230 185)"/>
  <!-- Body shading -->
  <ellipse cx="235" cy="195" rx="35" ry="20" fill="#E8E0CC" transform="rotate(-10 235 195)"/>

  <!-- Tail feathers -->
  <path d="M185 185 L160 170 L170 185 L155 178 L168 192" fill="#E0D8C0" stroke="#D0C8B0" stroke-width="1"/>

  <!-- Wing -->
  <path d="M210 170 Q195 155 200 175 Q188 158 198 180 Q210 195 250 190" fill="#EAE2D0" stroke="#D5CDB8" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M260 175 Q280 155 285 130 Q288 110 280 95" fill="none" stroke="#F5F0E0" stroke-width="18" stroke-linecap="round"/>
  <path d="M260 175 Q280 155 285 130 Q288 110 280 95" fill="none" stroke="#EDE5D5" stroke-width="14" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="278" cy="85" rx="18" ry="15" fill="#F5F0E0"/>

  <!-- Eye -->
  <circle cx="282" cy="80" r="4" fill="#333"/>
  <circle cx="283" cy="79" r="1.5" fill="#fff"/>

  <!-- Beak - top -->
  <path d="M295 82 L350 78 L345 85 L295 88" fill="#F4A820" stroke="#E09010" stroke-width="1"/>
  <!-- Beak hook tip -->
  <path d="M348 78 Q355 80 345 85" fill="#E09010"/>

  <!-- Pouch (throat sac) -->
  <path d="M295 88 L340 85 Q335 105 320 110 Q305 112 295 100 Z" fill="#F4B840" opacity="0.7" stroke="#E0A020" stroke-width="1"/>

  <!-- Legs going to pedals -->
  <!-- Left leg (on top pedal) -->
  <path d="M225 205 Q220 230 224 262" stroke="#E8C870" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Right leg (on bottom pedal) -->
  <path d="M240 205 Q250 250 255 292" stroke="#E8C870" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Webbed feet on pedals -->
  <!-- Left foot -->
  <path d="M220 260 L212 255 L224 262 L216 262 L226 267" fill="#F4A820" stroke="#E09010" stroke-width="1"/>
  <!-- Right foot -->
  <path d="M252 290 L244 285 L256 292 L248 292 L258 297" fill="#F4A820" stroke="#E09010" stroke-width="1"/>

  <!-- Wing tip gripping handlebar -->
  <path d="M250 190 Q270 200 290 215" stroke="#E0D8C0" stroke-width="3" fill="none"/>
  <path d="M288 212 Q295 210 292 218" fill="#E0D8C0" stroke="#D0C8B0" stroke-width="1"/>

  <!-- Head crest feathers -->
  <path d="M270 72 Q265 58 272 55" stroke="#D5CDB8" stroke-width="2" fill="none"/>
  <path d="M275 70 Q272 54 278 50" stroke="#D5CDB8" stroke-width="2" fill="none"/>

  <!-- Sun -->
  <circle cx="430" cy="60" r="30" fill="#FFE040"/>
  <g stroke="#FFE040" stroke-width="3" stroke-linecap="round">
    <line x1="430" y1="18" x2="430" y2="8"/>
    <line x1="430" y1="102" x2="430" y2="112"/>
    <line x1="388" y1="60" x2="378" y2="60"/>
    <line x1="472" y1="60" x2="482" y2="60"/>
    <line x1="401" y1="31" x2="394" y2="24"/>
    <line x1="459" y1="89" x2="466" y2="96"/>
    <line x1="459" y1="31" x2="466" y2="24"/>
    <line x1="401" y1="89" x2="394" y2="96"/>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <circle cx="80" cy="50" r="20"/>
    <circle cx="100" cy="40" r="25"/>
    <circle cx="125" cy="48" r="18"/>
  </g>
</svg>