<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball in Ring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .controls {
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        select {
            padding: 0.75rem 1.5rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 0.5rem;
            background: white;
            color: #2d3748;
            cursor: pointer;
        }
        .game-area {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        #canvas {
            border: none;
        }
        button {
            padding: 1.5rem 2rem;
            font-size: 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        #startBtn {
            background: #48bb78;
            color: white;
        }
        #stopBtn {
            background: #f56565;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Ball in a Ring</h1>

    <div class="controls">
        <label for="simulation-select">Simulation:</label>
        <select id="simulation-select" onchange="changeSimulation()">
            <option value="gravity-balls">Gravity + Ball Spawning</option>
            <option value="classic">Classic Bouncing</option>
            <option value="no-gravity">No Gravity</option>
            <option value="speed-up">Speed Increase</option>
            <option value="moon-gravity">Moon Gravity</option>
        </select>
    </div>

    <div class="game-area">
        <button id="startBtn" onclick="startAnimation()">▶️ Start</button>
        <canvas id="canvas" width="600" height="600"></canvas>
        <button id="stopBtn" onclick="stopAnimation()">⏸️ Stop</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        let ringRadius = 230;
        const maxBalls = 5;

        let isRunning = false;
        let animationId = null;
        let audioContext = null;
        let bounceCount = 0;
        let gravity = 0.15;
        let currentSimulation = 'gravity-balls';
        let spawnBalls = true;
        let speedIncrease = false;

        // Ball array
        let balls = [];

        // Create a new ball
        function createBall() {
            return {
                x: centerX,
                y: centerY,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                radius: 20,
                hue: Math.random() * 360
            };
        }

        // Initialize with first ball
        balls.push(createBall());

        // Initialize audio context on user interaction
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Play bounce sound
        function playBounceSound() {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Random pitch between 300 and 600 Hz
            oscillator.frequency.value = 300 + Math.random() * 300;
            oscillator.type = 'sine';

            // Sound envelope
            const now = audioContext.currentTime;
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

            oscillator.start(now);
            oscillator.stop(now + 0.1);
        }

        function drawRing() {
            ctx.save(); // Save state and ensure no shadows
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Draw outer ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 10;
            ctx.stroke();

            // Draw inner glow
            ctx.beginPath();
            ctx.arc(centerX, centerY, ringRadius - 5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore(); // Restore state
        }

        function drawBall(ball) {
            ctx.save(); // Save current state
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);

            // Ball gradient with unique color
            const gradient = ctx.createRadialGradient(
                ball.x - ball.radius * 0.3,
                ball.y - ball.radius * 0.3,
                0,
                ball.x,
                ball.y,
                ball.radius
            );
            gradient.addColorStop(0, `hsl(${ball.hue}, 70%, 70%)`);
            gradient.addColorStop(1, `hsl(${ball.hue}, 70%, 50%)`);

            ctx.fillStyle = gradient;
            ctx.fill();

            // Ball shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.restore(); // Restore state (removes shadow for next draw)
        }

        function updateBall(ball) {
            // Apply gravity (if enabled)
            if (gravity !== 0) {
                ball.vy += gravity;
            }

            // Update position
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Check collision with ring
            const dx = ball.x - centerX;
            const dy = ball.y - centerY;
            const distanceFromCenter = Math.sqrt(dx * dx + dy * dy);

            // If ball touches or goes beyond ring
            if (distanceFromCenter + ball.radius >= ringRadius) {
                // Calculate normal vector at collision point
                const nx = dx / distanceFromCenter;
                const ny = dy / distanceFromCenter;

                // Calculate dot product of velocity and normal
                const dotProduct = ball.vx * nx + ball.vy * ny;

                // Reflect velocity vector (perfect bounce, no energy loss)
                ball.vx = ball.vx - 2 * dotProduct * nx;
                ball.vy = ball.vy - 2 * dotProduct * ny;

                // Push ball back inside ring
                const overlap = distanceFromCenter + ball.radius - ringRadius;
                ball.x -= nx * overlap;
                ball.y -= ny * overlap;

                // Play sound and update counters
                playBounceSound();
                ball.hue = (ball.hue + 30) % 360; // Change color on bounce
                bounceCount++;

                // Increase speed on bounce (if enabled)
                if (speedIncrease) {
                    ball.vx *= 1.1;
                    ball.vy *= 1.1;
                }

                // Every 10 bounces, add a new ball (if spawning enabled and under max)
                if (spawnBalls && bounceCount % 10 === 0 && balls.length < maxBalls) {
                    balls.push(createBall());
                }
            }
        }

        // Check collision between two balls
        function checkBallCollision(ball1, ball2) {
            const dx = ball2.x - ball1.x;
            const dy = ball2.y - ball1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const minDistance = ball1.radius + ball2.radius;

            if (distance < minDistance && distance > 0) {
                // Collision detected!

                // Normal vector (from ball1 to ball2)
                const nx = dx / distance;
                const ny = dy / distance;

                // Relative velocity
                const dvx = ball1.vx - ball2.vx;
                const dvy = ball1.vy - ball2.vy;

                // Velocity along normal
                const velAlongNormal = dvx * nx + dvy * ny;

                // Only resolve if balls are moving toward each other
                if (velAlongNormal > 0) {
                    // Elastic collision (equal mass, no energy loss)
                    // Swap velocity components along the normal
                    const impulse = velAlongNormal;

                    ball1.vx -= impulse * nx;
                    ball1.vy -= impulse * ny;
                    ball2.vx += impulse * nx;
                    ball2.vy += impulse * ny;

                    // Separate balls to prevent sticking
                    const overlap = minDistance - distance;
                    const separationX = nx * overlap / 2;
                    const separationY = ny * overlap / 2;

                    ball1.x -= separationX;
                    ball1.y -= separationY;
                    ball2.x += separationX;
                    ball2.y += separationY;

                    // Change colors on collision
                    ball1.hue = (ball1.hue + 15) % 360;
                    ball2.hue = (ball2.hue + 15) % 360;
                }
            }
        }

        function gameLoop() {
            if (!isRunning) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw ring
            drawRing();

            // Update all balls
            balls.forEach(ball => updateBall(ball));

            // Check ball-to-ball collisions
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    checkBallCollision(balls[i], balls[j]);
                }
            }

            // Draw all balls
            balls.forEach(ball => drawBall(ball));

            animationId = requestAnimationFrame(gameLoop);
        }

        function startAnimation() {
            initAudio();
            if (isRunning) return;
            isRunning = true;
            animationId = requestAnimationFrame(gameLoop);
        }

        function stopAnimation() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            // Reset the simulation
            balls = [];
            bounceCount = 0;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRing();
        }

        function changeSimulation() {
            const select = document.getElementById('simulation-select');
            currentSimulation = select.value;

            // Reset game state
            stopAnimation();
            balls = [];
            bounceCount = 0;

            // Set simulation parameters
            switch (currentSimulation) {
                case 'gravity-balls':
                    gravity = 0.15;
                    spawnBalls = true;
                    speedIncrease = false;
                    break;
                case 'classic':
                    gravity = 0.15;
                    spawnBalls = false;
                    speedIncrease = false;
                    break;
                case 'no-gravity':
                    gravity = 0;
                    spawnBalls = false;
                    speedIncrease = false;
                    break;
                case 'speed-up':
                    gravity = 0.15;
                    spawnBalls = false;
                    speedIncrease = true;
                    break;
                case 'moon-gravity':
                    gravity = 0.025; // Moon gravity is ~1/6 of Earth
                    spawnBalls = false;
                    speedIncrease = false;
                    break;
            }

            // Initialize with first ball
            balls.push(createBall());

            // Redraw static state
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRing();
            balls.forEach(ball => drawBall(ball));
        }

        // Initialize - draw static ring and balls
        ctx.shadowColor = 'transparent';
        drawRing();
        balls.forEach(ball => drawBall(ball));
    </script>
</body>
</html>
